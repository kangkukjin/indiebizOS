# 정본 설치 경로(소스 트리) 이식성 게이트 — 매 푸시마다, 3 OS 에서.
#
# 헌법(2026-08-10, canonical-install-path): 공식 설치 경로 = git clone 한 소스
# 트리를 그대로 돌리는 것(맥·윈도우·리눅스), 설치본(.exe/.dmg)은 그 포장.
# 검증 안 되는 몸은 조용히 썩는다(실증: 층 이동 후 폰 부팅 불능 — import 는
# 초록, 부팅 첫 줄에서 사망) → 경로의 증명은 저자의 기억이 아니라 CI 가 한다.
#
# 왜 build.yml 과 별도인가: build.yml 은 태그 푸시 때만 도는 배포 빌드라
# 평시 커밋의 이식성 회귀를 못 잡는다(2026-07-20 윈도우 첫 설치에서
# data/packages/ 의 fcntl 이 설치 후에야 발견된 부류).
#
# 세 층 (얕은 것부터):
#   static-scan   — AST 정적 검사(의존성 0, 우분투). 유닉스 전용 stdlib 의
#                   무가드 톱레벨 import + 진입점(api.py)의 sys.path 부트스트랩
#                   전 backend 로컬 import. pre-commit 훅과 같은 스크립트.
#   import-smoke  — 실제 윈도우에서 api.py 톱레벨 exec. 배포 번들과
#                   같은 requirements-core.txt 로 설치. ★python -I(isolated)로
#                   실행해 임베디드 파이썬(_pth isolated)의 "스크립트 폴더가
#                   sys.path 에 없음" 조건을 재현 — 표준 python -c 는 이 조건이
#                   재현되지 않아 v1.3.6 mime_compat 조기 import 를 못 잡았다.
#   boot-smoke    — 3 OS 에서 서버를 실제로 띄워 /health 200 까지 (import 성공
#                   ≠ 부팅 성공 — 부팅은 파일 배치·데이터 로드·라우터 조립까지
#                   본다). scripts/ci_boot_smoke.py.
name: Portability (3 OS)

on:
  push:
    paths:
      - 'backend/**'
      - 'data/packages/**'
      - 'scripts/check_win_portability.py'
      - 'scripts/ci_import_smoke.py'
      - 'scripts/ci_boot_smoke.py'
      - 'scripts/bootstrap.py'
      - '.github/workflows/portability.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'data/packages/**'
      - 'scripts/check_win_portability.py'
      - 'scripts/ci_import_smoke.py'
      - 'scripts/ci_boot_smoke.py'
      - 'scripts/bootstrap.py'
      - '.github/workflows/portability.yml'
  workflow_dispatch:

jobs:
  static-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 유닉스 전용 무가드 import 검사
        run: python scripts/check_win_portability.py

  import-smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # pip 단계용 — 스모크 자체는 -I(-E 포함)가 env 를 무시해 -X utf8 로 지정
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # 배포 임베디드 파이썬(build.yml)과 동일 계열
      - name: 코어 의존성 설치 (배포 번들과 동일)
        run: pip install -r backend/requirements-core.txt
      - name: 백엔드 모듈 그래프 import 스모크 (임베디드 등가 -I)
        run: python -I -X utf8 scripts/ci_import_smoke.py

  boot-smoke:
    # 정본 경로 부팅 증명 — README 의 레시피 *그대로*: clone → bootstrap.py → 부팅 → /health 200.
    # 세 OS 대칭: 어떤 데스크탑 몸도 "아무도 부팅 안 해본 채 썩는" 상태로 두지 않는다.
    # bootstrap.py 를 쓰는 이유: CI 가 별도 설치 절차를 가지면 그 순간 레시피가 둘이 된다 —
    # 낯선 사람이 따라할 그 명령이 여기서 도는 그 명령이어야 증명이 성립한다.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 부트스트랩 (README 정본 레시피 — venv+코어 의존성)
        run: python scripts/bootstrap.py --core-only
      - name: 서버 실기동 → /health 200 (scripts/ci_boot_smoke.py)
        run: python scripts/ci_boot_smoke.py
