# 이음매 가드 — 액션이 아니라서 기존 검증망에 안 걸리던 것들.
#
# 배경(2026-07-25 진단): 이 저장소의 검증망(--check 가드 17개 · ibl_fixtures 기반
# §1B 일일 행동 그물 · 자가점검)은 전부 "액션 하나"를 단위로 삼는다. 액션에는
# 시민권이 있어 커밋 게이트와 일일 점검을 받지만, 미들웨어·이벤트 루프 규율·
# 두 렌더러의 동작 동일성·부팅 순서·노출 등록은 액션이 아니라 걸릴 자리가 없었다.
# 실제로 재발한 버그 부류가 정확히 그 목록이다(자기교착 3회 · 지도 미렌더 3연속 ·
# 터널 마커 오매칭). 새 규율을 들이는 대신, 이 저장소가 이미 지키는 방식(AST 가드)
# 으로 이음매에 시민권을 준다.
#
# 여기 모이는 가드는 전부 pre-commit 훅과 같은 스크립트를 부른다 — 로컬은 워킹트리를
# 보고 CI 는 커밋된 것만 보므로, 둘 다 있어야 틈이 없다.
name: Seam Guards

on:
  push:
    # ★가드 스크립트 자신을 빠뜨리지 말 것 — 2026-07-25 에 check_public_routes.py 를
    # 여기 안 넣어서, 그 가드를 고치는 커밋에 정작 그 가드가 안 돌았다. 훅에서 고친
    # "게이트가 자기 입력을 안 본다"와 정확히 같은 부류를 CI 에서 반복한 것.
    paths:
      - 'backend/**'
      - 'data/packages/installed/**'
      - 'scripts/check_event_loop*.py'
      - 'scripts/check_public_routes.py'
      - 'scripts/check_string_returns.py'
      - 'pytest.ini'
      - '.github/workflows/seam-guards.yml'
  pull_request:
  workflow_dispatch:

jobs:
  event-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 의존성 0 (AST 파싱만) — 이식성 검사와 같은 성질.
      - name: async 본문의 동기 블로킹 호출 검사
        run: python scripts/check_event_loop.py

      # 가드가 스스로 정확한지 — 음성(중첩 sync + executor = 정석 패턴)을 오탐하면
      # 가드가 꺼진다. 실제로 나이브 스캔이 backend/api_nodes.py 의 모범 사례를
      # 오탐했던 적이 있어(2026-07-25), 그 케이스를 회귀로 박아둔다.
      - name: 가드 자체 픽스처 (오탐/미탐 회귀)
        run: python scripts/check_event_loop_fixtures.py

  public-routes:
    # is_public_remote_path 가 세션 없이 통과시키는 경로가 자체 인증을 실제로 가졌는지.
    # 오라클을 코드가 아니라 살아있는 라우트 테이블로 삼으므로 앱을 임포트한다 —
    # 배포 번들과 같은 requirements-core.txt 로 설치(ci_import_smoke 와 같은 조건).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 간접 추적 로직 회귀 — 앱 임포트가 필요 없어 먼저 돌린다(설치 실패와 무관하게 신호).
      - name: 가드 자체 회귀 (간접 호출 추적)
        run: python scripts/check_public_routes.py --self-test

      - name: 코어 의존성 설치 (배포 번들과 동일)
        run: pip install -r backend/requirements-core.txt

      - name: 공개 라우트 ↔ 인증 대조
        run: python scripts/check_public_routes.py

  # 맨 문자열 반환 (2026-08-05 감사 부채 ② 수렴 후 재발 봉쇄) — 도구 결과 경로
  # (execute/디스패처 op 함수)의 문자열 리터럴 return 차단. 의존성 0 (AST 파싱만).
  string-returns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 가드 자체 회귀 (탐지/중첩 def 제외)
        run: python scripts/check_string_returns.py --self-test
      - name: 도구 결과 경로 맨 문자열 반환 검사
        run: python scripts/check_string_returns.py

  # pytest 스위트 (2026-08-05 감사 부채 ⑧): 고아 테스트 5개를 CI 시민으로.
  # -m "not local" — 해마 DB·임베딩 모델이 필요한 측정성 테스트는 로컬 전용
  # (해당 테스트는 데이터 부재 시 스킵도 하므로 이중 안전).
  # 의존성은 public-routes 와 같은 requirements-core.txt — `import api` 스모크가
  # 이미 이 조합으로 초록이므로 테스트의 import 체인(그 부분집합)도 돈다.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 코어 의존성 + pytest 설치
        run: pip install -r backend/requirements-core.txt pytest
      - name: pytest (backend/test_*.py, 로컬 데이터 필요분 제외)
        run: python -m pytest -m "not local"
