<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공동 업무</title><style>
:root{font-family:system-ui,sans-serif;color:#202c31;background:#f3f5f4}body{max-width:1180px;margin:auto;padding:24px}h1{font-size:26px}h2{font-size:19px}button,input,select,textarea{font:inherit;border:1px solid #c6d0ce;border-radius:7px;padding:9px}button{cursor:pointer;background:white}button.primary{background:#176856;color:white;border-color:#176856}button:disabled{opacity:.5;cursor:wait}header,.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}section{background:white;border:1px solid #dde3e0;border-radius:12px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}label{display:block;font-size:14px;margin:12px 0 5px}input:not([type=checkbox]),textarea{width:100%;box-sizing:border-box}textarea{min-height:90px}table{width:100%;border-collapse:collapse;font-size:14px}th{white-space:nowrap}td button{white-space:nowrap}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;word-break:break-word}tr.selected{background:#e8f5ef}.scroll{overflow:auto;max-height:480px}.muted{color:#63736d;font-size:13px}#status{white-space:pre-wrap}#status.error{color:#a52424}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}details{margin:12px 0}fieldset{border:1px solid #e0e6e2;margin:10px 0;border-radius:8px}.item{border-top:1px solid #eee;padding:12px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:12px}}
</style></head><body>
<header><div><h1>공동 업무</h1><span class="muted">기록을 함께 살펴보고, 맡은 일을 처리합니다.</span></div><div class="bar"><select id="spaces" aria-label="업무 공간"></select><button id="refresh">새로고침</button></div></header>
<details id="login"><summary>회원 열쇠로 접속</summary><input id="key" type="password" autocomplete="off" placeholder="발급받은 회원 열쇠"><button id="connect">접속</button></details>
<p id="notice" class="muted"></p><p id="status" role="status" aria-live="polite"></p>
<div class="grid"><section><div class="bar"><h2>기록</h2><select id="collections" aria-label="기록 종류"></select></div><div class="scroll" id="rows"></div><button id="more" hidden>다음 기록</button><h2>내 할 일</h2><div id="tasks"></div></section>
<section><h2>업무 처리</h2><button id="clear">새 기록 / 선택 해제</button><div id="detail"></div><p id="selected" class="muted">목록에서 기록을 선택하거나 새 기록을 만드세요.</p><select id="commands" aria-label="업무 명령"></select><form id="form"><div id="fields"></div><label for="reason">처리 사유</label><textarea id="reason"></textarea><p id="version" class="muted"></p><button class="primary" id="submit" type="submit">처리</button></form><h2>변경 이력</h2><div id="history"></div></section></div>
<details id="admin"><summary>공간 관리</summary><section><h2>업무 정의</h2><p class="muted">기록의 항목, 역할과 처리 규칙을 등록합니다. 운영 중인 업무에 영향을 주는 변경은 검증 후 반영됩니다.</p><label>공간 이름<input id="newspace" placeholder="영문·한글·숫자·하이픈"></label><label>정의 파일<input id="definitionfile" type="file" accept=".json"></label><textarea id="definition" aria-label="업무 정의" placeholder="업무 정의 파일을 선택하세요"></textarea><div class="bar"><button id="validate">정의 검사</button><button id="create">새 공간 만들기</button><button id="publish">현재 공간에 발행</button></div><h2>정의와 데이터 이전</h2><p class="muted">열린 검토와 후속 처리를 종결하고 공간을 중지한 뒤 새 정의와 필드 변환을 함께 반영합니다.</p><textarea id="transforms" aria-label="필드 변환" placeholder='{"stocks":{"set":{"category":"general"}}}'></textarea><div class="bar"><button id="pause">업무 중지</button><button id="migrate">정의·데이터 함께 이전</button></div><h2>참여자</h2><label>이웃 번호<input id="neighbor"></label><label>역할 (쉼표로 구분, 비우면 접근 해제)<input id="roles"></label><button id="grant">역할 반영</button><h2>후속 처리 확인</h2><button id="queue">처리 상태 조회</button><div id="deliveries"></div><h2>보존·복구</h2><div class="bar"><button id="export">공간 내보내기</button><label>새 공간으로 복원<input id="archive" type="file" accept=".zip"></label><button id="restore">복원</button><button id="resume">복구 확인 완료</button><button id="unpause">업무 재개</button></div><p class="muted">복원한 공간은 외부 처리 결과를 확인할 때까지 중지됩니다.</p></section></details>
<script>
const csrf=__RECORD_CSRF__, $=id=>document.getElementById(id);
let space='', info=null, selected=null, task=null, cursor=null, records=[];
const member=()=>location.pathname.startsWith('/m/')||!!sessionStorage.getItem('record-member-key');
const base=()=>member()?'/m/records':'/records';
const status=(text,error=false)=>{ $('status').textContent=text; $('status').className=error?'error':''; };
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);return e;}
async function call(path,data,raw=false){
  const headers={'Content-Type':'application/json','X-Record-CSRF':csrf};
  const key=sessionStorage.getItem('record-member-key');if(key)headers['X-Member-Key']=key;
  const r=await fetch(path,{method:data===undefined?'GET':'POST',headers,credentials:'same-origin',body:data===undefined?undefined:JSON.stringify(data)});
  if(raw&&r.ok)return r.blob();const v=await r.json();if(!r.ok||v.success===false)throw Error(v.error||v.detail||'처리할 수 없습니다.');return v;
}
const action=(id,data={})=>call(`${base()}/spaces/${encodeURIComponent(space)}/actions/${encodeURIComponent(id)}`,data);
function options(id,items,key,label){const select=$(id);select.replaceChildren();for(const it of items){const o=element('option',it[label]||it[key]);o.value=it[key];select.append(o);}}
async function load(){try{const r=await call(base()+'/spaces');options('spaces',r.items,'space','title');const wanted=new URLSearchParams(location.search).get('space');if(r.items.some(x=>x.space===space||!space&&x.space===wanted))$('spaces').value=space||wanted;space=$('spaces').value;$('admin').hidden=member();if(space)await openSpace();else status('참여할 수 있는 공간이 없습니다. 운영자는 공간 관리에서 업무 정의를 등록할 수 있습니다.');}catch(e){status(e.message,true);}}
async function openSpace(){selected=null;task=null;$('detail').replaceChildren();$('history').replaceChildren();$('selected').textContent='목록에서 기록을 선택하거나 새 기록을 만드세요.';info=await action('describe');$('notice').textContent=info.notice;options('collections',info.items,'collection','label');options('commands',info.commands,'command','label');renderForm();await Promise.all([loadRows(),loadTasks()]);}
async function loadRows(next=false){if(!$('collections').value)return;const r=await action('query',{collection:$('collections').value,limit:50,...(next&&cursor?{cursor}:{})});records=next?records.concat(r.items):r.items;cursor=r.cursor;$('more').hidden=!cursor;const wrap=$('rows');wrap.replaceChildren();const table=element('table');const fields=info.items.find(x=>x.collection===$('collections').value)?.fields||{};const cols=Object.keys(fields).slice(0,5);const head=element('tr');for(const c of cols)head.append(element('th',fields[c].label||c));head.append(element('th','선택'));table.append(head);for(const record of records){const row=element('tr');if(selected?._id===record._id)row.className='selected';for(const c of cols)row.append(element('td',typeof record[c]==='object'?JSON.stringify(record[c]):record[c]??''));const td=element('td'),button=element('button','선택');button.onclick=()=>pick(record);td.append(button);row.append(td);table.append(row);}wrap.append(table);}
async function pinnedInfo(){if(selected){const detail=await action('describe',{collection:selected._collection,id:selected._id});info={...info,commands:detail.commands,definition_revision:detail.definition_revision};options('commands',info.commands,'command','label');}}
async function pick(record){$('commands').disabled=true;$('submit').disabled=true;try{selected=record;task=null;await pinnedInfo();$('selected').textContent=`선택한 기록 · 버전 ${record._revision}`;renderForm();await history();}catch(e){status(e.message,true);}finally{$('commands').disabled=false;$('submit').disabled=false;}}
async function history(){renderDetail();const r=await action('history',{collection:selected._collection,id:selected._id});$('history').replaceChildren();for(const item of r.items){const details=element('details'),summary=element('summary',`${item.command} · 버전 ${item.revision} · ${item.subject}`);details.append(summary,element('p',item.reason||''),element('pre',JSON.stringify(item.after,null,2)));$('history').append(details);}}
async function loadTasks(){const r=await action('inbox');$('tasks').replaceChildren();if(!r.items.length)$('tasks').append(element('p','대기 중인 일이 없습니다.'));for(const t of r.items){const div=element('div');div.className='item';const button=element('button',t.label||t.command||'작업 열기');button.onclick=async()=>{try{const r=await action('detail',{collection:t.collection,id:t.record_id});selected=r.items[0];task=t;await pinnedInfo();if(t.command)$('commands').value=t.command;renderForm();$('selected').textContent=`검토 대상 · 버전 ${t.target_revision}`;await history();}catch(e){status(e.message,true);}};div.append(button,element('span',` 승인 ${t.approvals}건`));$('tasks').append(div);}}
function renderDetail(){const box=$('detail');box.replaceChildren();const fields=info.items.find(x=>x.collection===selected._collection)?.fields||{};for(const[k,spec]of Object.entries(fields)){if(selected[k]===undefined)continue;const row=element('p');row.append(element('strong',(spec.label||k)+': '));if(spec.type==='artifact_ref'&&selected[k]){const b=element('button','첨부 열기');b.type='button';b.onclick=async()=>{try{const blob=await call(`${base()}/spaces/${space}/assets/${encodeURIComponent(selected[k])}`,{},true);const url=URL.createObjectURL(blob),a=element('a');a.href=url;a.download='attachment';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){status(e.message,true);}};row.append(b);}else row.append(element('span',typeof selected[k]==='object'?JSON.stringify(selected[k]):selected[k]));box.append(row);}}
function inputField(key,spec,value){const wrap=element('div'),label=element('label',spec.label||key);wrap.append(label);let control;
  if(spec.enum){control=element('select');for(const v of spec.enum){const o=element('option',v);o.value=JSON.stringify(v);control.append(o);}if(value!==undefined)control.value=JSON.stringify(value);}
  else if(spec.type==='boolean'){control=element('input');control.type='checkbox';control.checked=!!value;}
  else if(spec.type==='array'||spec.type==='object'){control=element('textarea');control.value=JSON.stringify(value??(spec.type==='array'?[]:{}),null,2);}
  else if(spec.type==='artifact_ref'){control=element('input');control.type='file';control.onchange=async()=>{try{const f=control.files[0],content=await asBase64(f);const r=await call(`${base()}/spaces/${space}/assets`,{filename:f.name,content});control.dataset.artifact=r.items[0].id;status('첨부가 준비되었습니다.');}catch(e){status(e.message,true);}};}
  else{control=element('input');control.type=['integer','number'].includes(spec.type)?'number':'text';if(spec.type==='integer')control.step='1';if(spec.type==='number')control.step='any';control.value=value??spec.default??'';}
  control.required=!!spec.required;control.dataset.field=key;wrap.append(control);return wrap;
}
function renderForm(){const command=info?.commands.find(x=>x.command===$('commands').value);$('fields').replaceChildren();if(!command)return;for(const [key,spec]of Object.entries(command.input)){let value=spec.default;if(selected&&(spec.type==='record_ref'&&spec.collection===selected._collection||Object.values(command.observed).some(r=>r.collection===selected._collection&&r.id==='$input.'+key)))value=selected._id;if(task&&key==='task_id')value=task.id;if(task&&key==='task_revision')value=task.revision;$('fields').append(inputField(key,spec,value));}$('reason').required=!!command.reason_required;$('version').textContent=`업무 정의 버전 ${info.definition_revision}`;}
function readInput(command){const result={};for(const control of $('fields').querySelectorAll('[data-field]')){const k=control.dataset.field,s=command.input[k];if(s.type==='artifact_ref'){if(control.dataset.artifact)result[k]=control.dataset.artifact;else if(s.required)throw Error('첨부가 아직 준비되지 않았습니다.');}else if(s.enum)result[k]=JSON.parse(control.value);else if(s.type==='boolean')result[k]=control.checked;else if(control.value!==''){result[k]=['object','array'].includes(s.type)?JSON.parse(control.value):['integer','number'].includes(s.type)?Number(control.value):control.value;}}return result;}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const c=info.commands.find(x=>x.command===$('commands').value);const data={command:c.command,definition_revision:info.definition_revision,input:readInput(c),expected:selected?[{collection:selected._collection,id:selected._id,revision:selected._revision}]:[],reason:$('reason').value};const signature=JSON.stringify(data),cacheKey='record-pending:'+space;let pending=JSON.parse(localStorage.getItem(cacheKey)||'null');if(pending&&pending.signature!==signature&&!confirm('결과를 확인하지 못한 이전 요청이 있습니다. 새 업무로 처리하시겠습니까?'))return;if(!pending||pending.signature!==signature)pending={signature,request_id:'req_'+crypto.randomUUID().replaceAll('-','')};localStorage.setItem(cacheKey,JSON.stringify(pending));data.request_id=pending.request_id;
if(c.confirmation==='human'){if(!confirm('표시된 대상 버전과 입력을 확인했습니다. 이 업무를 승인하시겠습니까?'))return;const confirmed=await call(`${base()}/spaces/${space}/confirm`,data);data.confirmation=confirmed.confirmation;}const r=await action('command:'+c.command,Object.fromEntries(Object.entries(data).filter(([k])=>k!=='command')));localStorage.removeItem(cacheKey);status(r.replayed?'이미 처리된 요청입니다. 기존 결과를 확인했습니다.':'처리되었습니다.');selected=null;task=null;await openSpace();}catch(e){status(e.message+' 입력과 요청 번호는 보존됩니다. 통신이 끊겼다면 같은 내용으로 다시 처리하세요.',true);}finally{$('submit').disabled=false;}};
async function admin(op,data={}){const target=op==='create'||op==='import'?$('newspace').value:space;if(!target)throw Error('공간 이름이 필요합니다.');const reason=prompt('관리 변경 사유');if(!reason)throw Error('관리 변경을 취소했습니다.');const r=await call(`/records/admin/${encodeURIComponent(target)}/${op}`,{request_id:'adm_'+crypto.randomUUID().replaceAll('-',''),expected_revision:info?.admin_revision,reason,...data});status('반영되었습니다.');space=target;await load();return r;}
function bind(id,fn){$(id).onclick=async()=>{try{await fn();}catch(e){status(e.message,true);}};}
async function asBase64(file){if(!file)throw Error('파일을 선택하세요.');return await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=fail;r.readAsDataURL(file);});}
bind('clear',openSpace);bind('pause',()=>admin('pause',{paused:true}));bind('migrate',()=>admin('migrate',{definition:JSON.parse($('definition').value),transforms:JSON.parse($('transforms').value||'{}')}));bind('connect',async()=>{sessionStorage.setItem('record-member-key',$('key').value);await load();});bind('refresh',load);bind('more',()=>loadRows(true));$('spaces').onchange=async()=>{space=$('spaces').value;try{await openSpace();}catch(e){status(e.message,true);}};$('collections').onchange=()=>loadRows().catch(e=>status(e.message,true));$('commands').onchange=renderForm;
$('definitionfile').onchange=async()=>{$('definition').value=await $('definitionfile').files[0].text();};bind('validate',async()=>{await call('/records/admin/check/validate',{definition:JSON.parse($('definition').value)});status('정의가 유효합니다.');});bind('create',()=>admin('create',{definition:JSON.parse($('definition').value)}));bind('publish',()=>admin('publish',{definition:JSON.parse($('definition').value)}));bind('grant',()=>admin('membership',{subject:'neighbor:'+$('neighbor').value,roles:$('roles').value.split(',').map(x=>x.trim()).filter(Boolean)}));bind('restore',async()=>admin('import',{content:await asBase64($('archive').files[0])}));bind('resume',()=>admin('recovery_complete'));bind('unpause',()=>admin('pause',{paused:false}));bind('export',async()=>{const blob=await call(`/records/admin/${space}/export`,{},true);const url=URL.createObjectURL(blob),a=element('a');a.href=url;a.download=space+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
bind('queue',async()=>{const r=await call(`/records/admin/${space}/state`);info.admin_revision=r.admin_revision;$('deliveries').replaceChildren();for(const item of r.items){const div=element('div');div.append(element('p',`${item.id} · ${item.state}`));if(['unknown','blocked'].includes(item.state)){for(const outcome of ['succeeded','failed','pending','cancelled']){const b=element('button',{'succeeded':'성공 확인','failed':'실패 확인','pending':'재처리 승인','cancelled':'취소'}[outcome]);b.onclick=async()=>{try{const evidence=prompt('확인한 처리 결과와 근거');if(evidence)await admin('reconcile',{id:item.id,outcome,evidence});}catch(e){status(e.message,true);}};div.append(b);}}$('deliveries').append(div);}});
load();
</script></body></html>
