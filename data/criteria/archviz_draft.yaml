# 건축 외관 렌더(archviz) 심사 기준 — 1단계 **초안**
#
# 이 파일은 데이터다("명사의 자리"). [engines:image_read]{op:"critic", criteria:"archviz_draft"} 가 읽는다.
# 2026-09-06 ep2910 실측: 에이전트가 턴마다 "그림자 있음/없음·풀포기 있음/없음" 이진 채점표를 스스로 지어
# 정확한 판정기에 물었고, 통과선이 없어 41분·렌더 27회 동안 같은 그림을 돌렸다. 단계별 통과선은 여기에 산다.
#
# 단계: archviz_draft(초안: 형태·재질·조명이 읽히면 통과) → archviz(제안: 건축주 검토용) → archviz_final(최종 투시도)
# 단계는 의도(intent)에 "초안/제안/최종" 을 적고 criteria 를 그 단계로 지정한다. 통과선을 넘으면 **멈추고 보여준다**.

intro: >
  당신은 건축 외관 투시도 검토자입니다. 이 컷은 **초안**입니다 — 목적은 "형태·재질·조명이 무엇인지 읽히는가"이며,
  세부 사실감은 채점 대상이 아닙니다. 초안 통과선: 아래 체크가 대체로 만족되면 passed=true, score 7 이상으로 주세요.
  잔디가 낱개 풀포기로 보이지 않거나, 창에 주변이 비치지 않거나, 그림자가 부드럽다는 이유로 감점하지 마세요(그건 최종 단계 기준).
  issues 에는 "다음 단계로 가려면 무엇을 바꿔야 하는가"를 최대 3개, 효과가 큰 순서로만 적으세요.

checks:
  - 건물의 형태(층수·지붕·개구부)가 한눈에 읽히는가?
  - 외벽·지붕·바닥이 단색 판이 아니라 재질(콘크리트·기와·잔디 등)로 읽히는가?
  - 빛의 방향이 있는가? (벽면 사이 명암 차이가 있고, 건물이 지면에 얹혀 보이는가 — 접지 그림자의 흔적)
  - 하늘과 지면이 있고 지평선이 부자연스럽게 잘리지 않았는가?
  - 노출이 적절한가? (너무 어둡거나 하얗게 날아간 영역이 넓지 않은가)
  - 눈에 띄는 렌더 결함(검은 창 구멍, 뚫린 면, 떠 있는 물체, 노이즈 얼룩)이 없는가?

forbidden:
  - 건물 형상이 깨져 있음(벽이 없거나 지붕이 뚫림)
  - 이미지 전체가 검거나 하얗게 날아감
