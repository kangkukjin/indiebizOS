# 장부(스프레드시트) 심사 기준 — [engines:render]{op:"xlsx"} 산출 PNG 용
#
# 이 파일은 **데이터**다 — 장부가 조악하다고 느껴질 때마다 불만을 체크 한 줄로 내려앉힌다.
# 증축은 사용례가 이끈다(RENDER_XLSX_HANDOFF Phase 3 — 최소 시작).

extends: visual_base

intro: 당신은 장부(스프레드시트) 품질 평가자입니다. 렌더된 장부 이미지를 기준에 대고 엄격하게 평가하세요.

checks:
  - 숫자 열이 '#####' 로 잘리지 않고 값이 온전히 보이는가?
  - 열 폭이 내용에 맞는가? (제목·품목명이 중간에서 잘리지 않는가)
  - 합계·소계 행이 데이터 행과 시각적으로 구분되는가?
  - 표가 페이지 경계에서 행 중간 절단되지 않는가?
  - 통화·날짜 표시 형식이 같은 열 안에서 일관되는가? (1,000원과 2000 혼재 없음)

forbidden:
  - 수식 오류 표식(#REF!, #DIV/0!, #VALUE!, #NAME?, #N/A)이 셀에 노출  # ②층 심사의 시각 그물
