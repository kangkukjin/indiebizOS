# 시각 산출물 심사 기준 — 공통 기저 (모든 형식)
#
# 이 파일은 **데이터**다 — "명사의 자리": 취향은 세계의 명사, 반증 가능한 데이터로 산다.
# [engines:image_read]{op:"critic", criteria:"<이름|경로>"} 가 읽는다.
# 산출물이 조악하다고 느껴질 때마다 그 불만을 여기(또는 도메인 파일)에 체크 한 줄로 내려앉힌다 —
# 비평은 대화에서 증발하지 않고 이 파일의 diff 로 축적된다.
#
# 스키마: intro(심사자 역할 한 문장, 선택) / extends(기저 파일 이름, 선택)
#         checks(질문형 체크 목록) / forbidden(있으면 실패인 것들 — 각 항목이 hard rule)

intro: 당신은 시각 산출물 품질 평가자입니다. 아래 이미지를 기준에 대고 엄격하게 평가하세요.

checks:
  - 이미지가 의도(intent)를 정확하고 충분히 충족하는가?
  - 텍스트가 잘리거나 겹치거나 컨테이너를 넘치는 곳이 없는가?
  - 레이아웃이 균형 잡혀 있는가? (한쪽으로 쏠린 무게, 의도 없는 빈 공간 과다가 없는가)
  - 요소들의 정렬이 일관된 격자를 따르는가? (몇 픽셀씩 어긋난 정렬이 없는가)
  - 저해상도·깨짐·렌더링 결함(빈 이미지 슬롯, 로드 실패 아이콘)이 없는가?
  - 색이 서로 충돌하지 않고 제한된 팔레트 안에서 일관되는가?

forbidden:
  - 본문 텍스트와 배경의 대비가 낮아 읽기 어려운 조합
  - 플레이스홀더 텍스트(lorem ipsum, TODO, 샘플 문구)가 그대로 노출
