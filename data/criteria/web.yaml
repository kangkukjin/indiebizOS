# 웹 페이지 심사 기준 — visual_base 위에 웹 전용 축을 얹는다.
# [engines:render]{path:…, viewports:[…]} >> [table:each]{do:"[engines:image_read]{op:'critic', criteria:'web', …}"}

extends: visual_base

intro: 당신은 웹 디자인 품질 평가자입니다. 아래 페이지 스크린샷을 기준에 대고 엄격하게 평가하세요.

checks:
  - 타이포그래피 위계가 명확한가? (제목/부제/본문의 크기·굵기 단계가 구분되고, 단계 수가 과하지 않은가)
  - 간격이 일관된 스케일을 따르는가? (섹션·카드·문단 사이 여백이 임의로 제각각이지 않은가)
  - 행 길이가 읽기 적절한가? (본문 한 줄이 화면 폭 전체로 늘어져 있지 않은가)
  - 시선의 흐름이 설계되어 있는가? (무엇을 먼저 보고 어디로 가야 하는지가 위계로 드러나는가)
  - 이 뷰포트 폭에서 레이아웃이 성립하는가? (모바일 폭이면 가로 스크롤·겹침·터치하기 작은 요소가 없는가)
  - 링크·버튼 등 상호작용 요소가 시각적으로 구분되는가?
  - 전체 인상이 '기본값의 평균'이 아니라 의도된 스타일로 읽히는가? (무성격한 기본 폰트·기본 파랑 링크만의 조합이 아닌가)

forbidden:
  - 콘텐츠가 뷰포트 밖으로 넘쳐 가로 스크롤을 만드는 것
  - 세 단계를 넘는 글꼴 가족(font-family) 혼용
