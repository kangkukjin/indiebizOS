    폴더 이름·제목·질의어는 그 사람의 삶이다. 예시는 중립 낱말로 쓰고, 개인 명사는 로컬 목록과
    관문(scripts/check_private_nouns.py)이 잡는다. 이미 올라간 것은 역사를 다시 쓰지 않고 새
    커밋으로 지운다.
