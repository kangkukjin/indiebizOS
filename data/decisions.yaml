- id: think-always-fresh-framing
  date: 2026-11-17
  verdict: 기각
  ruling: "규정 계승(후속·정기 턴에서 의식을 건너뛰고 경량 모델이 직전 규정을 고쳐 쓰기)은 없앴다 — THINK 판정이면 의식이 새로 규정한다. 되살리지 않는다"
  why: >
    후속이라는 개념은 의식을 부르는 비용(약 1분·10만 토큰)을 아끼려고 2026-10-07 에 넣은 것이었는데
    위험했다. 2026-11-17 에피소드 6192 에서 시제품 제작 요청이 직전 조사의 후속으로 판정돼, 92분짜리
    제작 과제의 규정을 경량 모델(분류 축)이 7.7초에 새로 썼고 사용자가 주문한 심층실행 10단계는 옮겨
    적을 칸이 없어 1단계로 돌았다. 직전 규정에서 실제로 물려받은 것은 거짓인 플래그 셋뿐이었다. 경량
    모델이 복잡한 일의 규정을 고쳐 쓰는 것은 말이 안 된다. 같은 문장의 정기 실행을 잇던 계승도 같은
    구조라 함께 없앴다. 남은 것은 직전 규정의 기록(의식의 연구계획 후보·수리 재개가 읽음), 수리 재개의
    관계 판정, 위임 완료 통지 판별뿐이다. 수리 재개의 관계 판정도 같은 날 분류 축(경량)에서 의식 축
    모델로 옮겼다 — 수리야말로 중요하니 의식이 판단한다. 규정·재개처럼 일의 방향을 정하는 판단을 분류
    축의 경량 모델에 두지 않는다. 의식 호출 비용을 줄이자는 제안이 다시 나오면 이 판정부터 본다.
  keywords: [규정 계승, 후속, 후속 턴, followup, inherited_followup, inherited_repeat, framing_inheritance, framing_record, 정기 계승, 경량 패치, 의식 각성, 의식 건너뛰기, 의식 호출 비용, framing_patch_prompt, 관계 판정, 수리 재개, 수리 재개 판정, repair_resume]
  source: "사용자 판정 2026-11-17 (에피소드 6192 점검 대화, docs/DEEP_EXECUTION_DESIGN_2026_11_15.md 8.1)"
  status: active

- id: repair-resume-rethinks-from-present-state
  date: 2026-11-17
  verdict: 채택
  ruling: "멈춘 수리를 사용자의 말로 이을 때는 처음 규정을 다시 틀지 않는다 — 몸이 지금 상태를 사실로 건네고 의식이 남은 일을 새로 규정한다. 완료 기준은 그대로다"
  why: >
    멈춤은 새로 알게 된 것이 가장 많은 지점인데, 재개는 연상·분류·의식을 모두 건너뛰고 수리를 시작하기
    전에 쓴 규정을 다시 틀었다. 왜 멈췄는지는 실행자에게 건네는 묶음에 없었다. 2026-11-03 이후 사용자의
    말로 이은 12번 가운데 끝까지 간 것은 2번이고, 11-03 하루에는 한 수리에 "완료해줘"를 15번 말해야
    했다 — 다시 멈춘 이유는 매번 다른 수리 절차의 벽이었다. 그래서 (1) 완료 기준·권한은 몸이 쥐고 누구도
    바꾸지 못하고(바꿔야 하면 사용자에게 묻는다) (2) 몸이 상태를 사실로 건네고 (3) 의식이 그 상태와
    사용자의 새 말로 남은 일을 규정한다. 잇는 말인지의 판정도 의식 축 모델이 한다. 하네스가 자동으로 잇는
    턴(재기동 뒤·검수 지점 복원)은 같은 턴이 이어지는 것이라 그대로다.
  keywords: [수리 재개, 멈춘 수리, 계속해, 수리를 완료해줘, repair_resume, user_resume, resume_context, 수리 인계, repair_continuation, 재개 규정, state_facts]
  source: "사용자 판정 2026-11-17 (\"네, 구현해\" — 에피소드 6192 점검 대화에서 이어진 논의)"
  status: active
  scent: false

- id: repair-always-framed-by-consciousness
  date: 2026-11-17
  verdict: 채택
  ruling: "수리 판정을 받은 일은 누가 판정했든 의식이 어떻게 고칠지 규정한다 — 사용자의 #repair 는 무의식의 수리 판정과 같다. 자기수리 턴도 정본 반영 전에는 심층실행을 돌린다"
  why: >
    일관성. 그 전(2026-10-03~)에는 사용자가 #repair 를 붙이면 의식 없이 요청문이 그대로 과제와 완료 기준이
    됐다. 사용자가 수리라고 분명히 말한 요청에서만 의식을 건너뛰는 셈이었다. 예외는 하네스가 자동으로
    잇는 턴(재기동 뒤·검수 지점 복원)이다 — 보존된 규정에 따라 하는 일이다. 같은 날 정한 것: 멈춘 수리를
    사용자의 말로 이을 때도 의식이 다시 규정한다(repair-resume-rethinks-from-present-state), 자기수리
    턴에도 정본 반영 전(사본 단계)에는 심층실행을 돌린다(심층실행 설계 9절 3번을 닫음 — 구현은
    docs/REMAINING_REPAIRS_DESIGN_2026_11_17.md 1-나). 업무 도중에 실행자의 요청으로 열리는 한정 수리
    (task_repair)는 요청문을 그대로 규정으로 쓰는 채로 둔다(같은 날 사용자 판정 "지금대로 둬") — 사용자의
    요청을 수리로 판정한 것이 아니라 목표가 정해진 업무 안의 한 걸음이고, 범위가 요청한 파일로 묶여 있다.
  keywords: ["#repair", 수리 판정, REPAIR, 직접 수리, direct_framing, repair_execution, 의식 건너뛰기, 수리 규정, 자기수리 심층실행, 한정 수리, task_repair]
  source: "사용자 판정 2026-11-17 (에피소드 6192 점검 대화, docs/REMAINING_REPAIRS_DESIGN_2026_11_17.md 1·2절)"
  status: active

- id: session-size-shown-no-auto-reset
  date: 2026-11-17
  verdict: 채택
  ruling: "실행자 CLI 세션의 크기는 대화창 머리에 숫자로 보인다 — 크기로 세션을 끊는 자동 리셋은 되살리지 않고, 새로 여는 것은 사용자가 '새 세션'으로 한다"
  why: >
    에피소드 6192(92분, 도구 143회)에서 세션이 67만 토큰까지 자랐고 그 대화의 다음 턴은 그 크기에서 시작했다.
    그러나 큰 세션이 라운드를 느리게 하거나 사용 한도에 닿게 한다는 근거가 운영 기록에 없다(문맥이 큰 턴은
    출력도 길어 원인을 가를 수 없고, 한도 도달 3번은 이 하네스의 사용량으로 설명되지 않는다). 크기 문턱은
    과제 도중에 세션을 끊어 일을 탈선시킨 적이 있어(에피소드 718) 2026-10-02 에 껐고, 그 결정을 뒤집을 일은
    그 뒤에 생기지 않았다. 없던 것은 크기를 볼 곳이다 — 사용자는 세션이 얼마나 큰지 모른 채 이어 썼다.
    그래서 문턱·경고·자동 판단 없이 숫자만 보인다. 다시 판단할 조건: 같은 과제를 새 세션과 50만 이상인
    세션에서 돌려 결과나 시간이 달라지거나, CLI 의 압축(context.compacted) 직후 턴이 앞의 일을 다시 하거나
    조건을 잊는 것이 기록에 보일 때. 하지 말 것: 크기 문턱을 다시 넣는 것, 과제가 바뀌었는지를 경량 모델에게
    물어 세션을 끊는 것(없앤 규정 계승과 같은 구조).
  keywords: [세션 크기, 세션 리셋, 자동 리셋, SESSION_RESET_TOKEN_THRESHOLD, _should_reset_session, 문맥 크기, 컨텍스트 크기, 새 세션, resume, 세션 성장, session_sizes, context_size, 캐시 읽기]
  source: "사용자 판정 2026-11-17 (\"세션 크기는 대화창 상단에 숫자로 보여 주면 될 거 같아\", docs/REMAINING_REPAIRS_DESIGN_2026_11_17.md 3절)"
  status: active

- id: independent-review-for-work-made-to-others-standard
  date: 2026-11-18
  verdict: 채택
  ruling: "남이 정한 기준(공고·규격·양식·과업 지시)에 맞춰 만든 완성 산출물은 끝에서 독립 검토를 받는다 — 제작 과제라고 평가 없이 끝내지 않는다"
  why: >
    끝 확인을 없앤 뒤(2026-11-16, "평가가 필요하면 하고 아니면 평가 없이 끝낸다") 끝에서 결과와 최종 답변을
    읽는 단계는 의식이 규정 때 고른 독립 검토뿐이다. 그 선택 기준(11-12)의 본보기가 "판단의 근거로 삼을, 여러
    출처·수치를 종합한 최종 결과물" 하나여서 제작 과제는 한 번도 선택되지 않았다(11-12 이후 실사용 63턴 중
    10턴, 전부 연구 종합이거나 "검토"가 든 요청). 에피소드 6220(동국대 AI리터러시 교과목안, 심층실행 6단계)
    에서 채팅 답변이 중요한 한계를 빠뜨리고 PDF 실습지의 빈칸이 깨졌는데 아무도 읽지 않고 전달됐다.
    사용자: "이런 일은 마지막에 해줘야 할거 같은데." 원칙(틀리면 비용이 크고 사용자가 스스로 알아채기 어려울
    때만)과 제외 목록(조회·대화·초안·중간 산출물·정기 반복 보고·쉽게 되돌릴 변경)은 그대로다. 평가는 미달과
    남은 것을 알릴 뿐 실행을 다시 돌리지 않는다. 끝에서 의식을 따로 부르는 확인을 되살린 것이 아니다.
  keywords: [독립 검토, 독립 평가, independent_review, 최종 평가, 평가 선택, 선택제, 제작 과제, 공고, 양식, 과업지시서, 완성 산출물, 끝 확인, 마지막 평가, goal_eval]
  source: "사용자 판정 2026-11-18 (에피소드 6220 점검 대화, docs/DEEP_EXECUTION_DESIGN_2026_11_15.md 8.1 '끝을 보는 독립 검토의 선택 기준')"
  status: active

- id: consciousness-corrects-repair-classification
  date: 2026-11-18
  verdict: 채택
  ruling: "분류가 수리로 본 새 요청은 의식이 바로잡는다 — 의식이 needs_repair:false 로 답하면 수리 사본·그랜트 없이 일반 업무(THINK)로 간다. 사용자가 #repair 로 정한 길과 이어지는 수리는 false 여도 유지한다"
  why: >
    분류(무의식·결정론 단서)는 문장 몇 줄을 본 추측이고 의식은 전체 맥락을 본다. 에피소드 6230(창업, "이걸
    구현해봐" — 프로젝트 산출물 제작)이 수리로 분류됐고, 의식은 needs_repair:false 로 답했지만 경로가 바뀌지
    않아 수리 사본에 갇혀 한 줄도 쓰지 못했다(projects/ 는 git 밖이라 사본에 없다). 사용자: "분류가 오판된
    경우 의식이 그걸 고치게 해야하지 않아?" 같은 분기가 2026-09-15~11-03 에 있었다가 빠졌다(0b20946f, #5778):
    그때 needs_repair 의 뜻이 '코어 변경 여부'여서 정당한 비코어 수리(스크립트)의 권한까지 없앴기 때문이다.
    같은 커밋이 뜻을 '일반 프로그램 사본 작업의 필요 여부'로 바꿨으므로 원인은 이미 없어졌다. 11-03 뒤 수리로
    분류된 실사용 17턴 가운데 새 요청 13건에서 의식의 답은 요청 문장·규정으로 보아 모두 맞았고(false 10·true
    3), 분류는 10건이 프로그램 수리가 아니었다. 나머지는 이미 열린 수리를 잇는 턴 3건(끝맺음만 남아 false)과
    예행 1건 — 그래서 이어지는 수리는 정정 대상에서 뺀다. 명시된 false 만 정정이다(필드 없음·의식 실패는
    분류를 따른다). 의식이 틀리게 false 를 낸 진짜 수리는 업무 도중의 한정 수리(task_repair)로 남는다.
    하지 말 것: 이 정정을 다시 없애는 것(먼저 0b20946f 와 이 항목을 볼 것), needs_repair 에 다른 뜻을 겹치는 것.
  keywords: [분류 정정, 오분류, REPAIR, needs_repair, repair_declined, 수리 분류, 무의식 분류, 의식 정정, 수리 사본, 그랜트, consciousness_corrected_classification, "#repair", 프로젝트 산출물]
  source: "사용자 판정 2026-11-18 (\"분류가 오판된 경우 의식이 그걸 고치게 해야하지 않아?\" — 에피소드 6230 점검 대화, docs/SELF_REPAIR_BOUNDARIES_2026_10_31.md '분류가 틀렸을 때 의식이 바로잡는다')"
  status: active
