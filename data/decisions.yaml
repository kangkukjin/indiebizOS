- id: idioms-are-vocabulary
  date: 2026-09-07
  verdict: 채택
  ruling: "상시 소개되는 관용구 = 어휘 — 에피소드마다 자동 증류·자동 작명하지 않는다. 등록은 사람이 부정기로, 후보는 빈도로 캐지 말고 설계해서 준다"
  why: >
    "그런 관용구는 실질적으로 어휘나 마찬가지야. 자주 쓰는 관용구가 어휘라는 것은 그 숫자를
    마구 늘려서는 안 된다는 거야." 상시 소개되는 관용구는 매 턴 비용을 내므로 어휘와 같은 규율을
    받는다. 등록 통로는 scripts/register_idiom.py 하나. 후보를 실행 원장의 빈도로 캐는 방법은
    기각됐다 — 힌트에 있어서 자주 쓰인 것일 수 있어(노출이 빈도를 만든다) 순환이다. 무엇이
    유용한지는 지식으로 설계해서 주고, 언제 어떻게 쓰는지를 프롬프트에 적는다. 가치 기준은
    어떤 일에든 들일 수 있는 도메인 중립 표현.
  keywords: [관용구, idiom, 자동 증류, 자동 작명, 관용구 증류, 관용구 후보, always_on, 빈도 측정]
