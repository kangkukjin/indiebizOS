- id: model-portable-optimization
  date: 2026-09-02
  verdict: 채택
  ruling: "속도·토큰 최적화는 모델을 바꿔도 살아남아야 한다 — 특정 모델·공급자의 버릇에 맞춘 튜닝 금지"
  why: >
    특정 모델의 추론 방식·캐시·토큰 속도에 맞춘 상수는 모델을 바꾸는 날 조용히 결과를 깎는다.
    값은 모델과 함께 낡고, 작업의 모양에 걸린 구조(차선·관문)는 남는다. 추론 예산도 모델 등급이
    아니라 차선(EXECUTE/THINK/REPAIR)에 걸고 공급자가 번역한다. 2026-09-04 같은 취지 재확인:
    설정은 다른 공급자에서도 문제가 없어야 한다.
  keywords: [최적화, 튜닝, 모델 교체, 모델 독립, 공급자, 프로바이더, 추론 예산, 토큰 절감, 속도 개선]
  source: "사용자 원칙 2026-09-02·09-04 (Claude Code 세션), 관련 커밋 521121ee"
  status: active

- id: ai-work-not-fixed-program
  date: 2026-09-03
  verdict: 채택
  ruling: "AI 가 할 일을 고정 프로그램(파서·고정 스키마·선택기·앱 손잡이)으로 만들지 않는다 — 지침 + 어휘 입구 + 입구 앱이면 충분"
  why: >
    하네스는 AI 를 자동화하는 것이 아니라 AI 에게 판단을 맡기고 기억·어휘·입구를 준다. 형식과
    도구를 미리 정하면 자료가 정할 형식을 코드가 정하게 되고, AI 가 필요할 때 스크립트를 짜서
    등록하는 결정화 사다리를 사람이 미리 깔아 버린다. 같은 날 세 번 교정됐다: 자동 주입 선택기
    폐지, 폴더 조사 스크립트·원장·유형별 추출기 폐기, 싼 관측 도구도 미리 짜지 않음.
    설계 전에 물을 것 = "이 코드가 하는 일을 AI 가 지침만 읽고 할 수 있는가".
  keywords: [파서, 고정 스키마, 선택기, 추출기, 고정 프로그램, 조사 스크립트, 관련성 점수, 전용 도구]
  source: "사용자 판정 2026-09-03 (커밋 26b489bb, docs/FOLDER_SURVEY_HANDOFF.md)"
  status: active

- id: no-automatic-forage-injection
  date: 2026-09-03
  verdict: 기각
  ruling: "포식 기억은 프롬프트에 자동 주입하지 않는다 — '필요하면 보라' 한 문장 + 어휘 입구. 예외는 프로젝트 에이전트의 자기 폴더 기억"
  why: >
    항상 주입은 기억이 적을 때의 설계다. 기억이 많아지면 무엇을 넣을지가 관련성 판단이 되고,
    그 판단을 점수·구절 목록으로 코드에 옮기는 것은 AI 가 할 일을 코드가 하는 것이다. 회상은
    판단이 아니라 데이터 접근(장소를 주면 그 자리의 기억 전부)이어야 한다.
    예외(2026-09-05): 프로젝트 폴더의 포식 문서는 그 프로젝트 에이전트의 안정 프롬프트에 통째로
    실린다 — 폴더가 하나로 고정이라 고를 판단이 없으므로 이 판정과 충돌하지 않는다.
  keywords: [자동 주입, 기억 주입, 포식 기억, forage, 선택기, 항상 주입, project_memory, 프롬프트에 넣]
  source: "사용자 판정 2026-09-03 (커밋 7b463775), 프로젝트 에이전트 예외 2026-09-05 (커밋 fe76871f)"
  status: active

