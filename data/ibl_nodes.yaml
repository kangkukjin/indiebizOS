            status: 포털 현황 — 공개 주소(/h/…)·회원 수·오늘 사용량·진열 수 (portal 로 지정)
            portals: 포털 목록 — 대상별 주소 전부 (가족용·친구용…)
            create: 새 포털 만들기 (title — 새 5자 주소 발급)
            remove: 포털 삭제 (portal 필수, 회원 있으면 force:true)
            members: 이웃 목록 (레벨·아이디·개인 링크·오늘 사용량)
            join: 이웃 직접 등록 — 링크 전용 회원 (name 필수, contact·level 옵션)
            promote: 레벨 승급/강등 (member_id + level 0~4 지정 또는 +1, down:true 면 -1 — 전역 이웃등급)
            issue: 개인 링크 재발급 (옛 링크·세션 즉시 무효, 회수 해제 — 비밀번호 분실 복구)
            revoke: 회수 — 그 사람의 링크·쿠키·아이디 로그인 차단 (재발급으로 복구)
            display: 진열 다이얼(포털별) — 항목마다 최소 레벨 드롭다운(set_level=off 또는 0~4). 사용 횟수 캡은 config(포털 단위)
            audit: 사용 기록 (누가·언제·어느 포털에서·무엇을)
            config: 포털 설정 — title/intro/일일 한도(guest_daily·member_daily·global_daily). portal 로 대상 지정
        implementation: 'community-portal 패키지 portal_op — 상태·게이트 로직은 portal_core.py(운영자 어휘와 공개 서빙이 공유, flock 직렬화). 공개 서빙(홈 렌더·가입·개인 링크 쿠키·회원 실행 게이트)은 backend/api_portal.py, 공개 Worker 는 public-files 와 공유(/h/ 네임스페이스). 회원 실행 게이트=계기 app: 블록 선언 템플릿의 인스턴스만 실행(리터럴 파라미터 강제) + 회원/손님/전역 3중 일일 한도 + 감사로그(data/portal_audit.jsonl).'
        keywords:
        - 포털
        - 커뮤니티 홈
        - 마을 포털
        - 이웃 가입
        - 개인 링크
        - 회원 레벨
        - portal
        - community
        app:
          instrument: portal
          icon: 🏘️
          name: 포털
          order: 18
          modes:
          - name: 포털
            auto_run: true
            note: 대상별로 주소를 따로 만드세요 — 가족용·친구용 주소가 각자 자기 첫페이지(진열)와 회원 명부를 가집니다. 주소는 완전 공개해도 됩니다(가입=아이디·비밀번호, 레벨 0 자동 등록 — 승급이 곧 승인).
            action: '[others:portal]{op: "portals"}'
            view:
            - type: card_list
              from: items
              empty_from: message
              card:
                title: 🏘️ {title}
                lines:
                - '{meta}'
                link:
                  href: '{url}'
                  label: 공개 홈 열기 →
            - type: form
              title: 새 포털 만들기
              fields:
              - key: title
                label: 포털 이름 (예 우리 가족, 동창 모임)
                type: text
              action: '[others:portal]{op: "create", title: "$title"}'
              button: ➕ 새 주소 만들기
          - name: 이웃
            auto_run: true
            note: 이 목록은 메신저의 이웃과 같은 책입니다 — 여기서 승급하면 메신저 이웃등급도, 포털 앱 접근도 함께 바뀝니다(레벨 0~4 하나). 홈에서 아이디·비밀번호로 가입한 사람은 레벨 0(손님)으로 이 책에 자동 등록됩니다 — 승급해야 회원 계기가 열려요. 개인 링크는 즉시 로그인 열쇠(비밀번호 분실 복구용) — 본인에게만 전달하세요.
            inputs:
            - key: portal
              type: select
              label: 포털
              options_action: '[others:portal]{op: "portals"}'
              options_from: items
              option_value: slug
              option_label: label
            action: '[others:portal]{op: "members", portal: "$portal"}'
            view:
            - type: kv
              title: '{portal.title}'
              rows:
              - k: 🔗 공개 홈
                v: '{portal.url}'
              - k: 이웃
                v: '{portal.member_count}명 · 오늘 사용 {portal.usage_today}회 · 진열 {portal.display_on}개'
            - type: form
              title: 이웃 직접 등록 (링크 전용 회원)
              fields:
              - key: name
                label: 이름
                type: text
              - key: contact
                label: 연락처 (선택)
                type: text
              action: '[others:portal]{op: "join", portal: "$portal", name: "$name", contact: "$contact"}'
              button: ➕ 등록
            - type: list_action
              from: items
              icon: 👤
              title: '{name} — {level_label}'
              sub: '{meta}'
              button:
                label: ▲ 승급
                action: '[others:portal]{op: "promote", portal: "{portal}", member_id: "{id}"}'
                refresh: true
              button2:
                label: ▼ 내림
                action: '[others:portal]{op: "promote", portal: "{portal}", member_id: "{id}", down: true}'
                refresh: true
            - type: list_action
              from: items
              icon: 🔑
              title: '{name}'
              sub: '{key_hint}'
              button:
                label: 🔗 재발급
                action: '[others:portal]{op: "issue", portal: "{portal}", member_id: "{id}"}'
                refresh: true
              button2:
                label: ⛔ 회수
                action: '[others:portal]{op: "revoke", portal: "{portal}", member_id: "{id}"}'
                refresh: true
            - type: kv_list
              from: items
              title: 개인 링크 (즉시 로그인 — 본인에게만)
              k: '{name}'
              v: '{key_link}'
          - name: 진열
            auto_run: true
            note: 이 포털 첫페이지에 보여줄 것을 고르세요. 항목마다 드롭다운으로 최소 레벨(0~4)을 고르면 됩니다 — 레벨은 이웃등급과 같은 눈금이라, 예컨대 '2 이웃부터'로 두면 레벨 2 이상 이웃에게만 보입니다. '끔'은 안 보이게. '0 손님·전체 공개'는 로그인 안 한 손님도 사용. 사적/몸/발신 계기는 목록에 아예 없습니다. 크롤형 계기는 집 IP 평판을 지키려 손님(0)에게 열지 마세요.
            inputs:
            - key: portal
              type: select
              label: 포털
              options_action: '[others:portal]{op: "portals"}'
              options_from: items
              option_value: slug
              option_label: label
            action: '[others:portal]{op: "display", portal: "$portal"}'
            view:
            - type: list_action
              from: items
              icon: 🎛️
              title: '{icon} {name} — {state}'
              sub: '{meta}'
              select:
                value: '{level_sel}'
                options:
                - value: 'off'
                  label: 끔 (안 보임)
                - value: '0'
                  label: 0 손님·전체 공개
                - value: '1'
                  label: 1 지인부터
                - value: '2'
                  label: 2 이웃부터
                - value: '3'
                  label: 3 친구부터
                - value: '4'
                  label: 4 가족만
                action: '[others:portal]{op: "display", portal: "{portal}", key: "{key}", set_level: "{sel}"}'
                refresh: true
          - name: 기록
            auto_run: true
            note: 회원 실행 게이트를 지나간 사용 기록입니다 (누가 · 언제 · 어느 포털에서 · 무엇을).
            action: '[others:portal]{op: "audit"}'
            view:
            - type: card_list
              from: items
              empty_from: message
              card:
                title: '{title}'
                lines:
                - '{meta}'
                - '{summary}'
          - name: 설정
            auto_run: true
            note: 이름과 소개는 그 포털 공개 홈 맨 위에 실립니다. 아래에서 손님·회원 하루 사용 한도도 이 포털 전체에 정할 수 있어요.
            inputs:
            - key: portal
              type: select
              label: 포털
              options_action: '[others:portal]{op: "portals"}'
              options_from: items
              option_value: slug
              option_label: label
            action: '[others:portal]{op: "status", portal: "$portal"}'
            view:
            - type: kv
              title: 공개 주소
              rows:
              - k: 🔗 홈
                v: '{portal.url}'
            - type: form
              title: 포털 설정
              fields:
              - key: title
                label: 포털 이름
                type: text
                value: '{settings.title}'
              - key: intro
                label: 소개글
                type: textarea
                value: '{settings.intro}'
              action: '[others:portal]{op: "config", portal: "$portal", title: "$title", intro: "$intro"}'
              button: 저장
            - type: kv
              title: 일일 사용 한도
              rows:
              - k: 💡 안내
                v: 이 포털의 모든 계기(앱)에 적용됩니다. 누가 보느냐(레벨 0~4)는 '진열' 탭의 계기별 드롭다운으로, 하루 몇 번 쓰느냐는 여기서 한 번에 정합니다.
            - type: form
              title: 손님·회원 하루 사용 한도
              fields:
              - key: guest_daily
                label: 손님(로그인 없음) 하루 사용 횟수 — 0이면 손님 금지
                type: text
                value: '{settings.guest_daily}'
              - key: member_daily
                label: 회원 1인당 하루 사용 횟수 — 0이면 무제한
                type: text
                value: '{settings.member_daily}'
              - key: global_daily
                label: 계기별 전체 하루 상한 — 0이면 무제한
                type: text
                value: '{settings.global_daily}'
              action: '[others:portal]{op: "config", portal: "$portal", guest_daily: "$guest_daily", member_daily: "$member_daily", global_daily: "$global_daily"}'
              button: 한도 저장
      family_news:
        returns: items
        side_effect: true
        fixture: '[others:family_news]{op: "status"}'
        runs_on: pc_only
        description: 가족신문 (op 분기) — USB 폰 사진(지난 발행 이후)으로 신문 판을 조판해 공개 주소(/n/<5자>)에 누적 발행하는 가족용 정기간행물. 공개 페이지에 방명록·가족 사진 업로드(다음 판 재료)가 달린다. showcase(폴더 진열)와 달리 날짜·장소로 조판된 "판"을 발행.
        target_description: op:status(기본 — 판 목록·초안/발행 구분·공개 주소·제작 진행 상황) / create(폰 사진으로 새 판 초안 제작. 백그라운드 조판 — photo_limit 사진 수 상한, days 며칠치[비우면 지난 발행 이후]. 미발행 초안이 있으면 갈아엎음. 사진 EXIF GPS→행정동 장소명 표기, 웹판 사진 자체는 EXIF 제거) / photos(초안 사진 목록 — 편집용, 각 사진의 날짜·시간·장소·썸네일과 남은 후보 수) / remove_photo(초안에서 file 사진 1장 빼기 — 안 뽑혔던 후보에서 자동 보충[폰 USB 연결 시], 발행 전에만) / publish(edition_id 판을 공개 주소로 발행 — 첫 발행 때 5자 코드 주소 생성) / detail(edition_id 판 상세) / delete(edition_id 판 삭제, 발행판은 force:true 필요) / comments(방명록 — edition_id 필터 가능) / uploads(가족이 보낸 사진 목록) / config(title 제호, photo_limit, public_base).
        target_key: op
        group: family_news
        router: handler
        tool: family_news_op
        ops:
          default: status
          returns:
            create: effect
            remove_photo: effect
            publish: effect
            delete: effect
            config: effect
          side_effect:
            status: false
            photos: false
            detail: false
            comments: false
            uploads: false
          exempt:
            photos: 미발행 초안이 있을 때만 성립 — 초안 유무는 런타임 상태(없는 것이 정상)
            detail: edition_id 필요(status 결과의 id) — 고정 fixture 부적합
            comments: 공개 페이지 방문자 활동에 의존 — 빈 것이 정상이라 결함과 구별 불가
            uploads: 가족이 보낸 사진에 의존 — 빈 것이 정상이라 결함과 구별 불가
          values:
            status: 판 목록(초안·발행)·공개 주소·가족이 보낸 새 사진 수·제작 진행 상황 조회
            create: 폰(USB) 사진으로 새 판 초안 제작 — 백그라운드 조판, status 로 진행 확인
            photos: 초안 사진 목록 (편집용 — 날짜·시간·장소·썸네일 + 남은 후보 수)
            remove_photo: 초안에서 file 사진 빼기 — 후보에서 자동 보충(폰 USB 연결 시), 발행 전에만
            publish: 초안 판을 공개 주소로 발행 (첫 발행 때 /n/<5자 코드> 주소 생성)
            detail: 판 하나 상세 (앱 드릴용 — 기간·사진수·장소·미리보기/공개 주소)
            delete: 판 삭제 (발행된 판은 force:true 필요, 실렸던 가족 사진은 후보로 복귀)
            comments: 공개 페이지 방명록 글 목록 (edition_id 로 판별 필터)
            uploads: 가족이 공개 페이지에서 보낸 사진 목록 (미사용분은 다음 판에 실림)
            config: 설정 — title 제호 / photo_limit 판당 사진 상한 / public_base 공개 사이트
        implementation: family-news 패키지 family_news_op — 폰 MediaStore(adb content query, DCIM 만) 조회 → 날짜별 비례 샘플링(캡) → adb pull → EXIF GPS→Kakao 역지오코딩(1km 격자 캐시) → 웹판(1600px, EXIF 제거) → 정적 신문 HTML(newspaper_html.py). 판·상태는 data/family_news/. 공개 서빙(발행판만)·방명록·업로드 수신은 backend/api_family_news.py, 공개 Worker 는 public-files 와 공유(/n/ 네임스페이스).
        keywords:
