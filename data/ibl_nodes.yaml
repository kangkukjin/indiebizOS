          - url
          - file
        ops:
          default: ask
          returns:
            create: effect
            add: effect
            remove: effect
            delete: effect
          side_effect:
            ask: false
            search: false
            sources: false
            list: false
          fixture:
            list: '[self:notebook]{op: "list"}'
          exempt:
            ask: 노트북 name+질문 필요 — 고정 fixture 부적합
            search: 노트북 name+검색어 필요 — 고정 fixture 부적합
            sources: 노트북 name 필요 — 고정 fixture 부적합
            create: 원장에 노트북을 만든다 — 부작용
            add: 소스 색인을 만든다 — 부작용
            remove: source_id 필요 + 부작용
