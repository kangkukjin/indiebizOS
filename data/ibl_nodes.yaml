                      v: '{track.artist}'
                    - k: 앨범
                      v: '{track.album}'
                    - k: 장르
                      v: '{track.genre|opt:}'
                    - k: 연도
                      v: '{track.year|opt:}'
                    - k: 길이
                      v: '{track.duration_str}'
                    - k: 파일
