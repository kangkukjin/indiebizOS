        group: finance
        target_description: 'save — kind(지출/수입/자산/부채) 평탄형: 거래=amount(원)+category+counterparty+date, 소유=name+value+asset_type. query — query_type(summary/거래/지출/수입/자산/부채/검색/주체목록) + month "YYYY-MM"/days/keyword/source(하나카드·청주페이). delete — record_type(transaction/holding) + record_id(조회 출력의 #번호). ingest — file(영수증 사진/PDF/엑셀 가계부/텍스트 경로) 또는 text 를 AI가 구조화해 일괄 저장. sync — 폰 USB 연결 상태에서 결제 앱(하나카드·청주페이) 알림 수거→지출 병합(알림을 지우기 전에 수거). 전 op 공통 owner(주체 — 미지정=기본, 이름 처음 쓰면 자동 등록).'
        target_key: op
        router: handler
        tool: finance_op
        aliases:
          keyword:
          - query
          - q
        ops:
          returns:
            save: effect
            delete: effect
            sync: effect
          side_effect:
            query: false
          values:
            save: 재무 정보 저장 (kind + 금액/이름 평탄형)
            query: 조회 (query_type + month/days/keyword/source/owner)
            delete: 기록 삭제 (record_type + record_id)
            ingest: 다형 입력 일괄 적재 — 영수증 사진·PDF·엑셀 가계부·텍스트를 AI가 구조화해 저장 (file/text + owner)
            sync: 폰(USB) 결제 알림 수거 → 지출 병합 (하나카드·청주페이, 지우기 전에 수거)
        implementation: handler.py가 op로 분기 — save/query/delete/ingest/sync. 저장=finance_storage.py(data/finance/finance_records.db, 주체·거래·소유 3테이블+sync_log, soft-delete·ext_id dedup). ingest=공용 backend/services/ingest_engine.py 재사용, sync=finance_sync.py(구 spending 패키지 수거기 이식 — adb dumpsys 활성 알림 파싱, 취소=음수 지출, 충전=원장 제외).
        keywords:
        - 재무
        - 재무기록
        - 지출
        - 지출내역
        - 가계부
        - 카드값
        - 결제 내역
        - 하나카드
        - 청주페이
        - 수입
        - 자산
        - 부채
        - 순자산
        - 회사 재무
        app:
          instrument: finance
          icon: 💰
          name: 재무기록
          order: 18
          modes:
          - name: 지출
            auto_run: true
            note: 이번 달 지출입니다. 폰을 USB 로 연결하고 '지금 수거하기'를 누르면 결제 알림에서 카드 내역을 가져옵니다. 알림을 지우기 전에 수거해야 내역이 남습니다.
            action: '[self:finance]{op: "query", query_type: "지출"}'
