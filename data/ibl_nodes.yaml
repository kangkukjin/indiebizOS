              options_from: items
              option_value: title
              option_label: title
            action: '[self:finance]{op: "query", query_type: "자산", owner: "$owner"}'
            view:
            - type: kv
              rows:
              - k: 🏦 자산
                v: '{asset_label}'
              - k: 💳 부채
                v: '{liability_label}'
              - k: ∑ 순자산
