  table:
    actions:
      each:
        returns: transform
        side_effect: true
        runs_on: anywhere
        scope: workspace
        description: 통화 변환자(고차) — items의 각 행에 IBL 문장(do)을 적용한다. 목록을 항목 단위 행동으로 잇는 유일한 어휘.
        target_description: 'do(각 행에 적용할 IBL 문장, 필수 — 행 값은 $it.필드 로 참조) · as(행 참조 이름, 기본 "it") · limit(처리 상한, 기본 20 — 넘으면 앞에서 자르고 skipped 로 알림) · on_error(continue 기본 | stop). 결과는 원 행 + _ok + _error/_result 의 items. 예: [sense:used]{q:"자전거"} >> [table:take]{n:3} >> [table:each]{do: "[self:notify_user]{message: ''$it.title''}"}'
        group: transform
        router: system
        func: table_each
        target_key: do
        implementation: ibl_executors._execute_table_each — 행마다 $it 치환 후 ibl_parse → execute_pipeline(깊이 +1). 부분 실패는 행 단위로 정직 반환(침묵 금지).
        keywords:
        - 각각
        - 하나씩
        - 반복
        - 항목마다
        - 모두에게
        - each
      filter:
        returns: transform
        runs_on: anywhere
        scope: workspace
        description: 통화 변환자 — items에서 조건(where)에 맞는 것만 남긴다(부분집합·비파괴).
        target_description: 'where(필터 조건): 문자열(전 필드 부분일치, 예 "전세") · {field, op, value}(op=eq/ne/lt/le/gt/ge/contains/in) · {열:값} 단축형 · 조건 배열(AND). >> 파이프로 앞 통화를 자동 수용. 도메인 무관 — 모든 검색·목록 생산자에 적용.'
        group: transform
        router: handler
        tool: data_filter
        implementation: data-ops handler.py — items(또는 표형 table 입력)에서 where 미니 DSL로 부분집합. 비파괴(같은 형태 반환).
        target_key: where
        keywords:
        - 필터
        - 거르기
        - 조건
        - 만
        - filter
      sort:
        returns: transform
        runs_on: anywhere
        scope: workspace
        description: 통화 변환자 — items를 기준 필드(by)로 정렬(수치 인식, desc 옵션).
        target_description: 'by(정렬 기준 필드/열명, 필수) · desc(내림차순 bool, 기본 false). 숫자는 수치로, 아니면 문자열로 비교. 예: [...] >> [table:sort]{by: price, desc: true}.'
