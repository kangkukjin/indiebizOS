        # ⑩ 생애주기 op 추가(2026-10-05): create/update/delete/start/stop/role/note — 매니저 창 라우트와 같은 함수(agent_lifecycle).
        open_params: false
        params: {op: string, agent_id: string, project_id: string, name: string, type: string, role: string,
                 allowed_nodes: array, allowed_tools: array, channel: string, email: string, text: string}
        # 실측 items(에이전트 트리 행들) — 07-28 통화 축 정정이 방출은 고치고 선언이
        # 뒤처져 있던 것 (2026-08-19 returns 드리프트 스윕).
        returns: items
        side_effect: true
        requires:
          ops:
            create: {principal: [owner]}
            update: {principal: [owner]}
            delete: {principal: [owner], human_confirm: true}
            start: {principal: [owner]}
            stop: {principal: [owner]}
            role: {principal: [owner]}
            note: {principal: [owner]}
        fixture: '[others:agents]{}'
        description: 프로젝트·에이전트 조회와 생애주기 (op 분기). list=프로젝트별 명부, info=단건, create/update/delete(사람 승인)/start/stop/role/note. (구 [self:agents] 흡수 2026-08-05.)
        target_description: 'op 생략 시 agent_id 가 있으면 info, 없으면 list. agent_id 는 "프로젝트/에이전트id"(또는 project_id 와 함께). create — project_id + name(+type·role·allowed_nodes·channel·email). update — agent_id + 바꿀 필드. delete — agent_id, 영구라 사람 승인 토큰. start/stop — agent_id(상주 러너). role/note — agent_id(+text 주면 쓰기, 없으면 읽기).'
        group: delegation
        target_key: op
        router: system
        func: agents
        ops:
          default: list
          returns:
            info: scalar
            create: effect
            update: effect
            delete: effect
            start: effect
            stop: effect
            role: scalar
            note: scalar
          side_effect:
            list: false
            info: false
          exempt:
            info: 'agent_id 필요(list 결과) — 고정 fixture 부적합'
            role: 'agent_id 필요 — 고정 fixture 부적합'
            note: 'agent_id 필요 — 고정 fixture 부적합'
          values:
            list: 전체 프로젝트별 에이전트 명부 (위임 대상 확인)
            info: 에이전트 단건 상세 (agent_id)
            create: 새 에이전트 (project_id + name, type·role·allowed_nodes 선택)
            update: 에이전트 갱신·이름 바꾸기 (agent_id + 필드)
            delete: 에이전트 삭제 (agent_id, 사람 승인 토큰 필요)
            start: 상주 러너 시작 (agent_id)
            stop: 상주 러너 중지 (agent_id)
            role: 역할문 읽기/쓰기 (agent_id, text 주면 쓰기)
