        target_description: 'list·status — 파라미터 없음. detail — channel_type(gmail|nostr). set — channel_type + enabled|polling_interval(초, ≥5)|config(객체), 사람 승인 토큰 필요(gmail 은 config.yaml 동기화·폴러 새로고침 포함). poll — channel_type 즉시 수신. 비밀 값은 *** 로 가려 돌려준다.'
