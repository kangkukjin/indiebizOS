        ops:
          default: feed
          returns:
            browse: scalar
            like: effect
            retweet: effect
            score: effect
            memo: effect
            forget: effect
            poll: effect
          side_effect:
            neighbors: false
            feed: false
            browse: false
            search: false
          fixture:
            feed: '[others:warehouse]{op: "feed", limit: 5}'
          exempt:
            browse: 'url 필요(neighbors 결과) — 고정 fixture 부적합'
            search: 'query 필요 — 고정 fixture 부적합'
          values:
            neighbors: 이웃 창고 명부 (상태·점수)
            poll: 창고 새로 읽기 (url, 없으면 전부)
            feed: 최근 올라온 것 (limit, 필터 min_level/min_score/favorites)
            browse: 한 창고의 폴더 보기 (url + path)
            search: 스냅샷 검색 (query)
            like: 좋아요 (url + path)
            retweet: 내 창고로 소개 (url + name + level + mode)
            score: 창고 점수 0~3 (url + score)
            memo: 이웃 창고 메모 (neighbor_id + memo)
            forget: 이웃 창고 잊기 (url, 사람 승인 토큰 필요)
        keywords:
        - 창고 피드
        - 이웃 창고
        - 리트윗
        - 좋아요
