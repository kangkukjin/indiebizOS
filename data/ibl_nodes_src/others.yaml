  others:
    actions:
      delegate:
        callable_contract:
          version: 1
          params:
            agent_id: Text
            message: Text
            mode: Text
            scope: Text
            workflow: Text
            steps: List|Text
            from_agent: Text
            project_id: Text
            items: Unknown
            criteria: Unknown
            target: Unknown
            op: Unknown
            role: Text
            allowed: List|Text
            context: Unknown
          required: []
          defaults: {mode: async, scope: same}
          enums: {mode: [async, sync, workflow], scope: [same, cross, system]}
          nonempty: [agent_id, message, workflow, steps]
          variants:
          - when: {scope: same, mode: async}
            required: [agent_id, message]
          - when: {scope: same, mode: sync}
            required: [agent_id, message]
          - when: {scope: same, mode: workflow}
            required: [steps]
            required_any: [[agent_id, workflow]]
          # cross/system 의 workflow 는 구현된 적이 없다 — 검사와 실행 양쪽에서 거절(2026-10-05).
          - when: {scope: cross}
            required: [agent_id, message]
            enums: {mode: [async, sync], scope: [same, cross, system]}
          - when: {scope: system}
            required: [message]
            enums: {mode: [async, sync], scope: [same, cross, system]}
          result: Record
          effects: [write_external]
          compatibility: legacy-envelope/1
          pipe_input: items
          adapter: {protocol: legacy-envelope, value_path: '', legacy_pipe_input: items, input_envelopes: [items]}
        # 닫힌 인자 계약(2026-09-29 78회차 F78-2 census) — 구현이 실제로 읽는 키. 밖의 인자는 check·실행이 UNKNOWN_ARGUMENT.
        open_params: false
        params: {agent_id: string, message: string, mode: string, scope: string, workflow: string,
                 steps: [array, string], from_agent: string, items: [array, object, string],
                 role: string, allowed: [array, string], context: [object, array, string]}
        aliases:
          # do = 문장 자리의 정본 이름(2026-08-15 고차 문장 M1). 핸들러 읽기키는 steps 유지.
          steps: [do, pipeline]
          message: [query]   # _delegate_unified·_agent_ask_sync 폴백 키
        returns: effect
        pipe_in: true   # 앞 통화(_prev_result)를 읽는다 — 정적 검사 T3(죽은 이음매)의 소비자 선언 (2026-09-18)
        description: 에이전트에게 작업 위임 (mode 분기 · scope 분기). 기본 같은 프로젝트 비동기. 반환은 접수증(task_ref·child_task_id·status_url) — 접수는 완료가 아니다.
        target_description: 'agent_id (''에이전트'' 또는 ''프로젝트/에이전트''). message 필수. mode: async(기본, 접수증 반환·결과는 비동기 보고)/sync(같은 접수 뒤 그 작업을 제한 시간 동안 기다려 response 반환, 파이프라인용 — 시간 초과면 실패로 바꾸지 않고 task_ref·state 반환)/workflow(do=IBL 문장 위임, same 전용). scope: same(기본, 대상 에이전트의 상주 러너가 실행 중이어야 함 — others:agents의 start로 시작)/cross(타 프로젝트 자동 활성화, 시스템 AI 전용)/system(자율주행 top-level 시스템 AI에 자연어 의도 위임 — 접수 시점에 시스템 작업을 선발급해 접수증 task_ref·status_url 반환, sync 면 그 작업을 기다림, agent_id 불필요). cross/system 의 workflow 는 미지원 오류. 순환 위임(대상이 조상 사슬에 있음)은 접수 거절. 범위 지정(⑨): allowed=허용 노드 목록 — 부모 권한을 좁히기만(밖의 노드는 잘라내고 allowed_clamped 로 알림)·하위 위임에 상속 / role=시스템 AI 위임의 프롬프트 역할(force_role) / context=구조화 맥락(메시지에 JSON 동봉, 64KB 상한).'
        group: delegation
        target_key: agent_id
        router: system
        func: delegate
        implementation: |
          mode/scope 통합 디스패치(routing_system._delegate_unified). scope=cross →
          _execute_call_project_agent(접수증 dict), scope=same → execute_call_agent(접수증 JSON);
          mode=sync 는 두 scope 모두 같은 접수 뒤 delegation_tasks.await_child 가 자식 task 를
          기다린다(임시 AIAgent 실행기 은퇴, 2026-10-05). mode=workflow → _delegate_workflow (same 전용).
          봉투(origin·chain)는 delegation_tasks.envelope, 상태 투영은 task_view.
        keywords:
        - 위임
        - 에이전트
        - 동기
        - 파이프라인
        - 프로젝트위임
        - 다른프로젝트
      ask:
        # 닫힌 인자 계약(2026-09-29 78회차 F78-2 census) — 구현이 실제로 읽는 키. 밖의 인자는 check·실행이 UNKNOWN_ARGUMENT.
        open_params: false
        params: {to: string, message: string, payload: object, dry_run: boolean}
        aliases:
          message: [query]   # ask_peer 폴백 키
        returns: items
        exempt: 상대 몸 프레즌스 의존(폰 꺼짐=일상, dry_run 도 상대가 컴파일) + 런타임 등록 별칭 하드코딩 부적합 — 헤드리스 점검이 폰 꺼진 날마다 거짓 실패 (limbs:player_status 동류)
        description: 이웃 몸(다른 indiebizOS 기기)에 자연어로 부탁. 상대가 자기 사전으로 컴파일·실행해 결과(items 통화)를 돌려준다. 내 어휘에 없는 상대 능력(이웃 몸 명함의 냄새)은 이 액션으로 — 상대 액션 이름을 흉내내지 말 것. 내 몸의 경량 원샷 질문은 [self:ask].
        target_description: 'to=상대 몸 별칭(프레즌스 등록명, 예 "폰-9f2b"). 생략 시 유일한 이웃 몸 자동, 여럿이면 되물음. message=자연어 부탁(필수 — 상대 사전을 몰라도 됨). payload=동봉(선택, dict) — 클립보드 텍스트처럼 그대로 전달할 리터럴 데이터. message 에서 payload.<키> 로 지칭하면 상대가 원문 그대로 치환해 쓴다(LLM 이 베끼지 않음). dry_run=true면 상대가 컴파일만(실행 안 함). 반환=상대 실행 결과 + compiled_ibl(상대가 부탁을 어떻게 이해했는지).'
        group: delegation
        target_key: to
        router: system
        func: ask_body
        implementation: |
          body_ask.ask_peer — device_registry 라이브에서 to 별칭 해소(생략 시 유일 피어),
          몸별 인증(phone-class=X-Phone-Token, compute=런처 세션)으로 상대 /nodes/ask 에
          POST. 상대가 자기 사전으로 컴파일·실행(사전은 전선을 건너지 않는다 — 몸 독립
          소통 연구 docs/BODY_CARD_RESEARCH.md).
        keywords:
        - 부탁
        - 이웃몸
        - 폰에부탁
        - 몸간요청
        - 명함
        - 다른기기
      chat_room:
        # ⑩ 멀티채팅 채팅방(여러 에이전트가 한 방에서 말하는 곳) — multi_chat.db. 이웃 메신저(others:messages)와 다른 명사.
        open_params: false
        params: {op: string, room_id: string, name: string, description: string, project_id: string, agent_id: string,
                 agent_name: string, message: string, response_count: integer, limit: integer}
        aliases:
          room_id: [id]
          message: [text]
        returns: items
        side_effect: true
        requires:
          ops:
            create: {principal: [owner]}
            add: {principal: [owner]}
            remove: {principal: [owner]}
            say: {principal: [owner]}
            clear: {principal: [owner]}
            trash: {principal: [owner]}
            delete: {principal: [owner], human_confirm: true}
        fixture: '[others:chat_room]{op: "list"}'
        description: 멀티채팅 채팅방 (op 분기). list/candidates/create/info/participants/add/remove/messages/say(발화→에이전트 응답)/clear/trash/delete(사람 승인).
        target_description: 'list·candidates(초대 가능 에이전트) — 파라미터 없음. create — name(+description). info/participants/messages(+limit)/clear/trash/delete — room_id. add — room_id + project_id + agent_id("프로젝트/에이전트" 도 됨). remove — room_id + agent_name. say — room_id + message(@이름 으로 지목, response_count 기본 2) → items=응답들.'
        group: delegation
        target_key: op
        router: system
        func: chat_room_op
        implementation: 조립 루트가 주입한 chat_room_ops.chat_room_op(서비스층) → multi_chat_manager(조종실 /multi-chat 라우트와 같은 매니저).
        ops:
          default: list
          returns:
            candidates: items
            create: effect
            info: scalar
            participants: items
            add: effect
            remove: effect
            messages: items
            say: items
            clear: effect
            trash: effect
            delete: effect
          side_effect:
            list: false
            candidates: false
            info: false
            participants: false
            messages: false
          fixture:
            candidates: '[others:chat_room]{op: "candidates"}'
          exempt:
            info: 'room_id 필요 — 고정 fixture 부적합'
            participants: 'room_id 필요 — 고정 fixture 부적합'
            messages: 'room_id 필요 — 고정 fixture 부적합'
          values:
            list: 채팅방 목록
            candidates: 초대할 수 있는 에이전트 목록 (전 프로젝트)
            create: 새 채팅방 (name, description 선택)
            info: 채팅방 상세 + 참가자 (room_id)
            participants: 참가자 목록 (room_id)
            add: 참가자 추가 (room_id + project_id + agent_id)
            remove: 참가자 제거 (room_id + agent_name)
            messages: 최근 메시지 (room_id, limit)
            say: 발화 → 참가 에이전트 응답 (room_id + message, @이름 지목)
            clear: 메시지 전부 삭제 (room_id)
            trash: 휴지통으로 (room_id, 복구는 [self:trash])
            delete: 영구 삭제 (room_id, 사람 승인 토큰 필요)
        keywords:
        - 채팅방
        - 멀티채팅
        - 에이전트 회의
      warehouse:
        # ⑩ 이웃 창고(공유창고 피드) — 조종실 창고 창(api_warehouse_feed)과 같은 함수(warehouse_ops). 내 창고 관리는 [self:warehouse].
        open_params: false
        params: {op: string, url: string, path: string, query: string, limit: integer, sort: string, min_level: integer,
                 min_score: integer, favorites: boolean, name: string, level: integer, mode: string, warehouse: string,
                 score: integer, neighbor_id: integer, memo: string}
        aliases:
          query: [q]
          url: [wh_url]
        returns: items
        side_effect: true
        requires:
          ops:
            like: {principal: [owner]}
            retweet: {principal: [owner]}
            score: {principal: [owner]}
            memo: {principal: [owner]}
            poll: {principal: [owner]}
            forget: {principal: [owner], human_confirm: true}
        fixture: '[others:warehouse]{op: "neighbors"}'
        description: 이웃 창고 피드 (op 분기) — 내 창고 관리는 [self:warehouse]. neighbors/poll(새로 읽기)/feed/browse(한 창고 안)/search/like/retweet(내 창고로 소개)/score(0~3)/memo/forget(사람 승인). 이웃 등급은 [others:neighbor]{op:save, info_level}.
        target_description: 'neighbors — 파라미터 없음(상태·점수 동반). poll — url(없으면 전부). feed — limit·min_level·min_score·favorites(필터). browse — url + path. search — query(+limit·sort·필터). like — url(창고) + path(파일). retweet — url(파일 주소) + name + level(0~4) + mode(link|copy). score — url + score(0~3). memo — neighbor_id + memo. forget — url(이웃 창고를 등기부·캐시에서 제거, 사람 승인).'
        group: community
        target_key: op
        router: system
        func: warehouse_op
