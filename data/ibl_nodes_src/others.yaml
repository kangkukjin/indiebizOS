        target_description: "channel_type은 email/nostr(gmail은 email의 옛 별칭). 한메일·다음메일 등 메일 서비스 이름도 channel_type은 email이다. 최근 메일 5개: [others:channel_read]{channel_type:\"email\",max_results:5}. 시스템 AI는 account로 계정 선택, 프로젝트 에이전트는 설정된 신원 유지. .env의 IMAP_EMAIL과 일치하는 계정은 IMAP_HOST/PORT/USERNAME/PASSWORD로 TLS 읽기 전용 INBOX 조회. query는 Gmail 계정에서 Gmail 문법, 일반 IMAP은 일반 텍스트·from:·to:·subject:·after:·before:·is:unread/read의 AND 검색만 지원(미지원 문법은 오류). 날짜 YYYY-MM-DD 또는 YYYY/MM/DD, after는 해당 날짜 포함·before는 제외. 조회 개수는 limit 또는 기존 max_results 중 하나(동시 지정 금지). email 기본 10(일반 IMAP 1~100), nostr 기본 20. nostr 최근 수신은 since(Unix 초)를 지원한다. 인증 실패 시 다른 공급자로 우회하지 않음."
