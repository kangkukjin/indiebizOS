            disable: 트리거 비활성화 (trigger_id)
            status: 전체 트리거 상태 요약
            history: 트리거 실행 이력 (trigger_id)
        implementation: trigger_engine.execute_trigger 입구에서 op→action 재매핑 후 기존 분기(list/get/create/update/delete/enable/disable/status/history) 그대로 사용.
        keywords:
        - 트리거
        - 트리거 등록
        - 트리거 목록
        - 트리거 삭제
        - 트리거 이력
        - 트리거 상태
        - 자동 실행
      output:
        aliases:
          content: [data]
          format: [type]
        returns: effect
        description: 결과를 지정한 목적지로 내보냄 (op 분기). gui=UI 표시, clipboard=클립보드 복사. 파일 저장은 write(파이프 싱크 겸용 — 어휘 중복 흡수 2026-08-05).
        target_description: 'gui — content(HTML/데이터) + format(카드/테이블/HTML). clipboard — content(텍스트).'
        group: output
        target_key: op
        router: system
        func: output_op
        ops:
          default: gui
          values:
            gui: UI에 HTML/카드/테이블로 표시 (WebSocket)
            clipboard: OS 클립보드에 복사
        implementation: ibl_routing._route_system이 op로 분기 — output_gui/output_clipboard에 위임.
        keywords:
        - 출력
        - 표시
        - 클립보드
        - 복사
        - UI
      download:
        returns: effect
        description: URL에서 파일 다운로드해 로컬 저장. HTML 페이지 텍스트 추출은 sense:crawl.
        target_description: 다운로드 URL. output 옵션으로 저장 경로 지정.
        group: output
        target_key: url
        router: system
        func: output_download
        implementation: requests + 파일 I/O로 URL에서 파일 다운로드
        keywords:
        - 다운로드
        - 파일받기
      package:
        # list op 가 목록을 낸다 — self:switch·self:trigger 와 같은 부류.
        returns: items
        # ★install/remove 는 폴더를 옮기고 어휘를 재빌드한다 — 명백한 부작용.
        side_effect: true
        fixture: '[self:package]{op: "list"}'
        description: 도구 패키지 생애주기 관리 (op 분기). list=설치됨/설치가능 목록, info=상세, install/remove=폴더 이동+IBL 어휘 재빌드+캐시 초기화, reload=런타임 캐시만 초기화(handler.py·어휘 선언 편집 뒤, POST /packages/reload 의 낱말 자리).
        target_description: 'list/reload — (파라미터 없음). info/install/remove — package_id(필수). reload 는 되살린 범위(reloaded)와 못 되살린 범위(not_reloaded — tool_*.py·backend 는 재기동)를 봉투로 말한다.'
        group: system
        target_key: op
        router: system
        func: package_op
        # ★셸 그림자(2026-09-06 ep2904): 몸 자신의 리로드 API 를 curl 로 두드린 4회 — 편집 결과문이
        #   이 op 을 약속했는데 낱말엔 없었다. url_contains = 같은 머리(curl)라도 이 경로일 때만 그림자.
        shell_shadow:
          heads: [curl, wget, http, xh]
          argmap:
            url_contains: ["/packages/reload"]
            skeleton: {op: reload}
        ops:
          default: list
          returns:
            install: effect
            remove: effect
            reload: effect
            info: scalar
          side_effect:
            list: false
            info: false
          fixture:
            info: '[self:package]{op: "info", package_id: "web"}'
          values:
            list: 설치됨/설치가능 패키지 목록 (package_id, 어휘 액션 수 포함)
            info: 패키지 상세 정보 (package_id)
            install: not_installed→installed 이동 + IBL 어휘 재빌드 + 캐시 초기화 (package_id)
            remove: installed→not_installed 이동 + IBL 어휘 재빌드 + 캐시 초기화 (package_id)
            reload: 런타임 캐시만 초기화 — 카탈로그·api_registry·실행기·의식·handler.py (POST /packages/reload 동형)
        implementation: package_manager.PackageManager 래핑. install/remove 후 build_ibl_nodes.py 서브프로세스 재빌드 +
          ibl_routing.invalidate_runtime_caches(POST /packages/reload·reload op 과 한 절차).
        keywords:
        - 패키지
        - 도구
        - 설치
        - 제거
        - 능력
        - 리로드
        - reload
        - 확장
      install_lib:
        returns: effect
        description: 파이썬 라이브러리(pip) 확인·승인 설치. 이미 있으면 installed 즉답, check:true=확인만(부작용 0, installed/approved/pending/missing). ★사람 승인 게이트 — 미승인은 대기열+알림(approval_required), 사용자가 도구 관리 창에서 승인한 뒤 같은 호출을 다시 하면 설치.
        target_description: 'package(필수) — pip 패키지명(세상의 도구 지도 world_tools.md 의 이름 그대로). check(선택, bool) — 확인만. reason(선택) — 왜 필요한지 한 줄(승인 화면에 보임). 설치 위치=쓰기가능 pylibs, 재기동 불요. package="playwright"면 chromium 바이너리도 함께. 예: {package: "duckdb", check: true}.'
        group: system
        router: system
        func: install_lib
        keywords:
        - 설치
        - 라이브러리
        - 의존성
        - pip
        - 라이브러리설치
