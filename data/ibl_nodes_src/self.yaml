      task:
        # ③ 작업 수명의 공통 관찰·제어(2026-10-05, docs/APP_COMMON_FOUNDATION_GAPS §1-③). 긴 작업의 접수증(task_ref)을 읽는
        # 유일한 낱말 — 위임·script 백그라운드·guestpc·신문 발행·강의 렌더·노트북 색인·시트 엔진이 같은 통화를 돌려준다.
        # 저장소 없음(backend/base/task_receipts 어댑터 등록부). 목표(self:goal)는 다른 수명이라 섞지 않는다.
        open_params: false
        params: {op: string, ref: [object, string], kind: string, task_id: string, owner: string, timeout: integer, suspend: boolean}
        # 반환 칸 선언(2026-10-07 긴문장 26회차 L26-1): 선언이 없어 검사기가 `$r.error` 같은 없는 칸을 못 잡았고,
        # 실행 중 MISSING_FIELD 는 이미 시작한 작업을 남긴 채 프로그램을 끝냈다. 투영은 항상 이 칸들을 갖는다.
        callable_contract:
          version: 1
          params: {op: Text, ref: Unknown, kind: Text, task_id: Text, owner: Text, timeout: Number, suspend: Bool}
          required: []
          enums: {op: [status, wait, cancel]}
          defaults: {op: status}
          result:
            $closed: true          # 투영은 항상 이 칸들이다 — 없는 칸(error 등)은 실행 전에 걸린다. 선택 칸(raw·note)은 get 으로
            success: Bool
            task_ref: Record
            state: Text
            terminal: Bool
            timed_out: Bool
            result: Unknown
            failure: Unknown
            progress: Unknown
            accepted_at: Unknown   # 접수 시각(글) 또는 null — 접수 기준 시계(29회차 L29-3)
            elapsed_s: Unknown     # 접수부터 지금(끝났으면 종료)까지의 초 또는 null
          effects: [unknown]
          nondeterministic: true
          per_run: true
          adapter: {protocol: legacy-envelope, value_path: ""}
          variants:
          - when: {op: status}
            effects: [read_external]
          - when: {op: wait}
            effects: [read_external]
          - when: {op: cancel}
            effects: [write_external]
        returns: scalar
        side_effect: true        # cancel 보유 — 통화(returns)와 안전은 다른 축
        exempt: '접수증(task_ref) 필요 — 고정 fixture 부적합'
        description: 긴 작업 접수증(task_ref)의 공통 관찰·제어 (op 분기). status=현재 상태, wait=끝날 때까지 유한 대기 뒤 result, cancel=취소 요청. 위임·script·guestpc·신문·강의 렌더·노트북·시트·IBL 실행이 같은 접수증.
        target_description: 'ref 필수 — 접수증의 task_ref({kind, task_id[, owner]}) 그대로(접수증 통째도 됨). 반환 칸은 항상 같다: state(queued/running/waiting_children/cancel_requested/succeeded/failed/cancelled/interrupted/unknown)·terminal·timed_out·result(성공일 때만 값, 아니면 null)·failure(작업의 실패 사유, 아니면 null)·progress. accepted_at·elapsed_s 는 접수 기준 시계(접수부터 지금·끝났으면 종료까지의 초, 모르면 null) — wait 의 timeout 은 그 호출이 기다린 시간일 뿐이라 "접수 후 N초 안에 끝났는가"는 elapsed_s 로 센다. status: 실패한 작업도 값으로 답한다(모르는 작업만 실패). wait: timeout(초, 기본 60·상한 240) 안에 성공하면 result, 시간 초과는 실패가 아니라 값(timed_out: true — [if:$r.timed_out] 로 갈라 같은 ref 로 다시), 현재 IBL에서 suspend:true는 시간 초과 시 프로그램을 중단·보존하며 주인 실행은 자식 종료 뒤 같은 원장에서 자동 재개한다(기본 timeout=0). 승인 대기는 자동 승인하지 않는다. 작업이 실패·취소·유실로 끝나면 이 호출이 실패하며 [catch] 의 $error.details.state·failure 로 사정을 읽는다. cancel: 어댑터가 확인한 사실만 — state 로 읽는다(cancelled=멈춤 확인, cancel_requested=요청만 남음). 이미 끝난 작업은 실패가 아니라 그 종료 투영을 값으로 돌려준다(state: succeeded 면 result 도 있다). 살아 있는데 취소를 지원하지 않는 종류(렌더 등)만 거절되며 [catch] 의 $error.details.state 가 현재 상태다. script 백그라운드·개별 위임·IBL 실행은 취소 요청을 지원한다. 위임은 실행 범위가 끝난 뒤에만 cancelled이며 자식 취소는 해당 접수증으로 별도 요청한다. 작업을 시작한 낱말을 다시 부르지 말 것 — 접수증으로 이어받는다.'
        group: system
        target_key: op
        router: system
        func: task_op
        implementation: _route_system task_op → backend/base/task_receipts(접수증 통화·상태 어휘·어댑터 등록부). 위임 어댑터는 routing_system.register_all, 패키지 종류는 각 ibl_actions.yaml 최상위 task_kinds.
        ops:
          default: status
          returns:
            cancel: effect
          side_effect:
            status: false
            wait: false
          exempt:
            status: 'task_ref 필요 — 고정 fixture 부적합'
            wait: 'task_ref 필요 — 고정 fixture 부적합'
          values:
            status: 현재 상태·진행·(종료면) 결과
            wait: 유한 대기 뒤 결과 — 시간 초과는 실패가 아니다
            cancel: 취소 요청 — 확인된 사실만 보고
        keywords:
        - 작업 상태
        - 접수증
        - 대기
        - task
        - wait
        - 취소
