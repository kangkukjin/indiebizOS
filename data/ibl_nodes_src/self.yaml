      trash:
        # ⑩ 런처 휴지통 — 프로젝트·폴더·스위치·채팅방이 한 휴지통(조종실 /trash 와 같은 세 저장소 합집합). 디스크 삭제(self:delete)와 무관.
        open_params: false
        params: {op: string, item_id: string, item_type: string}
        aliases:
          item_id: [id]
        returns: items
        side_effect: true
        requires:
          principal: [owner]
          ops:
            empty: {principal: [owner], human_confirm: true}
        fixture: '[self:trash]{op: "list"}'
        description: 런처 휴지통 (op 분기). list=프로젝트·폴더·스위치·채팅방 휴지통 합집합, restore=복구(item_id+item_type), empty=비우기(영구, 사람 승인).
        target_description: 'list — 파라미터 없음(각 행 item_type=project|folder|switch|chat_room). restore — item_id + item_type. empty — 전부 영구 삭제, 사람 승인 토큰 필요.'
        group: system
        target_key: op
        router: system
        func: trash_op
        implementation: launcher_ops.trash_op → project_manager.list_trash/restore_from_trash/empty_trash + switch_manager + multi_chat_manager(chat_room_ops). 조종실 /trash 라우트와 같은 함수.
        ops:
          default: list
          returns:
            restore: effect
            empty: effect
          side_effect:
            list: false
          values:
            list: 휴지통 항목 전부 (item_type 동반)
            restore: 복구 (item_id + item_type)
            empty: 휴지통 비우기 (영구, 사람 승인 토큰 필요)
        keywords:
        - 휴지통
        - 복구
      warehouse:
        # ⑩ 내 창고(공유창고 레벨 0~4) 관리 — 공개면 관리창(portal_admin)과 같은 함수(warehouse_admin). 이웃 창고는 [others:warehouse].
        open_params: false
        params: {op: string, level: integer, name: string, new_name: string, dest: string, dest_level: integer, paths: array, path: string, all: boolean}
        returns: items
        side_effect: true
        requires:
          principal: [owner]
          ops:
            purge: {principal: [owner], human_confirm: true}
        fixture: '[self:warehouse]{op: "list"}'
        description: 내 공유창고(레벨 0~4) 관리 (op 분기) — 이웃 창고 피드는 [others:warehouse]. list/add(넣기)/remove(휴지통으로)/move(옮기기·이름변경·레벨 변경)/mkdir/trash(휴지통 목록)/restore/purge(영구, 사람 승인).
        target_description: 'level 은 0~4(기본 0). list — level. add — level + paths(디스크 경로 목록, 폴더도 됨) + dest(창고 안 하위폴더, 선택). remove — level + name(창고 안 상대경로) → 휴지통. move — level + name + dest(폴더) + dest_level(레벨 변경=공개 범위 변경) + new_name. mkdir — level + name + dest. trash — 전 레벨 휴지통 목록. restore — level + name. purge — level + name 또는 all:true, 사람 승인 토큰 필요.'
        group: system
        target_key: op
        router: system
        func: my_warehouse_op
        implementation: 조립 루트가 주입한 warehouse_admin.my_warehouse_op(서비스층) — 경로 규칙은 base.warehouse_paths 한 벌.
        ops:
          default: list
          returns:
            trash: items
            add: effect
            remove: effect
            move: effect
            mkdir: effect
            restore: effect
            purge: effect
          side_effect:
            list: false
            trash: false
          fixture:
            trash: '[self:warehouse]{op: "trash"}'
          values:
            list: 그 레벨 창고의 파일·폴더 목록 (level)
            add: 디스크 파일·폴더를 창고에 넣기 (level + paths + dest)
            remove: 창고에서 빼기 = 휴지통으로 (level + name)
            move: 창고 안 옮기기·이름변경·레벨 변경 (level + name + dest/dest_level/new_name)
            mkdir: 새 폴더 (level + name + dest)
            trash: 창고 휴지통 목록 (전 레벨)
            restore: 휴지통에서 복구 (level + name)
            purge: 휴지통 영구 삭제 (level + name 또는 all, 사람 승인 토큰 필요)
        keywords:
        - 내 창고
        - 공유창고 관리
        - 창고에 넣기
      media:
        # ⑩ 미디어 파일 탐침·변환·HLS·자막 — NAS 라우트(api_nas)와 같은 함수(media_ops). 변환·사다리는 ③ 접수증(task_ref).
        open_params: false
        params: {op: string, path: string, dst: string, track: integer, smi_class: string}
        aliases:
          path: [file]
        returns: scalar
        side_effect: true
        exempt: '미디어 파일 경로 필요 — 고정 fixture 부적합'
        description: 미디어 파일 (op 분기). probe=코덱·길이·내장 자막 트랙, transcode=브라우저용 mp4 변환(접수증), hls=HLS 사다리 준비(접수증), subtitles=연결 자막 파일 목록, subtitle=자막을 VTT 텍스트로.
        target_description: 'path 필수(동영상 또는 자막 파일). probe — path. transcode — path(+dst, 기본 같은 자리 .web.mp4) → task_ref(접수증, [self:task]{op:wait}). hls — path → task_ref. subtitles — path(동영상): 옆에 있는 srt/vtt/ass/smi 목록 + 내장 트랙. subtitle — path(자막 파일, smi_class 선택) 또는 path(동영상)+track(내장 트랙 번호) → vtt.'
        group: system
        target_key: op
        router: system
        func: media_op
        implementation: 조립 루트가 주입한 media_ops.media_op(서비스층) — ffprobe 탐침(캐시)·thumbnails.transcode_video_to_mp4·hls_ladder.ensure_ladder·nas_subtitle 변환.
        runs_on: pc_only
        ops:
          default: probe
          returns:
            transcode: effect
            hls: effect
          side_effect:
            probe: false
            subtitles: false
            subtitle: false
          exempt:
            probe: '미디어 파일 경로 필요'
            subtitles: '동영상 경로 필요'
            subtitle: '자막 파일 경로 필요'
          values:
            probe: 코덱·컨테이너·길이·내장 자막·브라우저 호환 여부 (path)
            transcode: 브라우저용 mp4 변환 — 접수증 반환 (path, dst 선택)
            hls: HLS 사다리 준비 — 접수증 반환 (path)
            subtitles: 연결 자막 파일 목록 + 내장 트랙 (path)
            subtitle: 자막 → VTT 텍스트 (자막 path, 또는 동영상 path + track)
        keywords:
