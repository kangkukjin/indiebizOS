        target_description: 'list — 파라미터 없음. create — name(+parent_folder). items — folder_id(폴더 안 항목). rename — folder_id+new_name. move — folder_id(+parent_folder, 없으면 바깥으로). trash — folder_id(휴지통, 복구는 [self:trash]).'
        group: system
        target_key: op
        router: system
        func: folder_op
        implementation: launcher_ops.folder_op → project_manager(create_folder/get_folder_items/rename_item/move_to_folder/move_out_of_folder/move_to_trash). 조종실 /folders 라우트와 같은 함수.
        ops:
          default: list
          returns:
            items: items
            create: effect
            rename: effect
            move: effect
            trash: effect
          side_effect:
            list: false
            items: false
          exempt:
            items: 'folder_id 필요(list 결과의 id) — 고정 fixture 부적합'
          values:
            list: 휴지통 밖 런처 폴더 목록
            create: 새 폴더 (name, parent_folder 선택)
            items: 폴더 안 항목 (folder_id)
            rename: 이름 바꾸기 (folder_id + new_name)
            move: 다른 폴더로/바깥으로 (folder_id + parent_folder)
            trash: 휴지통으로 (folder_id)
