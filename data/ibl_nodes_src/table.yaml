  table:
    actions:
      # each는 현재 컴파일러·런타임의 코드 블록 조합이다.
      each:
        open_params: true
        open_params_reason: 'each의 items·mode·on_error·parallel과 코드 블록은 ibl_v2_compile이 직접 검사한다.'
        target_description_edition: 2
        returns: transform
        flow:   # 정적 통화 검사(2026-09-05, docs/IBL_STATIC_TYPECHECK_HANDOFF.md §2-2) — 검사기는 이 선언만 읽는다
          accepts: items
          emits: items
          columns: open
          columns_param: keep
        side_effect: true   # do 안에 무엇이든 올 수 있다 — dry-run 이 초록불을 켜면 안 된다
        runs_on: anywhere
        scope: workspace
        description: 목록의 각 입력에 코드 블록을 실행하고 결과를 입력 순서대로 모은다. 기본 map·실패 stop이며 전체 입력을 공유 실행 예산 안에서 처리한다.
        authoring_hint: '$행 >> [table:each]{parallel:4}{return $it}. items는 목록 또는 items 목록을 가진 Record. mode는 map(기본)·flat_map(List 반환을 한 겹 펼침)·effect(Unit 반환), on_error는 stop(기본)·collect(map에서 List<Result>), parallel은 1~8. 본문은 코드 블록이며 $it·$i를 읽는다. limit은 없고 표본은 앞에서 take로 명시한다. Unit을 원 행으로 바꾸지 않는다.'
        target_description: 'items는 List 또는 items List를 가진 Record. 코드 블록에서 $it·$i를 읽으며 return으로 결과를 만든다. mode는 map·flat_map·effect, on_error는 stop·collect(map 전용), parallel은 1~8. 입력 순서를 보존하며 collect 결과는 List<Result>이다. 실패·원행·메타데이터의 투영은 본문에서 명시한다. 입력 제한은 take로 먼저 선택한다.'
        group: transform
        router: system
        func: table_each
        implementation: ibl_v2_compile.each → ibl_v2_runtime의 each 코드 블록 실행
        keywords:
        - 각각
        - 하나씩
        - 반복
        - 항목마다
        - 모두에게
        - each
      reduce:
        callable_contract:
          version: 1
          # 닫힌 인자 계약(2026-09-29 78회차 F78-2 census) — _execute_table_reduce 가 읽는 키(expr 은 step 의 옛 이름).
          params:
            items: List|Record|Text
            step: Text
            init: Unknown
            as: Text
          aliases: {expr: step}
          required: []
          result: Record
          effects:
          - pure
          compatibility: legacy-envelope/1
          adapter:
            protocol: legacy-envelope
            input_envelopes: [items]
            value_path: ''
          pipe_input: items
        # 프로그램급 IBL M5 (2026-08-22, docs/IBL_PROGRAM_GRADE_DESIGN.md §2.3): 행을 순회하며 상태(acc)를
        # 넘기는 fold — groupby(고정 집계 5종)·compute(행→행)가 못 하는 "누적". 식 한 줄만(경계선 판정):
        # 객체·목록 구성도 허용한다. 임의 실행문은 [self:script]. 식 평가기는 common.safe_expr(compute 와 같은 화이트리스트).
        returns: transform
        flow:   # 정적 통화 검사(2026-09-05, docs/IBL_STATIC_TYPECHECK_HANDOFF.md §2-2) — 검사기는 이 선언만 읽는다
          accepts: items
          emits: scalar
        runs_on: anywhere
        scope: workspace
        description: 통화 변환자(고차) — items 객체 행을 순회하며 한 줄 식으로 누적(fold). 객체 아닌 행은 위치와 함께 거절하고 빈 목록은 init을 보존한다. init 초기값, step 식(acc=누적값·i=행 번호·열 이름·col("열")), as 결과 이름. 합·최대·문자열 이어붙이기 같은 한 줄 누적만 — 그 이상은 [self:script].
        target_description: 'step(한 줄 식, 필수 — acc 가 누적값, 열 이름을 그대로 쓴다: "acc + 보증금", "max(acc, price)", "acc + title + \", \"") · init(초기값, 기본 0 — 문자열 누적이면 "") · as(결과 열 이름, 기본 value) · items(앞 통화 없이 직접 줄 때). 결과: value(스칼라)·message·items 1행 [{as: value}] — $변수로 받아 조건에 쓴다. 예: [sense:realty]{…} >> [table:reduce]{init: 0, step: "acc + 보증금", as: "총보증금"}'
        group: transform
        router: system
        func: table_reduce
        target_key: step
        implementation: ibl_executors._execute_table_reduce — common.safe_expr 화이트리스트 식을 행마다 acc·i 와 함께 평가. 없는 열·식 오류·행 계산 실패는 정직 에러(partial 동봉).
        keywords:
        - 누적
        - 합계
        - 접기
        - 모으기
        - reduce
        - fold
    description: '표/통화 변환 문법 — 관계대수(filter·sort·take·select·dedup·groupby·join·union·merge)와 통화 emitter(chart·spreadsheet·document·structure) + 고차 변환자(each·reduce) + AI 낱말(ai=의미 변환·brief=산문 종합은 기어 실행 축 — ai-ops 패키지·ai_call 고지). 도메인·몸 무관 IBL 문법 계층.'
    # 문법 계층 — 노드 on/off 선별에서 engines 가 꺼져도 파이프가 살도록 항상 허용
    always_on: true
    tags:
    - 변환
    - 문법
