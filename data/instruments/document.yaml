# 문서 앱 — 빈노트의 얼굴 + 형식별 엔진 (docs/DOCUMENT_APP_ON_BINNOTE_PLAN_2026_10_05.md)
# 어휘 없는 순수 매니페스트. 능력은 전부 기존 낱말이다.
#
#   빈 페이지 = 앱을 열면 바로 서는 빈 페이지. 비어 있고 아무 창도 쥐지 않은(세션 없음 = 저장 안 한 초안도 없음) 가장 최근
#              "무제 …" 문서가 있으면 그것을 다시 쓰고(빈 파일이 쌓이지 않게), 아니면 "무제 날짜 시각.txt" 를 만들어 연다(기본은 텍스트 파일). 화면에는 캔버스만 선다 — 나머지 탭은 캔버스의 ⚙ 안에 접힌다(빈 페이지 자신은 첫 화면이지 메뉴 항목이 아니다 — ⚙ 에 나오지 않는다).
#   새 문서  = 같은 이름이 없을 때만 [self:write](빈 파일. 한글은 빈 문서 틀을 [self:copy]) → open → engine 뷰
#   열기     = 경로로 open — 데스크탑은 문서함 폴더에서 시작하는 파일 창(입력의 browse)으로 고른다. DOCX·HWP·PDF 등 어디에 있든.
#              (옛 "문서함" 목록 탭은 은퇴 — 파일 창이 그 일을 한다. 2026-10-06 사용자 지시)
#   ⚙ 안의 탭은 화면을 옮기지 않는다: 입력이 필요한 탭은 작은 창에서 받고, 성공했을 때만 캔버스가 그 문서로 바뀐다.
#   편집     = engine 뷰 — 자료 capabilities 가 편집기를 고른다(원문=넓은 캔버스 · DOCX류=ONLYOFFICE · HWP=RHWP).
#              저장·자동 초안·버전·사본은 엔진의 일(조건부 원본 저장).
#   틀로 새 문서 = 틀(보고서·회의록…)로 새 문서 — DOCX 포함. 본문은 마크다운으로 짓고 DOCX 는 [table:document] 가 렌더.
#              문서별 도구(사본·변환·버전·미리보기·시트 표 연결·강의 전달)는 캔버스의 ⚙ 도구 패널(엔진)에 있다.
#   AI       = 캔버스 아래 ai_dock — 선택이 있으면 선택, 없으면 글 전체($text)를 [self:ask](경량 원샷)에게.
#              반영은 사람이 누른다. 여러 단계가 필요한 일은 시스템 AI 에게 따로 시킨다.
#
# 문서함의 기본 폴더는 빈노트가 쓰던 자리(projects/앱모드/outputs/binnote) — 노트를 옮길 필요가 없다.
# 빈노트(BinNote.tsx)와 옛 문서 창(DocumentWorkspace.tsx)은 이 앱에 흡수돼 은퇴했다(2026-10-06).
# 단독 창 경로 #/documents 도 이 선언을 그대로 띄운다(frontend DocumentApp.tsx).

instrument: document
edition: 2
icon: 📄
name: 문서
order: 12

modes:
  # ── 빈 페이지: 여는 즉시 쓸 수 있는 빈 페이지(기본 화면). 입력도 목록도 없이 캔버스 하나. ──
  - name: 빈 페이지
    auto_run: true
    action: |
      $빈 = [self:list]{path: "outputs/binnote"} >> [table:filter]{where: ($r) => $r.is_dir != true && $r.size == 0 && $r.name[0:2] == "무제" && $r.name[-4:] == ".txt"} >> [table:sort]{by: "mtime", descending: true}
      [if: len($빈) > 0] {
        $열린 = [self:workspace]{op: "open", path: $빈[0].path}
        [if: $열린.session == null] { return $열린 }
      }
      $t = [self:time]
      $쓴 = [self:write]{path: f"outputs/binnote/무제 ${t[0:10]} ${t[11:13]}${t[14:16]}${t[17:19]}.txt", content: ""}
      [self:workspace]{op: "open", path: $쓴.path}
    view:
      - &canvas
        type: engine
        ref: '{resource}'
        ai_dock:
          action: '[self:ask]{prompt: $dock, context: $text, system: "너는 편집자다. context 의 글을 사용자의 지시대로 고쳐, 설명·머리말 없이 고친 본문만 답한다. 지시가 질문이면 답만 쓴다."}'

  - name: 새 문서
    run_label: 만들기
    inputs:
      - key: name
        type: text
        required: true
        placeholder: "문서 이름 (확장자 없이)"
      - key: folder
        type: text
        default: "outputs/binnote"
        placeholder: "만들 폴더 (없으면 생긴다)"
      - key: format
        type: select
        default: txt
        options:
          - {value: txt,  label: 텍스트 (.txt)}
          - {value: md,   label: 마크다운 (.md)}
          - {value: docx, label: 워드 (.docx)}
          - {value: hwpx, label: 한글 (.hwpx)}
          - {value: hwp,  label: 한글 (.hwp)}
          - {value: html, label: HTML (.html)}
          - {value: tex,  label: LaTeX (.tex)}
          - {value: typ,  label: Typst (.typ)}
    # 같은 이름이 있으면 덮어쓰지 않고 멈춘다(빈 파일 쓰기가 기존 글을 지우지 않게).
    # 워드(docx)는 빈 문단 하나짜리 문서를 [table:document] 가 렌더한다.
    # 한글(hwp·hwpx)은 0바이트가 문서가 아니므로 빈 문서 틀(document_templates/blank.* — 번들 RHWP 엔진이 낸 빈 문서)을 복사한다.
    action: '$file = f"${name}.${format}"; $있음 = [self:file_find]{pattern: $file, path: $folder}; [if: len($있음.items) > 0] { return {error: f"이미 있는 문서입니다: ${file} — 열기로 여세요"} } [if: $format == "docx"] { $워드 = [table:document]{blocks: [{type: "paragraph", text: ""}], format: "docx", path: f"${folder}/${file}"}; return [self:workspace]{op: "open", path: $워드.path} } [if: $format == "hwp" || $format == "hwpx"] { $틀 = [self:copy]{src: f"../../data/instruments/document_templates/blank.${format}", dest: f"${folder}/${file}"}; return [self:workspace]{op: "open", path: $틀.path} } $쓴 = [self:write]{path: f"${folder}/${file}", content: ""}; [self:workspace]{op: "open", path: $쓴.path}'
    view:
      - *canvas

  - name: 열기
    run_label: 열기
    inputs:
      - key: path
        type: text
        browse: "outputs/binnote"   # 데스크탑: 문서함 폴더에서 시작하는 파일 창으로 고른다
        required: true
        placeholder: "문서 경로 — txt·md·html·tex·typ · docx·odt·rtf · hwp·hwpx · pdf"
      - key: encoding
        type: select
        default: ""
        options:
          - {value: "",          label: 인코딩 자동}
          - {value: "utf-8",     label: UTF-8}
          - {value: "utf-16",    label: UTF-16}
          - {value: "cp949",     label: CP949}
          - {value: "euc-kr",    label: EUC-KR}
    action: '[self:workspace]{op: "open", path: $path, encoding: $encoding}'
    view:
      - *canvas

  # ── 틀로 새 문서(DOCX 포함). ──
  - name: 틀로 새 문서
    run_label: 틀로 만들기
    note: 틀을 골라 새 문서를 만듭니다(DOCX 는 사무 편집기로 열립니다). 사본·변환·버전·시트 표 연결은 문서를 연 뒤 캔버스의 "⚙ 도구"에 있습니다.
    inputs:
      - key: name
        type: text
        required: true
        placeholder: "문서 이름 (확장자 없이)"
      - key: template
        type: select
        default: report
        options:
          - {value: report,      label: 보고서}
          - {value: minutes,     label: 회의록}
          - {value: proposal,    label: 제안서}
          - {value: letter,      label: 공문}
          - {value: application, label: 신청서}
          - {value: contract,    label: 계약서 초안}
          - {value: resume,      label: 이력서}
          - {value: blank,       label: 빈 문서}
      - key: format
        type: select
        default: docx
        options:
          - {value: docx, label: 워드 (.docx)}
          - {value: md,   label: 마크다운 (.md)}
          - {value: txt,  label: 텍스트 (.txt)}
      - key: folder
        type: text
        default: "outputs/binnote"
        placeholder: "만들 폴더 (없으면 생긴다)"
    action: |
      $file = f"${name}.${format}"
      $있음 = [self:file_find]{pattern: $file, path: $folder}
      [if: len($있음.items) > 0] { return {error: f"이미 있는 문서입니다: ${file} — 열기로 여세요"} }
      $틀 = {
        blank: "",
        report: "## 개요\n\n목적과 핵심 내용을 작성하세요.\n\n## 조사 결과\n\n확인한 사실과 근거를 작성하세요.\n\n## 결론\n\n다음 행동과 담당자를 작성하세요.",
        minutes: "## 회의 정보\n\n일시 / 참석자 / 안건\n\n## 논의 내용\n\n주요 논의를 작성하세요.\n\n## 결정 사항\n\n결정 / 담당 / 기한",
        proposal: "## 배경\n\n해결할 문제\n\n## 제안\n\n방법과 기대 효과\n\n## 계획\n\n일정과 비용",
        letter: "## 수신\n\n수신자 / 참조\n\n## 제목\n\n공문 제목\n\n## 내용\n\n요청 사항을 작성하세요.",
        application: "## 신청인\n\n성명 / 연락처\n\n## 신청 내용\n\n신청 사항과 이유\n\n## 확인\n\n작성일 / 서명",
        contract: "## 당사자\n\n계약 당사자\n\n## 계약 내용\n\n목적 / 기간 / 대금 / 의무\n\n## 서명\n\n검토 후 서명하세요.",
        resume: "## 인적 사항\n\n이름 / 연락처\n\n## 경력\n\n기간 / 조직 / 주요 업무\n\n## 학력과 역량\n\n학력 / 자격 / 기술"
      }
      $절 = $틀[$template]
      $본문 = f"# ${name}\n\n${절}\n"
      [if: $format == "docx"] {
        $만든 = [table:document]{markdown: $본문, format: "docx", path: f"${folder}/${file}"}
        return [self:workspace]{op: "open", path: $만든.path}
      }
      $쓴 = [self:write]{path: f"${folder}/${file}", content: $본문}
      [self:workspace]{op: "open", path: $쓴.path}
    view:
      - *canvas
