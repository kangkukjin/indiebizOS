# 폴더 조사 앱 — 입구일 뿐(FOLDER_SURVEY_HANDOFF §5). 판단도 관측도 앱이 하지 않는다.
#
#   만들기 = 폴더를 고르면 [others:delegate]{scope: system} — AI 가 가이드 '폴더 조사'(folder_survey)대로 포식 기억을 만든다
#   문서   = AI 가 쓴 문서(~workspace/data/forage_surveys/*.md)를 읽고 고쳐 저장 — 고친 줄은 주인의 선언
#   기억   = [self:forage]{recall, locus} 통째 보기 · 빼기(forget) · 주인 선언 추가(note)
#
# 말로 시키는 길과 같은 저장소(단언·문서)에 쓴다. 산출물은 개인정보라 저장소 밖(gitignore).

instrument: folder_survey
icon: 🗂️
name: 폴더 조사
order: 31
phone_render: false

modes:
  - name: 만들기
    auto_run: true
    note: 폴더를 고르면 AI 가 지침대로 그 폴더를 보고 포식 기억(단언 + 문서)을 만듭니다. 이미 있으면 차이만 갱신하고, 당신이 고친 줄은 보존합니다.
    action: '[self:file_find]{pattern: "*.md", path: "~workspace/data/forage_surveys"}'
    view:
      - type: form
        title: 이 폴더의 포식 기억을 만들어 주세요
        fields:
          - key: path
            label: 폴더
            type: folder
            value: ''
          - key: hint
            label: AI 에게 한마디(옵션 — 이 폴더가 무엇인지, 무엇을 찾고 싶은지)
            type: textarea
            value: ''
        action: '[others:delegate]{scope: "system", message: "폴더 조사: $path 의 포식 기억을 만들어라. 먼저 read_guide 로 가이드 폴더 조사(folder_survey)를 읽고 그대로 한다 — 단언은 self:forage note 로, 문서는 그 가이드가 정한 자리에. 이미 문서가 있으면 차이만 갱신하고 주인이 고친 줄은 보존한다. 주인의 말: $hint", from_agent: "폴더조사앱"}'
        button: AI 에게 맡기기
        confirm: AI 가 이 폴더를 살펴보고 포식 기억을 만듭니다(시간이 걸릴 수 있습니다). 진행할까요?
      - type: card_list
        from: items
        empty: 아직 만든 포식 기억 문서가 없습니다.
        card:
          title: '{title}'
          lines:
            - '{meta}'

  - name: 문서
    auto_run: true
    note: AI 가 쓴 폴더 문서입니다. 열어서 고치면 그 줄은 주인의 선언이 됩니다.
    action: '[self:file_find]{pattern: "*.md", path: "~workspace/data/forage_surveys"}'
    view:
      - type: card_list
        from: items
        master_detail: true
        empty: 아직 문서가 없습니다 — "만들기" 탭에서 폴더를 골라 AI 에게 맡겨 보세요.
        card:
          title: '{title}'
          lines:
            - '{meta}'
        item_click:
          action: '[self:read]{path: "{url}"}'
          view:
            - type: form
              title: 폴더 문서(마크다운) — 고친 줄은 선언이 됩니다
              fields:
                - key: body
                  label: 본문
                  type: textarea
                  value: '{result}'
                  ai_dock:
                    action: '[self:ask]{prompt: "지시대로 고쳐 본문만 답하라: $dock", context: "$body"}'
                    modes: [replace, append]
                    placeholder: AI에게 시키기 — 더 간결하게 / 예외 항목을 표로
              action: '[self:write]{path: "{_item.url}", content: "$body"}'
              button: 저장

  - name: 기억
    note: 폴더를 적으면 그 폴더의 기억이 통째로 옵니다 — 자기 단언(own)·물려받은 관습(inherit)·자식 골격(child). 틀린 줄은 빼고, AI 가 못 보는 것은 선언으로 더하세요.
    inputs:
      - key: locus
        type: text
        placeholder: 폴더 경로
        required: true
    action: '[self:forage]{op: "recall", locus: "$locus", limit: 40}'
    view:
      - type: list_action
        from: map
        empty: 이 폴더에 적힌 기억이 없습니다 — "만들기" 탭에서 AI 에게 맡기거나 아래에서 직접 선언하세요.
        title: '{kind} · {via} · {locus}'
        sub: '{claim}'
        button:
          label: 빼기
          action: '[self:forage]{op: "forget", id: "{id}", table: "forage_map"}'
          confirm: 이 단언을 지울까요?
          refresh: true
      - type: form
        title: 주인 선언 추가 — AI 가 못 보는 것(연상 기준·예외·취향)
        fields:
          - key: kind
            label: 종류
            type: select
            value: identity
            options:
              - {value: identity, label: 정체(이 폴더는 무엇)}
              - {value: convention, label: 관습(명명·정리 규칙)}
              - {value: dead_branch, label: 죽은 가지(여긴 그것 없음)}
              - {value: substrate, label: 기질(외장·포맷·마운트)}
          - key: claim
            label: 한 줄 단언
            type: textarea
            value: ''
          - key: gen
            label: 적용 범위
            type: select
            value: "false"
            options:
              - {value: "false", label: 이 폴더만}
              - {value: "true", label: 하위 폴더에도(관습·기질)}
        action: '[self:forage]{op: "note", layer: "map", locus: "$locus", kind: "$kind", claim: "$claim", generalizes: $gen, confidence: 0.95, provenance: {observed: ["주인 선언(폴더 조사 앱)"]}}'
        button: 선언 저장
