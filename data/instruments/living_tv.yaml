# 앱·AI 공용 TV 제어. 연결 설정은 손발의 비공개 원장에만 저장한다.
instrument: living_tv
edition: 2
icon: 📺
name: TV 컨트롤
order: 30
modes:
- name: 전원·입력
  note: 손발에 등록한 TV를 제어합니다. 응답 없음은 전원 꺼짐과 다릅니다. PC 입력 전환은 TV 메뉴 키를 보내며 실제 입력은 별도 확인하세요.
  action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target, op:
    "status"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
  run_label: 상태 새로고침
  buttons:
  - label: ⏻ 켜기
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "on"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: ⏻ 끄기
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "off"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: 🖥 PC 입력으로 전환
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "to_pc"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: 🏠 홈
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "key", keys: ["KEY_HOME"]},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: TV 연결 허용·페어링
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "pair"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 전원
      v: '{power}'
    - k: 확인 여부
      v: '{verified}'
    - k: 결과
      v: '{message} {error}'
    - k: 유튜브
      v: 실행 {apps.youtube.running} · 화면 {apps.youtube.visible}
    - k: 넷플릭스
      v: 실행 {apps.netflix.running} · 화면 {apps.netflix.visible}
  inputs:
  - key: target
    type: select
    label: 제어할 TV 선택
    required: true
    scope: instrument
    options_action: '$r = [self:limb]{op:"list"}; $tvs = $r.items >> [table:filter]{where: ($p) => $p.registration != null && $p.registration.adapter
      == "network-api" && $p.registration.kind == "tv" && $p.registration.state == "active" && $p.registration.paused != true};
      return {items:$tvs}'
    options_from: items
    option_value: device_id
    option_label: alias
- name: 볼륨
  note: 증감은 상대 단계, 음소거는 켜기/끄기 전환입니다. 현재 음량·음소거 상태는 읽을 수 없습니다. 결과가 불확실하면 자동 반복하지 마세요.
  action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target, op:
    "status"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
