- name: 지금 방송
  note: KT 지니TV 공개 편성표(전국 기준)를 번호 순으로 보여 줍니다. 지역 방송과 실제 채널은 다를 수 있습니다. 채널 전환은 셋톱 리모컨으로 합니다.
  inputs:
  - key: target
    type: select
    label: 제어할 TV 선택
    required: true
    scope: instrument
    options_action: '$r = [self:limb]{op:"list"}; $tvs = $r.items >> [table:filter]{where: ($p) => $p.registration != null && $p.registration.adapter
      == "network-api" && $p.registration.kind == "tv" && $p.registration.state == "active" && $p.registration.paused != true};
      return {items:$tvs}'
    options_from: items
    option_value: device_id
    option_label: alias
  - key: page
    type: text
    placeholder: 쪽 번호
    default: '1'
    chips:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
  action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target, op:
    "epg_now", page: number($page)},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
  run_label: 새로고침
  buttons:
  - label: ⟳ 편성 다시 받기
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "epg_now", page: number($page), refresh: true},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r};
      return $r'
    render_result: true
  - label: 🔎 채널 목록 다시 찾기
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "epg_scan"},timeout:300}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 기준
      v: '{date} {now} · {page}/{pages}쪽 · {span} · 전체 {total_channels}개 채널'
    - k: 원장
      v: '{ledger_scanned_at} 확인 · 이번 응답 {seconds}초 · 새로 받은 채널 {fetched_channels}개'
    - k: 오류
      v: '{errors_text} {error}'
  - type: kv_list
    from: items
    k: '{ch} {name}'
    v: '{start} {title} · 다음 {next}'
- name: 미디어 주소
  note: TV가 접근 가능한 HTTP(S) 동영상 주소를 보냅니다. 일반 웹페이지·유튜브 페이지 주소는 DLNA 영상 주소가 아닙니다.
  inputs:
  - key: target
    type: select
    label: 제어할 TV 선택
    required: true
    scope: instrument
    options_action: '$r = [self:limb]{op:"list"}; $tvs = $r.items >> [table:filter]{where: ($p) => $p.registration != null && $p.registration.adapter
      == "network-api" && $p.registration.kind == "tv" && $p.registration.state == "active" && $p.registration.paused != true};
      return {items:$tvs}'
    options_from: items
    option_value: device_id
    option_label: alias
  - key: url
    type: text
    label: 동영상 주소
    placeholder: https://…/video.mp4
  action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target, op:
    "dlna_play", url: $url},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
  run_label: TV로 재생 요청
  buttons:
  - label: 재생 중지 요청
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "dlna_stop"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 결과
      v: '{message} {error}'
    - k: 검증
      v: '{verified}'
