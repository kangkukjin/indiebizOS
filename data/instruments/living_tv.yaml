  buttons:
  - label: 🔊 +1
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "volume", steps: 1},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: 🔉 −1
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "volume", steps: -1},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: 🔊 +3
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "volume", steps: 3},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: 🔉 −3
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "volume", steps: -3},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  - label: 🔇 음소거 전환
    action: 'assert $target != null && $target != "", "손발에 등록된 TV를 먼저 선택하세요."; $r = [self:script]{id:"TV제어",args:{target:$target,
      op: "mute"},timeout:90}; assert $r.success == true, "TV 요청 실패. 상태를 확인하세요.", {result:$r}; return $r'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 전원
      v: '{power}'
    - k: 확인 여부
      v: '{verified}'
    - k: 결과
      v: '{message} {error}'
    - k: 유튜브
      v: 실행 {apps.youtube.running} · 화면 {apps.youtube.visible}
    - k: 넷플릭스
      v: 실행 {apps.netflix.running} · 화면 {apps.netflix.visible}
  inputs:
  - key: target
    type: select
    label: 제어할 TV 선택
    required: true
    scope: instrument
    options_action: '$r = [self:limb]{op:"list"}; $tvs = $r.items >> [table:filter]{where: ($p) => $p.registration != null && $p.registration.adapter
      == "network-api" && $p.registration.kind == "tv" && $p.registration.state == "active" && $p.registration.paused != true};
      return {items:$tvs}'
    options_from: items
    option_value: device_id
    option_label: alias
