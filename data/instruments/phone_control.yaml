instrument: phone_control
edition: 2
icon: 📱
name: 폰 컨트롤
order: 31
modes:
- name: 음량 · 진동
  note: 기기 음량을 조절합니다. 벨소리와 알림은 기기에 따라 연동되며 방해금지 권한이 필요할 수 있습니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration != null && $p.registration.state == "active" && $p.registration.paused != true && $p.env != null && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  - key: stream
    type: select
    label: 음량 종류
    default: music
    options:
    - value: music
      label: 미디어
    - value: alarm
      label: 알람
    - value: ring
      label: 벨소리
    - value: notification
      label: 알림
  action: '$r = [fn:Android제어]{대상:$target,요청:{action:"volume_status", stream:$stream}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
  run_label: 상태 조회
  buttons:
  - label: − 한 단계
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"volume_step", stream:$stream, value:-1}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: ＋ 한 단계
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"volume_step", stream:$stream, value:1}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 절반으로
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"volume_half", stream:$stream}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 음소거
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"volume_mute", stream:$stream}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 이전 값 복원
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"volume_restore", stream:$stream}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 짧은 진동
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"vibrate", stream:$stream, duration_ms:200}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 처리 상태
      v: '{status}'
    - k: 확인·복구
      v: '{driver_failure.message} {driver_failure.next}'
    - k: 작업 ID
      v: '{control_task.task_ref.task_id}'
    - k: 음량
      v: '{actual} / {max}단계 · {percent}%'
    - k: 복원할 단계
      v: '{previous}'
    - k: 배터리
      v: '{battery}%'
    - k: 결과
      v: '{message} {error}'
- name: 화면
  note: 밝기·회전·자동 꺼짐은 시스템 설정 변경 허용이 필요합니다. 화면 켜기는 잠금을 해제하지 않습니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration != null && $p.registration.state == "active" && $p.registration.paused != true && $p.env != null && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  action: '$r = [fn:Android제어]{대상:$target,요청:{action:"status"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
  run_label: 상태 조회
  buttons:
  - label: 화면 켜기
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"screen_on"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 화면 끄기 · 잠금
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"screen_off"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 밝기 25%
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"brightness", value:64}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 밝기 50%
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"brightness", value:128}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 밝기 75%
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"brightness", value:191}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 밝기 100%
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"brightness", value:255}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 자동 밝기
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"brightness_auto", enabled:true}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 자동 회전
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"rotation", enabled:true}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 현재 방향 고정
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"rotation", enabled:false}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 자동 꺼짐 30초
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"timeout", seconds:30}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 자동 꺼짐 60초
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"timeout", seconds:60}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 자동 꺼짐 120초
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"timeout", seconds:120}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 자동 꺼짐 300초
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"timeout", seconds:300}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 폰에서 권한 설정 열기
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"settings_permission"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 처리 상태
      v: '{status}'
    - k: 확인·복구
      v: '{driver_failure.message} {driver_failure.next}'
    - k: 작업 ID
      v: '{control_task.task_ref.task_id}'
    - k: 화면 켜짐
      v: '{screen_on}'
    - k: 잠금
      v: '{locked}'
    - k: 밝기 (1~255)
      v: '{brightness}'
    - k: 자동 밝기
      v: '{brightness_auto}'
    - k: 자동 회전
      v: '{auto_rotate}'
    - k: 자동 꺼짐 (ms)
      v: '{screen_timeout_ms}'
    - k: 설정 변경 권한
      v: '{capabilities.settings_write}'
    - k: 변경 확인
      v: '{verified}'
    - k: 결과
      v: '{message} {error}'
- name: 손전등
  note: 폰의 카메라 권한과 플래시가 필요합니다. 기본 플래시를 제어합니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration != null && $p.registration.state == "active" && $p.registration.paused != true && $p.env != null && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  action: '$r = [fn:Android제어]{대상:$target,요청:{action:"status"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
  run_label: 상태 조회
  buttons:
  - label: 켜기
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"torch", enabled:true}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  - label: 끄기
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"torch", enabled:false}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 처리 상태
      v: '{status}'
    - k: 확인·복구
      v: '{driver_failure.message} {driver_failure.next}'
    - k: 작업 ID
      v: '{control_task.task_ref.task_id}'
    - k: 변경 확인
      v: '{verified}'
    - k: 결과
      v: '{message} {error}'
  - type: kv_list
    from: torches
    k: 조명 {id}
    v: 켜짐 {enabled} · 사용 가능 {available}
- name: 센서
  note: 지원 센서를 조회한 뒤 한 번 읽습니다. 화면이 꺼졌거나 센서가 없으면 오류를 표시합니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration != null && $p.registration.state == "active" && $p.registration.paused != true && $p.env != null && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  - key: sensor
    type: select
    label: 센서
    default: light
    options:
    - value: light
      label: 조도 (lx)
    - value: proximity
      label: 근접 (cm)
    - value: accelerometer
      label: 가속도 (m/s²)
    - value: gyroscope
      label: 자이로 (rad/s)
    - value: magnetic_field
      label: 자기장 (µT)
    - value: pressure
      label: 기압 (hPa)
  action: '$r = [fn:Android제어]{대상:$target,요청:{action:"status"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
  run_label: 상태 조회
  buttons:
  - label: 한 번 읽기
    action: '$r = [fn:Android제어]{대상:$target,요청:{action:"sensor", sensor:$sensor}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 처리 상태
      v: '{status}'
    - k: 확인·복구
      v: '{driver_failure.message} {driver_failure.next}'
    - k: 작업 ID
      v: '{control_task.task_ref.task_id}'
    - k: 센서
      v: '{sensor}'
    - k: 측정값
      v: '{reading.values}'
    - k: 정확도 코드
      v: '{reading.accuracy}'
    - k: 결과
      v: '{message} {error}'
  - type: kv_list
    from: sensors
    k: '{id}'
    v: '{name}'
- name: 기기 상태
  note: 배터리·화면·연결 상태를 읽습니다. Wi-Fi·블루투스 전환과 기기 종료·재부팅은 일반 앱 권한으로 제공하지 않습니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration != null && $p.registration.state == "active" && $p.registration.paused != true && $p.env != null && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  action: '$r = [fn:Android제어]{대상:$target,요청:{action:"status"}};  $state = {}; [if:$r.result != null] { $state = $r.result }; return {**$state,status:$r.status,verified:$r.verified,control_task:$r,driver_failure:get($r,"failure",null)}'
  run_label: 상태 조회
  buttons: []
  view:
  - type: kv
    rows:
    - k: 처리 상태
      v: '{status}'
    - k: 확인·복구
      v: '{driver_failure.message} {driver_failure.next}'
    - k: 작업 ID
      v: '{control_task.task_ref.task_id}'
    - k: 배터리
      v: '{battery}%'
    - k: 충전 중
      v: '{charging}'
    - k: 화면 켜짐
      v: '{screen_on}'
    - k: 절전
      v: '{power_save}'
    - k: Wi-Fi 켜짐
      v: '{wifi_enabled}'
    - k: 연결
      v: '{network_transports}'
    - k: 인터넷 검증
      v: '{network_validated}'
    - k: 결과
      v: '{message} {error}'
