    render_result: true
  - label: 자동 꺼짐 60초
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"timeout", seconds:60}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 자동 꺼짐 120초
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"timeout", seconds:120}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 자동 꺼짐 300초
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"timeout", seconds:300}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 폰에서 권한 설정 열기
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"settings_permission"}, timeout:
