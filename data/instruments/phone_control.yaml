    - k: 잠금
      v: '{locked}'
    - k: 밝기 (1~255)
      v: '{brightness}'
    - k: 자동 밝기
      v: '{brightness_auto}'
    - k: 자동 회전
      v: '{auto_rotate}'
    - k: 자동 꺼짐 (ms)
      v: '{screen_timeout_ms}'
    - k: 설정 변경 권한
      v: '{capabilities.settings_write}'
    - k: 변경 확인
      v: '{verified}'
    - k: 결과
      v: '{message} {error}'
- name: 손전등
  note: 폰의 카메라 권한과 플래시가 필요합니다. 기본 플래시를 제어합니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration.state == "active" && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
    $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"status"}, timeout: 20}; assert
    $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
  run_label: 상태 조회
  buttons:
  - label: 켜기
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"torch", enabled:true}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 끄기
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"torch", enabled:false}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 변경 확인
      v: '{verified}'
    - k: 결과
      v: '{message} {error}'
  - type: kv_list
    from: torches
    k: 조명 {id}
    v: 켜짐 {enabled} · 사용 가능 {available}
- name: 센서
  note: 지원 센서를 조회한 뒤 한 번 읽습니다. 화면이 꺼졌거나 센서가 없으면 오류를 표시합니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration.state == "active" && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  - key: sensor
    type: select
    label: 센서
    default: light
    options:
    - value: light
      label: 조도 (lx)
    - value: proximity
      label: 근접 (cm)
    - value: accelerometer
      label: 가속도 (m/s²)
    - value: gyroscope
      label: 자이로 (rad/s)
    - value: magnetic_field
      label: 자기장 (µT)
    - value: pressure
      label: 기압 (hPa)
  action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
    $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"status"}, timeout: 20}; assert
    $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
  run_label: 상태 조회
  buttons:
  - label: 한 번 읽기
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"sensor", sensor:$sensor}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 센서
      v: '{sensor}'
    - k: 측정값
      v: '{reading.values}'
    - k: 정확도 코드
      v: '{reading.accuracy}'
    - k: 결과
      v: '{message} {error}'
  - type: kv_list
    from: sensors
    k: '{id}'
    v: '{name}'
- name: 기기 상태
  note: 배터리·화면·연결 상태를 읽습니다. Wi-Fi·블루투스 전환과 기기 종료·재부팅은 일반 앱 권한으로 제공하지 않습니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration.state == "active" && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
    $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"status"}, timeout: 20}; assert
    $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
  run_label: 상태 조회
  buttons: []
  view:
  - type: kv
    rows:
    - k: 배터리
      v: '{battery}%'
    - k: 충전 중
      v: '{charging}'
    - k: 화면 켜짐
      v: '{screen_on}'
    - k: 절전
      v: '{power_save}'
    - k: Wi-Fi 켜짐
      v: '{wifi_enabled}'
    - k: 연결
      v: '{network_transports}'
    - k: 인터넷 검증
      v: '{network_validated}'
    - k: 결과
      v: '{message} {error}'
