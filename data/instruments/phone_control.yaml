instrument: phone_control
edition: 2
icon: 📱
name: 폰 컨트롤
order: 31
modes:
- name: 음량 · 진동
  note: 기기 음량을 조절합니다. 벨소리와 알림은 기기에 따라 연동되며 방해금지 권한이 필요할 수 있습니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
      == true && $p.revoked != true && $p.expired != true && $p.registration.state == "active" && $p.env.os == "android"};
      return {items: $phones}'
    options_from: items
    option_value: device_id
    option_label: alias
    scope: instrument
  - key: stream
    type: select
    label: 음량 종류
    default: music
    options:
    - value: music
      label: 미디어
    - value: alarm
      label: 알람
    - value: ring
      label: 벨소리
    - value: notification
      label: 알림
  - key: level
    type: text
    placeholder: 설정할 음량 단계
    default: '4'
  action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
    $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"status", stream:$stream}, timeout:
    20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
  run_label: 상태 조회
  buttons:
  - label: − 한 단계
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"step", stream:$stream, value:-1},
      timeout: 20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return
      $r.result.value'
    render_result: true
  - label: ＋ 한 단계
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"step", stream:$stream, value:1},
      timeout: 20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return
      $r.result.value'
    render_result: true
  - label: 절반으로
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"half", stream:$stream}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 음소거
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"mute", stream:$stream}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 이전 값 복원
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"restore", stream:$stream}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 입력한 단계 적용
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op: "set", value: $level, stream:$stream},
      timeout: 20}; return $r.result.value'
    render_result: true
  - label: 짧은 진동
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_control.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"vibrate", stream:$stream, duration_ms:200},
      timeout: 20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return
      $r.result.value'
    render_result: true
  view:
  - type: kv
    rows:
    - k: 음량
      v: '{actual} / {max}단계 · {percent}%'
    - k: 복원할 단계
      v: '{previous}'
    - k: 배터리
      v: '{battery}%'
    - k: 결과
      v: '{message} {error}'
- name: 화면
  note: 밝기·회전·자동 꺼짐은 시스템 설정 변경 허용이 필요합니다. 화면 켜기는 잠금을 해제하지 않습니다.
  inputs:
  - key: target
    type: select
    label: 제어할 폰 선택
    required: true
    options_action: '$r = [self:limb]{op: "list"}; $phones = $r.limbs >> [table:filter]{where: ($p) => $p.connected
