    render_result: true
  - label: 밝기 50%
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"brightness", value:128}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 밝기 75%
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"brightness", value:191}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 밝기 100%
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"brightness", value:255}, timeout:
      20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return $r.result.value'
    render_result: true
  - label: 자동 밝기
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"brightness_auto", enabled:true},
      timeout: 20}; assert $r.success == true && $r.result.success == true, "원격 실행에 실패했습니다. 상태를 다시 조회하세요."; return
      $r.result.value'
    render_result: true
  - label: 자동 회전
    action: 'assert $target != null && $target != "", "폰을 먼저 선택해 주세요."; $s = [self:read]{path: "%BASE%/data/instruments/phone_device.py"};
      $r = [limbs:guestpc]{limb: $target, op: "python", code: $s.text, inputs: {op:"rotation", enabled:true}, timeout:
