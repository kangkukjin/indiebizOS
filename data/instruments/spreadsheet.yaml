# 스프레드시트 앱 — 엑셀의 얼굴 + IBL 몸 (docs/SPREADSHEET_APP_ON_IBL_PLAN_2026_10_07.md)
# 어휘 없는 순수 매니페스트. 능력은 전부 기존 낱말이다.
#
#   빈 통합문서 = 앱을 열면 바로 서는 격자. 비어 있고 아무 창도 쥐지 않은 가장 최근 "무제 ….xlsx" 를 다시 쓰고(빈 파일이 쌓이지 않게 — [self:file_find] 는 폴더가 없어도 빈 목록),
#                없으면 빈 틀(spreadsheet_templates/blank.xlsx — 0바이트는 통합문서가 아니다)을 [self:copy] 로 복사해 연다.
#                화면에는 엑셀 얼굴(리본·수식줄·격자·시트 탭·상태줄)만 선다 — 나머지 탭은 리본의 "파일" 안에 접힌다(첫 화면은 메뉴 항목이 아니다).
#   새 통합문서 = 같은 이름이 없을 때만 틀(선언 데이터: 머리글 + 첫 행 수식)로 [table:spreadsheet] → open → engine 뷰. 빈 통합문서는 빈 틀 복사.
#   열기       = 경로로 open — 데스크탑은 통합문서 폴더에서 시작하는 파일 창(입력의 browse). csv/tsv 는 [self:read] 로 읽어 xlsx 사본을 만들어 연다(원본 보존).
#   편집       = engine 뷰 — 자료 capabilities 가 엔진을 고른다(격자=브라우저 안 Univer, 항상 · 사무=ONLYOFFICE, 차트·피벗·그림이 있을 때).
#                저장·자동 초안·버전·사본은 엔진의 일(조건부 원본 저장). 어느 엔진인지 선언은 모른다.
#   AI         = 리본 끝 "✦ AI" 작업창(ai_dock) — 선택 범위($sel={sheet,range}·$table 값 2차원·$text TSV, 선택이 없으면 사용 범위 전체)를
#                [table:ai] 에게. 값·수식 2차원이 돌아오면 바뀌는 셀을 미리보기(노란 강조)로 보이고 반영은 사람이 누른다(Ctrl+Z 로 되돌린다).
#                여러 시트에 걸친 긴 일은 시스템 AI 에게 따로 — `[self:workspace]` 로 같은 자료를 고치고 격자가 접수증을 소비한다.
#
# 통합문서 폴더 = projects/앱모드/outputs/sheets (새 자리 — 옛 앱은 폴더 없이 "최근 통합문서" 목록이었다).
# 옛 시트 화면(SpreadsheetWorkspace.tsx)은 이 앱에 흡수돼 은퇴했다(2026-10-07). 단독 창 경로 #/spreadsheets 도 이 선언을 띄운다.

instrument: spreadsheet
edition: 2
icon: 📊
name: 스프레드시트
order: 13

modes:
  # ── 빈 통합문서: 여는 즉시 격자(기본 화면). 입력도 목록도 없이 캔버스 하나. ──
  - name: 빈 통합문서
    auto_run: true
    action: |
      $빈 = [self:file_find]{pattern: "무제*.xlsx", path: "outputs/sheets"}
      [if: len($빈.items) > 0] {
        $최근 = $빈.items >> [table:sort]{by: "mtime", descending: true}
        $열린 = [self:workspace]{op: "open", path: $최근[0].path}
        [if: $열린.session == null && $열린.capabilities.empty == true] { return $열린 }
      }
      $t = [self:time]
      $틀 = [self:copy]{src: "../../data/instruments/spreadsheet_templates/blank.xlsx", dest: f"outputs/sheets/무제 ${t[0:10]} ${t[11:13]}${t[14:16]}${t[17:19]}.xlsx"}
      [self:workspace]{op: "open", path: $틀.path}
    view:
      - &grid
        type: engine
        ref: '{resource}'
        ai_dock:
          placeholder: '예: 구분이 "경비"인 행의 금액을 지출 열로 옮겨 줘 · 합계 행을 수식으로 넣어 줘 (Enter 전송)'
          action: '[table:ai]{items: [{range: $range, cells: $table}], instruction: $dock, schema: "values(범위와 같은 행·열 수의 2차원 배열 — 바꾸지 않는 셀은 원래 값 그대로, 수식은 = 로 시작, 집계는 수식으로, 계좌·코드·전화번호는 문자열 보존)", input_fields: ["range", "cells"], preserve_rows: true}'

  - name: 새 통합문서
    run_label: 만들기
    inputs:
      - key: name
        type: text
        required: true
        placeholder: "통합문서 이름 (확장자 없이)"
      - key: folder
        type: text
        default: "outputs/sheets"
        placeholder: "만들 폴더 (없으면 생긴다)"
      - key: template
        type: select
        default: blank
        options:
          - {value: blank,      label: 빈 통합문서}
          - {value: ledger,     label: 수입지출 장부}
          - {value: quotation,  label: 견적서}
          - {value: inventory,  label: 재고·입출고}
          - {value: attendance, label: 근태}
          - {value: schedule,   label: 일정}
          - {value: budget,     label: 프로젝트 예산}
    # 틀은 선언 데이터(머리글 + 첫 행 수식). 같은 이름이 있으면 덮어쓰지 않고 멈춘다. 빈 통합문서는 빈 틀 복사([table:spreadsheet] 는 0행을 거절한다).
    action: |
      $file = f"${name}.xlsx"
      $있음 = [self:file_find]{pattern: $file, path: $folder}
      [if: len($있음.items) > 0] { return {error: f"이미 있는 통합문서입니다: ${file} — 열기로 여세요"} }
      [if: $template == "blank"] {
        $틀 = [self:copy]{src: "../../data/instruments/spreadsheet_templates/blank.xlsx", dest: f"${folder}/${file}"}
        return [self:workspace]{op: "open", path: $틀.path}
      }
      $행 = {
        ledger: [["날짜", "구분", "거래처", "수입", "지출", "잔액"], ["", "", "", 0, 0, "=D2-E2"]],
        quotation: [["품목", "수량", "단가", "금액"], ["", 1, 0, "=B2*C2"]],
        inventory: [["품목코드", "품목", "입고", "출고", "재고"], ["", "", 0, 0, "=C2-D2"]],
        attendance: [["날짜", "이름", "출근", "퇴근", "근무시간", "비고"], ["", "", "", "", "=D2-C2", ""]],
        schedule: [["날짜", "일정", "담당", "상태"], ["", "", "", ""]],
        budget: [["항목", "예산", "실제", "차이"], ["", 0, 0, "=B2-C2"]]
      }
      $쓴 = [table:spreadsheet]{path: f"${folder}/${file}", rows: $행[$template]}
      [self:workspace]{op: "open", path: $쓴.path}
    view:
      - *grid

  - name: 열기
    run_label: 열기
    inputs:
      - key: path
        type: text
        browse: "outputs/sheets"   # 데스크탑: 통합문서 폴더에서 시작하는 파일 창으로 고른다
        required: true
        placeholder: "통합문서 경로 — xlsx · csv · tsv (ods·xls 등은 사본 변환 뒤)"
    # csv/tsv 는 값만 있는 자료 — 읽어서 xlsx 사본으로(원본 보존). 식별자 열(00123)은 [self:read] 가 문자열로 주므로 그대로 보존된다.
    action: |
      $ext = $path[-4:]
      [if: $ext == ".csv" || $ext == ".tsv"] {
        $읽은 = [self:read]{path: $path}
        $이름 = join(".", split(split($path, "/")[-1], ".")[0:-1])
        $사본 = [table:spreadsheet]{path: f"outputs/sheets/${이름}.xlsx", table: $읽은.data.table}
        return [self:workspace]{op: "open", path: $사본.path}
      }
      [self:workspace]{op: "open", path: $path}
    view:
      - *grid
