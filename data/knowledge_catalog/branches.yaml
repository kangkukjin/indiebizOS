  cues: 데이터베이스와 자료 저장 구조를 어떻게 설계하고 운영할지 고민할 때. 표를 중복 없이 나누기, 여러 시스템 자료를 모아 옮기는 과정, 분석용 구조, 조회가 느릴 때 빠르게 하기, 자료가 어디서 와서 어떻게 바뀌었는지 추적, 같은 작업을 두 번 해도 안전하게
