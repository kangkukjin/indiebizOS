  cues: 직원·알바·간호사 등의 교대 근무표를 짜야 할 때. 누가 언제 가능하고, 하루 최소 몇 명 필요하고, 연속 근무·휴무 규칙과 개인 희망을 넣어 배정하고 규칙 위반이 없는지 검사
- path:
  - 운영
  - 일정 계획
  cues: 여러 작업의 소요 기간과 선후 관계가 있는 프로젝트에서 전체가 언제 끝나는지, 늦어지면 안 되는 핵심 작업과 여유 있는 작업이 무엇인지 계산하고 싶을 때 (공정표)
- path:
  - 운영
  - 조직과 협업
  cues: 팀과 조직을 잘 굴리는 방법. 누가 무엇을 책임지는지 정하기, 목표 세우고 점검하기, 일 끝난 뒤 돌아보기, 편하게 말할 수 있는 분위기, 노하우 물려주기와 후임 준비, 직무 정의와 공정한 채용 면접·실기 평가, 여러 방향 피드백, 팀 내 갈등 풀기, 조직 안에서 실제 누가 누구와 일하는지
- path:
  - 운영
  - 품질과 개선
  cues: 불량·문제의 진짜 원인을 찾고 품질을 꾸준히 관리·개선할 때. '왜'를 거듭 묻기, 원인을 생선뼈 그림으로 정리, 중요한 소수 문제 가려내기, 공정이 안정적인지 관리 그래프로 감시, 측정 자체가 믿을 만한지, 샘플 검사로 합격 판정, 고객 요구를 설계로, 최적 조건 실험, 실수 방지 장치, 개선 사이클
- path:
  - 운영
  - 흐름 개선
  cues: 업무나 공정이 실제로 어떤 순서로 흘러가고 어디서 기다리고 되돌아가는지 파악해 낭비를 줄이고 싶을 때. 시스템 로그 기록으로 실제 업무 흐름 재구성, 작업·대기·재고를 한 장에 그려 개선점 찾기
- path:
  - 인문
  - 글쓰기
  cues: 이미 써 놓은 글의 구성이 맞는지 점검하고 싶을 때. 문단마다 한 줄 요지와 역할을 뽑아 흐름이 끊기거나 겹치는 곳 찾기
- path:
  - 인문
  - 글쓰기와 편집
  cues: 글을 쓰고 다듬는 전 과정. 막힐 때 일단 쏟아 내기, 개요 잡기, 핵심 주장 한 문장 세우기, 문단 연결 매끄럽게, 큰 구조 고치기부터 문장 다듬기·맞춤법 교정·사실 확인까지, 독자에 맞추기, 소설의 시점·복선·서사 구조·'말하지 말고 보여 주기', 서로 읽고 평해 주기
- path:
  - 인문
  - 문학
  cues: 시·소설·글의 한 대목을 단어 선택, 문장 형식, 세부 묘사까지 꼼꼼히 읽어 해석의 근거를 찾고 싶을 때. 작품 분석·감상문
- path:
  - 인문
  - 역사
  cues: 옛 편지·일기·공문서·사진 같은 당대 자료를 누가 왜 썼는지 따져 가며 읽고 해석할 때, 어르신·경험자의 이야기를 인터뷰로 채록하고 녹음·녹취·동의서를 갖춰 기록으로 남기고 싶을 때
- path:
  - 인문
  - 역사와 고고학
  cues: 과거를 연구하는 방법을 찾을 때. 사료가 진짜이고 믿을 만한지 따지기, 여러 판본 비교로 원문 복원, 옛 글씨·문서 양식 읽기, 기록 보관소 조사, 평범한 사람·집단의 삶으로 시대 보기, 유적·유물의 지층과 연대 측정, 옛 기술 재현, 오늘의 잣대로 과거를 재는 오류
- path:
  - 인문
  - 철학과 윤리
  cues: 옳고 그름이나 개념의 뜻을 깊이 따져 볼 때. 윤리적 딜레마에서 결과·의무·인격·돌봄 중 무엇을 기준 삼을지, 공정한 규칙을 정하는 사고실험, 무엇이 과학인지·이론이 어떻게 바뀌는지, 텍스트·경험의 해석, 내 직관과 원칙을 서로 맞춰 가기, 확신이 없을 때의 도덕 판단
- path:
  - 제작
  - CAD
  cues: 치수를 숫자로 정해 부품·케이스·브래킷 같은 입체 물건을 코드로 설계하고, 치수만 바꿔 다시 뽑고 싶을 때. 3D 프린터·가공용 도면 파일 만들기. 마우스가 아닌 스크립트로 하는 정밀 설계
- path:
  - 제작
  - 공예와 수선
  cues: 손으로 물건을 만들고 고치는 기술. 못 없이 나무 맞춰 짜기, 나무 말리고 휘기, 날 갈기, 옷본 뜨기·재단·솔기 처리·옷 수선, 천연 염색, 천 짜기와 뜨개, 도자기 빚기와 유약, 금속 주조, 납땜, 책 제본, 물건이 고쳐 쓰기 쉬운지 평가
- path:
  - 제작
  - 기계설계
  cues: 마우스로 조작하는 무료 3D CAD 프로그램으로 기계 부품·조립품을 치수 기반으로 설계하고 도면을 뽑고 싶을 때. 나중에 치수를 고치면 모양이 따라 바뀌는 설계 (코드가 아닌 화면 조작 방식)
- path:
  - 제작
  - 회로
  cues: 전자 회로도를 그리고 기판(PCB)을 설계해 제작 파일을 뽑거나, 만들기 전에 회로가 제대로 동작하는지 전압·전류 파형을 시뮬레이션해 보고 싶을 때
- path:
  - 조사
  - 근거 종합
  cues: 어떤 질문에 대해 지금까지 나온 연구를 빠짐없이 찾아 기준에 따라 걸러 정리하고 싶을 때, 핵심 논문 하나에서 출발해 참고문헌과 후속 연구를 따라가며 관련 연구를 넓힐 때 (문헌 조사)
- path:
  - 조사
  - 사회 조사
  cues: 여러 사람에게 같은 질문을 던져 의견·실태·만족도를 알아보는 설문을 만들고 돌리고 싶을 때. 문항 작성, 응답자 뽑기, 응답 정리
- path:
  - 조사
  - 실험 설계
  cues: A안과 B안 중 어느 쪽이 실제로 더 나은지 공정하게 시험해 보고 싶을 때, 여러 조건을 동시에 바꿔 가며 어떤 요인이 효과가 있고 서로 어떻게 영향을 주는지 적은 횟수로 알아내는 실험을 짤 때 (A/B 테스트)
- path:
  - 조사
  - 연구 설계
  cues: 연구·조사를 시작하기 전에 어떻게 짜야 믿을 만한 결론이 나오는지 고민할 때. 막연한 개념을 잴 수 있게 정의, 누구를 몇 명 어떻게 뽑을지, 한 번 볼지 오래 따라갈지, 결과를 일반화할 수 있는지, 미리 계획 공개, 다시 해도 같은 결과가 나오게 하기
- path:
  - 조사
  - 인과 추론
  cues: 실험을 못 하고 이미 있는 자료만으로 '이 정책·광고·약 때문에 정말 결과가 바뀐 건가'를 가려내고 싶을 때. 단순 상관과 진짜 원인 구분, 숨은 제3의 요인, 시행 전후·지역 비교, 비교 집단을 공정하게 맞추기, 통계가 뒤집혀 보이는 역설
- path:
  - 조사
  - 질적 분석
  cues: 인터뷰 녹취·관찰 메모·자유 응답처럼 글로 된 자료를 여러 번 읽으며 표시(코딩)하고 공통된 주제와 의미를 뽑아 정리하고 싶을 때
- path:
  - 지식
  - AI 자원
  cues: 내 용도에 맞는 공개 AI 모델이나 학습용 데이터셋이 있는지 찾고, 라이선스·크기·사용법을 확인해 내려받고 싶을 때
- path:
  - 지식
  - 개체 관계
  cues: 인물·장소·회사·작품 등에 대한 사실(생년, 소속, 수도, 누구의 자식 등)을 구조화된 형태로 확인하거나, '○○인 것들을 모두 나열' 같은 조건 목록을 뽑고, 서로 다른 DB의 식별자를 맞춰 보고 싶을 때
- path:
  - 지식
  - 문헌
  cues: 논문·책을 모아 정리하고 참고문헌 목록과 인용 표기를 자동으로 만들고 싶을 때, DOI로 논문의 정확한 서지 정보를 확인할 때, 유료 논문의 합법적인 무료 공개본이 있는지 찾을 때
- path:
  - 지식
  - 웹 기록
  cues: 지워졌거나 바뀐 웹페이지의 옛 모습을 보고 싶을 때, 어떤 사이트가 과거 특정 날짜에 뭐라고 써 있었는지 확인, 깨진 링크의 원래 내용 찾기, 페이지가 언제 어떻게 바뀌었는지 비교
- path:
  - 지식
  - 조직과 탐색
  cues: 많은 자료를 찾기 쉽게 분류·정리하는 도서관·정보학 방법. 용어 통일과 유의어 관리, 분류 체계·다면 분류, 개념 관계 모델, 이름 표기 통일, 자료 설명 항목(메타데이터) 표준, 변하지 않는 식별 주소, 검색식 짜기와 검색어 넓히기, 논문 인용 통계, 디지털 자료 장기 보존·판 관리
- path:
  - 지식
