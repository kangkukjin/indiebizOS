  cues: 지으려는 집·건물·방의 모양과 외관이 어떻게 보일지 입체 그림으로 미리 확인하고 싶을 때. 평면 구상을 3D 조감도·투시도로 보기
- path:
  - 표현
  - 공학 시각화
  cues: 해석·시뮬레이션이나 CT 같은 3차원 데이터 결과를 색 입힌 입체 그림, 단면, 등고면으로 보여 주고 싶을 때. 응력·온도·유속 분포의 3D 시각화와 후처리
- path:
  - 표현
  - 과학 시각화
  cues: 논문·보고서에 넣을 정지된 그래프를 축·범례·글꼴까지 세밀하게 다듬어 그리고 싶을 때. 선·막대·산점도, 여러 그래프를 한 장에 배치, 인쇄용 고해상도 도표
- path:
  - 표현
  - 관계도
  cues: 순서도·조직도·의존관계도·계통도처럼 상자와 화살표로 된 그림을 자동으로 보기 좋게 배치해 그리고 싶을 때. '무엇이 무엇에 연결되는지'를 글로 적으면 도식으로 만들어 주길 원할 때 (흐름도, 다이어그램)
- path:
  - 표현
