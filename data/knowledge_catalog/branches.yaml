  cues: 로봇이 움직이고 주변을 알아보게 만드는 기술. 관절 각도와 손끝 위치 계산, 스스로 위치 파악하며 지도 만들기, 여러 센서 값 합치기, 장애물 피하는 길과 부드러운 움직임 계획, 물건 집기, 힘 조절하며 접촉, 카메라 보고 움직이기, 카메라·팔 보정, 행동 순서 구성, 가상 복제 모델, 사람과 함께 일하기
- path:
