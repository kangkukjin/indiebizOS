  - 시각화
  cues: 마우스로 확대·선택·호버할 수 있는 움직이는 차트를 웹에서 보여 주고 싶을 때, 또는 수학 개념·도형·그래프가 변하는 과정을 설명 애니메이션 영상으로 만들고 싶을 때 (대화형 차트, 수학 애니메이션)
- path:
