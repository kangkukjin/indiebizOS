  cues: 전자 회로와 신호·통신의 원리. 전압·전류·저항 회로 계산, 고속 신호가 깨지거나 전원이 흔들리는 문제, 전자파 간섭, 아날로그 신호를 디지털로 바꿀 때 주의점, 잡음 걸러 내기, 모터·밝기 조절(PWM), 전송 오류 고치기, 무선 변조·안테나 빔, FPGA 설계 언어
- path:
