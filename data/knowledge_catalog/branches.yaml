# 세계의 기억 — 가지 사전 (docs/TREE_MEMORY_RECALL_COMMON_DESIGN_2026_09_17.md §5.2)
#
# 가지(분류 경로 앞 두 단)마다 한 항목. 회상은 이 사전으로 **가지를 먼저** 고른 뒤 그 안에서 어휘를 고른다.
#   cues      찾는 말 — 이 가지로 와야 할 **일상 표현**(상황·증상·가진 것·원하는 것). 전문용어 나열이 아니다.
#             이름이 내용을 예고하지 않는 가지는 비워 둔다(지어내지 않는다).
#   gist      요약 — 이 가지에 무엇이 있나 한 줄(지도에 실릴 자리. 지금 지도는 최상위 분야만 싣는다).
#   see_also  함께 볼 가지 — 같은 주제가 걸쳐 있는 다른 가지 경로들. 세계 지식은 나무가 아니라 격자다.
#
# 2026-09-17 초안: cues 는 시험 질문을 모르는 에이전트가 소속 어휘만 보고 썼다(편집 초안 — 고쳐 쓸 것).
# 어휘를 옮기거나 가지를 합치면 이 파일도 같이 고친다. 없는 경로는 회상이 무시하고 시험이 잡는다.
