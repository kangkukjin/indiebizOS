  cues: 여러 폴더에 흩어진 CSV·엑셀·Parquet 파일들을 데이터베이스에 넣지 않고 한꺼번에 SQL 질의로 검색·집계·결합하고 싶을 때, 어떤 파일에 어떤 열이 있는지 확인할 때
