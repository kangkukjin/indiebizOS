  cues: 입체 모델을 만들고 재질·조명·카메라를 잡아 실사 같은 그림이나 애니메이션으로 뽑고 싶을 때, 만든 3D 모델을 화면에서 돌려 보고 확대해 여러 각도로 살펴보고 싶을 때. 3D 모델링·렌더링 전반
- path:
