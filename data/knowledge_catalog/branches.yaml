  cues: 그림·디자인·판화를 보기 좋게 만드는 원리와 기법. 화면 배치와 시선 흐름, 여백, 색 조합과 화면·인쇄 색 맞추기, 원근과 명암, 빠른 스케치와 관찰 그리기, 판화·콜라주 기법, 코드로 만드는 예술, 자료를 그래프로 잘 보여 주는 디자인 원칙
- path:
