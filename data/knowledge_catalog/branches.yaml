  cues: 지저분한 표 자료를 화면에서 보면서 정리하고 싶을 때. 같은 값인데 표기가 제각각인 것('서울시', '서울 특별시')을 자동으로 묶어 통일, 칸 나누기·합치기, 공백·오타 일괄 수정
