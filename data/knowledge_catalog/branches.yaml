  cues: 로고·아이콘·포스터·도안처럼 아무리 키워도 깨지지 않는 선 기반 그림을 그리거나 SVG 파일을 편집하고 싶을 때. 레이저 커팅·인쇄용 도안 만들기
- path:
  - 표현
