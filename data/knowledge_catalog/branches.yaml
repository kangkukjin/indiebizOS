- path:
  - 판단
  - 의사결정
  cues: 앞날이 불확실한데 중요한 결정을 내려야 할 때. 선택지별 결과와 확률 따져 보기, 더 알아보고 결정할 가치가 있는지, 나중에 후회를 줄이는 선택, 미리 실패를 가정해 위험 찾기, 여러 미래 시나리오 대비, 전문가·팀 의견 모아 우선순위 정하기, 되돌릴 수 있는 결정인지
- path:
