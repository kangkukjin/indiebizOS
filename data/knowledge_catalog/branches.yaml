  cues: 사진이나 영상 속에서 컴퓨터가 뭔가를 찾아내거나 재게 하고 싶을 때. 윤곽·도형·얼굴·물체 검출, 움직임 추적, 두 사진 비교, 영상에서 개수 세기, 기울어진 문서 사진 펴기 (컴퓨터 비전)
- path:
