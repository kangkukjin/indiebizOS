  cues: 천체 관측과 자료 분석 방법. 별의 위치·밝기·스펙트럼 재기, 외계 행성 찾기(별빛이 살짝 어두워짐·별의 흔들림), 거리와 적색편이 측정, 밝기 변화와 주기 찾기, 궤도 계산, 중력으로 많은 천체 움직임 시뮬레이션, 천체 사진 여러 장 쌓고 잡음·얼룩 보정, 전파 망원경 여럿 묶기
- path:
