  hint: 지하의 공극과 틈을 채우며 이동하는 물
  aliases: [비가 땅속으로 스며든 뒤 어디로 가는지, 우물에서 물이 나오는 원리, 지하에 저장된 물의 흐름, 땅속 물과 하천의 관계]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
