  hint: 운반된 입자가 가라앉거나 쌓여 지층과 지형을 만드는 과정
  aliases: [강 하구에 모래가 쌓이는 이유, 호수 바닥의 층이 생기는 과정, 물이 느려지면 입자가 가라앉는 까닭, 삼각주가 만들어지는 방식]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
