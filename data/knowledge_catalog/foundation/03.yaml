  name: 기상 전선
  hint: 성질이 다른 기단이 만나는 경계와 그에 따른 날씨
  aliases: [찬 공기와 따뜻한 공기가 만날 때, 비구름이 띠 모양으로 생기는 이유, 날씨가 갑자기 바뀌는 경계, 일기예보 지도의 파란 선과 빨간 선]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
- id: foundation.ocean_current
