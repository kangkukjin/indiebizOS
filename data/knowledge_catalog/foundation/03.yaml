  hint: 바람·밀도 차이 등으로 형성되는 바닷물의 지속적 흐름
  aliases: [바닷물이 큰 강처럼 흐르는 이유, 따뜻한 바닷물이 기후에 주는 영향, 바다에서 열이 이동하는 경로, 해안마다 수온이 다른 까닭]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
- id: foundation.tides
  kind: concept
  path: [지구와 환경, 기상과 해양]
  name: 조석
  hint: 주로 달과 태양의 기조력으로 나타나는 해수면의 주기적 변화
  aliases: [바닷물이 하루에도 들어왔다 나가는 이유, 갯벌이 드러나는 시간, 달과 바닷물 높이의 관계, 밀물과 썰물의 차이]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
- id: foundation.greenhouse_effect
  kind: concept
  path: [지구와 환경, 기후와 자원]
  name: 온실효과
  hint: 대기 성분의 복사 흡수·방출이 지표 온도에 미치는 효과
  aliases: [대기가 지표의 열에 영향을 주는 방식, 이산화탄소가 늘면 기온이 달라지는 이유, 햇빛과 지구가 내보내는 빛의 차이, 행성의 온도를 정하는 요인]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
- id: foundation.carbon_cycle
  kind: concept
  path: [지구와 환경, 기후와 자원]
  name: 탄소 순환
  hint: 대기·생물·토양·바다·암석 사이의 탄소 이동
  aliases: [숲과 바다에 저장되는 탄소, 생물이 죽은 뒤 탄소의 행방, 연료를 태우면 대기가 바뀌는 이유, 자연 속 탄소의 저장과 이동]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
