  hint: 물·바람·빙하 등이 지표 물질을 깎아 옮기는 과정
  aliases: [강이 계곡을 깊게 만드는 이유, 빗물에 흙이 씻겨 내려갈 때, 해안의 모양이 바뀌는 과정, 바람이 땅을 깎는 현상]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
