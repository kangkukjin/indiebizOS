  hint: 지표의 암석이 물리·화학·생물 작용으로 분해되는 과정
  aliases: [바위가 오랜 세월 부서지는 이유, 돌 표면이 가루가 되는 과정, 얼었다 녹으며 생기는 틈, 비와 공기가 암석을 바꾸는 방식]
