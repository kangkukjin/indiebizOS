  hint: 증발·응결·강수·유출과 저장을 통한 지구의 물 이동
  aliases: [바닷물이 비가 되어 돌아오는 과정, 구름과 강물은 어떻게 이어지는지, 물이 땅과 하늘 사이를 오가는 길, 비가 온 뒤 물의 행방]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
- id: foundation.relative_humidity
  kind: concept
  path: [지구와 환경, 기상과 해양]
  name: 상대습도
  hint: 같은 온도에서 포화 수증기압에 대한 실제 수증기압의 비
  aliases: [기온이 바뀌면 습도도 달라지는 이유, 공기가 눅눅하게 느껴질 때, 같은 수분량인데 습도계 값이 다른 까닭, 포화 상태에 얼마나 가까운 공기인지]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 지구와 환경
- id: foundation.atmospheric_circulation
