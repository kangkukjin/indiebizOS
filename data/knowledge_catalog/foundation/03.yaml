  path: [지구와 환경, 기상과 해양]
  name: 대기 대순환
  hint: 불균등한 가열과 지구 자전에 따른 대규모 공기 순환
  aliases: [위도마다 바람과 날씨가 다른 이유, 적도와 극 사이 열의 이동, 사막이 특정 위도에 많은 까닭, 전 지구의 바람 방향]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
