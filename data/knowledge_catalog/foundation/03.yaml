  hint: 토양 형성 과정에 따라 성질이 달라진 수직 층
  aliases: [땅을 파면 흙 색이 달라지는 이유, 표면의 부식질과 아래 흙의 차이, 흙이 만들어지는 시간, 토양 단면의 층 구분]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
