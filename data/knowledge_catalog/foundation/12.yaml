  aliases: [전구를 이어 붙이는 방법에 따른 차이, 전류가 갈라지는 회로, 배터리 연결에 따라 전압이 달라지는 이유, 한 부품이 끊어질 때 전체에 미치는 영향]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
