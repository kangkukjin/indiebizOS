version: 1
basis: 분야 골격을 먼저 선언하고 기존 항목 배치 및 빈 가지 보강; 편집 분류이며 유일한 세계 분류가 아님
domains:
- name: 형식과 추론
  scope: 수량·구조·증명·불확실성·계산·선택의 일반 원리
  branches:
