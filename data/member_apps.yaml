- id: report
  name: 정기보고
  icon: 📑
  web_only: true
  modes:
  - id: create
    name: 작성
    note: 공개 자료를 검색하고 출처 원문을 확인하여 보고서를 만듭니다. 결과는 이 기기에 저장됩니다.
    run_label: 보고서 만들기
    inputs:
    - {key: topic, placeholder: 보고서 주제, default: AI 동향}
    - {key: focus, placeholder: 관심 주제·지역·기간 등}
    request:
      workflow: research_report
      title: '$topic 보고서 작성'
      message: '$topic 보고서를 작성해 주세요. 관심 범위: $focus'
      output: reports/report.md
  - id: list
    name: 내 보고서
    auto_run: true
    action: '[self:list]{path:"reports"}'
    view:
    - type: card_list
      from: items
      empty: 아직 이 기기에 작성한 보고서가 없습니다.
      card: {title: '{name}', lines: ['{path}']}
      item_click:
        action: '[self:read]{path:"{path}",blocks:true}'
        view: [{type: blocks, from: items}]
- id: member_files
  name: 내 파일
  icon: 📁
  modes:
  - id: list
    name: 목록
    inputs: [{key: path, placeholder: 폴더 경로, default: '.'}]
    action: '[self:list]{path:"$path"}'
    view: [{type: list_action, from: items, title: '{name}', sub: '{type} · {path}'}]
  - id: read
    name: 읽기
    inputs: [{key: path, placeholder: 읽을 파일 경로}]
    action: '[self:read]{path:"$path"}'
    view: [{type: kv, rows: [{k: 내용, v: '{text}'}]}]
  - id: write
    name: 저장
    inputs: [{key: path, placeholder: 저장할 파일 경로}, {key: content, placeholder: 내용}]
    action: '[self:write]{path:"$path",content:"$content"}'
    view: [{type: kv, rows: [{k: 저장 경로, v: '{path}'}]}]
- id: member_programs
  name: 내 프로그램
  icon: ⚙️
  modes:
  - id: list
    name: 목록
    auto_run: true
    action: '[self:script]{op:"list"}'
    view: [{type: list_action, from: items, title: '{id}', sub: '{description}'}]
  - id: run
    name: 실행
    inputs: [{key: id, placeholder: 등록된 프로그램 이름}]
    action: '[self:script]{op:"run",id:"$id"}'
    view: [{type: kv, rows: [{k: 실행 결과, v: '{stdout}'}]}]
- id: member_documents
  name: 문서
  icon: 📄
  web_only: true
  modes:
  - id: read
    name: 읽기
    note: 이 기기에서 선택한 문서만 읽습니다. PDF·Word·Excel·텍스트를 지원합니다.
    inputs: [{key: path, type: file, placeholder: 문서 선택, required: true}]
    action: '[self:read]{path:"$path",blocks:true}'
    view: [{type: blocks, from: items}]
  - id: fields
    name: 양식 확인
    note: PDF 또는 Word 양식에서 채울 수 있는 항목을 확인합니다.
    inputs: [{key: path, type: file, placeholder: 양식 선택, required: true}]
    action: '[self:fill]{path:"$path"}'
    view: [{type: list_action, from: items, title: '{name}', sub: '{type}'}]
  - id: fill
    name: 양식 채우기
    note: 선택한 파일을 임시로 처리한 뒤 완성된 문서를 이 기기로 돌려줍니다.
    run_label: 문서 만들기
    inputs:
    - {key: path, type: file, placeholder: 양식 선택, required: true}
    - key: field
      type: select
      label: 채울 항목 선택
      required: true
      options_action: '[self:fill]{path:"$path"}'
      options_from: items
      option_value: name
      option_label: name
    - {key: value, placeholder: 넣을 내용, required: true}
    action: '[self:fill]{path:"$path",data:{"$field":"$value"}}'
    view: [{type: kv, rows: [{k: 완성된 문서, v: '{path}'}]}]
- id: member_search
  name: 공개 웹 검색
  icon: 🔎
  web_only: true
  modes:
  - id: search
    name: 검색
    inputs: [{key: query, placeholder: 검색할 내용, required: true}]
    action: '[sense:search]{query:"$query",source:"ddg"}'
    view:
    - type: card_list
      from: items
      card: {title: '{title}', lines: ['{url}', '{summary}']}
      item_click:
        action: '[sense:crawl]{url:"{url}"}'
        view: [{type: blocks, from: items}]
- id: member_location
  name: 내 위치
  icon: 📍
  web_only: true
  modes:
  - id: locate
    name: 현재 위치
    note: 이 기기의 브라우저가 위치를 확인합니다. 위치 사용을 묻는 창이 나오면 선택하세요.
    buttons: [{label: 현재 위치 확인, action: '[sense:here]{}'}]
    action: '[sense:here]{}'
    run_label: 현재 위치 확인
    view: [{type: kv, rows: [{k: 위도, v: '{latitude}'}, {k: 경도, v: '{longitude}'}, {k: '정확도(m)', v: '{accuracy}'}]}]
