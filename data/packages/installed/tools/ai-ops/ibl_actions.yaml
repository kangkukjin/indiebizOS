# ai-ops — 생성형 원샷 세 자리 + 판정 전용 judge (2026-09-21).
# 생성형 설계 = docs/ONESHOT_VOCAB_DESIGN.md(기어 실행 축).
# 판정 설계 = docs/JEV_JUDGMENT_2026_09_21.md(Jev typed API, 별도 인증).
# ai_call: true = 검수·표면 신호(실행마다 모델 비용·출력 편차 — dry-run 고지, 포털 대여 금지).
nodes:
  self:
    actions:
      struct:
        returns: items
        pipe_in: true   # 앞 통화(_prev_result)를 읽는다 — 정적 검사 T3(죽은 이음매)의 소비자 선언 (2026-09-18)
        schema_param: schema
        ai_call: true
        exempt: 원샷 AI 호출 — 정기 자가점검 실행 시 토큰 소모·비결정적이라 fixture 부적합 (table:structure·self:ask 동류)
        runs_on: anywhere
        scope: workspace
        description: AI 구조화 원자(입구) — 비정형 입력(파일·텍스트·파이프 본문)을 schema 계약의 레코드 items 통화로. 이미 표인 것은 [self:read]{tables:true}(결정론), 문서 조판용 IR 은 [table:structure].
        target_description: 'file(경로 — 이미지/PDF/엑셀/CSV/텍스트) 또는 text(직접 본문) 또는 >> 파이프 본문(예 [sense:crawl] 결과) 중 하나 · known([이미 있는 기록] — 같은 것은 다시 뽑지 않음, 2026-09-06) · instruction(추가 지시 — 2단 추출의 2차: "다음 제목들에 대해서만 how 를 채운다") · schema(필수 — 자유 라벨 "finance" 또는 필드 명세 "date, item, amount(원)". 필드 명세는 정적 검사·AI 출력 지시·필드 존재 검사를 공유하며 값 미확인은 null) · grounded(bool — 각 레코드에 원문 발췌 _quote 를 요구하고 코드가 원문 대조·탈락 수 신고. finance/health 원장 스키마=기본 on, 이미지 입력=원리상 off). 파이프 봉투에 본문(text 등)과 items 가 병기되면 본문을 원문으로 쓰고 items 는 부속으로 신고(note) — 본문 없는 items 통화는 거절([table:ai]/[table:brief] 안내). 시간이 있는 자막에서 grounded=true와 schema의 timestamp를 함께 쓰면 코드가 _quote의 시작 세그먼트 시각을 MM:SS로 복원한다(추가 모델 호출 없음). timestamp(MM:SS)를 요청했지만 원본 시간이 없거나 구절 위치가 여러 곳이면 timestamp=null과 _timestamp_error를 남긴다. missing_timestamp/ timestamp_grounded로 건수를 신고한다. 일반 날짜 timestamp 필드는 이 자막 규약의 대상이 아니다. 반환 items(_ai:true) — >> filter/each/save 로 조합. 실행마다 모델 비용(기어 실행 축, 이미지=비전 패스스루).'
        group: ai
        router: handler
        tool: ai_struct
        aliases:
          file:
          - path
        implementation: ai-ops handler — ingest_engine.extract_source(원문층 재사용) → 실행 축 원샷(oneshot_facade, 파싱 재시도 1회+정직 실패) → grounded 결정론 원문 대조(notebook 인용 후검증 부류) → items(_ai:true).
        target_key: schema
        keywords:
        - 구조화
        - 레코드
        - 영수증
        - 추출
        - 데이터화
        - struct
  table:
    actions:
      judge:
        returns: transform
        flow:
          accepts: items
          emits: items
          columns: open
        ai_call: true
        side_effect: false
        runs_on: anywhere
        scope: workspace
        group: transform
        description: '판정 전용 변환자 — 각 행의 참/거짓·선택·점수를 Jev로 일괄 판정. 원 행과 순서를 보존하고 judgment_ 접두 열 추가. 의미 판정은 judge, 규칙 비교는 filter, 글 생성은 ai/brief.'
        target_description: 'instruction(단일 질문, 결과 이름 result) · type(boolean 기본 / choice / score) · criteria(choice는 선택지→설명 맵, score는 낮은 순 2~10개 등급 목록, 점수 0~N-1) 또는 questions({이름:{instruction,type,criteria?}} 여러 독립 질문. items(직접 입력) 또는 >> 파이프. as(판정 열 접두사, 기본 judgment, 기존 열과 충돌 시 오류). threshold(0.5 초과~1, 기본 0.8): boolean 참 확률≥threshold면 true, ≤1-threshold면 false, 중간은 null; choice/score는 confidence≥threshold일 때만 value 확정. 결과 열 judgment_<질문>_value·judgment_<질문>_status(decided/unknown), 같은 접두사의 probability 또는 choice/score·confidence·probabilities. unknown은 false가 아니다. 행×질문≤100, 요청≤60000자; 빈 입력은 호출 0, 나머지는 한 요청. 통신/형식 오류는 실패, LLM 자동 폴백 없음. 인증 TYPESAFE_API_KEY(.env), 생성형 기어와 독립된 Jev API 비용·usage 신고. 상세 guides/judgment.md.'
        router: handler
        tool: ai_judge
        target_key: instruction
        implementation: 'ai_ops_judge — TypeSafe systemone 직접 API, 행마다 질문 경로를 명시해 한 요청, 응답 전수 검증 후 원 행에 병합. ProviderMetrics 사용량 원장.'
        keywords: [판정, 분류, 선택, 점수, 관련성, 광고성, 판단, judge, Jev]
      ai:
        returns: transform
        flow:   # 정적 통화 검사(2026-09-05, docs/IBL_STATIC_TYPECHECK_HANDOFF.md §2-2) — 검사기는 이 선언만 읽는다
          accepts: items
          emits: items
          columns: open
          columns_param: fields
          schema_param: schema
        ai_call: true
        runs_on: anywhere
        scope: workspace
        description: 통화 변환자(AI) — items 를 자연어 지시(instruction)대로 의미 변환(선별·주석·재구성). 참/거짓·선택·점수만 필요하면 [table:judge], 규칙으로 적을 수 있으면 filter/sort 먼저.
        target_description: 'instruction(필수 — 자연어 지시, 예 "광고성 행 제거"·"각 행에 한 줄 요약 summary 필드 추가"·"조건에 맞는 것만") · schema(선택 — 새 필드 명세 "selected(불리언), reason(사유)". 정적 검사·출력 지시·필드 존재 검사 공용) · input_fields(선택 — 모델에 보낼 최상위 열 배열, 생략=전체; 숨긴 원본 열은 모델이 수정할 수 없음) · preserve_rows(선택 boolean, 기본 false — 모든 _i 정확히 한 번, 입력 순서 복원; 누락·중복·추가 거절) · fields(선택 — 병합 뒤 남길 필드 배열, 생략=입력 필드 보존+추가 허용; 입력 필드를 나열해도 모델이 되쓰지 않는다 — 코드가 원 행에서 가져온다). 모델 출력=행마다 새/바뀐 필드만(색인 병합, 2026-09-06) — 큰 입력이라도 출력은 새 정보 크기. 집합 전체를 한 호출로 처리(행별 독립 처리는 [table:each] 안에서). 반환에 rows_in/rows_out(+rows_dropped) 동반 — 조용한 깎기 금지. 입력 상한 초과=정직 거절(take/filter 로 줄이기). >> 파이프로 앞 통화 자동 수용. 실행마다 모델 비용(기어 실행 축).'
        group: transform
        router: handler
        tool: ai_transform
        aliases:
          instruction:
          - do
          - prompt
        implementation: ai-ops handler — items 집합(행마다 색인 _i)을 한 원샷(실행 축)에 넣고, 모델은 행마다 {_i, 새로 만들거나 바꾼 필드}만 돌려준다 — 코드가 원 행에 병합(_merge:index; 입력 echo 제거로 출력 토큰 ÷4, 2026-09-06 ep2882). _i 전무=옛 계약(전체 행) 정직 폴백(_merge:full). JSON 검증+재시도 1회+정직 실패, 행 수 신고, _ai provenance. 0행=호출 생략(비용 0).
        target_key: instruction
        keywords:
        - 골라줘
        - 추려줘
        - 판단
        - 선별
        - 의미변환
        - ai
      brief:
        returns: scalar
        flow:   # 정적 통화 검사(2026-09-05, docs/IBL_STATIC_TYPECHECK_HANDOFF.md §2-2) — 검사기는 이 선언만 읽는다
          accepts: items
          emits: prose
        ai_call: true
        exempt: 원샷 AI 호출 — 정기 자가점검 실행 시 토큰 소모·비결정적이라 fixture 부적합 (table:structure·self:ask 동류)
        runs_on: anywhere
        scope: workspace
        description: 통화 emitter(AI 종합, 출구) — items 를 근거로 짧은 산문(요약·판정 이유·작명)을 낸다. 분기용 참/거짓·선택·점수는 [table:judge]. [table:document](결정론 조판)·[table:structure](문서 IR)의 형제 — 출력이 '글'일 때. 평문 텍스트 요약은 [self:ask].
        target_description: 'instruction(필수 — 산문 지시, 예 "급변 종목 중심 3문장 보고"·"어느 매물이 조건에 최적인지 판정과 이유"). 입력 = >> 파이프 items(통화 없음=거절 / 0행=빈손 성공: message 없이 note+rows_in:0, AI 호출 생략). 반환 message=산문 정본(>> [self:write] 가 산문으로 저장, notify 등으로 연결). 지어내기 금지 — items 에 있는 것만. 실행마다 모델 비용(기어 실행 축).'
        group: ai
        router: handler
        tool: ai_brief
        aliases:
          instruction:
          - do
          - prompt
        implementation: ai-ops handler — items 집합을 한 원샷(실행 축)에 넣어 산문 종합. 빈 응답 1회 재시도 후 정직 실패. 0행=호출 생략(비용 0, 빈손 성공). message=산문 정본(write 싱크 v4 추출 계약 접속).
        target_key: instruction
        keywords:
        - 요약해
        - 보고
        - 판정
        - 종합
        - 한줄로
        - brief

# tool.json 파생 원본 — 빌드가 이 블록에서 tool.json 을 생성한다.
tool_json:
  header:
    id: ai-ops
    name: AI Ops (원샷 낱말)
    description: 'AI 원자 — struct(구조화)·ai(의미 변환)·brief(산문)는 기어 실행 축의 생성형 원샷. judge(참/거짓·선택·점수)는 TYPESAFE_API_KEY를 쓰는 Jev 직접 API. 판정 결과를 IBL filter/if로 연결한다.'
    version: 1.1.0
  tools:
  - name: ai_judge
    description: 'items 각 행에 구조화 판정 추가 — [table:judge]. 여러 독립 질문을 한 Jev 요청으로 처리. guides/judgment.md 참조.'
    input_schema:
      type: object
      properties:
        items:
          type: array
          items: {type: object}
          description: '직접 입력할 행 목록. 생략하면 파이프 통화 사용.'
        instruction:
          type: string
          description: '단일 질문의 완전한 판정 기준. questions와 동시 사용 금지.'
        type:
          type: string
          enum: [boolean, choice, score]
          description: '단일 질문의 답 형식. 기본 boolean.'
        criteria:
          type: [object, array]
          description: 'choice는 선택지→설명 문자열/null 맵(2~255), score는 낮은 순 등급 설명 배열(2~10).'
          oneOf: [{type: object}, {type: array, items: {type: string}}]
        questions:
          type: object
          description: '질문 이름→{instruction,type,criteria?}. 이름은 식별자. 같은 입력에 대한 독립 질문을 묶는다.'
          additionalProperties:
            type: object
            properties:
              instruction: {type: string}
              type: {type: string, enum: [boolean, choice, score]}
              criteria:
                type: [object, array]
                oneOf: [{type: object}, {type: array, items: {type: string}}]
            required: [instruction]
            additionalProperties: false
        as:
          type: string
          description: '결과 열 접두사. 기본 judgment, 기존 열 덮어쓰기 금지.'
        threshold:
          type: number
          description: '판정 확정 임계값(0.5 초과 1 이하, 기본 0.8). 미달은 value:null, status:unknown.'
      additionalProperties: true
  - name: ai_struct
    description: '비정형 입력(파일·텍스트·파이프 본문) → schema 계약의 레코드 items — [self:struct]. grounded=원문 발췌(_quote) 결정론 대조(탈락 수 신고). 이미 표인 입력은 read{tables:true}, 문서 IR 은 table:structure.'
    input_schema:
      type: object
      properties:
        schema:
          type: string
          description: '출력 레코드 계약 — 자유 라벨("finance") 또는 필드 명세 텍스트("date, item, amount(원)").'
        file:
          type: string
          description: 입력 파일 경로(이미지/PDF/엑셀/CSV/텍스트). text·파이프 본문과 택일.
        text:
          type: string
          description: 직접 본문 텍스트(파일 대신).
        grounded:
          type: boolean
          description: 각 레코드에 원문 근거 앵커(_quote — 첫 구절 한 토막) 요구+코드 대조, 대조 뒤 코드가 문장 끝까지 이어 붙임(quote_expanded 신고). 시간 자막의 timestamp는 근거 앵커로 결정론 복원, 결측/중복 위치는 null+_timestamp_error. 기본 finance/health 스키마=on, 그 외 off.
        known:
          type: array
          description: '이미 있는 기록(문자열 목록, 또는 tip·title·name 필드가 있는 items) — 같은 내용은 다시 뽑지 않는다(known_excluded 신고). 예: 기존 팁 제목 목록, 이미 등재된 항목.'
          items:
            type: string
        instruction:
          type: string
          description: '추가 자연어 지시(선택) — 예 "다음 팁 제목들에 대해서만 how·tools·hype 를 채운다: …" (2단 추출의 2차).'
      required:
      - schema
  - name: ai_transform
    description: 'items → items 의미 변환(AI) — [table:ai]. instruction(자연어 지시)대로 선별·주석·재구성. 집합 한 호출, rows_in/out 신고, >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        schema:
          type: string
          description: '선택 출력 계약. 예 "selected(불리언), reason(선정 사유)". 필드 명세는 정적 검사·출력 지시·필드 존재 검사에 함께 쓰며, 입력 필드는 유지한다.'
        instruction:
          type: string
          description: '자연어 지시(예 "광고성 행 제거", "각 행에 요약 summary 필드 추가").'
        input_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
          description: '모델 입력에 보낼 최상위 열 이름. 원본은 코드에 보존하며 숨긴 열의 변경은 거절. fields는 별도의 출력 투영이다.'
        preserve_rows:
          type: boolean
          description: '기본 false. true면 모든 입력 _i를 정확히 한 번 요구하고 입력 순서로 병합한다. 행 누락·중복·추가·전체행 폴백은 거절.'
        fields:
          type: array
          items:
            type: string
          description: 병합 뒤 남길 필드(선택, 생략=입력 필드 보존+추가 허용). 입력 필드는 코드가 원 행에서 가져오므로 모델이 되쓰지 않는다.
        items:
          type: array
          description: 단독 호출용 items(파이프 없이 직접 공급).
      required:
      - instruction
  - name: ai_brief
    description: 'items → 산문 종합(AI) — [table:brief]. instruction 대로 요약·판정·작명 산문을 message 로 반환(write 싱크가 산문 정본으로 저장). >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        instruction:
          type: string
          description: '산문 지시(예 "급변 종목 중심 3문장 보고").'
        items:
          type: array
          description: 단독 호출용 items(파이프 없이 직접 공급).
      required:
      - instruction
