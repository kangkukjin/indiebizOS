nodes:
  self:
    actions:
      # 2026-08-15 원장 통합: business·business_item·business_document·work_guideline
      # 네 낱말 → [self:ledger]{store, op}. 헌법 "명사의 자리"(ibl.md) 집행 —
      # 하드코딩할 명사는 *몸의 명사*(작용의 거처)뿐이고 비즈니스·아이템·문서·지침은
      # *세계의 명사*(세계가 이런 곳이다)라 코드가 아니라 데이터가 나를 것이다.
      # 조항은 2026-08-06 에 선포됐는데 이 어휘들은 06-12 부터 있어 소급된 적이 없었다.
      # ★store 는 Object Type 선언이 아니라 자유 라벨이다 — "선행 명사 스키마 금지"와
      #   충돌하지 않는다(스키마를 먼저 짓지 않고, 기존 테이블로 라우팅만 한다).
      # ★저장 구조는 안 건드린다(사용자 판정): business.db 의 기존 테이블 그대로,
      #   어휘·프롬프트 상주비만 줄인다. 데이터 이관 0, 롤백은 이 커밋 되돌리기.
      # ★부수 이득: save(business·item) 와 update(document·guideline) 가 같은 연산인데
      #   이름만 달랐다 → save 로 통일(update 는 별칭).
      ledger:
        aliases:
          op: [action]
          # ★id 에 business_id 를 별칭으로 걸지 말 것 — _item_save 가
          #   `ti.get("id") or ti.get("item_id")` 로 생성/수정을 가르므로,
          #   생성 호출(business_id + title)이 "아이템 #business_id 수정"으로 오독된다.
          #   store 별 함수들은 이미 id·item_id 를 둘 다 읽는다(별칭 불필요).
        returns: items
        side_effect: true     # 파괴적 op 보유 — 통화(returns)와 안전은 다른 축
        fixture: '[self:ledger]{store: "business", op: "list"}'
        description: 사업 원장 조회·관리 (store × op). store=business(사업)/item(상품·서비스)/document(레벨별 공개문서)/guideline(근무지침). op:list 기본.
        group: business
        target_description: 'store 로 원장을 고르고 op 로 연산을 고른다(기본 store=business, op=list).

          - business: list(level 0-4·search 필터) / detail(id, +소속 아이템) / save(id 없으면 생성·name 필수) / delete(id, 아이템도 함께)

          - item: list(business_id 없으면 전체·search) / detail(id) / save(business_id·title 필수) / delete(id) / add_image·remove_image(id + path)

          - document: list(레벨 0-4 전체) / detail(level) / save(level + title/content) / regenerate(비즈니스·아이템 기반 자동 재생성) / publish(Nostr 발행)

          - guideline: list / detail(level) / save(level + title/content)

          ★op 이 그 store 에 없으면 거절한다(조용히 무시하지 않는다).'
        target_key: op
        router: handler
        tool: ledger_op
        ops:
          default: list
          returns:
            save: effect
            delete: effect
            regenerate: effect
            publish: effect
            add_image: effect
            remove_image: effect
          side_effect:
            list: false
            detail: false
          exempt:
            detail: 'store 별 id/level 필요(list 결과) — 고정 fixture 부적합'
            save: '생성/수정 대상 필요 — 고정 fixture 부적합'
            delete: '삭제 대상 필요 — 고정 fixture 부적합'
            regenerate: '비즈니스 데이터 의존 — 고정 fixture 부적합'
            publish: '외부 발행(Nostr) — 부작용 fixture 부적합'
            add_image: 'item_id + 실파일 경로 필요 — 고정 fixture 부적합'
            remove_image: 'item_id + 경로 필요 — 고정 fixture 부적합'
          values:
            list: 원장 목록 (store 별 필터 — 기본 op)
            detail: 단건 상세 (business/item=id · document/guideline=level)
            save: 생성·수정 (옛 business/item 의 save 와 document/guideline 의 update 통합)
            delete: 삭제 (business=소속 아이템 동반 · item=단건)
            regenerate: 공개문서 자동 재생성 (store=document 전용)
            publish: 공개 프로필·발견 노트 Nostr 발행 (store=document 전용)
            add_image: 아이템 첨부 이미지 추가 (store=item 전용, id·path)
            remove_image: 아이템 첨부 이미지 제거 (store=item 전용, id·path)
        implementation: business 패키지 ledger_op — op 로 먼저 분기하고 store 로 기존
          store 별 함수(_biz_*/_item_*/_doc_*/_guide_*)에 라우팅. 테이블·매니저 무변경.
        keywords:
        - 비즈니스
        - 사업
        - 원장
        - 상품
        - 아이템
        - 공개문서
        - 근무지침
        - 비즈니스 목록
        - 사업 등록
        app:
          instrument: business
          icon: 🏢
          name: 비즈니스
          order: 11
          # 시스템 표면 — 정식 진입점은 공유창고의 '비즈니스' 탭(2026-07-19 모드→탭 이동:
          # 비즈니스=창고를 채우는 관리 기능). 데스크탑 앱 그리드에서 제외, 원격/폰(리모컨)은 계기 노출 유지.
          system: true
          # 소개발행 버튼은 2026-07-19 공유창고 표면(WarehouseView 헤더)으로 이동 — "나를 알리기"는 창고의 일.
          modes:
          - name: 비즈니스
            auto_run: true
            inputs:
            - key: q
              type: text
              placeholder: 이름 검색 · ＋추가
            filter:
              key: level
              items:
              - label: 전체
                value: ''
                default: true
              - label: L0
                value: 0
              - label: L1
                value: 1
              - label: L2
                value: 2
              - label: L3
                value: 3
              - label: L4
                value: 4
              - label: 폐쇄
                value: -1
            buttons:
            - label: ＋ 비즈니스 추가
              action: '[self:ledger]{store: "business", op: "save", name: "$q"}'
              refresh: true
            action: '[self:ledger]{store: "business", op: "list", level: "$level", search: "$q"}'
            view:
            - type: card_list
              from: items
              master_detail: true
              # 아이템(상품·항목)은 여기서 다루지 않는다 — 편집 창구는 '아이템' 탭 하나뿐이다.
              # (2026-07-29: 여기 있던 editable_list 는 사진을 못 붙여, 같은 일을 하는 두 창구 중
              #  사진 없는 쪽이 자연스러운 자리에 앉아 "사진 기능이 사라졌다"로 읽혔다.)
              item_click:
                action: '[self:ledger]{store: "business", op: "detail", id: "{id}"}'
                view:
                - type: form
                  title: 비즈니스 정보
                  fields:
                  - key: name
                    label: 이름
                    type: text
                    value: '{business.name}'
                  - key: level
                    label: 공개 수준
                    type: select
                    value: '{business.level}'
                    options:
                    - value: -1
                      label: 폐쇄
                    - value: 0
                      label: L0 · 최소
                    - value: 1
                      label: L1
                    - value: 2
                      label: L2
                    - value: 3
                      label: L3
                    - value: 4
                      label: L4 · 전체
                  - key: description
                    label: 설명
                    type: textarea
                    value: '{business.description}'
                  action: '[self:ledger]{store: "business", op: "save", id: "{business.id}", name: "$name", level: "$level", description: "$description"}'
                  button: 저장
                  actions:
                  - label: 비즈니스 삭제
                    action: '[self:ledger]{store: "business", op: "delete", id: "{business.id}"}'
                    style: danger
                    confirm: 이 비즈니스를 삭제할까요? 소속 아이템도 함께 사라집니다.
                    back: true
              card:
                title: '{name}'
                lines:
                - 레벨 {level} · {description|trunc:40}
                - '{item_label}'
          - name: 아이템
            auto_run: true
            note: 카드를 눌러 제목·설명·사진을 고칩니다(사진은 고르는 즉시 붙음 · 추가는 데스크탑에서만).
              여기 있는 아이템은 공유창고에 카탈로그로 자동 진열됩니다.
            inputs:
            - key: biz
              type: select
              placeholder: 전체 비즈니스
              options_action: '[self:ledger]{store: "business", op: "list"}'
              options_from: items
              option_value: id
              option_label: name
            - key: q
              type: text
              placeholder: 제목 검색 · ＋추가할 제목
            buttons:
            - label: ＋ 아이템 추가
              action: '[self:ledger]{store: "item", op: "save", business_id: "$biz", title: "$q"}'
              refresh: true
            action: '[self:ledger]{store: "item", op: "list", business_id: "$biz", search: "$q"}'
            view:
            - type: card_list
              from: items
              master_detail: true
              empty_from: message
              item_click:
                action: '[self:ledger]{store: "item", op: "detail", item_id: "{id}"}'
                view:
                - type: form
                  title: 아이템
                  fields:
                  - key: title
                    label: 제목
                    type: text
                    value: '{item.title}'
                  - key: details
                    label: 설명
                    type: textarea
                    value: '{item.details}'
                  - key: images
                    label: 사진
                    type: images
                    value: '{item.attachment_path}'
                    add_action: '[self:ledger]{store: "item", op: "add_image", item_id: "{item.id}", path: "$path"}'
                    remove_action: '[self:ledger]{store: "item", op: "remove_image", item_id: "{item.id}", path: "$path"}'
                  action: '[self:ledger]{store: "item", op: "save", id: "{item.id}", title: "$title", details: "$details"}'
                  button: 저장
                  actions:
                  - label: 아이템 삭제
                    action: '[self:ledger]{store: "item", op: "delete", item_id: "{item.id}"}'
                    style: danger
                    confirm: 이 아이템을 삭제할까요?
                    back: true
              card:
                image: '{image}'
                title: '{title}'
                lines:
                - '{business_name}{photo_label|opt:  ·  ,}'
                - '{details|trunc:50}'
          - name: 공개문서
            auto_run: true
            buttons:
            - label: ↻ 비즈니스 기반 재생성
              action: '[self:ledger]{store: "document", op: "regenerate"}'
              refresh: true
            action: '[self:ledger]{store: "document", op: "list"}'
            view:
            - type: card_list
              from: items
              item_click:
                action: '[self:ledger]{store: "document", op: "detail", level: "{level}"}'
                view:
                - type: form
                  title: 공개 비즈니스 문서
                  fields:
                  - key: title
                    label: 제목
                    type: text
                    value: '{document.title}'
                  - key: content
                    label: 내용
                    type: textarea
                    value: '{document.content}'
                  action: '[self:ledger]{store: "document", op: "save", level: "{document.level}", title: "$title", content: "$content"}'
                  button: 저장
              card:
                title: '{title}'
                lines:
                - '{content|trunc:60}'
          - name: 근무지침
            auto_run: true
            action: '[self:ledger]{store: "guideline", op: "list"}'
            view:
            - type: card_list
              from: items
              item_click:
                action: '[self:ledger]{store: "guideline", op: "detail", level: "{level}"}'
                view:
                - type: form
                  title: 근무 지침
                  fields:
                  - key: title
                    label: 제목
                    type: text
                    value: '{guideline.title}'
                  - key: content
                    label: 내용
                    type: textarea
                    value: '{guideline.content}'
                  action: '[self:ledger]{store: "guideline", op: "save", level: "{guideline.level}", title: "$title", content: "$content"}'
                  button: 저장
              card:
                title: 레벨 {level} · {title}
                lines:
                - '{content|trunc:60}'
          - name: 자동응답
            auto_run: true
            note: 외부 메시지(Gmail/Nostr) 자동응답을 켜면, 이웃의 정보공개수준별 근무지침·공개문서를 맥락으로 AI가 답합니다.
            buttons:
            - label: 켜기
              action: '[others:auto_response]{op: "start"}'
              refresh: true
            - label: 끄기
              action: '[others:auto_response]{op: "stop"}'
              refresh: true
            action: '[others:auto_response]{op: "status"}'
            view:
            - type: kv
              rows:
              - k: 상태
                v: '{state_label}'
              - k: 안내
                v: '{summary}'
              - k: 점검
                v: '{interval_label}'
      phone_sync:
        returns: effect
        description: 폰과 PC의 주소록(이웃·연락처·사업) USB 합집합 동기화 — "폰 동기화/싱크" 명령 시.
        group: business
        target_description: (파라미터 없음). 폰 USB 연결 필요(미기동 시 앱 자동 기동). 양방향 1회 머지 — 추가는 합치고 수정은 최신 우선, 삭제는 양쪽 반영. 메시지/글 내용은 비대상(릴레이/Gmail 진실원).
        router: handler
        tool: phone_sync
        runs_on: pc_only
        implementation: business 패키지 phone_sync — adb forward 로 폰 백엔드(:8765) 도달 후 export/merge 양방향. business_sync.merge_business_db(LWW+tombstone).
        keywords:
        - 폰 동기화
        - 폰 싱크
        - 주소록 동기화
        - 기기 동기화
  others:
    actions:
      messages:
        aliases:
          neighbor_id: [contact, name, id]
        returns: items
        side_effect: false    # 전 op 읽기 전용
        fixture: '[others:messages]{op: "inbox"}'
        description: 메신저 — 대화 목록(inbox) 또는 한 이웃과의 메시지 스레드(thread). 채널 통합(Gmail/Nostr) — business.db와 Nostr DM 캐시를 병합한 대화의 정본 뷰(원시 채널 조회는 channel_read). inbox items(unread·favorite 필드) — table:filter 로 미독·즐겨찾기만 선별.
        target_description: op:thread(기본, neighbor_id 필수 — 한 이웃과 주고받은 전체 메시지) / op:inbox(대화 목록 — 이웃별 최근 메시지·미응답, 파라미터 없음·최근순).
        group: channel
        target_key: op
        router: handler
        tool: messages_op
        ops:
          default: thread
          exempt:
            thread: 'neighbor_id 필요(inbox 결과의 id) — 고정 fixture 부적합'
          values:
            thread: 한 이웃과 주고받은 메시지 스레드 (neighbor_id 필수)
            inbox: 대화 목록 (이웃별 최근 메시지·미응답, 최근순)
        implementation: handler.py messages_op — op:thread 는 business_manager.get_messages(neighbor_id) 를 시간 오름차순 반환(채팅 순서), op:inbox 는 neighbors⋈messages 조인으로 대화 목록 합성.
        app:
          instrument: messenger
          icon: 💬
          name: 메신저
          order: 7
          # 시스템 표면 — 도메인 앱이 아니라 런처 직속(전용 창·'연락처' 버튼). 데스크탑 앱 그리드에서 제외.
          # 원격/폰은 리모컨이라 계기 노출 유지.
          system: true
          auto_run: true
          inputs:
          - key: q
            type: text
            placeholder: 이름 검색 · ＋추가
          filter:
            key: level
            items:
            - label: 전체
              value: ''
              default: true
            - label: L0
              value: 0
            - label: L1
              value: 1
            - label: L2
              value: 2
            - label: L3
              value: 3
            - label: L4
              value: 4
          buttons:
          - label: ＋ 이웃 추가
            action: '[others:neighbor]{op: "save", name: "$q"}'
          action: '[others:messages]{op: "inbox", level: "$level", search: "$q"}'
          view:
          - type: card_list
            from: items
            master_detail: true
            empty_from: message
            item_click:
              action: '[others:messages]{op: "thread", neighbor_id: "{id}", pubkey: "{pubkey}"}'
              tabs:
              - name: 대화
                view:
                - type: metric
                  big: '{name}'
                  sub: '{badge}{channel|opt:  ·  ,}{following_label|opt:  ·  ,}'
                - type: thread
                  from: items
                  text: '{content}'
                  mine: is_from_user
                  meta: '{contact_type}'
                  time: '{time}'
                  status: status
                compose:
                  placeholder: 메시지 입력…
                  channels:
                    from: contacts
                    type: contact_type
                    value: contact_value
                    # 발신 가능한 *주소 종류*(contact_type) = 채널 어휘와 같은 낱말(email/nostr).
                    # (warehouse 는 주소일 뿐 발신 수단이 없어 제외)
                    sendable:
                    - email
                    - nostr
                  action: '[others:channel_send]{channel_type: "$channel_type", to: "$to", body: "$text"}'
              - name: 이웃 정보
                view:
                - type: form
                  title: 이웃 정보
                  fields:
                  - key: name
                    label: 이름
                    type: text
                    value: '{name}'
                  - key: info_level
                    label: 정보 공개 수준
                    type: select
                    value: '{info_level}'
                    options:
                    - value: 0
                      label: L0 · 최소
                    - value: 1
                      label: L1
                    - value: 2
                      label: L2
                    - value: 3
                      label: L3
                    - value: 4
                      label: L4 · 전체
                  - key: rating
                    label: 평점
                    type: select
                    value: '{rating}'
                    options:
                    - value: 0
                      label: 평점 없음
                    - value: 1
                      label: ★1
                    - value: 2
                      label: ★2
                    - value: 3
                      label: ★3
                    - value: 4
                      label: ★4
                    - value: 5
                      label: ★5
                  - key: warehouse_score
                    label: 창고점수 (창고 등록된 이웃만)
                    type: select
                    value: '{warehouse_score}'
                    options:
                    - value: 0
                      label: 점수 없음
                    - value: 1
                      label: ★1
                    - value: 2
                      label: ★2
                    - value: 3
                      label: ★3
                  - key: info_share
                    label: 정보 공유 동의
                    type: toggle
                    value: '{info_share}'
                  - key: additional_info
                    label: 메모
                    type: textarea
                    value: '{additional_info}'
                  - key: business_doc
                    label: 비즈니스 문서(공개)
                    type: textarea
                    value: '{business_doc}'
                  action: '[others:neighbor]{op: "save", id: "{neighbor_id}", name: "$name", info_level: "$info_level", rating: "$rating", warehouse_score: "$warehouse_score", info_share: "$info_share", additional_info: "$additional_info", business_doc: "$business_doc"}'
                  button: 저장
                  actions:
                  - label: ⭐ 즐겨찾기 토글
                    action: '[others:neighbor]{op: "favorite", id: "{neighbor_id}"}'
                  - label: 이웃 삭제 · 대화 숨김
                    action: '[others:neighbor]{op: "delete", id: "{neighbor_id}", pubkey: "{pubkey}"}'
                    style: danger
                    confirm: 삭제할까요? 이웃이면 연락처·대화가 사라지고, 이웃 아닌 쪽지 상대면 대화가 숨겨집니다(새 메시지가 오면 다시 보여요).
                    back: true
                - type: form
                  title: 이웃 합치기
                  fields:
                  - key: merge_from
                    label: 합칠 이웃 (이름 또는 id) — 그쪽의 연락처·대화·가입 자격이 이 이웃으로 합류하고, 그쪽 레코드는 은퇴합니다
                    type: text
                  action: '[others:neighbor]{op: "merge", id: "{neighbor_id}", from: "$merge_from"}'
                  button: 이 이웃으로 합치기
                - type: editable_list
                  from: contacts
                  title: 연락처
                  display: '{contact_type} · {contact_value}'
                  empty: 연락처 없음
                  delete_action: '[others:neighbor]{op: "contact_delete", contact_id: "{id}"}'
                  add:
                    fields:
                    - key: contact_type
                      type: select
                      placeholder: 유형
                      options:
                      - value: gmail
                        label: 이메일
                      - value: phone
                        label: 전화
                      - value: nostr
                        label: Nostr
                      - value: kakao
                        label: 카카오
                      - value: telegram
                        label: 텔레그램
                      - value: other
                        label: 기타
                    - key: contact_value
                      type: text
                      placeholder: 연락처 값
                    action: '[others:neighbor]{op: "contact_add", neighbor_id: "{neighbor_id}", contact_type: "$contact_type", contact_value: "$contact_value"}'
                    button: 추가
            card:
              title: '{favorite|opt:⭐ ,}{name}'
              lines:
              - '{preview}'
              - '{badge}{time|opt:  ·  ,}{channel|opt: · ,}'
        keywords:
        - 메시지
        - 대화
        - 이력
        - 메신저
        - 받은메시지
      neighbor:
        returns: items
        side_effect: true     # 파괴적 op 보유 — 통화(returns)와 안전은 다른 축
        fixture: '[others:neighbor]{op: "list"}'
        description: 이웃(비즈니스 파트너) 조회·관리 — op:list(기본)/detail/save/delete/favorite/merge.
        target_description: op:list(search 부분일치·info_level 0-4 필터, 기본) / detail(neighbor_id 또는 name — 연락처·최근메시지 포함) / save(id 없으면 생성·name 필수, 있으면 수정 — name/info_level(0-4)/rating(0-5)/info_share/additional_info/business_doc. warehouse_score(0-3) 옵션=이웃의 창고에 주는 창고점수(창고 연락처 있는 이웃만 유효). npub 옵션=nostr 연락처 동시 연결, IndieNet 팔로우→이웃 승격용 — 같은 npub이 이미 이웃이면 멱등) / delete(id — 이웃 삭제, nostr 대화도 숨김. id 없이 pubkey(npub)면 비이웃 쪽지 상대의 대화 숨김 — 새 메시지가 오면 다시 보임) / favorite(id 필수, 토글) / merge(id=남길 이웃, from=합칠 이웃의 이름 또는 id — 같은 사람이 창고 등록·창고 가입 두 경로로 중복 등록됐을 때 연락처·대화·가입 자격·메모를 한 레코드로 합류, 합쳐진 쪽은 은퇴) / contact_add(neighbor_id·contact_type(email/phone/kakao/telegram/line/nostr/other)·contact_value 필수) / contact_update(contact_id 필수) / contact_delete(contact_id 필수).
        group: neighbor
        target_key: op
        router: handler
        tool: neighbor_op
        ops:
          default: list
          returns:
            save: effect
            delete: effect
            favorite: effect
            merge: effect
            contact_add: effect
            contact_update: effect
            contact_delete: effect
          side_effect:
            list: false
            detail: false
          exempt:
            detail: '이웃 id/name 필요(list 결과) — 고정 fixture 부적합'
            contact_add: '이웃 id + 연락처 값 필요 — 고정 fixture 부적합'
            contact_update: 'contact_id 필요(detail 결과) — 고정 fixture 부적합'
            contact_delete: 'contact_id 필요(detail 결과) — 고정 fixture 부적합'
          values:
            list: 이웃 목록 (search/info_level 필터)
            detail: 이웃 상세 (neighbor_id 또는 name, +연락처·최근메시지)
            save: 이웃 생성(id 없음)/수정(id 있음)
            delete: 이웃 삭제 (비이웃 쪽지 상대는 대화 숨김)
            favorite: 즐겨찾기 토글
            merge: 이웃 병합 (중복 등록된 같은 사람을 하나로 — 합쳐진 쪽 은퇴)
            contact_add: 연락처 추가 (neighbor_id·contact_type·contact_value)
            contact_update: 연락처 수정 (contact_id)
            contact_delete: 연락처 삭제 (contact_id)
        implementation: business 패키지 neighbor_op — business_manager.get_neighbors/get_neighbor/create_neighbor/update_neighbor/delete_neighbor
          + 연락처 CRUD(add_contact/update_contact/delete_contact).
        keywords:
        - 이웃
        - 이웃조회
        - 이웃추가
        - 이웃수정
        - 즐겨찾기
        - 연락처추가
        - 연락처수정
        - 연락처삭제
      # 2026-08-15 은퇴: others:contact → [others:neighbor]{op: contact_add|contact_update|contact_delete}
      # 되살리지 말 것 — contact 는 대등한 원장이 아니라 **neighbor 의 자식 컬렉션**이었다.
      # 증거: list op 이 없었다(연락처는 neighbor detail 안에 실려 나온다) + 전 op 가 부모 id
      # (neighbor_id) 또는 자식 id(contact_id)를 요구한다. self:ledger 의 item 이
      # add_image/remove_image 를 자기 op 로 갖는 것과 같은 모양이다.
      # ★self:ledger{store:"contact"} 로 접지 않은 이유: store 축은 *대등한 원장*의 축인데
      #   연락처는 대등하지 않다 — 넣었으면 store 가 거짓말을 시작했을 것이다.
      auto_response:
        returns: effect
        description: 외부 메시지 자동응답 서비스 제어 — op:status(기본)/start/stop. on/off 는 영속(재시작 유지).
        group: channel
        runs_on: pc_only
        target_description: op:status(가동 여부·켜짐설정·점검주기·처리수) / start(켜기, 영속) / stop(끄기, 영속). 자동응답은 이웃 정보공개수준별 근무지침·비즈니스문서를 맥락으로 AI가 응답 생성·발송.
        target_key: op
        router: handler
        tool: auto_response_op
        ops:
          default: status
          side_effect:
            status: false
          returns:
            status: scalar
          fixture:
            status: '[others:auto_response]{op: "status"}'
          values:
            status: 자동응답 가동 상태 조회
            start: 자동응답 켜기 (재시작에도 유지)
            stop: 자동응답 끄기 (재시작에도 유지)
        implementation: business 패키지 auto_response_op — backend auto_response.get_auto_response_service() 의 enable/disable/상태. 상태는 data/auto_response_state.json 에 영속, channel_poller 부팅 시 is_enabled 로 자동 시작 게이트.
        keywords:
        - 자동응답
        - 자동회신
        - 자동답장
        - auto reply

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: business
    name: Business & Contacts
    description: 비즈니스 관계 및 연락처(이웃) 관리 도구. 이웃 목록 조회, 상세 정보 확인, 연락처 관리 기능을 제공합니다.
    version: 1.0.0
    author: System AI
  tools:
  - name: messages_op
    description: '메신저 — 대화 목록 또는 한 대화의 메시지 스레드. business.db(다채널 이웃, 양방향) + dms.db(IndieNet Nostr DM)를 Nostr 이벤트 id로 dedupe하며
      통합.


      ## op 분기

      - thread (기본): neighbor_id(이웃) 또는 pubkey(비이웃 npub) 중 하나. 그 대화의 메시지 전체(시간 오름차순). 반환 {name, channel, to, messages:[{content,is_from_user,contact_type,time}]}

      - inbox: 파라미터 없음. 이웃+Nostr DM 통합 대화 목록(최근순). 반환 {conversations:[{id,pubkey,name,channel,to,preview,time,unread}]}'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: thread=한 대화 스레드(neighbor_id 또는 pubkey) / inbox=대화 목록
        neighbor_id:
          type: integer
          description: 이웃 ID (op:thread, 이웃 대화)
        pubkey:
          type: string
          description: 상대 npub (op:thread, 비이웃 Nostr DM 대화)
  - name: neighbor_op
    description: '이웃(비즈니스 파트너) 조회·관리.


      ## op 분기

      - list (기본): search(부분일치)/info_level(0-4) 필터로 이웃 목록. 반환 {neighbors:[...]}

      - detail: neighbor_id 또는 name. 상세+연락처+최근 메시지. 반환 {neighbor, contacts, messages}

      - save: id 없으면 생성(name 필수), 있으면 수정. 필드 name/info_level/rating/info_share/additional_info/business_doc

      - delete: id 필수

      - favorite: id 필수, 즐겨찾기 토글'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: list=목록(기본) / detail=상세 / save=생성·수정 / delete=삭제 / favorite=즐겨찾기 토글
        id:
          type: integer
          description: 이웃 ID (수정/삭제/즐겨찾기 시)
        name:
          type: string
          description: 이름 (생성 시 필수)
        info_level:
          type: integer
          description: 정보 공개 수준 0-4
        rating:
          type: integer
          description: 평점 0-5
        info_share:
          type: integer
          description: 정보 공유 동의 0/1
        additional_info:
          type: string
          description: 메모/추가 정보
        business_doc:
          type: string
          description: 이 이웃에게 공개할 비즈니스 문서
        search:
          type: string
          description: 이름 부분 일치 (list 모드)
        neighbor_id:
          type: integer
          description: 이웃 ID (detail 모드 — id 대신 사용 가능)
        contact_id:
          type: integer
          description: 연락처 ID (contact_update/contact_delete 시 필수)
        contact_type:
          type: string
          description: email/phone/kakao/telegram/line/nostr/other (contact_add)
        contact_value:
          type: string
          description: 연락처 값 (contact_add)
  - name: ledger_op
    description: '사업 원장 CRUD (store x op). 2026-08-15 통합 — 옛 business_op /
      business_item_op / business_document_op / work_guideline_op.


      ## store 분기 (기본 business)

      - business: 사업 자체. list(level/search) / detail(id, +소속 아이템) / save(id 없으면 생성·name 필수) / delete(id, 아이템 동반)

      - item: 상품·서비스. list(business_id 없으면 전체·search) / detail(id) / save(business_id·title 필수) / delete(id) / add_image·remove_image(id + path)

      - document: 레벨 0-4 공개문서. list / detail(level) / save(level + title/content) / regenerate(자동 재생성) / publish(Nostr 발행)

      - guideline: 레벨 0-4 근무지침. list / detail(level) / save(level + title/content)


      ## 주의

      - save 는 옛 business/item 의 save 와 document/guideline 의 update 를 합친 것이다(같은 연산이었다).

      - 그 store 에 없는 op 는 조용히 무시하지 않고 명시 거절한다.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 연산 (enum·default 는 빌드가 액션 ops 에서 주입 — 여기 적지 말 것)
        store:
          type: string
          description: 원장 종류 (business|item|document|guideline, 기본 business)
        id:
          type: string
          description: 대상 id (business/item — business_id·item_id 별칭 허용)
        business_id:
          type: string
          description: 소속 비즈니스 id (store=item 의 list 필터·save)
        level:
          type: integer
          description: 공개 수준 0-4 (business 필터 · document/guideline 의 대상)
        name:
          type: string
          description: 비즈니스 이름 (store=business 의 save)
        title:
          type: string
          description: 제목 (item 의 save · document/guideline 의 save)
        content:
          type: string
          description: 본문 (document/guideline 의 save)
        description:
          type: string
          description: 설명 (business/item 의 save)
        search:
          type: string
          description: 제목·설명 검색어 (list 필터)
        path:
          type: string
          description: 이미지 경로 (add_image/remove_image)
  - name: auto_response_op
    description: '외부 메시지(Gmail/Nostr) 자동응답 서비스 제어.


      ## op 분기

      - status (기본): 현재 가동 여부·켜짐 설정·점검주기·처리수 조회. 반환 {running, enabled, check_interval, processed_count}

      - start: 자동응답 켜기 (영속 — 재시작에도 유지)

      - stop: 자동응답 끄기 (영속 — 재시작에도 유지)


      자동응답은 이웃의 정보공개수준(info_level)별 근무지침·비즈니스문서를 맥락으로 AI가 응답을 생성·발송한다.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: status=상태 조회 / start=켜기 / stop=끄기
  - name: phone_sync
    description: '폰과 PC의 주소록 데이터(business.db: 이웃·연락처·사업·아이템·문서·지침)를 USB(adb)로 합집합 동기화한다. 폰이 USB로 연결돼 있어야 하며(미기동 시 앱 자동 기동
      시도), 양방향 1회 머지(추가는 합치고 수정은 최신이 이김, 삭제는 양쪽 반영). 메시지/글 내용은 동기화 대상이 아니다(릴레이/Gmail이 진실원). 파라미터 없음.'
    input_schema:
      type: object
      properties: {}
