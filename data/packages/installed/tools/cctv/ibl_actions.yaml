nodes:
  limbs:
    actions:
      cctv:
        returns: items
        description: CCTV·공개 웹캠 조작 — search/nearby로 찾고 open/capture로 보며 stats/refresh로 소스 현황·캐시 관리.
        group: media
        target_description: 'search: query 키워드 통합검색. nearby: lat/lng 필수, radius_km·limit 옵션, source:auto(기본) 또는
          windy(Windy 공개 웹캠만). open/capture: name 또는 url, capture의 save_path는 작업공간 기준. stats: 소스별 현황. refresh: UTIC
          캐시 갱신. 조회 결과는 items에 좌표·재생 가능 여부를 포함한다.'
        target_key: op
        router: handler
        tool: cctv_op
        ops:
          default: open
          values:
            search: 키워드 CCTV·공개 웹캠 통합검색
            nearby: 좌표 주변 카메라 검색 (source:auto/windy)
            open: 브라우저에서 HLS/RTSP 영상 재생 (기본)
            capture: ffmpeg 단일 프레임 PNG 캡처 (AI 분석용)
            stats: 소스별 현황 조회
            refresh: UTIC 캐시 갱신
          fixture:
            nearby: '[limbs:cctv]{op: "nearby", lat: 37.5665, lng: 126.978}'
            search: '[limbs:cctv]{op: "search", query: "해운대"}'
          returns:
            search: items
            nearby: items
            stats: items
            open: effect
            capture: effect
            refresh: effect
          side_effect:
            search: false
            nearby: false
            stats: false
          exempt:
            stats: 외부 소스·캐시 현황 조회 — 무인 정기 조회 제외
        implementation: cctv_op가 탐색·열기·캡처·소스 관리를 분기한다. nearby의 source는 공급처 선택이며 windy는 Windy 드라이버를 직접 호출한다.
        keywords:
        - cctv
        - 교통
        - 실시간
        - 카메라
        - 보여줘
        - 봐줘
        - traffic
        - camera
        - 영상
        - 근처
        - 주변
        - 열기
        - 캡처
        - 스크린샷
        - 찍어
        app:
          edition: 2
          instrument: cctv
          icon: 📹
          name: CCTV
          order: 12
          inputs:
          - key: q
            type: text
            label: 검색
            placeholder: '지역·도로 (예: 해운대, 경부)'
            default: 해운대
          auto_run: true
          action: '[limbs:cctv]{op: "search", query: $q}'
          view:
          - type: map
            markers: items
            max: 100
            'on':
              marker_click:
                stream: true
              search_here: '[limbs:cctv]{op: "nearby", lat: $lat, lng: $lng, radius_km: $radius_km}'
          - type: metric
            label: 검색 결과
            big: '{count}개'
          - type: list_action
            from: items
            icon: 📹
            empty: CCTV를 찾지 못했습니다
            title: '{name}'
            sub: '{region}{road_name|opt: · ,}'
            button:
              label: ▶ 보기
              stream: true
        aliases:
          limit:
          - count
          lng:
          - lon
        params: {}
        shape_variants:
          source=auto: '[limbs:cctv]{op:"nearby", source:"auto", lat:37.5665, lng:126.978}'
          source=windy: '[limbs:cctv]{op:"nearby", source:"windy", lat:37.5665, lng:126.978}'
        side_effect: true
        fixture: '[limbs:cctv]{op:"search", query:"해운대"}'
tool_json:
  header:
    id: cctv
    name: CCTV 실시간 영상
    description: 'CCTV 및 실시간 웹캠 통합 도구


      ## 소스

      - UTIC 도시교통정보센터 (한국 시내도로 CCTV, 16,000+대 실시간 API)

      - ITS 국가교통정보센터 (한국 고속도로/국도 CCTV)

      - Windy Webcams (전세계 웹캠)


      ## 주요 기능

      - 위치/키워드 기반 CCTV 검색 (UTIC+ITS+Windy 통합)

      - 가장 가까운 CCTV 찾기

      - 실시간 영상 URL 제공

      - 화면 캡처 (ffmpeg/이미지)

      - UTIC 실시간 API 연동 (캐시 자동 갱신)


      ## 필요 환경변수

      - UTIC_API_KEY: 도시교통정보센터 API 키

      - ITS_API_KEY: 국가교통정보센터 API 키

      - WINDY_API_KEY: Windy Webcams API 키 (선택)'
    version: 3.0.0
  tools:
  - name: cctv_op
    description: 'CCTV·공개 웹캠 조작 — search/nearby로 찾고 open/capture로 보며 stats/refresh로 소스 현황·캐시 관리. search: query 키워드
      통합검색. nearby: lat/lng 필수, radius_km·limit 옵션, source:auto(기본) 또는 windy(Windy 공개 웹캠만). open/capture: name 또는
      url, capture의 save_path는 작업공간 기준. stats: 소스별 현황. refresh: UTIC 캐시 갱신. 조회 결과는 items에 좌표·재생 가능 여부를 포함한다.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 동작 (ops 목록 참조)
        query:
          type: string
          description: '[search] 검색 키워드 (광화문, 경부, 해운대 등)'
        lat:
          type: number
          description: '[nearby] 위도 (필수)'
        lng:
          type: number
          description: '[nearby] 경도 (필수)'
        radius_km:
          type: number
          description: '[nearby] 검색 반경 km (기본 5)'
        category:
          type: string
          description: '[search] Windy 카테고리 (mountain, beach, city 등)'
        limit:
          type: integer
          description: 검색 결과 상한 (search 기본 10, nearby 기본 5)
        url:
          type: string
          description: CCTV 스트림 URL
        name:
          type: string
          description: CCTV 이름 (url 대안, 자동 검색)
        save_path:
          type: string
          description: 캡처 저장 경로 (op=capture 시)
        source:
          type: string
          enum:
          - auto
          - windy
          description: 'nearby 공급처: auto(기본 통합검색), windy(Windy 공개 웹캠만)'
