        view:
        - type: card_list
          from: items
          card:
            image: '{cover_url}'
            title: '{title}'
            lines:
            - '{authors}'
            - 내려받기 {download_count|num}회
            link:
              href: '{html_url}'
              label: 원문 읽기 →
  classic:
    returns: items
    side_effect: false    # 전 op 읽기 전용
    fixture: '[sense:classic]{op: "western", query: "plato"}'
    description: 고전 원문 검색 (op 분기). western=서양 고전(Gutenberg), korean=한국 고전(한국고전종합DB).
    group: culture
    target_description: query=검색어. western — Gutenberg(저작권 만료 7만+권), languages·topic·author_year 옵션. korean — 한국고전종합DB(이황·이이 등 원문·번역).
    target_key: op
    router: handler
    tool: classic_op
    ops:
      default: western
      fixture:
        korean: '[sense:classic]{op: "korean", query: "이황"}'
      values:
        western: 서양 고전 원문 (Project Gutenberg)
        korean: 한국 고전 (한국고전종합DB)
    implementation: op 분기. western=tool_gutenberg.search_gutenberg, korean=tool_korean_classics.search_korean_classics.
    keywords:
    - 고전
    - 원문
    - Gutenberg
    - 한국고전
  exhibit:
    aliases:
      query: [keyword]
    returns: items
    fixture: '[sense:exhibit]{query: "미술"}'
    description: 전시·문화행사 검색 (KCISA). 박물관·미술관 행사 위주, 공연은 performance. items 통화 — table 파이프·& 병렬(공연과 동시 검색) 조합.
    group: culture
    target_description: 검색어 또는 키워드 (예 '국립중앙박물관', '미디어아트').
    router: handler
    tool: kcisa_quick_search
    implementation: 한국문화정보원(KCISA) API로 전시/문화행사 검색
    target_key: query   # 정본(2026-08-24 #repair B5) — keyword 는 aliases 로 수용
    app:
      instrument: culture
      mode: 전시
      mode_order: 1
      inputs:
      - key: kw
        type: text
        default: 전시
        placeholder: '전시 키워드 (예: 사진, 현대미술)'
        required: true
      action: '[sense:exhibit]{keyword: "$kw"}'
      view:
      - type: image_grid
        from: items
        image: '{thumbnail}'
        title: '{title}'
        lines:
        - '{place}'
        - '{startDate}~{endDate}'
        - '{area} · {realmName}'

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: culture
    name: Culture & Arts
    description: 공연, 도서, 전시 등 문화 예술 정보 조회 도구. KOPIS API로 공연/박스오피스/공연장 정보를, 도서관 정보나루 API로 도서 검색/인기대출/추천도서 정보를 제공합니다.
    version: 2.0.0
  tools:
  # 2026-07-03 미소유 도구 감사: 죽은 tool.json 항목 14개 제거(kopis_*/library_*/kcisa_search_culture 등).
  # performance_op/book_op/classic_op가 함수 직접 호출로 대체 — handler.py의 해당 elif 분기도 같은 날 제거 완료.
  # data/api_registry.yaml의 동명 휴면 항목(14 tools + kopis/data4library 서비스 블록)도 같은 날 제거 완료.
  - name: kcisa_quick_search
    description: 키워드로 문화 정보를 빠르게 검색합니다.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색어
        rows:
          type: integer
          description: 결과 수
          default: 10
      required:
      - keyword
  - name: performance_op
    description: '공연·공연장 조회 (op 분기) — [sense:performance], KOPIS.

      - op=search (기본): 공연 검색 (연극·뮤지컬·음악회). keyword·genre·region·status·days 옵션.

      - op=venue: 공연장·문화시설 검색. keyword(시설명)·region.

      - op=genres: 장르 코드 목록 (검색 필터용, 파라미터 없음).

      - op=regions: 지역 코드 목록 (검색 필터용, 파라미터 없음).'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: search=공연검색(기본), venue=공연장, genres=장르코드, regions=지역코드
        query:
          type: string
          description: '[search] 공연명 / [venue] 공연장명'
        genre:
          type: string
          description: '[search] 장르 코드 (genres로 조회)'
        region:
          type: string
          description: '[search/venue] 지역 코드 (regions로 조회)'
        status:
          type: string
          description: '[search] 공연상태 (기본 공연중)'
        days:
          type: integer
          description: '[search] 검색 기간(일, 기본 90)'
        facility_id:
          type: string
          description: '[venue] 시설 ID'
        rows:
          type: integer
          description: 결과 수
        page:
          type: integer
          description: 페이지
      required: []
  - name: book_op
    description: '도서 조회 (op 분기) — [sense:book]. 기본=도서관정보나루, source="nl"=국립중앙도서관, source="google"=글로벌·원서(Google Books). 고전 원문은 classic_op.

      - op=search (기본): 도서 검색·조회. title/author/publisher(필드 전용)·keyword(광역)·isbn(+detail=true면 대출통계). source="nl"이면 국립중앙도서관 납본 소장 검색(정보나루에 없는 신간·소부수 출판까지 — "이 책이 존재하나"의 정본).

      - op=recommended: 추천도서 (마니아·다독자 패턴). isbn13·rec_type.

      - op=codes: 분류 코드 목록. code_type=kdc(주제분류) 또는 region(도서관 지역).'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: search=도서검색(기본), recommended=추천도서, codes=분류코드목록
        title:
          type: string
          description: '[search] 제목 전용 검색'
        author:
          type: string
          description: '[search] 저자 전용 검색'
        publisher:
          type: string
          description: '[search] 출판사 전용 검색'
        query:
          type: string
          description: '[search] 광역 검색 (제목+저자+출판사)'
        source:
          type: string
          description: '[search] "nl"=국립중앙도서관 납본 소장 검색 (기본=도서관정보나루 공공도서관 대출분석)'
          enum:
          - nl
        category:
          type: string
          description: '[search, source=nl] 자료 구분 (기본 도서. 학위논문/기사 등, 빈 문자열=전체)'
        region:
          type: string
          description: '[search detail·popular] 지역명 또는 코드 (예 "충북", "11"=서울) — detail 의 소장 도서관 조회는 필수'
        gender:
          type: string
          description: '[popular] 성별 필터 ("남성"/"여성")'
        age:
          type: string
          description: '[popular] 연령대 (예 "40" 또는 "40대" → 40~49세)'
        kdc:
          type: string
          description: '[popular] KDC 주제분류 (예 8=문학)'
        start_date:
          type: string
          description: '[popular] 시작일 YYYY-MM-DD (기본 7일 전)'
        end_date:
          type: string
          description: '[popular] 종료일 YYYY-MM-DD (기본 어제)'
        base_date:
          type: string
          description: '[trending] 기준일 YYYY-MM-DD (기본 어제)'
        isbn:
          type: string
          description: '[search] ISBN 조회'
        detail:
          type: boolean
          description: '[search] isbn과 함께 true면 상세·대출통계'
        isbn13:
          type: string
          description: '[recommended] 기준 도서 ISBN13'
        rec_type:
          type: string
          enum:
          - mania
          - reader
          description: '[recommended] mania(기본)/reader'
        code_type:
          type: string
          enum:
          - kdc
          - region
          description: '[codes] kdc 또는 region'
        rows:
          type: integer
          description: 결과 수
      required: []
  - name: classic_op
    description: '고전 원문 검색 (op 분기) — [sense:classic].

      - op=western (기본): 서양 고전 원문 (Project Gutenberg, 저작권 만료 7만+권). query·languages·topic·author_year_start/end.

      - op=korean: 한국 고전 (한국고전종합DB, 이황·이이 등 원문·번역). query·rows.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: western=Gutenberg 서양고전(기본), korean=한국고전종합DB
        query:
          type: string
          description: 검색어 (제목·저자·주제)
        languages:
          type: string
          description: '[western] 언어 (기본 en)'
        topic:
          type: string
          description: '[western] 주제'
        author_year_start:
          type: integer
          description: '[western] 저자 생존연도 시작'
        author_year_end:
          type: integer
          description: '[western] 저자 생존연도 끝'
        rows:
          type: integer
          description: '[korean] 결과 수 (기본 10)'
      required: []
