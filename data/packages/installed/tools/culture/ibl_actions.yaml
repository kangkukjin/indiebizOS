node: sense
actions:
  performance:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      query: [keyword]
    # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
    #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
    #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
    params:
      query: string
      date_from: string
      date_to: string
    returns: items
    side_effect: false    # 전 op 읽기 전용
    fixture: '[sense:performance]{}'
    description: 공연·공연장 조회 (op 분기, KOPIS). 전시는 exhibit, 도서는 book. items 통화 — table:take·table:document 파이프로 추리고 문서화.
    group: culture
    target_description: search — query(공연명/키워드)·genre·region·status·date_from/date_to(날짜 범위, 둘 함께 입력)·days(날짜 생략 시 오늘부터 N일) 옵션. venue — query(공연장명, 예 '예술의전당')·region. genres/regions — 파라미터 없음(필터 코드 목록). KOPIS 오류 XML이나 점검 HTML은 검색 0건으로 취급하지 않고 명시적 오류로 반환한다.
    target_key: op
    router: handler
    tool: performance_op
    ops:
      default: search
      fixture:
        venue: '[sense:performance]{op: "venue", query: "예술의전당"}'
        genres: '[sense:performance]{op: "genres"}'
        regions: '[sense:performance]{op: "regions"}'
      values:
        search: 공연 검색 (연극·뮤지컬·음악회, 기본)
        venue: 공연장·문화시설 검색
        genres: 장르 코드 목록 (검색 필터용)
        regions: 지역 코드 목록 (검색 필터용)
    implementation: KOPIS(한국공연예술센터) API op 분기. search=search_by_keyword, venue=get_facilities, genres=get_genre_list, regions=get_region_list.
    keywords:
    - 공연
    - 연극
    - 뮤지컬
    - 공연장
    app:
      instrument: culture
      icon: 🎭
      name: 문화공연
      order: 3
      mode: 공연
      mode_order: 0
      inputs:
      - key: region
        type: select
        label: 전체 지역
        options_action: '[sense:performance]{op: "regions"}'
        options_from: regions
        option_value: code
        option_label: name
      - key: genre
        type: select
        label: 전체 장르
        options_action: '[sense:performance]{op: "genres"}'
        options_from: genres
        option_value: code
        option_label: name
      - key: kw
        type: text
        placeholder: 공연명 키워드(선택)
      action: '[sense:performance]{genre: "$genre", region: "$region", keyword: "$kw"}'
      view:
      - type: image_grid
        from: items
        empty_from: message
        image: '{poster}'
        title: '{prfnm}'
        lines:
        - '{fcltynm}'
        - '{prfpdfrom}~{prfpdto}'
        - '{area} · {prfstate}'
  exhibit:
    aliases:
      query: [keyword]
    returns: items
    fixture: '[sense:exhibit]{query: "미술"}'
    description: 전시·문화행사 검색 (KCISA). 박물관·미술관 행사 위주, 공연은 performance. items 통화 — table 파이프·& 병렬(공연과 동시 검색) 조합.
    group: culture
    target_description: 검색어 또는 키워드 (예 '국립중앙박물관', '미디어아트').
    router: handler
    tool: kcisa_quick_search
    implementation: 한국문화정보원(KCISA) API로 전시/문화행사 검색
    target_key: query   # 정본(2026-08-24 #repair B5) — keyword 는 aliases 로 수용
    app:
      instrument: culture
      mode: 전시
      mode_order: 1
      inputs:
      - key: kw
        type: text
        default: 전시
        placeholder: '전시 키워드 (예: 사진, 현대미술)'
        required: true
      action: '[sense:exhibit]{keyword: "$kw"}'
      view:
      - type: image_grid
        from: items
        image: '{thumbnail}'
        title: '{title}'
        lines:
        - '{place}'
        - '{startDate}~{endDate}'
        - '{area} · {realmName}'

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).

tool_json:
  header:
    id: culture
    name: 공연·전시
    description: KOPIS 공연·공연장과 KCISA 전시·문화행사를 조회합니다.
    version: 2.1.0
  tools:
  - name: performance_op
    description: '공연·공연장 조회 (op 분기) — [sense:performance], KOPIS.

      - op=search (기본): 공연 검색 (연극·뮤지컬·음악회). query·genre·region·status·date_from·date_to·days 옵션.

      - op=venue: 공연장·문화시설 검색. keyword(시설명)·region.

      - op=genres: 장르 코드 목록 (검색 필터용, 파라미터 없음).

      - op=regions: 지역 코드 목록 (검색 필터용, 파라미터 없음).'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: search=공연검색(기본), venue=공연장, genres=장르코드, regions=지역코드
        query:
          type: string
          description: '[search] 공연명 / [venue] 공연장명'
        genre:
          type: string
          description: '[search] 장르 코드 (genres로 조회)'
        region:
          type: string
          description: '[search/venue] 지역 코드 (regions로 조회)'
        status:
          type: string
          description: '[search] 공연상태 (기본 공연중)'
        days:
          type: integer
          description: '[search] 날짜 범위를 생략했을 때 오늘부터 검색할 기간(일, 기본 90)'
        date_from:
          type: string
          description: '[search] 검색 시작일 YYYY-MM-DD (date_to와 함께 입력)'
        date_to:
          type: string
          description: '[search] 검색 종료일 YYYY-MM-DD (date_from과 함께 입력)'
        facility_id:
          type: string
          description: '[venue] 시설 ID'
        rows:
          type: integer
          description: 결과 수
        page:
          type: integer
          description: 페이지
      required: []
  - name: kcisa_quick_search
    description: 키워드로 문화 정보를 빠르게 검색합니다.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색어
        rows:
          type: integer
          description: 결과 수
          default: 10
      required:
      - keyword
