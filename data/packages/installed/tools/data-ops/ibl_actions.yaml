node: table
actions:
  filter:
    # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
    #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
    #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
    params:
      field: string
      value: [string, number, boolean]
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — items에서 조건(where)에 맞는 것만 남긴다(부분집합·비파괴).
    target_description: 'where(필터 조건): 문자열 "필드 op 값"(op=기호 >= <= > < == != · 워드 contains/in/matches/startswith/endswith/eq/ne/lt/le/gt/ge — 예 "아파트명 matches 자이") · 연산자 없는 문자열은 전 필드 부분일치(예 "전세") · {field, op, value} 구조형 · {열:값} 단축형 · 조건 배열(AND). 모르는 op 은 정직 거절(침묵 == 폴백 없음). >> 파이프로 앞 통화를 자동 수용. 도메인 무관 — 모든 검색·목록 생산자에 적용.'
    group: transform
    router: handler
    tool: data_filter
    implementation: data-ops handler.py — items(또는 표형 table 입력)에서 where 미니 DSL로 부분집합. 비파괴(같은 형태 반환).
    target_key: where
    keywords:
    - 필터
    - 거르기
    - 조건
    - 만
    - filter
  sort:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — items를 기준 필드(by)로 정렬(수치 인식, desc 옵션).
    target_description: 'by(정렬 기준 필드/열명, 필수) · desc(내림차순 bool, 기본 false). 숫자는 수치로, 아니면 문자열로 비교. 예: [...] >> [table:sort]{by: price, desc: true}.'
    group: transform
    router: handler
    tool: data_sort
    implementation: data-ops handler.py — records|table을 by 키로 정렬(_sort_key 수치 우선). 비파괴.
    target_key: by
    keywords:
    - 정렬
    - 순
    - 정렬하기
    - sort
    - 순서
  take:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — items에서 상위 n개만(음수면 뒤에서 n). 보통 sort 뒤.
    target_description: 'n(취할 개수, 기본 10; 음수=뒤에서 n개). 보통 sort 뒤에 써 상위 N 추출: [...] >> [table:sort]{by:..} >> [table:take]{n:5}.'
    group: transform
    router: handler
    tool: data_take
    implementation: data-ops handler.py — records|table을 n으로 슬라이스. 비파괴.
    target_key: n
    keywords:
    - 상위
    - 개만
    - 처음
    - take
    - top
  select:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — items에서 지정한 열/필드만 남긴다(투영). 차트·문서 전 좁히기.
    target_description: 'columns(남길 열/필드 이름 배열, 필수). 예: [sense:...] >> [table:select]{columns: ["연도","GDP"]}. 표가 넓을 때 차트/문서 전에 좁히기.'
    group: transform
    router: handler
    tool: data_select
    implementation: data-ops handler.py — table 열 투영(인덱스 매핑), records 필드 추림. 비파괴.
    target_key: columns
    keywords:
    - 열
    - 컬럼
    - 투영
    - select
    - 골라
  compute:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — 열끼리 계산해 파생 열 추가(비율·차이·증감률). 받은 숫자를 네가 다시 타이핑하지 말고 이걸로.
    target_description: 'set({새열: "식"} 필수, 여러 열 가능). 식=열 이름(식별자) 또는 col("열 이름(특수문자)") · 숫자 · + - * / // % ** · round/abs/min/max/int/float/len · 비교·조건식(a if c else b). 숫자 문자열("3,500")은 수치로. 없는 열=정직 에러(실제 열 동봉), 0 나눗셈 등=그 행 None + note. 예: [sense:realty]{…} >> [table:compute]{set: {전세가율: "round(보증금 / 매매가 * 100, 1)"}} >> [table:sort]{by: "전세가율", desc: true}. 집계(합·평균)는 groupby.'
    group: transform
    router: handler
    tool: data_compute
    implementation: data-ops handler.py — ast 화이트리스트 식 평가(행별 scope=열 값, 수치 강제), 행→행 파생. 비파괴.
    target_key: set
    keywords:
    - 계산
    - 비율
    - 증감률
    - 파생
    - 곱하기
    - 나누기
    - compute
  rename:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — 열/필드 이름 바꾸기(관계대수 ρ). 소스가 다른 두 통화의 join 전 키 맞추기.
    target_description: 'map({옛이름: 새이름} 딕셔너리, 필수). items·table 둘 다. 없는 이름·이름 충돌=명시 에러(값 무변경·비파괴). 예: [sense:realty]{source: "molit", region: "청주"} >> [table:rename]{map: {"아파트명": "단지명"}} — 이후 join{on: "단지명"} 이 성립.'
    group: transform
    router: handler
    tool: data_rename
    aliases:
      map:
      - columns
    implementation: data-ops handler.py — table 열 이름/records dict 키 재명명. 교환(A↔B) 원자적 허용.
    target_key: map
    keywords:
    - 이름바꾸기
    - 열이름
    - rename
    - 개명
    - 키맞추기
  flatten:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — 행 속 중첩 목록을 펼쳐(unnest) 행들로. each 결과를 한 표로 모으는 출구.
    target_description: 'field(중첩 목록 경로, 기본 "_result" — each 가 행에 붙인 결과 자리. 점 표기 "_result.items" 가능, 값이 {items: [...]} 봉투면 자동 승격) · keep([부모 필드] 배열 — 각 펼친 행에 승계, 충돌 시 _2 접미). 목록 아닌 행은 건너뛰고 skipped_rows 로 신고. 예: ... >> [table:each]{do: "[sense:crawl]{url: \"$it.url\"}"} >> [table:flatten]{} >> [table:document]{}.'
    group: transform
    router: handler
    tool: data_flatten
    implementation: data-ops handler.py — 행별 field 경로에서 목록 추출·concat. items 전용.
    target_key: field
    keywords:
    - 펼치기
    - 중첩
    - flatten
    - unnest
    - 풀기
  dedup:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — items에서 중복 제거(첫 항목 유지, 정규화 비교).
    target_description: by(중복 판정 키 필드/열; 미지정 시 items=title, 표형 table 입력=첫 열). 공백·대소문자 정규화 후 동등 비교. 여러 검색 합친 뒤 중복 제거에. (옛 newspaper 내부 dedup을 전 생산자 공용으로 끌어올림.)
    group: transform
    router: handler
    tool: data_dedup
    implementation: data-ops handler.py — by 키 정규화 후 첫 항목만 유지. 비파괴.
    target_key: by
    keywords:
    - 중복제거
    - 중복
    - 유니크
    - dedup
    - 고유
  since:
    returns: transform
    # 검침 원장(data/table_since.db) 갱신 — 자가점검 순찰·dry-run 이 기준선을 올리면
    # 다음 실사용의 '새 것'이 침묵 소실된다(통화와 안전은 다른 축 — trigger 선례).
    side_effect: true
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자(검침) — 지난 호출 이후 새로 나타난 행만 통과. 모든 items 생산자 × since = 감시자("새 것 있으면 알려줘"), 트리거와 조합하면 정기 감시가 한 문장.
    target_description: 'key(검침 스트림 이름, 필수 — 감시 파이프마다 고유하게) · by(행 식별 필드, 생략=url/id/link/title 자동 선택) · watch(값 변화도 보고할 필드 배열, 예 ["price"] — 변화 행은 _since:"changed"+_since_prev 동반) · peek(true=기준선 안 올리고 미리보기). 첫 실행=기준선만 저장하고 빈 items+note(스팸 방지). 예: [sense:feed]{url:...} >> [table:since]{key:"하다뉴스"}.'
    group: transform
    router: handler
    tool: data_since
    implementation: data-ops handler.py — 스트림(key)별 last-seen 원장(data/table_since.db, 누적·스트림당 5000키 상한) 대조로 new/changed 주석. warehouse_feed seed/new/changed diff 의 통화 변환자 일반화.
    target_key: key
    keywords:
    - 새로운
    - 새 것
    - 새 글
    - 새 매물
    - 변동
    - 지난번 이후
    - since
    - 감시
  groupby:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자 — items를 키 필드로 그룹지어 집계. agg=dict({새열:[op,원본열]}), op=count/sum/avg/min/max. 생략(또는 "count")은 그룹 행수, 명시 count(원본열)는 non-null 관측 수. 숫자 집계는 결측·null·비수치를 제외하며 숫자 관측이 없으면 null.
    target_description: 'by(그룹 키 열, 필수) · agg({새열:[op,원본열]} 또는 {원본열:op}, op=count/sum/avg/min/max; 미지정 또는 agg:"count" = 그룹별 행수, 명시 count(원본열) = 필드의 non-null 관측 수). sum/avg/min/max는 결측·null·비수치를 제외하고 숫자 관측이 없으면 null. ★{원본열:op} 형태의 집계열 이름은 자동 명명 ''op_원본열''(예: {name: count}→count_name) — 하류 sort/select 는 그 이름을 써야 한다. 직접 정하려면 {새열명:[op,원본열]}. 반환 table=[by열, 집계열들]. 예: [...] >> [table:groupby]{by: 지역, agg: {평균가: [avg, 가격]}}.'
    group: transform
    router: handler
    tool: data_groupby
    implementation: data-ops handler.py — table을 by로 그룹핑 후 agg 명세대로 집계(입력 순서 보존). 표형 전용.
    target_key: by
    keywords:
    - 그룹
    - 집계
    - 묶어
    - groupby
    - 통계
  join:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자(이항) — 두 입력을 공통 키(on)로 inner join. 서로 다른 소스를 한 키로 묶어 분석. & 병렬로 공급.
    target_description: 'on(조인 키 이름, 양쪽에 존재, 필수). 표형 table 입력=열 기준, items=필드 기준. null·필드 부재·빈/공백 문자열은 키 없음으로 제외(0·False는 유효 키). 결과=좌측 전체+우측(키 제외, 동명은 _2). 예: [sense:stock]{op: history} & [sense:world_bank]{...} >> [table:join]{on: "연도"}. 두 입력은 & 병렬로 공급 — 가지에 파이프가 필요하면(rename 등) 변수에 담아 left/right 로: $a = [A] >> [table:rename]{...} 후 [table:join]{left: "$a", right: "$b", on: ...}. ★1:N 조인은 왼쪽 값이 N행에 복제된다 — 조인 뒤 sum/avg 는 중복 합산이 되기 쉬우니 집계(groupby)는 조인 전에 하고 결과를 조인할 것.'
    group: transform
    router: handler
    tool: data_join
    implementation: data-ops handler.py — & 병렬 두 입력을 on 키로 inner join(우측 인덱싱, 키 정규화 비교). items·표형 table 입력 모두 지원(같은 형태끼리).
    target_key: true
    keywords:
    - 조인
    - 결합
    - 합쳐
    - join
    - 연결
  union:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자(이항) — 두 입력을 행 결합(이어붙이기). & 병렬로 공급. 중복 제거는 뒤에 >> dedup.
    target_description: '파라미터 없음. 표형 table 입력은 열 이름으로 통합(순서 보존, 한쪽에만 있는 열은 None), items는 단순 concat. 예: [A] & [B] >> [table:union]. items 합치며 중복까지 지우려면 table:merge.'
    group: transform
    router: handler
    tool: data_union
    implementation: data-ops handler.py — & 병렬 두 입력 행 결합(표형 table 입력=열 통합/items=concat). 같은 형태끼리만.
    target_key: ''
    keywords:
    - 행결합
    - 이어붙여
    - union
    - 합집합
    - 세로결합
  merge:
    returns: transform
    runs_on: anywhere
    scope: workspace
    description: 통화 변환자(이항) — 두 입력을 합치되 by 키로 중복 제거. & 병렬로 공급. (단순 이어붙이기는 union.)
    target_description: 'by(선택, 중복 제거 키 필드; 미지정 시 단순 concat). 여러 검색 결과를 한 목록으로 모을 때. 표형 결합은 table:union. 예: [sense:search]{source: "gnews", ...} & [sense:search]{...} >> [table:merge]{by: title}.'
    group: transform
    router: handler
    tool: data_merge
    implementation: data-ops handler.py — & 병렬 두 records concat(+ by 지정 시 정규화 중복 제거). 목록형 전용.
    target_key: by
    keywords:
    - 합치기
    - 모아
    - merge
    - 통합
    - 목록합치기
  structure:
    # 실측 2026-08-24: 방출은 {title, blocks, block_count, items, …} — 이미 통화다.
    # 2026-08-19 스윕이 '정적 3건'으로 지목했으나 모드-조건부 부류로 묶여 유보됐고,
    # 그 뒤 items 가 붙어 조건부가 아니게 됐는데 선언만 남았다. ★fixture 면제(LLM 비용)라
    # 주간 스윕의 측정 우주 밖이었다 — 면제 = 측정 사각.
    returns: items
    ai_call: true  # F14-4 (2026-08-20): 실행마다 경량 LLM 편집자 호출 — dry-run 고지·포털 기본 거부
    exempt: 경량 LLM 편집자 원샷 호출 — 정기 실행 시 토큰 소모·비결정적이라 fixture 부적합 (self:ask 동류)
    runs_on: anywhere
    scope: workspace
    description: 원본 콘텐츠를 문서 IR 한 건(title·blocks 필드를 가진 단일 응답)으로 정리하는 편집자 원자 — 획득→구조화→렌더 파이프라인의 중간. >> [table:document]로 이어 렌더.
    target_description: content(필수, 구조화할 원본 텍스트 — >> 파이프 시 이전 결과를 content로 받아 생략 가능). instruction(선택, 정리 방향 예 "3섹션 요약 보고서로"·"비교는 표로"). 반환에 title·blocks(문서 IR) 포함 — 그대로 table:document로 >> 파이프하면 렌더.
    group: media_produce
    router: handler
    tool: structure_document
    implementation: 경량 LLM 편집자가 콘텐츠를 문서 IR(heading/paragraph/list/table/quote/code/divider) JSON으로 정리. 지어내기 금지·주어진 내용에서만. document emitter의 입력 생산.
    target_key: content
    keywords:
    - 구조화
    - 정리
    - 요약정리
    - 문서화
    - structure
  document:
    returns: effect
    runs_on: anywhere
    aliases:
      filename: [path]   # 모델이 path 로 자주 부름(실험 6 ⑮) — 조용한 무시 대신 filename 규칙(경로부는 기존 note 가 시끄럽게)으로

    description: blocks(문서 구조 배열)·items(단일 통화)·markdown(이미 쓰인 글)을 산출물로 렌더 — 같은 입력을 html/pdf/png/docx/pptx/typst/markdown emitter로. 보고서·문서·페이지·발행글 산출의 단일 진실 소스.
    target_description: 'blocks·items·markdown 중 하나 — blocks(문서 IR 블록 배열) / items(단일 통화 [{title,meta,summary,url}] — 자동으로 cards 블록화, group_by 지정 시 그 필드로 섹션 heading 분할) / markdown(이미 마크다운으로 쓰인 글을 기계 변환, LLM 0·내용 안 고침 — [self:read] 결과를 >> 로 받으면 자동). 각 블록은 {type, ...}:

      - heading{level(1~6), text} · paragraph{text} · list{ordered?, items[]}

      - image{src(경로/URL), caption?} · table{columns, rows}(표형 데이터 그대로 재사용)

      - cards{columns(기본2), items:[{title, meta?, summary?, url?, link_label?}]}(링크 카드 그리드 — 뉴스·검색결과·북마크·상품목록)

      - quote{text, cite?} · code{text, lang?} · divider

      title(선택, 최상단 제목) · meta(선택, 제목 아래 부제/발행정보 한 줄) · theme(default 기본/newspaper 제호+카드그리드)

      · filename(선택 — bare 파일명은 프로젝트 outputs/로, 디렉토리를 적으면 그 자리에(형제 emitter 공통 규약); 확장자는 format 이 정한다) · group_by(선택, items 섹션 분할 필드 예 "query") · format(html 기본/pdf/png/docx/pptx/typst/markdown — 같은 IR을 여러 emitter로).

      결과 산출물 경로(path·file) 반환. markdown 은 md 텍스트도 결과의 markdown 필드로 반환(>> [others:publish] 로 바로 발행 가능). 단일 IR → 다중 emitter. typst=책 품질 조판 PDF(산문·보고서에 최적, HTML theme/cards 그리드는 무시). pptx는 문서 구조를 슬라이드로 투영(heading=새 슬라이드) — 시각 레이아웃 슬라이드가 필요하면 [self:slide]{op:"create"} 를 쓸 것.

      '
    group: media_produce
    router: handler
    tool: render_document
    implementation: 포맷 중립 문서 IR을 emitter로 렌더 — html(_doc_blocks_to_html)·pdf/png(Playwright 동일 HTML)·docx(_doc_blocks_to_docx, python-docx)·pptx(_doc_blocks_to_pptx, python-pptx 슬라이드 투영). table 블록은 표형 {columns,rows} 재사용. 단일 IR → 다중 emitter.
    target_key: blocks
    keywords:
    - 문서
    - 보고서
    - document
    - 리포트
    - 페이지

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: data-ops
    name: Data Ops (통화 변환자)
    description: 통화→통화 변환 동사(currency algebra). 생산자가 내는 공유 통화(records 목록형 / table 표형)를 받아 같은 통화로 변환 — filter/sort/take/select/dedup/groupby.
      >> 파이프로 임의 깊이 조합. 도메인 무관(한 번 짜서 모든 검색·목록 생산자에 곱해짐). + 표준 코어 문서 emitter(table:structure 구조화·table:document 렌더,
      2026-07-03 media_producer에서 이관).
    version: 1.0.0
  tools:
  - name: data_filter
    description: 'records|table → 조건 부분집합. where: 문자열 "필드 op 값"(기호 >= <= > < == != · 워드 contains/in/matches/startswith/endswith/eq/ne/lt/le/gt/ge)
      또는 연산자 없는 문자열(전 필드 부분일치) 또는 {field,op,value} 또는 {열:값} 단축형 또는 조건 배열(AND).
      비교 필드가 없거나 null이면 !=/ne·순서 비교는 불일치(모르는 값을 다름·대소로 단정하지 않음). 모르는 op 은 정직 거절. >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        where:
          type: [string, object, array]
          description: 필터 조건. 문자열("필드 op 값" — 기호 또는 워드 contains/in/matches/startswith/endswith · 연산자 없으면 전 필드 부분일치)·{field,op,value}·{열:값}·배열(AND). 비교 필드의 결측은 !=/ne·순서 비교에서도 불일치.
  - name: data_sort
    description: records|table → 정렬. by(필드/열명, 필수), desc(bool, 기본 false). 수치 인식 정렬. >> 앞 통화를 받음.
    input_schema:
      type: object
      properties:
        by:
          type: string
          description: 정렬 기준 필드/열 이름.
        desc:
          type: boolean
          description: 내림차순 여부(기본 false).
        order:
          type: string
          description: desc 의 값-해석 별칭 — "desc"=내림차순, "asc"=오름차순 (desc 키가 우선).
      required:
      - by
  - name: data_take
    description: records|table → 상위 n개. n(기본 10). 음수면 뒤에서 n개. >> 앞 통화를 받음.
    input_schema:
      type: object
      properties:
        items:
          type: array
          description: 자를 행 배열(앞 통화 대신 직접 줄 때).
        n:
          type: integer
          description: 취할 개수(기본 10). 음수=뒤에서 n개.
  - name: data_select
    description: table → 열 투영(남길 columns만). records면 해당 필드만 추림. columns(필수). >> 앞 통화를 받음.
    input_schema:
      type: object
      properties:
        fields:
          type: array
          description: 남길 필드 이름 배열(columns 의 동의 표기).
        columns:
          type: array
          items:
            type: string
          description: 남길 열/필드 이름 배열.
      required:
      - columns
  - name: data_compute
    description: 'records|table → 열끼리 계산한 파생 열 추가. set({새열: "식"}, 필수) — 식=열 이름·col("열")·숫자·사칙·round/abs/min/max·비교·조건식. 없는 열=명시 에러. >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        set:
          type: object
          description: '{새열: "식"} — 예 {전세가율: "round(보증금 / 매매가 * 100, 1)"}'
      required:
      - set
  - name: data_rename
    description: 'records|table → 열/필드 이름 바꾸기. map({옛이름: 새이름}, 필수). 없는 이름·충돌=명시 에러, 값 무변경. 소스가 다른 두 통화의 join 전 키 맞추기. >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        map:
          type: object
          description: '{옛이름: 새이름} 딕셔너리.'
      required:
      - map
  - name: data_flatten
    description: 'records → 행 속 중첩 목록 펼치기(unnest). field(경로, 기본 "_result"), keep(각 행에 승계할 부모 필드 배열). each 출력의 _result 를 한 표로 모을 때. >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        field:
          type: string
          description: 중첩 목록 경로(점 표기, 기본 "_result"). 값이 {items:[...]} 봉투면 items 자동 승격.
        keep:
          type: array
          items:
            type: string
          description: 각 펼친 행에 승계할 부모 필드 이름들(충돌 시 _2 접미).
  - name: data_dedup
    description: records|table → 중복 제거(첫 항목 유지). by(키 필드/열, records 기본 title·table 기본 첫 열). 정규화 후 비교. >> 앞 통화를 받음.
    input_schema:
      type: object
      properties:
        by:
          type: string
          description: 중복 판정 키 필드/열(미지정 시 records=title, table=첫 열).
  - name: data_since
    description: 'records → 지난 호출 이후 새 행만(검침). 첫 호출=기준선 저장+빈 결과(note). 새 행=_since:"new", watch 필드 변화 행=_since:"changed"(+_since_prev). >> 앞 통화를 받음.'
    input_schema:
      type: object
      properties:
        items:
          type: array
          description: 검침할 행 배열(앞 통화 대신 직접 줄 때).
        key:
          type: string
          description: 검침 스트림 이름(감시 파이프마다 고유, 필수).
        by:
          type: string
          description: 행 식별 필드(생략=url/id/link/title 자동 선택).
        watch:
          type: array
          description: 값 변화도 보고할 필드 이름 배열(예 ["price"]).
        peek:
          type: boolean
          description: true=기준선 안 올리고 미리보기.
      required:
      - key
  - name: data_groupby
    description: table → 그룹 집계. by(그룹 키 열, 필수), agg({새열:[op,원본열]} 또는 {원본열:op}, op=count/sum/avg/min/max).
      미지정 또는 agg:"count"는 그룹 행수, 명시 count(원본열)는 non-null 관측 수. 숫자 집계는 결측·null·비수치를 제외하며 숫자 관측이 없으면 null. >> 앞 table 통화를 받음.
    input_schema:
      type: object
      properties:
        by:
          type: string
          description: 그룹 키 열 이름.
        agg:
          type: object
          description: 집계 명세. {새열:[op,원본열]} 또는 {원본열:op}. 명시 count는 non-null 수, 숫자 집계는 무관측이면 null.
      required:
      - by
  - name: data_join
    description: 'table×table 또는 items×items → 키 열로 inner join. on(양쪽 공통 키 열, 필수). null·필드 부재·빈/공백 문자열은 키 없음으로 제외(0·False는 유효 키). 결과 열=좌측 전체+우측(키 제외). & 병렬 두 입력, 또는 left/right 에 직접(변수 참조 가능). 예: [A] & [B] >> [table:join]{on:"연도"}.'
    input_schema:
      type: object
      properties:
        'on':
          type: string
          description: 조인 키 열/필드 이름(양쪽 통화에 존재). null·부재·빈 문자열 키는 제외.
        left:
          description: '좌측 입력 통화(& 병렬 대신 직접 공급 — $변수 참조 가능).'
        right:
          description: '우측 입력 통화(& 병렬 대신 직접 공급 — $변수 참조 가능).'
      required:
      - 'on'
  - name: data_union
    description: 두 table(또는 두 records)을 행 결합. 같은 통화끼리. table은 열 이름으로 통합(순서 보존), records는 concat. & 병렬 두 입력. 중복 제거는 뒤에 >> dedup.
    input_schema:
      type: object
      properties: {}
  - name: data_merge
    description: 두 records를 합침(concat). by 지정 시 그 키로 중복 제거. 여러 검색 결과를 한 목록으로. & 병렬 두 입력. (표형 결합은 union.)
    input_schema:
      type: object
      properties:
        by:
          type: string
          description: 중복 제거 키 필드(미지정 시 단순 concat).
  - name: render_document
    description: '문서 IR(공유 문서 모델)을 산출물로 렌더 — [table:document]. 포맷 중립 IR을 여러 emitter로(html/pdf/png/docx/pptx/typst).

      blocks(필수): 블록 배열. 타입 — heading{level,text}/paragraph{text}/list{ordered?,items[]}/image{src,caption?}/table{columns,rows}(데이터
      통화 재사용)/cards{columns?,items[]}/quote{text,cite?}/code{text,lang?}/divider.

      title(선택), meta(선택), theme(선택), filename(선택), format(기본 html).

      ## 예시

      - render_document(title="보고서", blocks=[{"type":"heading","level":2,"text":"요약"},{"type":"paragraph","text":"..."},{"type":"table","columns":["항목","값"],"rows":[["매출",100]]}])'
    input_schema:
      type: object
      properties:
        blocks:
          type: array
          description: 문서 IR 블록 배열 (각 블록 {type, ...}). blocks/items/markdown 중 하나.
          items:
            type: object
        markdown:
          type: string
          description: 마크다운 텍스트 입구 — 이미 글로 존재하는 문서(보고서·신문·블로그 글)를 그대로 렌더. 기계 변환이라 LLM 0(내용을 고쳐 쓰지 않음). >> 파이프로 앞 단계가 준 텍스트(예 [self:read])도 자동 수용.
        title:
          type: string
          description: 문서 제목 (선택, 최상단 h1)
        filename:
          type: string
          description: 출력 파일명·경로 (선택, 기본 document). bare 파일명은 프로젝트 outputs/로, 디렉토리를 적으면 그 자리에(형제 emitter 공통 규약). 확장자는 format 이 정한다.
        meta:
          type: string
          description: 제목 아래 부제/발행정보 한 줄 (선택)
        theme:
          type: string
          description: HTML 테마 (선택, default/newspaper)
        format:
          type: string
          enum:
          - html
          - pdf
          - png
          - docx
          - pptx
          - typst
          - markdown
          default: html
          description: '출력 포맷: html(기본)/pdf/png(동일 HTML을 Playwright 렌더)/docx/pptx(문서 IR을 사무 포맷으로 투영)/typst(책 품질 조판 PDF).'
      required: []
  - name: structure_document
    description: '원본 콘텐츠를 문서 IR(blocks)로 구조화 — [table:structure]. LLM 편집자가 내용을 heading/paragraph/list/table/quote/code/divider
      블록으로 정리. render_document로 이어 렌더(>> 파이프 지원: 이전 텍스트 결과를 content로 받음).

      content(필수): 원본 텍스트. instruction(선택): 정리 방향(예 "3섹션 요약 보고서로").

      ## 예시

      - structure_document(content="...긴 글...", instruction="핵심만 요약 보고서로")'
    input_schema:
      type: object
      properties:
        content:
          type: string
          description: 구조화할 원본 텍스트 (필수, >> 파이프 시 생략 가능)
        instruction:
          type: string
          description: 정리 방향 (선택, 예 "3섹션으로"·"표 위주로")
