node: sense
actions:
  entity:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [max_results]
      query: [q, name]  # 기존 핸들러가 받던 이름 별칭도 독립 묶음에 선언한다.
      id: [qid]
    returns: items
    side_effect: false    # 전 op 읽기 전용
    fixture: '[sense:entity]{query: "이순신"}'
    description: 개체 해소·구조화된 사실 (op 분기, Wikidata 지식 그래프). 동명이인·동음이의를 QID로 못박고 속성·사실을 구조화. 일반 인물/뉴스는 search(웹 검색), 국내 연구자는 researcher.
    target_description: "op로 분기 (기본 resolve).\n- resolve: query(필수) + lang(기본 ko) + max_results → 후보 개체별 QID·라벨·설명. 동명이인/동음이의 해소(예 '이순신'=여러 인물). QID는 개체를 못박는 신원자.\n- detail: id(QID 예 Q42) 또는 query → 구조화된 속성·사실(출생·직업·소속 등, 속성:값 records). query만 주면 최상위 후보로 자동 해소.\n"
    target_key: op
    group: research
    router: handler
    tool: entity_op
    ops:
      default: resolve
      fixture:
        detail: '[sense:entity]{op: "detail", id: "Q42"}'
      values:
        resolve: 개체 후보 검색 (query→QID·라벨·설명, 동명이인/동음이의 분리)
        detail: 구조화된 사실 (QID→속성:값 records)
    implementation: entity-lookup 패키지. Wikidata Action API — resolve=wbsearchentities, detail=wbgetentities(claims 라벨 해소). source 기본 wikidata(무API키).
    keywords:
    - 개체
    - 위키데이터
    - wikidata
    - 동명이인
    - 동음이의
    - 신원
    - 개체해소
    - QID

tool_json:
  header:
    id: entity-lookup
    name: 개체 식별
    description: Wikidata에서 동명이인·동음이의를 식별하고 개체의 사실을 조회합니다.
    version: 1.0.0
  tools:
  - name: entity_op
    description: '개체 해소·구조화된 사실 (op 분기) — [sense:entity]. Wikidata 지식 그래프. 동명이인·동음이의를 QID로 못박음. 일반 인물 OSINT는 search(웹 검색), 국내 연구자는 researcher_op.

      - op=resolve(기본): query(필수) + lang(기본 ko) + max_results → 후보별 QID·라벨·설명. 동명이인/동음이의 분리.

      - op=detail: id(QID 예 Q42) 또는 query → 구조화된 속성·사실(출생·직업·소속 등). query만 주면 최상위 후보 자동 해소.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: resolve(기본)/detail
        source:
          type: string
          enum:
          - wikidata
          default: wikidata
          description: 지식 그래프. 현재 wikidata(무API키)만 지원.
        query:
          type: string
          description: '[resolve/detail] 개체명·검색어 (예 "이순신")'
        id:
          type: string
          description: '[detail] Wikidata QID (예 Q42). resolve로 먼저 획득.'
        lang:
          type: string
          description: 라벨 언어(기본 ko, 없으면 en 폴백)
          default: ko
        limit:
          type: integer
          description: '[resolve] 최대 후보 수(기본 7)'
      required: []
