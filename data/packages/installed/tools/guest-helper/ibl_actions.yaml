task_kinds:
  guestpc: "handler:task_status"   # ③ 접수증 어댑터 — [self:task] 가 적재(cancel = task_status_cancel)

nodes:
  limbs:
    actions:
      guestpc:
        params:
          mode: string
          env: object
          request_id: string
          action: string
          local_path: string
          transfer_id: string
          url: string
          volume: number
          mac: string
          broadcast: string
          relay: string
          cursor: integer
        aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
          limit: [display]
          job: [job_id]      # shell 응답 필드명 그대로 되넣는 관습어
        returns: effect   # effector — 셸/파일을 남의 PC 에서 실행(부작용). effect 는 자가점검이 자동 실행하지 않는다.
        description: USB·상주 PC 헬퍼(손발)가 붙은 게스트 PC 에서 셸·파일 작업 + 화면 보기 실행 (op 분기) — 허브에서 명령을 내려보낸다. 데스크톱 자기 조작은 limbs:screen, 폰은 limbs:android.
        target_description: '상세 절차·등록 관용구는 guest_helper.md. limb에 대상 이름/device_id를 명시한다. self:limb list의 registration이 있으면 상주형이다. shell(cmd,cwd,timeout,shell,stdin): Windows cmd 또는 powershell, mac/Linux sh. 상주형은 매 작업의 cwd·env가 분리되므로 절대 cwd·명시 env·venv 실행 경로를 쓴다. 휴대형만 cwd·환경변수를 이어 쓰며 reset:true로 초기화한다(함수·별칭 유지 안 됨). 긴 명령은 background:true로 접수증(task_ref)을 받고 self:task wait/status로 관측한다. 상주형 request_id는 동일 명령의 중복 접수를 막고 동기 결과도 반복 회수한다. 상주 shell 기본 timeout은 동기·배경 모두 1800초다. 새 헬퍼는 info/list/read/screen을 별도 확인 자리 1개에서 실행한다. 짧은 확인 셸은 mode:observe와 timeout:1..10을 명시하며 일반 작업 2개와 독립이다(읽기 전용 보안 보장은 아님). 대기 종료·결과 불명은 재전송 사유가 아니다. info는 OS·권한·셸·도구·GUI 환경, list(path)는 폴더 목록, read(path)는 텍스트 200KB 상한(offset·limit 없음, 큰 파일은 transfer receive→collect), write(path,content)는 파일 쓰기. transfer(action:send|receive|collect,local_path,path,request_id,transfer_id)는 상주 바이너리 전송; receive 완료 뒤 collect로 중앙 저장. 같은 요청ID는 실패도 그대로 회수한다. 전송 실패 종료 확인 후 새 요청ID와 기존 transfer_id로 재개한다. 진행 중·결과 미확인에는 새 요청ID를 만들지 않는다. 다른 내용의 기존 파일은 덮어쓰지 않는다. media(volume:0..100 선택, path 또는 url,mode:background 오디오/interactive 영상·사진,timeout)는 상주 재생 접수; 실제 재생 증명은 별도. cancel(job)은 취소 요청이며 실제 종료는 self:task로 확인한다. wake는 저장된 경로로 신호 전송; mac/broadcast/relay를 주면 경로만 설정. relay는 대상 LAN의 켜진 PC 또는 같은 LAN의 central이다. 신호 전송은 준비 완료가 아니다. history(limb,job,cursor)는 상주 작업·이벤트 페이지이며 실패 원문을 보존한다. history는 이미지 b64를 생략하고 image_task_ref로 원본 조회를 안내한다. history.tasks와 작업 관측은 성공·실패·취소 모두 started_at·ended_at·seconds·outcome을 제공한다. outcome:timeout은 명령 제한시간 종료이며 timed_out은 조회 대기 종료다. 출력 파이프가 열린 채 명령이 정상 종료하면 exit:0과 output_incomplete·warning을 반환한다. 백그라운드 자식은 입출력을 파일과 /dev/null로 돌리고 재접수 전에 생존을 확인한다. 상주형 progress는 최근 5건 미리보기이며 전문은 history cursor로 조회한다. 셸 결과는 output이다. 휴대형 progress.tail 및 stdout/stderr와 구분한다. result(job)은 휴대형 호환 1회 회수이므로 반복 관측은 self:task. screen(max_width,format,display)과 click/move/type/key/scroll/drag는 상주형에서 mode:interactive 필수. 동기 screen 대기 종료는 촬영 취소를 요청하며 task_ref로 종료를 확인한다. 단색 캡처는 image_observation:uniform과 warning을 반환하며 원인은 단정하지 않는다. 좌표는 직전 screen 이미지에서 관측한 좌표이며 헬퍼가 배율을 환산한다. 입력은 기본 재캡처(shot:false로 끄기,settle_ms 기본 700); type은 현재 포커스. screen→입력→결과 확인하며 셸로 되는 일은 셸을 쓴다. detach는 휴대형 프로세스 종료만 허용한다. 상주형 작업 후에는 연결을 유지하고 일시 중지는 self:limb pause, 명시적인 등록 해제·제거는 self:limb remove다.'
        group: device
        target_key: op
        router: handler
        tool: guestpc_op
        scope: system
        runs_on: pc_only   # 허브(데스크톱)에서 실행 → 손발로 하달. 폰/손발 자신은 이 액션의 주체가 아니다.
        ops:
          default: shell
          side_effect:
            read: false
            list: false
            info: false
            # screen 은 안 푼다 — 허브가 캡처를 outputs/limb_screens/ 에 적재한다(파일 생성).
            history: false
            result: false
          returns:
            read: scalar
            list: scalar
            info: scalar
            history: scalar
            result: scalar
          exempt:
            read: 'USB 손발(게스트 PC) 연결 의존 — 안 꽂힌 날마다 거짓 실패 (others:ask 동류)'
            list: 'USB 손발(게스트 PC) 연결 의존 — 안 꽂힌 날마다 거짓 실패 (others:ask 동류)'
            info: 'USB 손발(게스트 PC) 연결 의존 — 안 꽂힌 날마다 거짓 실패 (others:ask 동류)'
            history: '상주 PC 등록·기록 의존'
            result: 'USB 손발(게스트 PC) 연결 의존 — 안 꽂힌 날마다 거짓 실패 (others:ask 동류)'
          values:
            shell: 셸 명령 실행 (상주형 cwd·env 분리, 휴대형 환경 유지. 긴 명령은 background:true)
            read: 게스트 PC 파일 읽기 (path, 200KB 상한)
            write: 게스트 PC 파일 쓰기 (path + content)
            list: 게스트 PC 디렉토리 목록 (path, 생략 시 현재)
            info: 그 PC 신상 — os·버전·권한·PATH·셸·패키지매니저·GUI·해상도
            screen: 게스트 PC 화면 캡처 — AI 가 그 화면을 직접 본다 (max_width/format/display)
            click: 마우스 클릭 (x, y = 직전 screen 이미지 위 좌표 / button left·right·middle / clicks 2=더블)
            move: 마우스 커서 이동만 (x, y — 호버 확인용. 맥은 cliclick 필요)
            type: 키보드로 텍스트 입력 (text — 현재 포커스된 곳에 들어간다)
            key: 특수키·단축키 (key — return/escape/tab/cmd+s/ctrl+c 등)
            scroll: 스크롤 (direction up·down·left·right, amount, x·y 로 위치 지정 선택)
            drag: 드래그 (x·y 출발 → x2·y2 도착. 맥은 cliclick 필요)
            result: 백그라운드 명령의 결과 회수 (job=작업 ID, 아직이면 중간 출력 progress)
            media: 상주 PC 미디어 재생 접수 (path/url, mode, timeout)
            transfer: 상주 PC 파일 전송 (action send/receive/collect, local_path, path, transfer_id)
            wake: 상주 PC 깨우기 또는 중계 경로 설정 (mac, broadcast, relay)
            history: 중앙에 보존된 상주 PC 작업·이벤트 (limb, job, cursor)
            cancel: 상주 PC 작업 취소 요청 (job)
            detach: 휴대형 헬퍼 프로세스 종료. 상주형은 거절하며 명시적 제거는 self:limb remove
        implementation: 허브 handler가 자격의 registration 유무로 상주/휴대를 분기한다. 상주형은 resident_pcs/resident_store에 요청ID·설치 세대·작업·이벤트를 보존하고 HTTPS/WSS로 전달한다. task_ref와 limb·limb_name·helper_mode·op·request_id를 반환하며 실패·취소·불명은 task 상태로 구분한다. 휴대형은 phone_jobs 롱폴·결과 회신과 cwd/env 세션을 유지한다. 화면은 OS 캡처·입력 API로 처리하고 이미지 봉투를 허브 outputs/limb_screens에 보존한다. transfer는 청크·해시 검증·덮어쓰기 거절을 사용하며 collect는 원자 확정하고 같은 내용의 완료 파일은 재확인한다. detach는 휴대형만 exit를 전달하고 상주형은 제거하지 않는다.
        keywords:
        - 게스트PC
        - 남의PC
        - USB
        - 손발
        - 원격셸
        - 원격PC
        - 파일처리
        - 손발해제
        - 연결해제
        - 원격화면
        - 화면보기
        - 그PC화면
  self:
    actions:
      limb:
        params:
          key: string
          paused: boolean
        aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
          target: [device_id]
        # list op 가 목록을 낸다 — self:switch·self:trigger·self:package 와 같은 부류.
        returns: items
        # ★발급·폐기는 부작용 — 종전엔 returns:effect 가 그 뜻을 겸했다. 통화를 items 로
        # 옮기면서 안전은 선언으로 명시(58ac392의 두 축 분리).
        side_effect: true
        # 자가점검이 발급·폐기를 자동 실행하지 않게 하려던 종전 의도는 fixture 를 읽기 op 로
        # 못박아 그대로 지킨다 — 자동 실행되는 건 list 하나뿐.
        fixture: '[self:limb]{op: "list"}'
        description: USB 손발 자격 원장 관리 (op 분기) — 발급·목록·폐기·승인. USB 에 담아 낯선 PC 에 꽂는 헬퍼의 인가는 허브 로그인 비밀번호가 아니라 여기서 발급하는 limb key. 발급하면 USB 페이로드(헬퍼 설정+안내)를 만들어 경로를 돌려준다.
        target_description: 'register는 outputs/pc-helper 공용 USB 폴더를 준비하고 경로를 돌려준다. OS별 실행파일과 중앙 연결 설정을 함께 USB에 복사하고 대상 PC에서 실행할 때 이름을 정해 등록한다. 같은 USB로 여러 PC를 등록하며 조종실 손발 (USB)에서 목록·해제를 관리한다. 음악·파일·셸 작업은 중앙 AI가 guestpc로 실행한다. remove(target)는 접근을 즉시 차단하고 원격 헬퍼 자체 제거를 요청한다. 오프라인이면 removal_pending, 제거 확인 후 removed. pause(target,paused:true/false)는 새 작업 중지/재개. Android/iPhone/iPad 등록은 아직 지원하지 않는다. op=issue(기본): 새 손발 키 발급 + USB 페이로드 생성 — alias(손발 이름, 명령할 때 이 이름으로 대상 지정)만 정하면 된다. ttl_days(유효기간, 기본 0=무기한)·os(win/mac/linux — 지정 시 그 OS 실행파일만, 기본은 생략=빌드된 전 OS 동봉=휴대용) 선택. neighbor_id(기존 회원 이웃 id)를 주면 **회원 열쇠**로 발급 — 그 이웃에 기기를 결합해 외부 서비스 앱(/m/chat)이 그 사람 주체·레벨로 열린다(기기≠사람: 한 사람이 여러 기기). list: 발급한 손발과 연결 상태. revoke: target(키·device_id·별칭) 폐기(영구 차단). approve: target 을 수동으로 잠그거나(approved=false) 다시 열기 — 붙으면 자동승인이므로 평소엔 불필요, 특정 손발 일시 차단용.'
        group: identity
        target_key: op
        router: handler
        tool: limb_op
        scope: system
        runs_on: pc_only   # 자격 원장·USB 페이로드는 허브(데스크톱)에서 발급.
        ops:
          default: issue
          returns:
            issue: effect
            revoke: effect
            approve: effect
          side_effect:
            list: false
          values:
            register: 공용 USB 헬퍼 폴더 준비 (이름은 대상 PC에서 등록 시 지정)
            remove: 상주 PC 등록 해제·헬퍼 자체 제거 요청 (target)
            pause: 상주 PC 새 작업 중지·재개 (target, paused)
            issue: 새 손발 키 발급 + USB 페이로드 생성 (alias 만 필수, 기본=전 OS·무기한 휴대용)
            list: 발급한 손발 자격과 지금 연결 상태
            revoke: 손발 키 폐기 — 영구 차단 (target = 키·device_id·별칭)
            approve: 손발 수동 잠금/열기 (target, approved) — 자동승인이라 평소 불필요
        implementation: 허브 handler(limb_op) → limb_keys.py 원장(mint/list_keys/revoke/approve). issue 는 public_face.get_public_base() 주소 + 새 키로 outputs/limb_issue/<alias>/indiebiz-helper.json + 안내문을 쓰고, helper/dist 의 빌드된 실행파일을 동봉(os 생략=전 OS, 지정=그 OS 만).
        keywords:
        - 손발발급
        - USB헬퍼
        - limb
        - 손발승인
        - 손발폐기
        - 헬퍼만들기

tool_json:
  header:
    id: guest-helper
    name: Guest PC Helper (USB 손발)
    description: USB로 설치하는 상주 PC 및 휴대형 손발 헬퍼 — 원격 셸·파일 전송·재생·화면 조작. 발급([self:limb])과 조작([limbs:guestpc]).
    version: 1.0.0
  tools:
  - name: guestpc_op
    description: 원격 PC 디스패처. shell/read/write/list/info·screen/입력·transfer/media/wake/history/cancel·result/detach. 상주형은 작업별 환경 분리와 request_id 중복 방지, GUI mode:interactive 필수. 확인 셸은 mode:observe와 timeout:1..10으로 별도 자리에서 실행한다. 긴 작업은 background:true 접수증→self:task 관측. detach는 휴대형만. 상세는 guest_helper.md.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 동작
        limb:
          type: string
          description: 대상 손발 별칭 또는 device_id (여러 개 붙어 있을 때. 하나면 생략)
        cmd:
          type: string
          description: 실행할 셸 명령 (op=shell; win=cmd/c, mac·linux=sh -c)
        cwd:
          type: string
          description: 셸 작업 디렉토리 (op=shell, 선택)
        mode:
          type: string
          description: 상주 실행 모드 background/interactive/observe. observe는 짧은 확인 셸 전용이며 timeout 1~10초를 명시한다(별도 동시 자리 1개, 읽기 전용 강제 아님).
        timeout:
          type: integer
          description: 셸 실행 제한 초 (op=shell, 상주형 기본 1800; 휴대형 동기 120·background 1800)
        shell:
          type: string
          description: 윈도우 셸 선택 cmd/powershell (op=shell, 기본 cmd — mac·linux 는 항상 sh)
        stdin:
          type: string
          description: 명령의 표준입력 (op=shell — 비밀번호·y/n 프롬프트를 기다리는 명령에 미리 물림)
        reset:
          type: boolean
          description: 휴대형 실행 전 세션(기억한 디렉토리·환경) 초기화 (op=shell — venv 벗기·환경 꼬였을 때)
        background:
          type: boolean
          description: true 면 즉시 task_ref·job_id 반환, self:task로 관측 (op=shell — 설치·빌드 등 오래 걸리는 명령)
        job:
          type: string
          description: 결과를 회수할 작업 ID (op=result — shell 응답의 job_id)
        wait:
          type: number
          description: 결과 대기 초 (op=result, 기본 5)
        path:
          type: string
          description: 대상 파일/디렉토리 경로 (op=read/write/list)
        content:
          type: string
          description: 쓸 내용 (op=write)
        max_width:
          type: integer
          description: 캡처 이미지 가로 상한 픽셀 (op=screen, 기본 1280 — 글자가 작으면 1600~1920)
        format:
          type: string
          description: 캡처 형식 png/jpeg/auto (op=screen, 기본 auto — 작으면 PNG, 크면 JPEG)
        quality:
          type: integer
          description: JPEG 품질 1-100 (op=screen, 기본 82)
        limit:
          type: integer
          description: 다중 모니터 인덱스 1부터 (op=screen, 생략 시 전체/주화면)
        x:
          type: integer
          description: 가로 좌표 — ★직전 screen 이 보낸 이미지 위의 좌표 (op=click/move/drag, scroll 은 선택)
        y:
          type: integer
          description: 세로 좌표 — ★직전 screen 이 보낸 이미지 위의 좌표 (op=click/move/drag, scroll 은 선택)
        x2:
          type: integer
          description: 드래그 도착 가로 좌표 (op=drag)
        y2:
          type: integer
          description: 드래그 도착 세로 좌표 (op=drag)
        button:
          type: string
          description: 마우스 버튼 left/right/middle (op=click, 기본 left)
        clicks:
          type: integer
          description: 클릭 횟수 1-3 (op=click, 2=더블클릭)
        text:
          type: string
          description: 입력할 텍스트 — 현재 포커스된 곳에 들어간다 (op=type)
        key:
          type: string
          description: 키 이름·단축키 (op=key — return/escape/tab/space/delete/방향키/cmd+s/ctrl+c)
        direction:
          type: string
          description: 스크롤 방향 up/down/left/right (op=scroll, 기본 down)
        amount:
          type: integer
          description: 스크롤 양 1-50 (op=scroll, 기본 5)
        shot:
          type: boolean
          description: 조작 후 화면 재캡처 (입력 op, 기본 true — 결과를 눈으로 확인)
        settle_ms:
          type: integer
          description: 재캡처 전 대기 밀리초 (입력 op, 기본 700 — 화면이 그려질 짬)
  - name: limb_op
    description: PC 헬퍼 자격 원장. register/list/pause/remove는 상주 PC 관리, issue/revoke/approve는 기존 휴대형 발급·관리 (기본 issue).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 동작
        alias:
          type: string
          description: 손발 이름 (op=issue, 생략 시 자동)
        ttl_days:
          type: integer
          description: 키 유효기간 일수 (op=issue, 기본 14, 0=무기한)
        os:
          type: string
          description: 헬퍼 실행파일 동봉 대상 win/mac/linux (op=issue, 생략 시 빌드된 전 OS 동봉)
        neighbor_id:
          type: integer
          description: 기존 회원(이웃)에 이 손발을 결합 (op=issue — 외부 서비스 앱 회원 열쇠. 새 이웃을 만들지 않고 그 이웃의 body 연락처로 추가, 레벨은 그 사람 것을 상속)
        target:
          type: string
          description: 대상 키·device_id·별칭 (op=revoke/approve)
        approved:
          type: boolean
          description: 승인 여부 (op=approve, 기본 true — false면 승인취소)
