node: engines
actions:
  arch_create:
    description: 새 집 설계 초기화 (부지 크기, 층수 설정)
    group: architecture
    runs_on: pc_only
    returns: scalar
    side_effect: true   # 설계 JSON 파일을 만든다(55회차 B55-1 — 데이터를 돌려주지만 세계를 바꾸는 부류)
    exempt: '설계 세션·저장 상태 의존(빈 몸에선 고정 fixture 불가)'
    category: create
    router: handler
    tool: create_house_design
    implementation: 자체 설계 엔진 — JSON 기반 건축 모델 초기화 (Undo/Redo 지원)
    target_key: name
    keywords:
    - 집설계
    - 건축
    - 초기화
  arch_modify:
    description: 설계 수정 (방, 문, 창, 벽, 계단 등)
    group: architecture
    runs_on: pc_only
    returns: scalar
    side_effect: true   # 설계 JSON 파일을 고친다(55회차 B55-1)
    exempt: '설계 세션·저장 상태 의존(빈 몸에선 고정 fixture 불가)'
    router: handler
    tool: modify_house_design
    implementation: JSON 설계 모델에 방/문/창/벽/계단 추가/수정
    target_key: design_id
    keywords:
    - 설계수정
    - 방
    - 문
    - 창
  arch_get:
    description: 현재 설계 상태 조회
    group: architecture
    runs_on: pc_only
    returns: scalar
    side_effect: false   # 설계 디렉토리 보장(makedirs)만 — 읽기(부작용-정직성 관문 2026-09-06)
    exempt: '설계 세션·저장 상태 의존(빈 몸에선 고정 fixture 불가)'
    category: get
    router: handler
    tool: get_house_design
    implementation: JSON 설계 모델 현재 상태 반환
    target_key: design_id
    keywords:
    - 설계조회
    - 현재상태
  arch_floor_plan:
    description: 2D 평면도 PNG 생성
    group: architecture
    runs_on: pc_only
    returns: effect
    router: handler
    tool: generate_floor_plan
    implementation: matplotlib 로 JSON 모델 기반 2D 평면도 PNG 렌더링
    target_key: design_id
    keywords:
    - 평면도
    - 2D
    - 도면
  arch_view_3d:
    description: 인터랙티브 3D 시각화 HTML 생성 (Three.js 뷰어 — 형상 확인용)
    group: architecture
    runs_on: pc_only
    returns: effect
    router: handler
    tool: generate_3d_view
    implementation: Three.js r164 템플릿에 설계 JSON 주입 → 독립 실행형 HTML
    target_key: design_id
    keywords:
    - 3D
    - 시각화
    - 입체
  arch_report:
    description: 면적표, 건폐율, 물량 산출 보고서
    group: architecture
    runs_on: pc_only
    returns: scalar
    side_effect: false   # 설계 디렉토리 보장(makedirs)만 — 계산·읽기(부작용-정직성 관문 2026-09-06)
    exempt: '설계 세션·저장 상태 의존(빈 몸에선 고정 fixture 불가)'
    router: handler
    tool: generate_quantity_report
    implementation: JSON 모델에서 면적/건폐율/물량 자동 산출
    target_key: design_id
    keywords:
    - 보고서
    - 면적표
    - 건폐율
  arch_section:
    description: 건물 단면도 PNG 생성
    group: architecture
    runs_on: pc_only
    returns: effect
    router: handler
    tool: generate_section_view
    implementation: matplotlib 로 JSON 모델 기반 건물 단면도 PNG 렌더링
    target_key: design_id
    keywords:
    - 단면도
    - 건물
  arch_elevation:
    description: 건물 입면도 PNG 생성 (4방향)
    group: architecture
    runs_on: pc_only
    returns: effect
    router: handler
    tool: generate_elevation_view
    implementation: matplotlib 로 JSON 모델 기반 4방향 입면도 PNG 렌더링
    target_key: design_id
    keywords:
    - 입면도
    - 외관
  arch_export:
    description: 도면을 PDF/SVG/DXF로 출력
    group: architecture
    runs_on: pc_only
    returns: effect
    router: handler
    tool: export_drawing
    implementation: matplotlib PdfPages/SVG/DXF 도면 출력
    target_key: design_id
    keywords:
    - 도면출력
    - PDF
    - DXF
  arch_list:
    description: 저장된 집 설계 목록 조회
    group: architecture
    runs_on: pc_only
    returns: items
    side_effect: false   # 설계 디렉토리 보장(makedirs)만 — 읽기(부작용-정직성 관문 2026-09-06)
    exempt: '설계 저장 디렉토리 상태 의존(빈 몸에선 고정 fixture 불가)'
    category: list
    router: handler
    tool: list_house_designs
    implementation: 설계 저장 디렉토리에서 JSON 파일 목록 조회
    keywords:
    - 설계목록
    - 집설계
