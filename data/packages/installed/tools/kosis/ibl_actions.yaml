node: sense
actions:
  kosis:
    # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
    #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
    #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
    params:
      indicator: string
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      query: [keyword]
      indicator: [indicator_id]
      limit: [count]   # 핸들러도 limit 정본 읽기로 개명 (2026-08-29 구현-읽기 감사 상환)
    returns: items
    fixture: '[sense:kosis]{query: "인구"}'
    description: 통계청 KOSIS. query 검색, indicator(주요지표), org_id+tbl_id(특정 통계표) 분기. items 통화. 자세히 read_guide(query="통계").
    group: research
    target_description: query(검색어) 또는 indicator(주요지표 ID, 빈 문자열이면 전체 목록) 또는 org_id+tbl_id(특정 통계표 데이터). 통계표는 query로 먼저 검색해 org_id/tbl_id 확인 후 조회. 데이터 조회 시 items를 기간 축으로 피벗해 반환(행=period, 필드=지표·분류 조합) → >> [table:chart/spreadsheet] / [table:document](table 블록). ⚠️다차원 통계표는 items 필드가 넓어짐(전 분류×항목) — 차트로 쓰려면 itm_id/obj_l1로 좁힐 것.
    router: handler
    tool: kosis_lookup
    implementation: KOSIS API 통합 — org_id+tbl_id면 get_data(또는 info=true시 get_statistics_info), indicator면 get_indicators, query면 integrated_search.
    target_key: query
    keywords:
    - 통계
    - kosis
    - 통계청
    - 인구
    - GDP
    - 물가
    - 실업률

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: kosis
    name: KOSIS Statistics
    description: 통계청 KOSIS API를 통한 국가통계 조회 도구. 인구, GDP, 물가, 고용 등 공식 통계 데이터를 검색하고 조회합니다. 경제 분석, 시장 조사, 정책 연구에 필요한 신뢰할 수 있는
      국가 통계 제공.
    version: 1.1.0
  tools:
  - name: kosis_lookup
    description: '통계청 KOSIS 국가통계 검색·조회. query는 통합 검색, indicator는 주요지표(GDP·물가·인구·고용 등), org_id+tbl_id는 특정 통계표 데이터(info=true면
      메타).


      파라미터: query(검색어) 또는 indicator(주요지표 ID, 빈 문자열이면 전체 목록) 또는 org_id+tbl_id(특정 통계표 데이터). 통계표는 query로 먼저 검색해 org_id/tbl_id
      확인 후 조회.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 동작 분기 — target_description 참조
        org_id:
          type: string
          description: 통계 작성 기관 ID (예 101=통계청 — query 검색으로 확인)
        tbl_id:
          type: string
          description: 통계표 ID (org_id 와 함께 데이터 조회)
        info:
          type: boolean
          description: true 면 org_id+tbl_id 통계표의 메타정보 조회 (기본 false=데이터)
        itm_id:
          type: string
          description: KOSIS 항목 ID (기본 ALL)
        obj_l1:
          type: string
          description: KOSIS 분류1 코드 (기본 ALL)
        obj_l2:
          type: string
          description: KOSIS 분류2 코드 (기본 ALL)
        obj_l3:
          type: string
          description: KOSIS 분류3 코드 (기본 ALL)
        prd_se:
          type: string
          description: 수록 주기 (Y=년 기본, Q=분기, M=월, D=일)
        start_prd_de:
          type: string
          description: 시작 수록시점 (예 "2020", 월이면 "202001")
        end_prd_de:
          type: string
          description: 종료 수록시점 (start_prd_de 와 같은 형식)
        limit:
          type: integer
          description: 통합 검색 결과 수 (query 검색, 기본 10 — count 별칭 허용)
      additionalProperties: true
