node: self
actions:
  lecture:
    returns: items
    side_effect: true     # 파괴적 op 보유 — 통화(returns)와 안전은 다른 축
    fixture: '[self:lecture]{op: "list"}'
    runs_on: pc_only
    description: 강의 워크스페이스 관리 (op 분기). 생성/조회/로드/삭제/창 열기.
    group: lecture
    target_description: create는 title 필수(+audience/thesis/duration_minutes/design_system 옵션). load/delete/open은 lecture_id 필수(open은 미지정시 목록 화면). delete는 confirm=true 추가.
    target_key: op
    router: handler
    tool: lecture_op
    ops:
      returns:
        create: effect
        delete: effect
        load: effect
        open: effect
      side_effect:
        list: false
      values:
        list: 강의 목록 조회
        create: 새 강의 생성 (title 필수)
        load: 기존 강의 로드 (lecture_id)
        delete: 강의 삭제 (lecture_id + confirm=true)
        open: 강의 창 열기 (lecture_id, 미지정시 목록)
    implementation: handler.py가 op로 분기 — list/create/load/delete/open 내부 함수 호출.
    keywords:
    - 강의 만들기
    - 강의 생성
    - 강의 목록
    - 강의 삭제
    - 강의 열기
    - 강의 워크스페이스
    scope: workspace
  slide:
    returns: effect
    runs_on: pc_only
    description: 슬라이드 한 장의 유일한 어휘 (op 분기). 생성/편집/삭제/필드 패치/재렌더/이미지 부분수정. create 는 lecture_id 없이도 가능 — 스크래치 덱에 자동 등록(구 engines:slide 단발 생성 흡수, 2026-08-05).
    group: lecture
    target_description: create는 instruction 필수 — lecture_id 미지정 시 스크래치 덱(aesthetic 옵션으로 톤 지정 — vintage_book/academic_paper/tech_minimal/magazine_modern/dark_keynote/blueprint, 같은 톤은 같은 스크래치 덱에 모임). layout(선택)=렌더 사다리 스위치 — 미지정=AI 이미지(가장 예쁨) / shadcn 레이아웃(무료·예쁨 — lecture_body·quote·features·pricing 등) / custom(자유 HTML). "가볍게/무료로/가격표로" 같은 요청에 사용. user_image_path(선택)=이 이미지 파일이 **들어간** 슬라이드를 조판(hero_image/content_image/custom 에 임베드, vision 으로 내용도 봄 — 새로 그리는 illustrations 와 다른 축). 나머지 op 는 lecture_id 필수. edit는 slide_id+instruction, delete/rerender는 slide_id, patch는 slide_id+patch(객체), image_edit는 slide_id+instruction(통짜 이미지/이미지 슬라이드만). create/edit/image_edit만 AI 호출.
    target_key: op
    router: handler
    tool: slide_op
    ops:
      values:
        create: 슬라이드 생성 (instruction, AI 호출 — lecture_id 없으면 스크래치 덱에 등록)
        edit: 슬라이드 편집 (slide_id+instruction, AI 호출)
        delete: 슬라이드 삭제 (slide_id)
        patch: 필드 직접 수정 (slide_id+patch, AI 우회)
        rerender: 재렌더링 (slide_id, AI 우회)
        image_edit: 이미지 부분수정 (slide_id+instruction, 통짜 이미지/이미지 슬라이드만 — 다시 그리지 않고 현재 PNG 편집)
    implementation: handler.py가 op로 분기. create/edit/image_edit는 AI 호출, delete/patch/rerender는 AI 우회 (PowerPoint식 직접 편집).
    keywords:
    - 슬라이드 만들기
    - 슬라이드 편집
    - 슬라이드 재렌더
    - 슬라이드 삭제
    - 슬라이드 일부 수정
    - 다음 슬라이드
    scope: workspace
  material:
    returns: effect
    runs_on: pc_only
    description: 강의 재료 관리 (op 분기). 추가/삭제.
    group: lecture
    target_description: 공통 lecture_id 필수. add는 file_path(파일 복사) 또는 text+filename(텍스트 저장), remove는 filename.
    target_key: op
    router: handler
    tool: material_op
    ops:
      values:
        add: 재료 추가 (file_path 또는 text+filename)
        remove: 재료 삭제 (filename)
    implementation: handler.py가 op로 분기. add는 file_path 모드/text 모드 자동 감지.
    keywords:
    - 재료 추가
    - 재료 삭제
    - 원고 추가
    - 자료 추가
    scope: workspace
  deck:
    returns: effect
    runs_on: pc_only
    description: 강의 데크 조작 (op 분기). 슬라이드 순서 변경 / 파일 내보내기 / 나레이션 동영상 렌더.
    group: lecture
    target_description: 공통 lecture_id 필수. reorder는 order(slide_id 배열), export는 format(pdf|pptx). video는 슬라이드 PNG+장별 스피커 노트를 TTS 나레이션 동영상(MP4)으로 — 기본 백그라운드(즉시 반환, 진행=video_state.json·같은 op 재호출로 확인), wait:true=동기. 옵션 voice/rate/transition/bgm_path/output_filename. 노트 없는 장은 무나레이션 씬.
    target_key: op
    router: handler
    tool: deck_op
    ops:
      values:
        reorder: 슬라이드 순서 변경 (order=slide_id 배열, deck.json만 갱신)
        export: 파일 내보내기 (format=pdf|pptx, PIL/python-pptx 합본)
        video: 나레이션 동영상 렌더 (슬라이드 PNG+스피커 노트→TTS→MP4, 기본 백그라운드·wait=동기)
    implementation: handler.py가 op로 분기. reorder는 deck.json만 갱신, export는 PIL/python-pptx로 합본. video는 덱을 scenes/narration_texts 로 조립해 media_producer create_html_video 차용(TTS→씬 길이 자동 맞춤→FFmpeg 합성), lecture_dir/video/ 저장+video_state.json.
    keywords:
    - 슬라이드 순서 변경
    - 강의 내보내기
    - PDF 내보내기
    - PPTX 내보내기
    - 강의 동영상
    - 나레이션 동영상
    scope: workspace

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: lecture_workspace
    name: 강의 만들기 워크스페이스
    description: '강의 슬라이드를 한 장씩 협업으로 만드는 도구. indiebizOS/outputs/lectures/ 밑에 강의별 폴더(deck.json + materials/ + slides/)를 두고,
      별도 Electron 창에서 재료/슬라이드 데크/AI 명령을 한 화면에 보며 작업한다.


      ## IBL 통합 도구 (4개, op 분기)

      - lecture_op {op: list|create|load|delete|open}

      - slide_op {op: create|edit|delete|patch|rerender}

      - material_op {op: add|remove}

      - deck_op {op: reorder|export}


      옛 14개 단일 도구(lecture_create, slide_create 등)도 직접 호출 호환용으로 유지.'
    version: 0.2.0
    author: IndieBiz OS
  tools:
  - name: lecture_op
    description: '강의 워크스페이스 관리 통합 도구. op 파라미터로 분기:

      - list: 강의 목록 조회 (파라미터 없음)

      - create: 새 강의 생성 (title 필수, +audience/thesis/duration_minutes/design_system)

      - load: 강의 데이터 로드 (lecture_id)

      - delete: 강의 폴더 전체 삭제 (lecture_id, confirm=true)

      - open: 강의 만들기 창 열기 (lecture_id 옵션)'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 작업
        lecture_id:
          type: string
          description: 강의 ID (load/delete/open에 필요, open은 옵션)
        title:
          type: string
          description: create — 강의 제목 (한글 가능)
        audience:
          type: string
          description: create 옵션 — 청중
        thesis:
          type: string
          description: create 옵션 — 한 줄 요지
        duration_minutes:
          type: integer
          description: create 옵션 — 분량
        design_system:
          type: string
          description: create 옵션 — vintage_book/academic_paper/tech_minimal/magazine_modern
        confirm:
          type: boolean
          description: delete 필수 — true가 아니면 거부
      required:
      - op
  - name: slide_op
    description: '슬라이드 한 장의 유일한 어휘 — op 파라미터로 분기:

      - create: AI로 슬라이드 한 장 생성 (instruction, +insert_at. lecture_id 미지정 시 스크래치 덱에 자동 등록 — 구 engines:slide 단발 생성 흡수)

      - edit: 슬라이드 AI 재생성 — 현재 spec을 컨텍스트로 (lecture_id, slide_id, instruction)

      - delete: 슬라이드 파일+deck 항목 제거 (lecture_id, slide_id)

      - patch: spec 일부 필드만 직접 patch (AI 호출 없음) (lecture_id, slide_id, patch)

      - rerender: spec 변경 없이 PNG만 재렌더 (AI 호출 없음) (lecture_id, slide_id)'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 작업
        lecture_id:
          type: string
          description: 강의 ID (create 만 선택 — 미지정 시 스크래치 덱. 나머지 op 는 필수)
        slide_id:
          type: string
          description: edit/delete/patch/rerender에 필요
        instruction:
          type: string
          description: create/edit 필수 — 강의자 자연어 요청
        insert_at:
          type: integer
          description: create 옵션 — 삽입 위치 (0-based)
        aesthetic:
          type: string
          description: create+스크래치 덱 전용 — 톤 (vintage_book 기본/academic_paper/tech_minimal/magazine_modern/dark_keynote/blueprint). 같은 톤은 같은 스크래치 덱에 모임. 강의 소속 create 는 덱 design_system 이 우선.
        layout:
          type: string
          description: create 옵션 — 렌더 3단 사다리의 스위치. 미지정=native(AI 통짜 이미지 — 가장 예쁨, 기본). layout 지정 시 그 한 장만 shadcn HTML(무료·빠름) — 구조 레이아웃(hero/lecture_body/metaphor_story/comparison_table/factbox/quote/일러스트형)·마케팅(hero_image/features/stats/testimonial/pricing/cta/content_image/steps)은 shadcn 컴포넌트(예쁨), custom 은 자유 Tailwind HTML(가장 일반·자유).
        patch:
          type: object
          description: patch 필수 — 변경할 필드 객체. None 값은 필드 삭제. layout 키는 거부.
        user_image_path:
          type: string
          description: create/edit 옵션 — 이 이미지 파일이 들어간 슬라이드를 조판. 렌더러가 base64 임베드, vision 으로 내용을 보고 텍스트를 맞춤. 첨부 시 HTML(shadcn) 경로 강제(통짜 이미지는 파일을 못 담음).
      required:
      - op
  - name: material_op
    description: '강의 재료 관리 통합 도구. op 파라미터로 분기:

      - add: 재료 추가 (lecture_id + file_path 또는 text+filename)

      - remove: 재료 삭제 (lecture_id, filename)'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 작업
        lecture_id:
          type: string
          description: 강의 ID (필수)
        file_path:
          type: string
          description: add 모드 1 — 복사할 원본 파일 절대경로
        text:
          type: string
          description: add 모드 2 — 저장할 텍스트 내용 (filename과 함께)
        filename:
          type: string
          description: add 모드 2 또는 remove — 파일명
      required:
      - op
      - lecture_id
  - name: deck_op
    description: '강의 데크 조작 통합 도구. op 파라미터로 분기:

      - reorder: 슬라이드 순서 변경 (lecture_id, order=slide_id 배열). 파일은 안 건드림.

      - export: PDF/PPTX 파일로 내보내기 (lecture_id, format). outputs/lectures/{id}/exports/ 저장.

      - video: 나레이션 동영상 렌더 (lecture_id) — 슬라이드 PNG+장별 스피커 노트를 TTS 나레이션 MP4 로. 기본 백그라운드(즉시 반환, 진행=video_state.json·같은 op 재호출), wait:true=동기. lecture_dir/video/ 저장.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 작업
        lecture_id:
          type: string
          description: 강의 ID (필수)
        order:
          type: array
          items:
            type: string
          description: reorder 필수 — 새 순서의 slide_id 배열 (기존 슬라이드 전체 포함)
        format:
          type: string
          enum:
          - pdf
          - pptx
          - pptx_editable
          description: export 필수 — 출력 형식 (pptx=이미지 슬라이드, pptx_editable=텍스트 편집 가능)
        wait:
          type: boolean
          description: video 옵션 — true=동기(완료까지 블로킹, 수 분). 기본 false=백그라운드.
        voice:
          type: string
          description: video 옵션 — TTS 음성 (기본 ko-KR-SunHiNeural)
        transition:
          type: string
          description: video 옵션 — 씬 전환 (fade 기본/wipeleft/slidedown/dissolve/none 등)
        bgm_path:
          type: string
          description: video 옵션 — 배경음악 파일 경로
        output_filename:
          type: string
          description: video 옵션 — 결과 파일명 (기본 lecture_video.mp4)
      required:
      - op
      - lecture_id
