nodes:
  engines:
    actions:
      tts:
        returns: effect
        runs_on: pc_only
        description: 텍스트를 음성 MP3로 변환 (Edge TTS, 한국어 지원). 동영상 나레이션용.
        target_description: 음성으로 만들 텍스트. voice 옵션으로 화자 선택 (기본 한국어 여성).
        group: media_produce
        router: handler
        tool: create_tts
        implementation: edge-tts(Microsoft Azure TTS)로 텍스트→MP3 변환
        target_key: text
        keywords:
        - speech
        - voice
        - 음성
        - 읽어줘
        - narration
        - text to speech
        - 목소리
        - 텍스트음성
        - TTS
        - 나레이션
      image_gemini:
        aliases:
          output_path: [filename]
        returns: effect
        runs_on: anywhere
        description: Gemini AI 이미지 (Nano Banana 2 기본). style_preset으로 슬라이드 design_system과 일관된 일러스트. 옵션·모델은 read_guide(query="Gemini 이미지").
        target_description: 'prompt (필수). 옵션:

          - style_preset: vintage_book/academic_paper/tech_minimal/magazine_modern (슬라이드 design_system과 매칭, 한글 금지+스타일 토큰 자동 결합)

          - aspect_ratio: 1:1/16:9/9:16/4:3/3:4/1:4/4:1/1:8/8:1

          - image_size: 512/1K/2K/4K (기본 1K)

          - quality: fast(3.1 Flash 기본)/pro(Nano Banana Pro)/legacy

          - output_path, api_key(환경변수 GEMINI_API_KEY 기본)

          '
        group: media_produce
        router: handler
        tool: generate_gemini_image
        implementation: 'Google Gemini API로 프롬프트 기반 AI 이미지 생성. 기본 모델: gemini-3.1-flash-image-preview (Nano Banana 2, 2026-02 출시, 한국어 텍스트 렌더링 개선, 4K까지). 파라미터: prompt(필수), style_preset(vintage_book/academic_paper/tech_minimal/magazine_modern — 슬라이드 design_system과 매칭, 한글 금지+스타일 토큰 자동 결합), aspect_ratio(1:1/16:9/9:16/4:3/3:4/1:4/4:1/1:8/8:1), image_size(512/1K/2K/4K, 기본 1K — 가격 1K $0.045 / 2K 중간 / 4K $0.151), quality(fast=3.1 Flash 기본 / pro=gemini-3-pro-image-preview Pro / legacy=gemini-2.5-flash-image 폴백), model(직접 모델명 지정 시 quality 무시), output_path(선택), api_key(선택, 환경변수 GEMINI_API_KEY 기본)'
        target_key: prompt
        keywords:
        - image generation
        - 이미지 만들기
        - AI 이미지
        - 그림
        - picture
        - 사진생성
        - text to image
        - 이미지생성
        - AI이미지
      icon:
        returns: effect
        runs_on: anywhere
        prompt_hidden: true
        description: 앱 전용 아이콘 생성. 사용자 아이디어를 AI가 귀여운 만화(kawaii/카툰) 스티커 프롬프트로 확장 → Pollinations flux(무료) 저해상도 아이콘 → 미리보기 + 폰이면 클립보드 자동 복사(카톡 붙여넣기).
        target_description: prompt(무엇을 그릴지 짧게, 한국어 가능) 필수. size(정사각 px, 기본 384)·style(스타일 힌트)·copy(폰 클립보드 자동복사, 기본 true) 옵션.
        group: media_produce
        router: handler
        tool: generate_icon
        target_key: prompt
        app:
          instrument: icon
          icon: 🎨
          name: 아이콘
          order: 20
          inputs:
          - key: prompt
            type: text
            label: 무엇을 그릴까요?
            placeholder: 예) 커피 마시는 고양이, 웃는 해
          action: '[engines:icon]{prompt: "$prompt"}'
          view:
          - type: blocks
            from: blocks
      render_html:
        returns: effect
        runs_on: pc_only
        description: AI가 작성한 HTML 조각을 PNG로 렌더 — 미리보기·검증·도식/목업 임베드용(웹 개발 보조 원시 능력). 슬라이드는 self:slide, 동영상은 self:deck{op:video}.
        target_description: 렌더링할 HTML 문자열 또는 경로. 결과 PNG 경로 반환.
        group: media_produce
        router: handler
        tool: render_html_to_image
        implementation: Playwright로 HTML 페이지 렌더링 후 PNG 캡처
        target_key: html
        keywords:
        - HTML
        - 이미지
        - 렌더링
      image_read:
        # 세계를 바꾸지 않는 순수 읽기(Gemini Vision 조회) — 반환은 단일값 → scalar.
        # 구 image_critic(채점)을 op:critic 으로 흡수 (2026-08-05 어휘 중복 압축 —
        # 같은 Gemini Vision, 프레이밍만 달랐다. 변형=op 명명 헌법).
        returns: scalar
        side_effect: false   # 두 op 모두 순수 읽기(Gemini Vision 조회) — 세계를 바꾸지 않는다
        # fixture 대신 면제 — self:ask 선례(LLM 원샷 호출)와 같은 이유.
        exempt: Gemini Vision 유료 호출 + 이미지 경로 인자 의존 — 정기 실행 부적합
        runs_on: anywhere
        scope: workspace
        description: Gemini Vision 이미지 읽기·평가 (op 분기). read(기본)=시각 QA·OCR·자유서술 답변, critic=의도 정합 채점(passed/score/issues/notes).
        target_description: 'image_path(절대 경로 또는 data URI, path 로도 받음) 필수. read — question(무엇을 읽거나 답할지, 생략 시 전체 묘사. query/intent/prompt 로도 받음). critic — intent(무엇을 표현해야 하는가) 필수 + preset(slide_illustration 기본|general)/style_preset/checks(추가 체크 배열) 옵션.'
        group: media_produce
        router: handler
        tool: read_gemini_image
        implementation: Gemini 3 Pro Vision(폴백 2.5 Pro). read=자유서술(temperature=0, 보이는 텍스트/숫자 그대로·추측 금지) / critic=평가(다이어그램형·한글 검출 시 passed=false·빈 공간·객체 명확성·톤 일관성, 반환 verdict_json).
        target_key: op
        ops:
          default: read
          values:
            read: 시각 QA·OCR — 질문에 자유서술로 답함 (question)
            critic: 의도 정합 채점 — passed/score/issues/notes (intent 필수)
        achievement_criteria: read — 보이는 내용을 환각 없이 옮김. critic — JSON 파싱 성공, issues가 구체적, 한글 검출 시 passed=false.
        keywords:
        - 이미지 읽기
        - 스크린샷 읽기
        - OCR
        - 시각 QA
        - 그림 보기
        - vision read
        - image ocr
        - 일러스트 평가
        - VLM
        - critic
        - image evaluation
# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: media_producer
    name: Media Producer
    description: 홍보용 슬라이드 이미지, HTML 기반 MP4 동영상, AI 이미지 생성 도구. HTML+CSS 애니메이션을 Playwright로 녹화하여 동영상을 제작합니다.
    version: 1.0.0
  tools:
  - name: render_html_to_image
    description: 'HTML/CSS 코드를 이미지(PNG)로 렌더링합니다. Playwright 브라우저 엔진을 사용하여 고품질 렌더링을 지원합니다.


      로컬 이미지 사용: base_path를 지정하면 HTML 내 상대 경로 이미지와 CSS background-image가 자동으로 Base64 변환되어 로드됩니다.'
    input_schema:
      type: object
      properties:
        html:
          type: string
          description: 렌더링할 전체 HTML 코드 (CSS 포함 권장)
        output_path:
          type: string
          description: '저장할 파일명 (예: slide.png). 경로는 자동으로 프로젝트 outputs 폴더에 저장됨'
        base_path:
          type: string
          description: 'HTML 내 상대 경로 이미지의 기준 디렉토리. 예: /Users/.../project 지정 시 <img src="images/photo.jpg">가 자동 로드됨'
        width:
          type: integer
          description: '이미지 가로 크기 (기본: 1280)'
          default: 1280
        height:
          type: integer
          description: '이미지 세로 크기 (기본: 720)'
          default: 720
        selector:
          type: string
          description: 특정 요소만 캡처하고 싶은 경우의 CSS 셀렉터 (선택)
      required:
      - html
  - name: generate_gemini_image
    description: 'Google Gemini API로 AI 이미지를 생성합니다. 고품질 이미지 생성에 적합하며, 텍스트 렌더링 성능이 뛰어납니다.


      환경변수 GEMINI_API_KEY를 설정하거나 api_key 파라미터로 전달하세요.


      비율 옵션: 1:1(기본), 16:9, 9:16, 4:3, 3:4'
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: 이미지를 설명하는 텍스트 프롬프트 (영어 권장)
        output_path:
          type: string
          description: '저장할 파일명 (예: cover.png). 경로는 자동으로 프로젝트 outputs 폴더에 저장됨. 지정하지 않으면 자동 생성'
        aspect_ratio:
          type: string
          description: 이미지 비율 (1:1, 16:9, 9:16, 4:3, 3:4)
          default: '1:1'
        api_key:
          type: string
          description: Gemini API 키 (환경변수 GEMINI_API_KEY가 없을 때 사용)
      required:
      - prompt
  - name: generate_icon
    description: 앱 전용 아이콘 생성. 사용자 아이디어를 AI가 전문 아이콘 프롬프트로 확장한 뒤 Pollinations flux(무료)로 저해상도 아이콘을 만들고, 폰에서는 이미지 클립보드에 자동 복사(카카오톡 붙여넣기용).
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: 무엇을 그릴지 짧게 (한국어 가능). AI가 전문 아이콘 프롬프트로 확장.
        size:
          type: integer
          description: 정사각 픽셀 크기 (기본 384, 128~1024)
          default: 384
        style:
          type: string
          description: 추가 스타일 힌트 (선택)
        copy:
          type: boolean
          description: 폰에서 생성 후 이미지 클립보드 자동 복사 (기본 true)
          default: true
      required:
      - prompt
  - name: create_tts
    description: 텍스트를 음성 파일(MP3)로 변환합니다. Edge TTS 사용. 나레이션 생성용.
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: 음성으로 변환할 텍스트
        voice:
          type: string
          description: '목소리 (ko-KR-SunHiNeural: 여성, ko-KR-InJoonNeural: 남성, ko-KR-HyunsuMultilingualNeural: 중성/멀티링구얼)'
          default: ko-KR-SunHiNeural
        rate:
          type: string
          description: '말하기 속도 (예: +0%, -10%, +20%)'
          default: +0%
        pitch:
          type: string
          description: '목소리 톤/피치 (예: +0Hz, -5Hz, +10Hz)'
          default: +0Hz
        output_filename:
          type: string
          description: '저장할 파일명 (예: narration_01.mp3)'
      required:
      - text
  - name: read_gemini_image
    description: Gemini Vision 이미지 읽기·평가 (op 분기). read(기본)=질문에 자유서술로 답함(시각 QA·OCR·검증), critic=의도 정합 채점(JSON {passed, score, issues, notes} + 사람 가독 요약).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 동작 분기 — read(기본) | critic
        image_path:
          type: string
          description: 이미지 절대 경로 또는 base64 data URI (path 로도 받음, 필수)
        question:
          type: string
          description: (read) 무엇을 읽거나 답할지. 생략 시 전체 묘사
        intent:
          type: string
          description: (critic 필수) 이 이미지가 무엇을 표현해야 하는가 — 자연어 설명
        preset:
          type: string
          description: '(critic) 평가 프리셋 — slide_illustration(기본) | general'
        checks:
          type: array
          description: '(critic) 추가 체크 항목 (예: [''다이어그램형인가'', ''오른쪽 1/3이 비어있는가''])'
          items:
            type: string
        style_preset:
          type: string
          description: '(critic) 디자인 시스템 톤 평가 기준 (예: sf_blueprint)'
        api_key:
          type: string
          description: 선택. 미지정 시 GEMINI_API_KEY 환경변수 사용
      required:
      - image_path
