nodes:
  engines:
    actions:
      tts:
        returns: effect
        runs_on: pc_only
        description: 텍스트를 음성 MP3로 변환 (기본 Gemini TTS, 한국어 지원). 동영상 나레이션용.
        target_description: '음성으로 만들 텍스트. engine: gemini(기본, 화자 Charon·style로 연기 지시)
          | edge(무과금, ko-KR-SunHiNeural 등 한국어 3종). voice로 화자 선택.'
        group: media_produce
        router: handler
        tool: create_tts
        implementation: Gemini TTS(기본, interactions API·raw PCM→ffmpeg) 또는 edge-tts(engine:"edge")로 텍스트→MP3 변환
        target_key: text
        keywords:
        - speech
        - voice
        - 음성
        - 읽어줘
        - narration
        - text to speech
        - 목소리
        - 텍스트음성
        - TTS
        - 나레이션
      image_gemini:
        # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
        #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
        #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
        params:
          image_size: string
          input_image: [string, array]
          path: string
          style_preset: string
          quality: string
          model: string
        aliases:
          output_path: [filename]
          input_image: [input_image_path]
        returns: effect
        runs_on: anywhere
        description: Gemini AI 이미지 생성·편집 (Nano Banana 2 기본). input_image에 원본 파일 경로를 주면 그 사진을 prompt 지시대로 편집(인물 보정·배경 교체 등, 나머지 보존). style_preset으로 슬라이드 design_system과 일관된 일러스트. 옵션·모델은 read_guide(query="Gemini 이미지").
        target_description: 'prompt (필수). 옵션:

          - input_image: 편집할 원본 이미지의 절대 경로(문자열 또는 목록) — 주면 생성이 아니라 그 사진을 지시대로 편집(채팅 첨부 사진 경로 그대로 사용 가능, 원본 비율 보존)

          - style_preset: vintage_book/blueprint/architect/ink_orange (슬라이드 design_system과 매칭, 한글 금지+스타일 토큰 자동 결합)

          - aspect_ratio: 1:1/16:9/9:16/4:3/3:4/1:4/4:1/1:8/8:1

          - image_size: 512/1K/2K/4K (기본 1K)

          - quality: fast(3.1 Flash 기본)/pro(Nano Banana Pro)/legacy

          - output_path, api_key(환경변수 GEMINI_API_KEY 기본)

          '
        group: media_produce
        router: handler
        tool: generate_gemini_image
        implementation: 'Google Gemini API로 프롬프트 기반 AI 이미지 생성·편집. 기본 모델: gemini-3.1-flash-image-preview (Nano Banana 2, 2026-02 출시, 한국어 텍스트 렌더링 개선, 4K까지). 파라미터: prompt(필수), input_image(원본 이미지 절대 경로 — 주면 편집 모드: inlineData 로 원본 첨부+최소 편집 프레이밍, aspect_ratio 미지정 시 원본 비율 보존, 결과는 image_data 봉투로 채팅 표시), style_preset(vintage_book/blueprint/architect/ink_orange — 슬라이드 design_system과 매칭, 한글 금지+스타일 토큰 자동 결합), aspect_ratio(1:1/16:9/9:16/4:3/3:4/1:4/4:1/1:8/8:1), image_size(512/1K/2K/4K, 기본 1K — 가격 1K $0.045 / 2K 중간 / 4K $0.151), quality(fast=3.1 Flash 기본 / pro=gemini-3-pro-image-preview Pro / legacy=gemini-2.5-flash-image 폴백), model(직접 모델명 지정 시 quality 무시), output_path(선택), api_key(선택, 환경변수 GEMINI_API_KEY 기본). 구현: gemini_image.py (1500줄 규칙 분리)'
        target_key: prompt
        keywords:
        - image generation
        - 이미지 만들기
        - AI 이미지
        - 그림
        - picture
        - 사진생성
        - text to image
        - 이미지생성
        - AI이미지
        - 사진 편집
        - 사진 보정
        - image edit
        - 이미지 편집
      render:
        # 자기 산출물 지각(2026-08-26) — 구 render_html 을 op:html 로 흡수(변형=op 명명 헌법).
        # 헌법: 이 낱말엔 판단이 없다 — 자기 투영법(렌더링 명세)을 가진 형식의 결정론적
        # 픽셀화만. 데이터→차트 같은 표현 판단은 생성 쪽, 심사는 image_read{op:critic}.
        params:
          path: string
          html: string
          svg: string
          viewports: array
          output_path: string
          base_path: string
          full_page: boolean
          selector: string
          scale: number
          max_pages: integer
          pages: array
          width: integer
          height: integer
          timeout: integer
        returns: items
        side_effect: true
        exempt: 실행마다 PNG 파일 생성(부작용) — 정기 합성 실행 부적합. Playwright 엔진 건강은 scripts/ci_playwright_smoke.py, xlsx 재계산 관문은 backend/test_render_xlsx_contract.py 가 담당.
        runs_on: pc_only
        scope: workspace
        description: 자기 산출물 지각 — 시각 형식(HTML/PDF/SVG/XLSX 장부)을 PNG 스크린샷으로 결정론 투영 (op 분기, 생략 시 path 확장자로 추론). 행=스크린샷 1장이라 `>> [table:each]` 로 장별 critic 심사 파이프 가능. 판단 없음 — 심사는 image_read{op:"critic"}. 슬라이드는 self:slide.
        target_description: 'op: html(기본)/pdf/svg/xlsx — op 생략 시 path 확장자(.pdf/.svg/.xlsx/.xlsm)로 결정론 추론, path 없으면 html. html — path(HTML 파일, file:// 로드라 상대 자산 자연 해소) 또는 html(문자열, base_path 로 로컬 이미지 인라인), 둘 다 생략 시 직전 통화를 렌더(파이프 싱크). viewports(["1280x720" 또는 {width,height,label}] 배열 — 뷰포트별 1행, 웹 검수는 데스크톱+모바일 두 눈 권장) · full_page(기본 true) · selector · scale. pdf — path 필수, 페이지별 1행, scale(기본 2.0≈144dpi) · max_pages(기본 20, 초과는 truncated·total_pages 로 정직 보고) · pages(1-기준 번호 배열). svg — path 또는 svg(문자열), svg 요소 경계로 캡처. xlsx — path(xlsx/xlsm) 필수, LibreOffice 헤드리스로 수식 재계산 후 인쇄 투영(원본 불변·매크로 미실행), pdf 와 같은 페이지 param + timeout(기본 120s), 결과에 pdf_path 동봉 — 계산된 숫자의 텍스트 확인은 [self:read]{path: pdf_path}. viewports 는 xlsx 에 비적용(note 로 알림). 공통 — output_path(파일명 stem). 행마다 prescreen(0층 기계 관측 문자열, ""=깨끗 — html: 콘솔 오류·페이지 예외·요청 실패·빈 화면 / pdf·svg: 빈 화면 / xlsx: +수식 오류 표식) 동봉, 봉투에 prescreen_flagged 수 — critic 에 prescreen: ''$it.prescreen'' 으로 넘기면 걸린 행은 비전 호출 없이 실패 verdict(비용 계층화).'
        group: media_produce
        router: handler
        tool: render_artifact
        implementation: render_artifact.py (1500줄 규칙 분리) — html/svg=Playwright(파일은 file:// 로드, 문자열은 base64 인라인), pdf=PyMuPDF get_pixmap, xlsx=LibreOffice 헤드리스(임시 프로파일에 OOXMLRecalcMode=0 시딩→재계산 PDF→pdf 경로 위임, soffice 부재 시 설치 안내 정직 실패). 행 path 는 절대 경로 — 인지층 GoalEval 시각 수집기가 결과 문자열에서 긁어 자동 검수 루프에 첨부한다.
        target_key: op
        ops:
          default: html
          values:
            html: HTML 파일/문자열/직전 통화 → 뷰포트별 PNG 1행 (V21-1 파이프 싱크 승계)
            pdf: PDF 파일 → 페이지별 PNG 1행 (PyMuPDF, max_pages 상한 정직 보고)
            svg: SVG 파일/문자열 → PNG 1행 (svg 요소 경계 캡처)
            xlsx: XLSX/XLSM 장부 → LibreOffice 재계산 → 페이지별 PNG 1행 (재계산 pdf_path 동봉)
        achievement_criteria: items 각 행의 path 가 실재하는 PNG 절대 경로이고 행 수가 요청(뷰포트 수·페이지 수)과 일치. pdf 상한 초과 시 truncated·total_pages 정직 보고. xlsx — PNG·pdf_path 의 수식 셀 값이 캐시가 아닌 재계산 값(관문 test_render_xlsx_contract)이고 원본 파일 불변, soffice 부재 시 설치 명령을 담은 정직 실패.
        keywords:
        - 렌더
        - 스크린샷
        - 미리보기
        - 검수
        - 투영
        - HTML
        - PDF
        - SVG
        - 장부
        - 엑셀
        - xlsx
        - render
        - screenshot
        - preview
      image_read:
        # vision_read.py(구 gemini_vision)가 코드에서 풀던 별칭을 데이터로(2026-08-23). ★intent 는 제외 —
        # op:critic 의 *정규 키*라 question 으로 접으면 두 자리가 섞인다.
        aliases:
          image_path: [path]
          question: [query, prompt]
        # 세계를 바꾸지 않는 순수 읽기(기어-해소 비전 조회) — 반환은 단일값 → scalar.
        # 구 image_critic(채점)을 op:critic 으로 흡수 (2026-08-05 어휘 중복 압축 — 변형=op
        # 명명 헌법). 2026-08-27 벤더 중립화: 모델은 기어가 단독 결정(vision_read.py).
        returns: scalar
        side_effect: false   # 두 op 모두 순수 읽기(비전 조회) — 세계를 바꾸지 않는다
        # fixture 대신 면제 — self:ask 선례(LLM 원샷 호출)와 같은 이유.
        exempt: 기어-해소 비전 모델 유료 호출 + 이미지 경로 인자 의존 — 정기 실행 부적합
        runs_on: anywhere
        scope: workspace
        description: 이미지 읽기·평가 (op 분기, 모델=기어 해소). read(기본)=시각 QA·OCR·자유서술 답변(실행 축), critic=의도 정합 채점(passed/score/issues/notes, 평가 축 — GoalEval 평가자와 같은 눈) — criteria 로 data/criteria/*.yaml 취향 파일을 기준으로 심사.
        target_description: 'image_path(절대 경로 또는 data URI, path 로도 받음) 필수. read — question(무엇을 읽거나 답할지, 생략 시 전체 묘사. query/intent/prompt 로도 받음). critic — intent(무엇을 표현해야 하는가) 필수 + criteria(취향 파일 이름 예 "web"/"visual_base"/"sheet" 또는 yaml 경로 — data/criteria/, extends 사슬 지원, 지정 시 preset 대신 적용)/preset(general 기본|slide_illustration — 슬라이드 일러스트 기준표는 명시 요청제)/style_preset/checks(추가 체크 배열)/prescreen(render 행의 0층 관측 ''$it.prescreen'' — 차 있으면 비전 호출 없이 즉시 실패 verdict, tier: prescreen. 비용 계층화) 옵션.'
        group: media_produce
        router: handler
        tool: read_image
        implementation: vision_read.py — 기어-해소 원샷(system_ai_call, read=실행 축/critic=평가 축, 벤더 SDK 직호출 금지 관문=test_vision_gear_contract). read=자유서술(보이는 텍스트/숫자 그대로·추측 금지) / critic=평가(criteria 체크·prescreen 0층 단락, 반환 verdict_json+tier·rubric — 적용 기준표 정직 신고, 미지정=general 기본표(매체 중립) — 매체 기준은 criteria/preset 명시).
        target_key: op
        ops:
          default: read
          values:
            read: 시각 QA·OCR — 질문에 자유서술로 답함 (question)
            critic: 의도 정합 채점 — passed/score/issues/notes (intent 필수)
        achievement_criteria: read — 보이는 내용을 환각 없이 옮김. critic — JSON 파싱 성공, issues가 구체적, 적용 기준표(rubric) 정직 신고(슬라이드 기준표의 한글 금지는 preset=slide_illustration 명시 시에만). prescreen 이 차 있으면 비전 호출 0회에 tier=prescreen 실패 verdict(관측 사실이 issues 로 승계).
        keywords:
        - 이미지 읽기
        - 스크린샷 읽기
        - OCR
        - 시각 QA
        - 그림 보기
        - vision read
        - image ocr
        - 일러스트 평가
        - VLM
        - critic
        - image evaluation
# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: media_producer
    name: Media Producer
    description: 홍보용 슬라이드 이미지, HTML 기반 MP4 동영상, AI 이미지 생성 도구. HTML+CSS 애니메이션을 Playwright로 녹화하여 동영상을 제작합니다.
    version: 1.0.0
  tools:
  - name: render_artifact
    description: '시각 형식(HTML/PDF/SVG/XLSX 장부)을 PNG 스크린샷으로 결정론 투영합니다 (op 분기, 생략 시 path 확장자로 추론). 반환은 items 통화 — 행마다 스크린샷 1장의 절대 경로 + prescreen(0층 기계 관측: 콘솔 오류·빈 화면·수식 오류 표식, 비었으면 깨끗). 판단 없는 순수 지각 — 심사는 read_gemini_image(op:critic).'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 동작 분기 — html(기본) | pdf | svg | xlsx. 생략 시 path 확장자(.pdf/.svg/.xlsx/.xlsm)로 추론
        timeout:
          type: integer
          description: (xlsx) LibreOffice 변환 타임아웃 초 (기본 120)
        path:
          type: string
          description: '입력 파일 절대 경로 (html/pdf/svg 파일). html 은 file:// 로드라 상대 자산이 자연 해소됨'
        html:
          type: string
          description: (html) 렌더링할 HTML 문자열. path 와 함께 생략 시 직전 파이프 통화를 렌더
        svg:
          type: string
          description: (svg) 렌더링할 SVG 마크업 문자열 (<svg …> 포함)
        viewports:
          type: array
          description: '(html) 뷰포트 배열 — "1280x720" 문자열 또는 {width,height,label} 객체. 뷰포트별 1행. 웹 검수는 데스크톱+모바일 두 눈 권장'
          items:
            type: [string, object]
        output_path:
          type: string
          description: '저장 파일명 stem (예: page.png → page_모바일.png 등). 경로는 프로젝트 outputs 폴더 자동'
        base_path:
          type: string
          description: (html 문자열 전용) 상대 경로 이미지·배경의 기준 디렉토리 — base64 인라인
        full_page:
          type: boolean
          description: '(html) 페이지 전체 높이 캡처 (기본 true, false=뷰포트 크롭)'
        selector:
          type: string
          description: (html) 특정 요소만 캡처할 CSS 셀렉터
        scale:
          type: number
          description: '배율 — html/svg: device_scale_factor(기본 html 1, svg 2) / pdf: 렌더 배율(기본 2.0≈144dpi)'
        max_pages:
          type: integer
          description: (pdf) 렌더 페이지 상한 (기본 20) — 초과분은 truncated·total_pages 로 정직 보고
        pages:
          type: array
          description: (pdf) 렌더할 페이지 번호 배열 (1-기준, 생략 시 앞에서부터)
          items:
            type: integer
        width:
          type: integer
          description: (html, viewports 미지정 시) 뷰포트 가로 (기본 1280)
        height:
          type: integer
          description: (html, viewports 미지정 시) 뷰포트 세로 (기본 720)
      required: []
  - name: generate_gemini_image
    description: 'Google Gemini API로 AI 이미지를 생성합니다. 고품질 이미지 생성에 적합하며, 텍스트 렌더링 성능이 뛰어납니다.


      환경변수 GEMINI_API_KEY를 설정하거나 api_key 파라미터로 전달하세요.


      비율 옵션: 1:1(기본), 16:9, 9:16, 4:3, 3:4'
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: 이미지를 설명하는 텍스트 프롬프트 (영어 권장)
        output_path:
          type: string
          description: '저장할 파일명 (예: cover.png). 경로는 자동으로 프로젝트 outputs 폴더에 저장됨. 지정하지 않으면 자동 생성'
        aspect_ratio:
          type: string
          description: 이미지 비율 (1:1, 16:9, 9:16, 4:3, 3:4)
          default: '1:1'
        api_key:
          type: string
          description: Gemini API 키 (환경변수 GEMINI_API_KEY가 없을 때 사용)
      required:
      - prompt
  - name: create_tts
    description: 텍스트를 음성 파일(MP3)로 변환합니다. 기본 Gemini TTS(engine:"edge"로 무과금 회귀). 나레이션 생성용.
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: 음성으로 변환할 텍스트
        engine:
          type: string
          enum:
          - gemini
          - edge
          description: 'TTS 엔진 — gemini(기본): 화자 30종·자연어 연기 지시·문자 수 과금 / edge: 무과금·한국어 화자 3종'
          default: gemini
        voice:
          type: string
          description: '화자. gemini: Charon(기본, 정보전달)·Sulafat(따뜻함)·Achird(친근함) 등 / edge: ko-KR-SunHiNeural(여)·ko-KR-InJoonNeural(남)·ko-KR-HyunsuMultilingualNeural'
          default: Charon
        style:
          type: string
          description: 'gemini 전용 — 자연어 연기 지시 (예: "차분하고 신뢰감 있는 강의 나레이션 톤으로, 또박또박 읽어줘"). edge에는 없는 축.'
        rate:
          type: string
          description: 'edge 전용 — 말하기 속도 (예: +0%, -10%, +20%). gemini는 이 축이 없어 무시되고 그 사실을 알려줍니다.'
          default: +0%
        pitch:
          type: string
          description: 'edge 전용 — 목소리 톤/피치 (예: +0Hz, -5Hz, +10Hz). gemini는 이 축이 없습니다.'
          default: +0Hz
        output_filename:
          type: string
          description: '저장할 파일명 (예: narration_01.mp3)'
      required:
      - text
  - name: read_image
    description: 이미지 읽기·평가 (op 분기, 모델=기어 해소). read(기본)=질문에 자유서술로 답함(시각 QA·OCR·검증), critic=의도 정합 채점(JSON {passed, score, issues, notes, tier} + 사람 가독 요약).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 동작 분기 — read(기본) | critic
        image_path:
          type: string
          description: 이미지 절대 경로 또는 base64 data URI (path 로도 받음, 필수)
        question:
          type: string
          description: (read) 무엇을 읽거나 답할지. 생략 시 전체 묘사
        intent:
          type: string
          description: (critic 필수) 이 이미지가 무엇을 표현해야 하는가 — 자연어 설명
        preset:
          type: string
          description: '(critic) 평가 프리셋 — general(기본, 매체 중립) | slide_illustration'
        criteria:
          type: string
          description: '(critic) 취향 파일 — data/criteria/ 의 이름("web"/"visual_base") 또는 yaml 절대 경로. extends 사슬 지원. 지정 시 preset 기본 체크 대신 이 파일의 checks/forbidden 으로 심사'
        checks:
          type: array
          description: '(critic) 추가 체크 항목 (예: [''다이어그램형인가'', ''오른쪽 1/3이 비어있는가''])'
          items:
            type: string
        style_preset:
          type: string
          description: '(critic) 디자인 시스템 톤 평가 기준 (예: vintage_book)'
        prescreen:
          type: string
          description: '(critic) render 행의 0층 기계 관측 문자열($it.prescreen) — 비어 있지 않으면 비전 호출 없이 즉시 실패 verdict(tier: prescreen, 비용 계층화)'
      required:
      - image_path
