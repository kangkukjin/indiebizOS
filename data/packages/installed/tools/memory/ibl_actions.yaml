node: self
actions:
  memory:
    returns: items
    side_effect: true     # 파괴적 op 보유 — 통화(returns)와 안전은 다른 축
    fixture: '[self:memory]{op: "search", query: "test"}'
    description: 심층 메모리 관리 (op 분기). 장기 기억을 **주제 가지(node) 트리**에 둔다 — 프롬프트의 <memory_map>(목차)에서 가지를 고른 뒤 recall 로 연다. 자아별 사적 기억(폰·맥 각자 로컬). 최근 대화 로그는 recent/agents 별도.
    group: memory
    target_description: save — content 필수(+node 가지 경로 권장 — 예 "가족/어머니"; 비우면 뿌리(미배치) — +category/keywords 옵션, 둘 다 생략 시 자동 추출·분류). recall — node 의 가지를 연다(문서 전문 + 그 가지의 기억 + 하위 가지; node 생략 = 지도 전체); store:"실행" 이면 실행기억(IBL 용례) 주제 트리(<execution_map>)를 연다 — **이름 먼저**(2026-09-05) — 부를 수 있는 함수의 서명(`[fn:이름]{슬롯}` 한 줄)·한 문장 용례·여러 문장 용례의 문장 수·주행 건수만 돌려준다. 본문은 expand 로만 — expand:"이름"(함수 정의 `[def:]`, 고쳐 쓸 때) · expand:"#id"(용례 한 건) · expand:"주행"(주행 절) · expand:"all"(문서 전문). 이름이 있으면 부르고, 없거나 안 맞을 때만 연다. move — memory_id 를 node 가지로 옮김(store 동일). category 유효값 = 사용자선호/사용자정보/작업기록/의사결정/중요날짜/기타 — 그 밖의 값은 '기타' 로 저장되며 봉투가 category_normalized 로 신고한다. search — query 필수(키워드·자연어, FTS+시맨틱 통합) + category 필터 옵션(유효값 밖이면 0건이 아니라 명시 거절). read/delete — memory_id (search 결과 items 의 memory_id). 워크플로 — save 누적 → search → preview 잘렸으면 read로 전문, 잘못 저장은 delete.
    target_key: op
    router: handler
    tool: memory_op
    aliases:
      top_k: [limit]   # 정본=top_k(문서·스키마). 관습어 limit 도 수용 — 옛 핸들러가 limit만 읽어 문서된 top_k가 침묵 무시되던 버그(2026-08-05)의 봉합.
    ops:
      returns:
        save: effect
        delete: effect
        move: effect
      side_effect:
        search: false
        read: false
        recall: false
      fixture:
        recall: '[self:memory]{op: "recall"}'
      exempt:
        read: 'memory_id 필요(search 결과의 id) — 고정 fixture 부적합'
        move: 'memory_id 필요(search/recall 결과의 id) — 고정 fixture 부적합'
      values:
        save: 메모리 저장 (content 필수, node 가지 권장, category/keywords 자동 추출)
        search: 키워드·자연어 검색 (FTS+시맨틱 통합, node 필터 옵션)
        read: 전문 조회 (memory_id)
        delete: 삭제 (memory_id)
        recall: 가지 열기 (node — 문서 전문+기억+하위 가지; 생략=지도; store 실행=IBL 함수 서명·용례, 본문은 expand)
        move: 가지 이동 (memory_id + node; store 실행=용례)
    implementation: handler.py가 op로 분기 — save/search/read/delete 옛 함수에 위임, recall/move 는 memory_tree(주제 트리 문서).
    keywords:
    - 메모리
    - 기억
    - 장기기억
    - 메모리 저장
    - 메모리 검색
    - 메모리 삭제
    - 메모리 읽기

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: memory
    name: Memory
    description: 에이전트 심층 메모리. 연상기억에서 자동으로 검색·저장되며, IBL [self:memory]{op} 통합 액션으로 직접 호출 가능. 옛 4개 도구(memory_search/save/read/delete)는
      직접 호출 호환용으로 유지.
    version: 2.2.0
  tools:
  - name: memory_op
    description: '심층 메모리 통합 도구 (op 분기). save/search/read/delete/recall/move — 기억은 주제 가지(node) 트리, <memory_map> 목차에서 가지를 골라 recall.


      - op=save: content 필수(+keywords, category 옵션, 둘 다 생략 시 자동 추출·분류)

      - op=search: query 필수(자연어/키워드, FTS+시맨틱 통합) + category 필터 옵션, top_k 옵션

      - op=read: memory_id 필수

      - op=delete: memory_id 필수


      워크플로: save로 누적 → search로 자연어 검색 → preview 잘렸으면 read로 전문 → 잘못 저장은 delete.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 작업
        content:
          type: string
          description: save 필수 — 저장 내용
        keywords:
          type: string
          description: save 옵션 — 검색 키워드(쉼표 구분 문자열 또는 배열 — 배열은 쉼표로 합쳐 저장, 2026-09-05)
        category:
          type: string
          description: save 옵션 또는 search 필터 — 분류 (유효값 사용자선호/사용자정보/작업기록/의사결정/중요날짜/기타 — 밖의 값은 save 가 '기타' 로 정규화·신고, search 는 거절)
        query:
          type: string
          description: search 필수 — 검색어
        top_k:
          type: integer
          description: search 옵션 — 반환 개수(기본 10)
        memory_id:
          type: integer
          description: read/delete/move 필수 — 메모리 ID
        node:
          type: string
          description: 주제 가지 경로("가족/어머니" 꼴). save 권장(비우면 뿌리) · recall 대상(생략=지도 전체) · move 목적지 · search 필터
        store:
          type: string
          enum: [심층, 실행]
          description: recall/move 의 저장소 — 심층(기본, 사용자·세계 사실) | 실행(해마 IBL 용례의 주제 트리, <execution_map>)
        expand:
          type: string
          description: recall(store 실행) 에서 본문 하나를 연다 — "이름"(함수 정의 [def:]) | "#id"(용례 한 건) | "주행"(주행 절) | "all"(문서 전문). 생략=이름·서명만(2026-09-05 이름 먼저)
      required:
      - op
