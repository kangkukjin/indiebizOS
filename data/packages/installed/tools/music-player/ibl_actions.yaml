nodes:
  self:
    actions:
      music:
        returns: items
        side_effect: true    # playlist_*·add_source·remove_source·scan 이 라이브러리를 쓴다
        fixture: '[self:music]{op: "sources"}'
        runs_on: pc_only
        description: '내 음악 라이브러리 (op 분기) — 등록한 소스 폴더의 음악 파일을 스캔해 태그·앨범아트로 정리한다. 보는 축은 폴더(폴더 구조=사용자의 의미 단위)와 검색·플레이리스트. 재생은 통화의 stream 필드를 표면의 <audio>가 문다 — 서버 재생 아님. [limbs:music](유튜브뮤직 스트림)과 다른 개념: 이쪽은 내 파일.'
        target_description: 'op 별 입력: library(q 검색어, folder 폴더 절대경로, path 단일 곡, limit 기본 300) / folders(folder 절대경로 — 생략하면 최상위. 결과 items=바로 아래 폴더[맨 앞은 ⬆️ 상위 행], tracks=그 폴더 아래 전체 곡[상한 500]) / track(path) / playlist·playlist_create·playlist_delete(name) / playlist_add·playlist_remove(name+path) / add_source·remove_source(path 폴더) / playlists·sources·scan 은 입력 없음. 결과 items 에 title/artist/album/duration_str/stream(재생 URL)/image(앨범아트) 구조 필드 → table 파이프·media_player 직결.'
        target_key: op
        group: music
        router: handler
        tool: music_library_op
        aliases:
          q: [query, keyword]
          path: [file]
        ops:
          default: library
          values:
            library: 곡 검색·목록 (q 검색어 / folder 폴더 단위 / path 단일 곡, 기본 op)
            track: 곡 하나 상세 — 태그 + 담을 플레이리스트 목록
            folders: 폴더 한 단계 탐색 (folder 없으면 소스 루트, 있으면 그 아래 폴더 + 그 폴더 전체 곡)
            playlists: 플레이리스트 목록
            playlist: 플레이리스트 상세 (담긴 곡 순서대로)
            playlist_create: 새 플레이리스트 (name)
            playlist_delete: 플레이리스트 삭제 (name)
            playlist_add: 곡 담기 (name + path)
            playlist_remove: 곡 빼기 (name + path)
            sources: 등록 폴더 목록 + 라이브러리 통계 + 스캔 상태
            add_source: 음악 폴더 등록 — 즉시 백그라운드 스캔
            remove_source: 폴더 제거 — 그 폴더의 곡을 라이브러리에서 내림
            scan: 전체 폴더 재스캔 (백그라운드, 증분)
        implementation: 'music-player 패키지 music_library_op — 로직은 music_core.py(소스 data/music/sources.json, 트랙 인덱스 library.db sqlite WAL, 플레이리스트 playlists.json, 스캔 상태 scan_state.json). 태그=mutagen(미설치 시 파일명·폴더명 폴백). 스캔=백그라운드 스레드(증분 mtime, family-news building 선례). 스트리밍·앨범아트=backend/api_music.py(/music/stream Range·/music/cover 캐시) — music_core 를 sys.modules 공유 키로 같이 문다(bulletin_core 선례). 소스 폴더 화이트리스트 밖 경로는 스트리밍 거부.'
        keywords:
        - 음악
        - 음악 라이브러리
        - 노래
        - 내 음악
        - 플레이리스트
        - 음악 폴더
        - 음악 재생
        - mp3
        - flac
        app:
          instrument: music
          icon: 🎧
          name: 음악
          order: 18
          phone_render: false
          modes:
          - name: 전곡
            auto_run: true
            inputs:
            - key: q
              type: text
              placeholder: 곡·아티스트·앨범 검색
            action: '[self:music]{op: "library", q: "$q", limit: 300}'
            view:
            - type: card_list
              from: items
              empty_from: message
              card:
                title: '{title}'
                lines:
                - '{artist} · {album}'
                - '{duration_str}'
                image: '{image}'
              item_click:
                action: '[self:music]{op: "track", path: "{path}"}'
                tabs:
                - name: 재생
                  view:
                  - type: media_player
                    from: items
                    src: '{stream}'
                    title: '{title} — {artist}'
                - name: 플레이리스트에 담기
                  view:
                  - type: list_action
                    from: playlists
                    empty_from: playlists_note
                    title: '{name}'
                    sub: '{meta}'
                    button:
                      label: 담기
                      action: '[self:music]{op: "playlist_add", name: "{name}", path: "{track_path}"}'
                      refresh: true
                - name: 정보
                  view:
                  - type: kv
                    title: 태그
                    rows:
                    - k: 제목
                      v: '{track.title}'
                    - k: 아티스트
                      v: '{track.artist}'
                    - k: 앨범
                      v: '{track.album}'
                    - k: 장르
                      v: '{track.genre|opt:}'
                    - k: 연도
                      v: '{track.year|opt:}'
                    - k: 길이
                      v: '{track.duration_str}'
                    - k: 파일
                      v: '{track.path}'
          - name: 폴더
            auto_run: true
            note: 파인더처럼 폴더를 하나씩 찾아 들어갑니다. 폴더를 열면 그 안의 하위 폴더가 나오고, 아래 재생기는 그 폴더 아래 전체(하위 폴더 포함) 곡을 이어서 재생합니다. 맨 위 ⬆️ 상위 폴더로 되돌아갑니다.
            action: '[self:music]{op: "folders"}'
            view:
            - type: list_action
              from: items
              empty_from: message
              title: '{title}'
              sub: '{meta}'
              item_click:
                action: '[self:music]{op: "folders", folder: "{path}"}'
                view:
                - type: list_action
                  from: items
                  empty_from: message
                  title: '{title}'
                  sub: '{meta}'
                  item_click:
                    # 같은 선언을 다시 쓴다(깊이 무제한 트리) — 렌더러가 지금 보고 있는
                    # 드릴 뷰를 그대로 재사용한다. 폴더 트리는 깊이를 미리 알 수 없으므로
                    # 단계마다 손으로 중첩해 쓰면 반드시 어딘가에서 막힌다.
                    action: '[self:music]{op: "folders", folder: "{path}"}'
                    recursive: true
                - type: media_player
                  from: tracks
                  empty_from: play_note
                  continuous: true
                  src: '{stream}'
                  title: '{title} — {artist}'
          - name: 플레이리스트
            auto_run: true
            note: 플레이리스트를 만들고, 전곡 탭에서 곡을 눌러 담으세요. 플레이리스트를 누르면 연속 재생됩니다.
            action: '[self:music]{op: "playlists"}'
            view:
            - type: list_action
              from: items
              empty_from: message
              title: '{name}'
              sub: '{meta}'
              button:
                label: 삭제
                action: '[self:music]{op: "playlist_delete", name: "{name}"}'
                confirm: 이 플레이리스트를 삭제할까요? (곡 파일은 그대로 남습니다)
                refresh: true
              item_click:
                action: '[self:music]{op: "playlist", name: "{name}"}'
                tabs:
                - name: 연속 재생
                  view:
                  - type: media_player
                    from: items
                    continuous: true
                    src: '{stream}'
                    title: '{title} — {artist}'
                - name: 곡 관리
                  view:
                  - type: list_action
                    from: items
                    title: '{title}'
                    sub: '{artist} · {album}'
                    button:
                      label: 빼기
                      action: '[self:music]{op: "playlist_remove", name: "{playlist_name}", path: "{path}"}'
                      refresh: true
            - type: form
              title: 새 플레이리스트
              fields:
              - key: name
                label: 이름
                type: text
                placeholder: 예) 드라이브, 잠들기 전
              action: '[self:music]{op: "playlist_create", name: "$name"}'
              button: 만들기
          - name: 보관함
            auto_run: true
            note: 음악 폴더를 등록하면 안의 음악 파일을 스캔해 라이브러리를 만듭니다. 폴더가 진실 — 파일을 옮기면 다시 스캔하세요.
            action: '[self:music]{op: "sources"}'
            buttons:
            - label: 전체 다시 스캔
              action: '[self:music]{op: "scan"}'
              refresh: true
            view:
            - type: kv
              title: 라이브러리
              rows:
              - k: 곡
                v: '{stats.tracks}곡'
              - k: 폴더
                v: '{stats.folders}개'
              - k: 플레이리스트
                v: '{stats.playlists}개'
              - k: 스캔
                v: '{scan.label}'
            - type: editable_list
              from: items
              display: '{path} · {n}곡'
              add:
                fields:
                - key: path
                  label: 음악 폴더
                  type: folder
                action: '[self:music]{op: "add_source", path: "$path"}'
                button: 폴더 등록
              delete_action: '[self:music]{op: "remove_source", path: "{path}"}'

# tool.json 파생 원본 — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: music-player
    name: Music Player
    description: '내 음악 라이브러리 — 소스 폴더의 음악 파일을 스캔해 정리하고(태그·앨범아트), 폴더·검색으로 보고, 플레이리스트를 만든다.


      ## 이음매

      스캔·질의·플레이리스트는 이 패키지(music_core), 스트리밍·앨범아트 서빙은 backend/api_music.py(/music/stream Range·/music/cover). 재생은 보는 표면의 <audio> — 서버는 소리 내지 않는다.


      ## 보안

      스트리밍은 등록된 소스 폴더 아래의 실존 파일만(화이트리스트). 폴더 제거 시 그 곡들은 라이브러리·플레이리스트에서 내려간다(파일은 무손상).'
    version: 0.1.0
    guide_file: guide.md
  tools:
  - name: music_library_op
    description: '내 음악 라이브러리 — 폴더 스캔·곡 검색·폴더 단위 재생·플레이리스트.


      ## op 분기

      - library (기본): 곡 목록. q(제목·아티스트·앨범·파일명 부분검색), folder(폴더 절대경로 — 폴더 단위, 하위 포함), path(단일 곡), limit(기본 300). items 각 곡에 title/artist/album/duration_str/stream(재생 URL)/image(앨범아트)/path.

      - track: path 곡 하나 상세 — track(태그) + playlists(담을 플레이리스트 후보).

      - folders: 파인더식 한 단계 탐색. folder(폴더 절대경로) 생략=등록된 소스 루트, 지정=그 폴더의 직속 하위 폴더(맨 앞 ⬆️ 상위 행, path 가 비면 최상위) + tracks=그 폴더 아래 전체 곡(하위 폴더 포함, 상한 500). 각 행의 n/sub 는 그 가지 아래 전체 곡 수·하위 폴더 수 — 들어가기 전에 규모를 본다. 폴더 구조=사용자의 의미 단위라 이 앱의 주 축이다.

      - playlists: 플레이리스트 목록. playlist: name 상세(담긴 곡 순서대로).

      - playlist_create / playlist_delete: name 으로 생성·삭제. playlist_add / playlist_remove: name+path 로 곡 담기·빼기.

      - sources: 등록 폴더 + 통계 + 스캔 상태. add_source/remove_source: path 폴더 등록(즉시 백그라운드 스캔)·제거.

      - scan: 전체 재스캔(백그라운드·증분). 진행 상태는 sources 로 확인.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: library(기본)/track/folders/playlists/playlist/playlist_create/playlist_delete/playlist_add/playlist_remove/sources/add_source/remove_source/scan
        q:
          type: string
          description: 검색어 — 제목·아티스트·앨범·파일명 부분일치 (library)
        path:
          type: string
          description: 파일 절대경로(track·playlist_add·playlist_remove) 또는 폴더 절대경로(add_source·remove_source)
        folder:
          type: string
          description: 폴더 절대경로 — library 는 그 폴더(하위 포함) 곡만, folders 는 그 폴더의 한 단계 아래를 연다(생략=최상위)
        name:
          type: string
          description: 플레이리스트 이름 (playlist·playlist_create·playlist_delete·playlist_add·playlist_remove)
        limit:
          type: integer
          description: 곡 수 상한 (library, 기본 300)
      additionalProperties: true
