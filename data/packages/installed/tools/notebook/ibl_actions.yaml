nodes:
  self:
    actions:
      notebook:
        returns: items
        side_effect: true    # create/add/remove/delete 가 노트북 원장을 쓴다
        fixture: '[self:notebook]{op: "list"}'
        runs_on: pc_only     # 임베딩 모델·sqlite-vec 는 데스크톱만. 폰은 [others:ask]로 부탁.
        description: '근거 고정 질의(op 분기) — 문서 더미(PDF·텍스트)에 이름을 붙여 두고, 물으면 그 소스 안에서만 답하며 출처 인용을 단다. 이미 가진 문서를 심문할 때 — 문자열 찾기는 [self:grep], 의미 질의는 이것. 소스에 없으면 not_in_sources 정직 반환.'
        target_description: 'op 별 입력: create(name 필수 + note 노트북 목적 — ask 때 렌즈로 쓰임) / add(name + path 또는 text 붙여넣기, title 옵션 — path=파일 경로·웹 URL·유튜브 URL[자막을 타임스탬프 loc으로 색인, 자막 없으면 정직 거부]. 같은 path 재add=재색인, 15만자 초과는 백그라운드 색인) / ask(name + query 질문, top_k 발췌 수 기본 12) — 답+citations[{n,source,loc,quote}]+items / search(name + query, top_k 기본 8) — 생성 없이 발췌만(LLM 0, 싼 경로) / sources(name) — 소스 목록·색인 상태·stale(원본 변경/소실) / remove(name + source_id) / list·delete(name). 결과 items 구조 필드 → table 파이프 직결.'
        target_key: op
        group: notebook
        router: handler
        tool: notebook_op
        aliases:
          query: [q, question]
          top_k: [limit]
          path: [url, file]
        ops:
          default: ask
          returns:
            create: effect
            add: effect
            remove: effect
            delete: effect
          side_effect:
            ask: false
            search: false
            sources: false
            list: false
          fixture:
            list: '[self:notebook]{op: "list"}'
          exempt:
            ask: '노트북 name+질문 필요 — 고정 fixture 부적합'
            search: '노트북 name+검색어 필요 — 고정 fixture 부적합'
            sources: '노트북 name 필요 — 고정 fixture 부적합'
            create: '원장에 노트북을 만든다 — 부작용'
            add: '소스 색인을 만든다 — 부작용'
            remove: 'source_id 필요 + 부작용'
            delete: '노트북을 지운다 — 부작용'
          values:
            create: 노트북 생성 (name + note 목적)
            add: 소스 넣기 (path=파일·웹 URL·유튜브 URL[자막] / text 붙여넣기, 재add=재색인)
            ask: 근거 고정 질문 (기본 op) — 소스 안에서만 답 + [n] 인용, 없으면 not_in_sources
            search: 발췌 검색만 (LLM 0 — 인용 확인·파이프용 싼 경로)
            sources: 소스 목록 + 색인 상태 + stale 표시
            remove: 소스 빼기 (source_id)
            list: 노트북 목록
            delete: 노트북 삭제 (소스·색인 포함)
        implementation: 'notebook 패키지 notebook_op — 저장·색인·검색=notebook_core.py(data/notebook/notebooks.db sqlite WAL, 청크 650자 문단 경계, 하이브리드=ko-sroberta 768d+sqlite-vec+FTS5 BM25, 미설치 시 FTS 폴백 — ★해마 임베딩 모델 아님). ask=handler가 발췌 top-K를 경량 AI 제약 생성(발췌만·[n] 인용 의무·모름=NOT_IN_SOURCES)에 넣고, 인용을 결정론 후검증(무효 [n] 제거·quote는 청크 원문에서 코드가 추출=인용 환각 차단). 원본=경로 참조+mtime(사본 없음), 변경은 sources op가 stale로 노출. 스캔(이미지) PDF=OCR 없음 정직 거부. 설계 정본=docs/NOTEBOOK_GROUNDED_QUERY_DESIGN.md'
        app:
          instrument: notebook
          icon: 📚
          name: 노트북
          order: 30
          phone_render: false
          modes:
          - name: 질문
            note: 노트북을 고르고 물으면 그 소스 안에서만 답하고 [n] 인용을 답니다. 소스에 없으면 없다고 답합니다.
            inputs:
            - key: nb
              type: select
              placeholder: 노트북 선택
              options_action: '[self:notebook]{op: "list"}'
              options_from: notebooks
              option_value: name
              option_label: name
            - key: query
              type: text
              placeholder: 질문 — 소스 안에서만 답합니다
            action: '[self:notebook]{op: "ask", name: "$nb", query: "$query"}'
            view:
            - type: blocks
              from: blocks
              empty_from: message
            - type: card_list
              from: items
              card:
                title: '{title}'
                lines:
                - '{meta}'
                - '{summary}'
          - name: 노트북
            auto_run: true
            action: '[self:notebook]{op: "list"}'
            view:
            - type: card_list
              from: items
              master_detail: true
              empty_from: message
              item_click:
                action: '[self:notebook]{op: "sources", name: "{name}"}'
                tabs:
                - name: 소스
                  view:
                  - type: list_action
                    from: items
                    empty_from: message
                    title: '{title}'
                    sub: '{meta}'
                    button:
                      label: 빼기
                      action: '[self:notebook]{op: "remove", name: "{notebook}", source_id: "{source_id}"}'
                      confirm: 이 소스를 노트북에서 뺄까요? 색인도 함께 삭제됩니다.
                      refresh: true
                - name: 관리
                  view:
                  - type: form
                    title: 소스 추가 (파일 경로 · 웹 URL · 유튜브 URL 또는 본문 붙여넣기)
                    fields:
                    - key: src
                      label: 경로/URL
                      type: text
                      value: ''
                    - key: title
                      label: 표시 이름(옵션)
                      type: text
                      value: ''
                    - key: text
                      label: 본문 붙여넣기(경로 대신)
                      type: textarea
                      value: ''
                    action: '[self:notebook]{op: "add", name: "{notebook}", path: "$src", title: "$title", text: "$text"}'
                    button: 넣기
                    actions:
                    - label: 이 노트북 삭제
                      action: '[self:notebook]{op: "delete", name: "{notebook}"}'
                      style: danger
                      confirm: 이 노트북과 모든 소스·색인을 삭제할까요? (원본 파일·URL은 지우지 않습니다)
                      back: true
              card:
                title: '{title}'
                lines:
                - '{meta}'
                - '{summary}'
          - name: 만들기
            auto_run: true
            note: 문서 더미에 이름을 붙여 두면, 그 안에서만 답하는 질문 창구가 생깁니다.
            action: '[self:notebook]{op: "list"}'
            view:
            - type: form
              title: 새 노트북
              fields:
              - key: name
                label: 이름
                type: text
                value: ''
              - key: note
                label: 목적 한 줄(옵션 — 답변의 렌즈)
                type: text
                value: ''
              action: '[self:notebook]{op: "create", name: "$name", note: "$note"}'
              button: 만들기
        keywords:
        - 노트북
        - 근거
        - 인용
        - 출처
        - 문서 질문
        - 자료조사
        - 문서 더미
        - grounded
        - 소스

# tool.json 파생 원본 — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: notebook
    name: Notebook
    description: '근거 고정 질의 — 문서 더미(노트북)에 넣고, 소스 안에서만 답하며 인용을 다는 도구. NotebookLM의 로컬·파이프라인 판.


      ## 이음매

      저장·색인·검색은 notebook_core.py(data/notebook/notebooks.db), 생성은 경량 AI 1회(consciousness_agent.oneshot_ai_call) + 결정론 인용 후검증. 임베딩=ko-sroberta(blog RAG와 동일 계보), 해마 모델 아님.


      ## 한계

      스캔(이미지) PDF는 OCR 없음 — 정직 거부. 시맨틱 의존성 미로드 시 FTS5 키워드 검색으로 강등(응답에 명시).'
    version: 1.0.0
  tools:
  - name: notebook_op
    description: '근거 고정 질의 통합 도구 (op 분기). create/add/ask/search/sources/remove/list/delete.


      - op=create: name 필수 (+note 노트북 목적 — ask 응답의 렌즈)

      - op=add: name + path(PDF·md·txt) 또는 text(붙여넣기), title 옵션. 같은 path 재add=재색인

      - op=ask (기본): name + query — 소스 안에서만 답, citations[{n,source,loc,quote}] 동반, 없으면 not_in_sources

      - op=search: name + query — 생성 없이 발췌만 (LLM 0)

      - op=sources: name — 소스·색인 상태·stale / op=remove: name + source_id

      - op=list / op=delete: name


      워크플로: create → add 여러 번 → ask 반복. 웹 검색이 아니라 이미 가진 문서를 심문하는 도구다.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 작업
        name:
          type: string
          description: 노트북 이름 (list 외 전 op 필수)
        note:
          type: string
          description: create 옵션 — 노트북 목적 한 줄 (ask 답변의 렌즈로 쓰임)
        path:
          type: string
          description: add — 소스 파일 절대경로 (PDF/md/txt 등)
        text:
          type: string
          description: add — 본문 붙여넣기 (path 대신)
        title:
          type: string
          description: add 옵션 — 소스 표시 이름 (생략 시 파일명)
        query:
          type: string
          description: ask/search 필수 — 질문 또는 검색어
        source_id:
          type: integer
          description: remove 필수 — sources op 가 보여주는 소스 번호
        top_k:
          type: integer
          description: 옵션 — ask 발췌 수(기본 12) / search 결과 수(기본 8)
      required:
      - op
