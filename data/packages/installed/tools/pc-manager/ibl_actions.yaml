nodes:
  sense:
    actions:
      host:
        returns: scalar
        side_effect: false    # 전 op 읽기 전용
        fixture: '[sense:host]{op: "status"}'
        description: 이 기계(나의 몸) 자신의 운영 상태를 구조화 데이터로 직접 내성 (op 분기). 화면을 보는 게 아니라 기계를 직접 느끼는 자기수용감각. status(상태 한눈에)/apps(자원 점유 프로세스)/resources(상세 지표).
        group: device
        target_description: 'op=status(기본): 전면 앱·CPU·메모리·디스크·배터리·가동시간·로드평균·프로세스 수 한 눈에. apps: 메모리 점유 상위 프로세스(limit 옵션, 기본 12). resources: per-core CPU·스왑·디스크 파티션별·네트워크 상세.'
        target_key: op
        router: handler
        tool: host_op
        runs_on: pc_only
        ops:
          default: status
          returns:
            # status=1행 스냅샷·apps=프로세스 행들 items 병기 실측 (2026-08-19 드리프트
            # 스윕 동기화). resources=디스크 파티션 행들 items 병기 (2026-08-20 V15-1
            # 사용자 판정 — "디스크 여유공간"의 영토는 storage 아닌 host, disks 는
            # 동일성 재투영으로 변환에 동행).
            status: items
            apps: items
            resources: items
          fixture:
            apps: '[sense:host]{op: "apps"}'
            resources: '[sense:host]{op: "resources"}'
          values:
            status: 이 기계 상태 한 눈에 (전면앱·CPU·메모리·디스크·배터리·가동시간)
            apps: 자원(메모리)을 많이 쓰는 프로세스 상위 N (limit 옵션)
            resources: 상세 지표 (per-core CPU·스왑·디스크 파티션·네트워크·배터리)
        implementation: pc-manager 패키지 host_op 핸들러 — psutil로 CPU/메모리/스왑/디스크/네트워크/배터리, lsappinfo로 전면 앱(권한 프롬프트 無), runtime_utils.detect_body로 몸 이름. 폰은 자기 센서 별도라 pc_only.
        keywords:
        - 내컴퓨터
        - 시스템상태
        - cpu
        - 메모리
        - 디스크
        - 배터리
        - 내몸
        - 프로세스
        app:
          instrument: host
          icon: 🖥️
          name: 시스템
          order: 15
          phone_render: false
          modes:
          - name: 상태
            auto_run: true
            action: '[sense:host]{op: "status"}'
            view:
            - type: metric
              label: CPU
              big: '{cpu_percent}'
              unit: '%'
              sub: '{body}{frontmost_app|opt:  ·  ,}'
            - type: kv
              title: 메모리 · 디스크 · 전원
              rows:
              - k: 메모리
                v: '{memory.used_gb} / {memory.total_gb} GB ({memory.percent}%)'
              - k: 디스크 (/)
                v: '{disk_root.free_gb} GB 여유 / {disk_root.total_gb} GB ({disk_root.percent}%)'
              - k: 배터리
                v: '{battery.percent|opt:,%}'
              - k: 가동시간
                v: '{uptime_hours} 시간'
              - k: 프로세스 수
                v: '{process_count}'
          - name: 프로세스
            auto_run: true
            action: '[sense:host]{op: "apps", limit: 15}'
            view:
            - type: kv_list
              title: 메모리 점유 상위
              from: top
              k: '{name}'
              v: '{mem_percent}% · CPU {cpu_percent}%'
          - name: 자원
            auto_run: true
            action: '[sense:host]{op: "resources"}'
            view:
            - type: kv
              title: CPU · 메모리 · 스왑 · 네트워크
              rows:
              - k: CPU
                v: '{cpu.percent_overall}% · {cpu.logical_cores} 코어'
              - k: 메모리
                v: '{memory.used_gb} / {memory.total_gb} GB ({memory.percent}%)'
              - k: 스왑
                v: '{swap.used_gb} / {swap.total_gb} GB ({swap.percent}%)'
              - k: 네트워크
                v: ↑ {network.sent_gb} · ↓ {network.recv_gb} GB
              - k: 가동시간
                v: '{uptime_hours} 시간'
            - type: kv_list
              title: 디스크 파티션
              from: disks
              k: '{mount}'
              v: '{free_gb} GB 여유 / {total_gb} GB ({percent}%)'
  self:
    actions:
      storage:
        # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
        #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
        #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
        params:
          root_path: string
        returns: scalar
        side_effect: true    # scan 이 용량 인덱스를 구축한다
        fixture: '[self:storage]{op: "volumes"}'
        description: 디스크 용량 분석 (op 분기) — summary·volumes 는 items 병기(>> table 파이프 접속 가능). ★파일 검색은 file_find·디스크 여유공간은 sense:host (둘 다 스캔 불요).
        group: file
        target_description: 용량 분석은 OS 색인이 못 하는 디렉토리 크기 롤업이라 인덱스가 필요 — scan(구축) 선행 → summary 가 폴더·확장자별 용량 집계. summary — volume_name/root_path 생략 시 전체 통합. volumes — 파라미터 없음.
        target_key: op
        router: handler
        tool: storage_op
        ops:
          default: volumes
          returns:
            # summary·volumes 는 items 병기 실측 (2026-08-19 returns 드리프트 스윕 —
            # volumes 병기=V13-1 수리, summary 는 storage_db 가 원래 병기).
            summary: items
            volumes: items
            scan: effect
          side_effect:
            summary: false
            volumes: false
          fixture:
            summary: '[self:storage]{op: "summary"}'
          values:
            scan: 용량 분석 인덱스 구축 (treemap·확장자별 집계의 선행 단계)
            summary: 폴더·확장자별 용량 집계 (scan 선행, 볼륨 생략 시 전체 통합)
            volumes: 용량 분석된 볼륨 목록 (이름·경로·용량, 기본)
        implementation: scan_storage/get_storage_summary/list_volumes op 분기 (pc-manager)
      folder_note:
        aliases:
          folder_path: [path]
          root_path: [path]
        returns: scalar
        side_effect: true    # set 이 폴더 주석을 저장한다
        fixture: '[self:folder_note]{op: "detail"}'
        description: 폴더 주석 관리 (op 분기). set(메모·주석 추가)/detail(저장된 주석 조회). 폴더 의미를 기록·확인.
        group: file
        target_description: set — root_path(스캔된 볼륨 경로) + folder_path + note 필수. detail — root_path/volume_name 생략 시 전체 볼륨 주석 통합 조회.
        target_key: op
        router: handler
        tool: folder_note_op
        ops:
          default: detail
          returns:
            set: effect
          side_effect:
            detail: false
          values:
            set: 폴더에 메모·주석 추가 (root_path + folder_path + note)
            detail: 저장된 폴더 주석 조회 (볼륨 생략 시 전체 통합, 기본)
        implementation: annotate_folder/get_folder_annotations op 분기 (pc-manager)
      forage:
        returns: scalar
        side_effect: true    # note 가 누적하고 forget 이 폐기한다
        fixture: '[self:forage]{op: "recall", query: "test"}'
        description: 포식 기억(냄새지도) — 과거 디스크·코드·웹 포식에서 배운 폴더/모듈 정체·관습·죽은가지·주인모델을 누적·회상. op 분기. ★응답=3층(map/owner/territory) 인지 기억 — items 통화 밖이라 table 파이프 대상 아님(판정 2026-08-17).
        group: file
        target_description: 'recall(기본) — query(주제)·body(포식 공간: "mac"=홈디스크/"code:<repo>"=코드레포/"web"=웹/"book:<제목>"/"disk:<라벨>" 등 AI가 명명, 생략 시 전 공간 회상)로 회상. note — layer(map|owner) + map은 locus/kind(identity|convention|dead_branch|substrate)/claim, owner는 facet/value. confidence·prior_class(structural|semantic)·prune_reason·generalizes 옵션. forget — id + table(forage_map|owner_model).'
        target_key: op
        router: handler
        tool: forage_op
        scope: workspace
        ops:
          default: recall
          returns:
            note: effect
            forget: effect
          side_effect:
            recall: false
          values:
            recall: 누적된 냄새지도 회상 (query·body 필터, 기본)
            note: 지도/주인모델에 단언 누적 (layer=map/owner)
            forget: 잘못된·낡은 항목 폐기 (id + table)
        keywords:
        - 포식기억
        - 냄새지도
        - 주인모델
        implementation: forage_memory.recall/note_map/note_owner/forget op 분기 (pc-manager → backend/forage_memory)
# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: pc-manager
    name: PC Manager
    description: PC 파일 탐색, 외장하드 관리, 저장소 스캔 도구. 파일 탐색기 GUI, 대용량 저장소 인덱싱, 파일 검색, 폴더 구조 분석 기능을 제공합니다. 파일 정리, 중복 파일 찾기, 저장소 관리에
      활용.
    version: 1.1.0
  tools:
  - name: storage_op
    description: '저장소 인덱스 조작 (op 분기) — [self:storage].

      - op=volumes (기본): 스캔된 볼륨 목록 (파라미터 없음).

      - op=scan: 디스크·볼륨 스캔 후 SQLite 인덱스 구축 (path 필수). 이후 query_storage로 검색.

      - op=summary: 저장소 사용량 요약 (volume_name 필수, 총 파일 수/용량/확장자별 통계).


      ## 예시

      - storage_op()                                  # 기본 volumes

      - storage_op(op=''scan'', path=''/Volumes/MyDrive'')

      - storage_op(op=''summary'', volume_name=''MyDrive'')'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: volumes=볼륨 목록(기본), scan=스캔/인덱싱, summary=사용량 요약
        path:
          type: string
          description: '[scan] 스캔할 경로 (예: /Volumes/MyDrive)'
        volume_name:
          type: string
          description: '[scan] 볼륨 식별 이름(생략시 자동) / [summary] 대상 볼륨(필수)'
  - name: folder_note_op
    description: '폴더 주석 관리 (op 분기) — [self:folder_note].

      - op=detail (기본): 저장된 폴더 주석 조회 (root_path 필수).

      - op=set: 폴더에 메모·주석 추가 (root_path + folder_path + note 필수).

      root_path는 storage_op(op=''scan'')으로 스캔한 볼륨 경로.


      ## 예시

      - folder_note_op(op=''set'', root_path=''/Volumes/MyDrive'', folder_path=''/Volumes/MyDrive/backup'', note=''2023 백업'')

      - folder_note_op(op=''get'', root_path=''/Volumes/MyDrive'')'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: get=주석 조회(기본), set=주석 추가
        root_path:
          type: string
          description: 스캔된 볼륨 경로 (set/get 모두 필수). volume_name으로도 받음
        folder_path:
          type: string
          description: '[set] 주석 달 폴더 경로'
        note:
          type: string
          description: '[set] 폴더 설명/주석'
        volume_name:
          type: string
          description: root_path 별칭 (스캔된 볼륨 경로)
  - name: forage_op
    description: '포식 기억(냄새지도) — [self:forage]. 과거 디스크·웹 포식에서 배운 폴더 정체·관습·죽은가지·주인모델을 세션 너머로 누적·회상. 루프(forager)는 AI 자신이고 이 도구는
      그 *지속 기억*이다.

      - op=recall (기본): 누적된 냄새지도 회상. query(주제)·body(몸, 생략 시 전 공간 — 몸별 공정 인터리브).

      - op=note: 단언 누적. layer=map(locus+kind+claim) 또는 layer=owner(facet+value). prior_class=structural만 committal prune 허용(semantic은
      위험).

      - op=forget: 잘못된·낡은 항목 폐기 (id + table).


      ## 예시

      - forage_op(op=''recall'', query=''여행'')

      - forage_op(op=''note'', layer=''map'', locus=''/Volumes/SSD/total/journal'', kind=''dead_branch'', claim=''출판논문 — 여행자료
      없음'', prune_reason=''논문폴더'', prior_class=''structural'')

      - forage_op(op=''note'', layer=''owner'', facet=''domain'', value=''계산신경과학'')

      - forage_op(op=''forget'', id=3, table=''forage_map'')'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: recall=회상(기본), note=누적, forget=폐기
        query:
          type: string
          description: '[recall] 주제 필터(부분일치)'
        body:
          type: string
          description: 몸 신원 (mac/disk:uuid 등, 생략 시 전 공간 회상 — note 는 현재 몸에 기록)
        limit:
          type: integer
          description: '[recall] 결과 상한 (기본 20)'
        layer:
          type: string
          enum:
          - map
          - owner
          description: '[note] map=몸별 지도, owner=몸독립 주인모델'
        locus:
          type: string
          description: '[note map] 곳(절대경로) 또는 __substrate__'
        kind:
          type: string
          enum:
          - identity
          - convention
          - dead_branch
          - substrate
          description: '[note map] 항목 종류'
        claim:
          type: string
          description: '[note] 단언(자연어)'
        facet:
          type: string
          enum:
          - identity
          - domain
          - affiliation
          - signal
          - lexicon
          - habit
          description: '[note owner] 주인모델 facet'
        value:
          type: string
          description: '[note owner] facet 값'
        prior_class:
          type: string
          enum:
          - structural
          - semantic
          description: '[note] 구조적(싸게 재검증·committal 허용) vs 의미적(이질억압 위험)'
        confidence:
          type: number
          description: '[note] 확신 0~1'
        prune_reason:
          type: string
          description: '[note map] defeasible 이유 — ''~라서 아마 없음'''
        generalizes:
          type: boolean
          description: '[note map convention] 새 가지에도 적용되나'
        id:
          type: integer
          description: '[forget] 항목 id'
        table:
          type: string
          enum:
          - forage_map
          - owner_model
          description: '[forget] 대상 테이블'
  - name: host_op
    description: '이 기계(호스트) 자신의 운영 상태를 구조화 데이터로 조회 (op 분기) — [sense:host]. 화면을 보는 게 아니라 기계를 직접 내성하는 자기수용감각.

      - op=status (기본): 몸 상태 한 눈에 — 전면 앱·CPU·메모리·디스크·배터리·가동시간·로드평균·프로세스 수. 파라미터 없음.

      - op=apps: 자원(메모리)을 많이 쓰는 프로세스 상위 N (limit 옵션, 기본 12).

      - op=resources: 상세 지표 — per-core CPU·메모리·스왑·디스크 파티션별·네트워크 누계·배터리.


      ## 예시

      - host_op()                 # 기본 status

      - host_op(op=''apps'', limit=8)

      - host_op(op=''resources'')'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: status=상태 한눈에(기본), apps=자원 상위 프로세스, resources=상세 지표
        limit:
          type: integer
          description: '[apps] 상위 프로세스 개수 (기본 12)'
