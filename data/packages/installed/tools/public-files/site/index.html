<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/">
<title>공개파일</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root {
    --bg: #0d0f12; --card: #171a1f; --text: #e8eaed; --muted: #9aa0a6;
    --line: #2a2e35; --accent: #4f9cf9;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --card:#fff; --text:#1a1c1e; --muted:#5f6368; --line:#e2e4e8; --accent:#1a73e8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); border-bottom:1px solid var(--line); padding:14px 18px;
    display:flex; align-items:center; gap:12px; }
  header .crumb { font-size:15px; font-weight:600; }
  header .crumb span { cursor:pointer; }
  header .crumb .sep { color:var(--muted); margin:0 6px; font-weight:400; cursor:default; }
  header .count { color:var(--muted); font-size:13px; margin-left:auto; }
  main { max-width:1400px; margin:0 auto; padding:18px; }
  .folders { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .folder { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px;
    cursor:pointer; transition:transform .12s, border-color .12s; }
  .folder:hover { transform:translateY(-2px); border-color:var(--accent); }
  .folder .fname { font-size:16px; font-weight:600; word-break:break-all; }
  /* 메이슨리(세로 컬럼) — 사진의 실제 비율을 보존해 상하 잘림 없이 전체를 보여준다 */
  .grid { column-width:180px; column-gap:8px; }
  .tile { position:relative; background:var(--card); border-radius:10px; overflow:hidden;
    cursor:pointer; border:1px solid var(--line); break-inside:avoid; margin-bottom:8px; }
  .tile img { width:100%; height:auto; display:block; transition:transform .2s; min-height:60px; }
  .tile:hover img { transform:scale(1.05); }
  .tile .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.28); font-size:34px; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .tile .noimg { min-height:150px; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px; color:var(--muted); font-size:12px; padding:8px; text-align:center; }
  /* 음악 — 썸네일이 없으므로(앨범아트 미추출) 타일 자체가 표지 역할 */
  .tile .noimg.audio { min-height:110px; color:var(--text);
    background:linear-gradient(150deg, color-mix(in srgb, var(--accent) 22%, var(--card)), var(--card)); }
  .tile .noimg.audio .ico { font-size:26px; }
  .tile .noimg.audio span { word-break:break-all; line-height:1.35; }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; line-height:1.6; }
  /* 라이트박스 */
  .lb { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.92); display:none;
    align-items:center; justify-content:center; padding:24px; }
  .lb.open { display:flex; }
  .lb img, .lb video { max-width:100%; max-height:100%; border-radius:8px; }
  .lb .audiobox { width:min(520px, 86vw); background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:28px 22px 22px; text-align:center; }
  .lb .audiobox .ico { font-size:52px; line-height:1; }
  .lb .audiobox .atitle { margin:14px 0 18px; font-size:15px; font-weight:600; color:var(--text);
    word-break:break-all; line-height:1.4; }
  .lb .audiobox audio { width:100%; display:block; }
  .lb .close { position:absolute; top:16px; right:20px; font-size:30px; color:#fff; cursor:pointer;
    line-height:1; opacity:.85; }
  .lb .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:44px; color:#fff;
    cursor:pointer; user-select:none; opacity:.7; padding:0 16px; }
  .lb .nav:hover { opacity:1; }
  .lb .prev { left:6px; } .lb .next { right:6px; }
  .lb .cap { position:absolute; bottom:14px; left:0; right:0; text-align:center; color:#ddd; font-size:13px; }
  /* 생방송 트랜스코드 전용 시크바 — 브라우저가 스트림을 탐색불가로 취급해 네이티브 바가 죽으므로 */
  .lb .seek { position:absolute; bottom:36px; left:8%; right:8%; display:none; align-items:center;
    gap:10px; color:#ddd; font-size:12px; }
  .lb .seek input { flex:1; accent-color:var(--accent); cursor:pointer; }
  /* 화질 토글 — 저대역(720p) ↔ 원본. 동영상 재생 중에만 뜬다. */
  .lb .qbtn { position:absolute; top:16px; left:20px; z-index:2; background:rgba(0,0,0,.55);
    color:#eee; border:1px solid rgba(255,255,255,.28); border-radius:999px; cursor:pointer;
    font-size:12px; padding:6px 12px; line-height:1; display:none; }
  .lb .qbtn:hover { border-color:var(--accent); color:#fff; }
</style>
</head>
<body>
<header>
  <span class="crumb" id="crumb"></span>
  <span class="count" id="count"></span>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>

<div class="lb" id="lb">
  <span class="close" onclick="closeLb()">✕</span>
  <button class="qbtn" id="lbQ" onclick="toggleQuality()"></button>
  <span class="nav prev" onclick="step(-1)">‹</span>
  <span class="nav next" onclick="step(1)">›</span>
  <div id="lbBody"></div>
  <div class="seek" id="lbSeek">
    <span id="lbSeekNow">0:00</span>
    <input type="range" id="lbSeekBar" min="0" max="100" step="1" value="0">
    <span id="lbSeekTotal">0:00</span>
  </div>
  <div class="cap" id="lbCap"></div>
</div>

<script>
// 공개파일 갤러리 — 라이브 서빙(인덱싱 없음). 매 디렉토리를 그때그때 맥이 훑어 주므로
// 파일을 옮기거나 지우면 즉시 반영된다. Worker(worker.js)가 slug 게이트 + 지연 캐시.
const _sm = location.pathname.match(/^\/s\/([^/]+)/);
const SLUG = _sm ? _sm[1] : "";
const SCOPE = SLUG ? "/s/" + SLUG + "/" : "/";
const api = (u) => SCOPE + u;                         // 스코프 절대경로(<base href="/"> 우회)
let TITLE = "공개파일", curItems = [], curTrail = [], lbIndex = -1;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function thumbUrl(it) { return api(`thumb/${encodeURIComponent(it.fid)}?rel=${encodeURIComponent(it.rel)}&v=${it.mtime}`); }
// ── 화질(대역폭) ──────────────────────────────────────────────────────────
// 기본 = "자동"(HLS 적응형): 맥이 렌디션 사다리(tiny 480p/low 720p/원본)를 byterange
// HLS 로 묶어 주면 hls.js 가 조각마다 회선을 재서 화질을 갈아탄다(느린 회선=안 멈추고
// 강등, 빠른 회선=원본). 사다리가 아직 없으면(첫 시청) 아래 프로그레시브 폴백 —
// 그 시청이 만든 캐시가 렁이 되어 다음부터 적응형. 수동 모드(저용량/원본)는 탈출구.
// qmode: "auto" | "low" | "orig" — localStorage. lowq()는 폴백 경로의 자동 판정용.
const QMODES = ["auto", "low", "orig"];
let QMODE = null;
function qmode() {
  if (QMODE !== null) return QMODE;
  let saved = null;
  try { saved = localStorage.getItem("qmode"); } catch (e) {}
  QMODE = QMODES.includes(saved) ? saved : "auto";
  return QMODE;
}
function setQmode(m) {
  QMODE = m;
  try { localStorage.setItem("qmode", m); } catch (e) {}
}
let LOWQ = null;
function lowq() {
  if (LOWQ !== null) return LOWQ;
  let saved = null;
  try { saved = localStorage.getItem("lowq"); } catch (e) {}
  if (saved !== null) { LOWQ = saved === "1"; return LOWQ; }
  const c = navigator.connection || {};
  LOWQ = (typeof c.downlink === "number" && c.downlink > 0 && c.downlink < 3)
      || /^(slow-2g|2g|3g)$/.test(c.effectiveType || "")
      || c.saveData === true;
  return LOWQ;
}
// ── HEVC 능력 감지 ────────────────────────────────────────────────────────
// 저대역엔 h264(&q=low)와 HEVC(&q=lowh, 같은 화질에 절반 대역) 두 판이 있다.
// canPlayType 은 선언일 뿐이라(테슬라도 av1 에 probably 를 준다) mediaCapabilities 로
// smooth(하드웨어/실시간 디코드)까지 확인된 기기만 lowh 를 요청한다. API 가 없거나
// 감지 전이면 false → h264 저대역(안전한 기존 동작). 결과는 localStorage 캐시.
let HEVCOK = false;
function hevcok() { return HEVCOK === true; }
(async function detectHevc() {
  try {
    const saved = localStorage.getItem("hevcok");
    if (saved !== null) { HEVCOK = saved === "1"; return; }
  } catch (e) {}
  let ok = false;
  try {
    if (navigator.mediaCapabilities && navigator.mediaCapabilities.decodingInfo) {
      const r = await navigator.mediaCapabilities.decodingInfo({
        type: "file",
        video: { contentType: 'video/mp4; codecs="hvc1.1.6.L120.B0"',
                 width: 1280, height: 720, bitrate: 800000, framerate: 24 },
        audio: { contentType: 'audio/mp4; codecs="mp4a.40.2"',
                 channels: "2", bitrate: 96000, samplerate: 48000 },
      });
      ok = !!(r && r.supported && r.smooth);
    }
  } catch (e) { ok = false; }
  HEVCOK = ok;
  try { localStorage.setItem("hevcok", ok ? "1" : "0"); } catch (e) {}
})();
function syncQBtn(show) {
  const b = document.getElementById("lbQ");
  b.style.display = show ? "block" : "none";
  const m = qmode();
  if (m === "auto") {
    b.textContent = "⚡ 자동 화질";
    b.title = "회선에 맞춰 화질 자동 전환(HLS) — 누르면 저용량 고정";
  } else if (m === "low") {
    b.textContent = hevcok() ? "🐢 저용량 720p·HEVC" : "🐢 저용량 720p";
    b.title = "느린 회선용 고정 — 누르면 원본 화질로";
  } else {
    b.textContent = "🎞 원본 화질";
    b.title = "원본 고정 — 누르면 자동(적응형)으로";
  }
}
function toggleQuality() {
  setQmode(QMODES[(QMODES.indexOf(qmode()) + 1) % QMODES.length]);   // auto→low→orig→auto
  syncQBtn(true);
  if (lbIndex >= 0) openLb(lbIndex);   // 같은 항목을 새 화질로 다시 연다
}
function mediaUrl(it) {
  // 프로그레시브 경로의 화질: 수동 low=고정 저용량 / 수동 orig=고정 원본 /
  // auto(HLS 폴백 도착)=기존 자동 판정(lowq — 저장된 토글·navigator.connection).
  let q = "";
  if (it.kind === "video") {
    const m = qmode();
    if (m === "low" || (m === "auto" && lowq())) q = hevcok() ? "&q=lowh" : "&q=low";
  }
  return api(`media/${encodeURIComponent(it.fid)}?rel=${encodeURIComponent(it.rel)}&v=${it.mtime}${q}`);
}
function hlsUrl(it) {
  return api(`hls/${encodeURIComponent(it.fid)}?rel=${encodeURIComponent(it.rel)}&v=${it.mtime}`);
}
function subUrl(it, s, shift) {
  return api(`sub/${encodeURIComponent(it.fid)}?rel=${encodeURIComponent(s.rel)}&v=${s.mtime || it.mtime}`
    + (s.cls ? `&cls=${encodeURIComponent(s.cls)}` : "")
    + (shift ? `&shift=${shift}` : ""));
}
function trackHtml(it, shift) {
  return (it.subs || []).map((s, i) =>
    `<track kind="subtitles" src="${subUrl(it, s, shift)}" label="${esc(s.label || "자막")}"${i === 0 ? " default" : ""}>`
  ).join("");
}
// 첫 시청(캐시 전 생방송 트랜스코드)은 브라우저가 스트림을 탐색불가(seekable 0)로
// 취급해 네이티브 시크바가 죽는다 → 커스텀 시크바를 보여주고, 드래그하면 그 지점부터의
// 오프셋 스트림(&t=)으로 스왑한다. 오프셋 스트림은 0 기준 타임라인이라 자막도
// &shift= 로 같이 당긴다. 캐시 완성 뒤(두 번째 재생)는 네이티브 seek 이라 바 숨김.
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = String(sec % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
}
function attachSeekRescue(v, it) {
  let off = 0, dragging = false;
  const cap = document.getElementById("lbCap");
  const seek = document.getElementById("lbSeek");
  const bar = document.getElementById("lbSeekBar");
  const now = document.getElementById("lbSeekNow");
  const total = document.getElementById("lbSeekTotal");
  function fullDur() { return off + (isFinite(v.duration) ? v.duration : 0); }
  function swap(absTarget) {
    off = Math.min(Math.max(0, Math.floor(absTarget)), Math.max(0, Math.floor(fullDur() - 10)));
    v.innerHTML = trackHtml(it, off);
    v.src = mediaUrl(it) + "&t=" + off;
    v.load();
    v.play().catch(() => {});
    cap.textContent = `${it.title || ""} — ⏩ ${fmtTime(off)}부터 이어보는 중`;
  }
  const onMetadata = () => {
    // 탐색불가 스트림(생방송)일 때만 커스텀 바. 캐시/원본(Range 지원)은 네이티브가 완전.
    const live = !v.seekable.length || v.seekable.end(v.seekable.length - 1) < fullDur() - off - 60;
    seek.style.display = live ? "flex" : "none";
    if (live) { bar.max = Math.floor(fullDur()); total.textContent = fmtTime(fullDur()); }
  };
  const onTimeUpdate = () => {
    if (dragging || seek.style.display === "none") return;
    bar.value = Math.floor(off + v.currentTime);
    now.textContent = fmtTime(off + v.currentTime);
  };
  const onInput = () => { dragging = true; now.textContent = fmtTime(+bar.value); };
  const onChange = () => {
    dragging = false;
    const target = +bar.value;
    const rel = target - off;
    for (let i = 0; i < v.buffered.length; i++)
      if (rel >= v.buffered.start(i) && rel <= v.buffered.end(i) + 1) { v.currentTime = rel; return; }
    swap(target);   // 버퍼 밖 — 그 지점부터의 오프셋 스트림으로 즉시 이동
  };
  bar.addEventListener("input", onInput);
  bar.addEventListener("change", onChange);
  v.addEventListener("loadedmetadata", onMetadata);
  v.addEventListener("timeupdate", onTimeUpdate);
  return () => {
    bar.removeEventListener("input", onInput);
    bar.removeEventListener("change", onChange);
    v.removeEventListener("loadedmetadata", onMetadata);
    v.removeEventListener("timeupdate", onTimeUpdate);
  };
}

// ── 동영상 열기 — HLS(적응형) 우선, 안 되면 프로그레시브 폴백 ──────────────
let curHls = null;
let playbackCleanup = null;
function destroyHls() {
  if (curHls) { try { curHls.destroy(); } catch (e) {} curHls = null; }
}
function releasePlayback() {
  if (playbackCleanup) { playbackCleanup(); playbackCleanup = null; }
  destroyHls();
  // DOM에서 지우는 것만으로는 Safari의 다운로드·디코더가 정리되지 않는다.
  document.querySelectorAll("#lbBody video, #lbBody audio").forEach(v => {
    v.pause();
    v.removeAttribute("src");
    v.querySelectorAll("source").forEach(s => s.remove());
    v.load();
  });
}
function attachPlaybackRecovery(v) {
  // iPadOS 16 실측: 수 분이 버퍼돼도 시작 시각 0.18초에서 HAVE_METADATA로 멈춤.
  // 받아 둔 범위 안의 작은 이동으로만 복구한다. 회선 지연·일시정지는 건드리지 않는다.
  let lastTime = v.currentTime, lastProgress = performance.now(), attempts = 0;
  const onSeeking = () => { lastTime = v.currentTime; lastProgress = performance.now(); };
  v.addEventListener("seeking", onSeeking);
  const timer = setInterval(() => {
    const now = performance.now(), at = v.currentTime;
    if (!v.isConnected) { stop(); return; }
    if (v.paused || v.ended || v.error || document.hidden) {
      lastTime = at; lastProgress = now;
      return;
    }
    if (Math.abs(at - lastTime) > 0.02) {
      lastTime = at; lastProgress = now; attempts = 0;
      return;
    }
    // 사용자가 탐색하는 동안은 더 기다린다. 충분히 버퍼됐는데 seeking마저
    // 끝나지 않는 경우에는 영구 대기하지 않고 같은 제한 안에서 복구한다.
    if (v.readyState >= 3 || now - lastProgress < (v.seeking ? 8000 : 4000) || attempts >= 2) return;
    for (let i = 0; i < v.buffered.length; i++) {
      const start = v.buffered.start(i), end = v.buffered.end(i);
      const target = Math.max(at + 0.25, start + 0.5);
      if (start > at + 0.5 || target - at > 0.75 || end - target < 0.5) continue;
      try {
        v.currentTime = target;
        lastTime = target; lastProgress = now; attempts++;
        v.dispatchEvent(new CustomEvent("playbackrecovery", { detail: { from: at, to: target } }));
      } catch (e) { lastProgress = now; attempts++; }
      break;
    }
  }, 500);
  function stop() { clearInterval(timer); v.removeEventListener("seeking", onSeeking); }
  return stop;
}
function progressiveVideo(v, it) {
  // 기존 경로 그대로 — 생방송 트랜스코드면 커스텀 시크바(attachSeekRescue)가 구출.
  v.src = mediaUrl(it);
  v.load();
  v.play().catch(() => {});
}
// hls.js 는 미디어 요소의 텍스트 트랙을 제 매니페스트 기준으로 정리한다. 우리 마스터는
// 화질 렁만 선언하므로(자막 그룹 0) 곁다리로 붙인 <track> 이 disabled 로 꺼진다 —
// 형제 자막이 있는 영화가 "사다리가 자란 순간부터" 자막을 잃는다(2026-08-04 회귀).
// → 붙은 직후 기본 트랙을 다시 켜고, 큐가 실리면 손을 뗀다(사용자의 수동 끄기 보존).
// 이벤트 이름에 기대지 않고 짧은 폴링으로 — hls.js 가 언제 모드를 건드리든 덮는다.
function keepSubsOn(v) {
  if (!v.textTracks || !v.textTracks.length) return;
  let n = 0;
  const t = setInterval(() => {
    const k = v.textTracks[0];
    if (!v.isConnected || !k || (k.cues && k.cues.length) || ++n > 20) { clearInterval(t); return; }
    if (k.mode !== "showing") k.mode = "showing";
  }, 250);   // 최대 5초
  return () => clearInterval(t);
}
// Safari는 변환 중인 길이 미상 MP4를 거부할 수 있다. 완성된 HLS가 준비될 때까지
// 기다리고 한 번 다시 붙인다. 준비 확인도 타임아웃·횟수·닫기 취소가 모두 유한하다.
function waitForPreparedHls(it, onReady, onFailure) {
  let active = true, checks = 0, retryTimer, timeoutTimer, request;
  async function check() {
    if (!active) return;
    if (++checks > 40) { active = false; onFailure(); return; }
    request = new AbortController();
    timeoutTimer = setTimeout(() => request.abort(), 8000);
    try {
      const r = await fetch(hlsUrl(it), { cache: "no-store", signal: request.signal });
      if (!active) return;
      if (r.ok) { active = false; onReady(); return; }
      if (![404, 502, 503, 504].includes(r.status)) {
        active = false; onFailure(); return;
      }
    } catch (e) { /* 일시적인 연결 오류도 준비 확인 횟수 안에서만 재시도 */ }
    finally { clearTimeout(timeoutTimer); }
    if (active) retryTimer = setTimeout(check, 3000);
  }
  check();
  return () => {
    active = false;
    clearTimeout(retryTimer); clearTimeout(timeoutTimer);
    if (request) request.abort();
  };
}
function openVideo(body, it) {
  body.innerHTML = `<video controls autoplay playsinline>${trackHtml(it, 0)}</video>`;
  const v = body.querySelector("video");
  const detachSeek = attachSeekRescue(v, it);
  const stopRecovery = attachPlaybackRecovery(v);
  const request = new AbortController();
  const preparedOnly = /Apple/.test(navigator.vendor || "")
    && !!v.canPlayType("application/vnd.apple.mpegurl");
  let active = true, fell = false, stopSubs, stopPrepare, preparing = false;
  const cap = document.getElementById("lbCap");
  const failed = () => {
    if (!active) return;
    destroyHls(); v.pause();
    cap.textContent = `${it.title || ""} — 재생하지 못했습니다. 잠시 후 영상을 다시 열어 주세요.`;
  };
  const onPlaying = () => {
    if (preparing) { preparing = false; cap.textContent = it.title || ""; }
  };
  v.addEventListener("playing", onPlaying);
  function startHls() {
    if (!active) return;
    if (window.Hls && Hls.isSupported()) {
      const h = new Hls();
      curHls = h;
      h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fallback(); });
      h.loadSource(hlsUrl(it)); h.attachMedia(v);
    } else {
      v.src = hlsUrl(it);
    }
    if (stopSubs) stopSubs();
    stopSubs = keepSubsOn(v);
    // 준비를 기다린 뒤의 자동 재생이 차단되면 기본 재생 버튼으로 시작할 수 있다.
    v.play().catch(() => {});
  }
  function fallback() {
    if (!active || !v.isConnected) return;
    if (fell) { if (preparedOnly && !stopPrepare) failed(); return; }
    fell = true;
    request.abort(); destroyHls();
    if (preparedOnly) {
      v.pause(); v.removeAttribute("src"); v.load();
      preparing = true;
      cap.textContent = `${it.title || ""} — 재생용 영상을 준비하고 있습니다…`;
      stopPrepare = waitForPreparedHls(it, () => {
        stopPrepare = null;
        if (active) startHls();
      }, () => { stopPrepare = null; failed(); });
    } else {
      progressiveVideo(v, it);
    }
  }
  playbackCleanup = () => {
    active = false;
    request.abort();
    if (stopPrepare) stopPrepare();
    detachSeek(); stopRecovery();
    if (stopSubs) stopSubs();
    v.removeEventListener("error", fallback);
    v.removeEventListener("playing", onPlaying);
  };
  if (qmode() === "auto" && window.Hls && Hls.isSupported()) {
    startHls();
    return;
  }
  if (qmode() === "auto" && v.canPlayType("application/vnd.apple.mpegurl")) {
    v.addEventListener("error", fallback);
    fetch(hlsUrl(it), { cache: "no-store", signal: request.signal })
      .then(r => {
        if (!active || fell) return;
        if (!r.ok) { fallback(); return; }
        startHls();
      })
      .catch(() => fallback());
    return;
  }
  progressiveVideo(v, it);
}

function boot() {
  if (!SLUG) {  // bare 루트 — 잠금.
    document.getElementById("crumb").textContent = "📁 공개파일";
    document.getElementById("main").innerHTML =
      '<div class="empty">🔒 이 주소로는 볼 수 없습니다.<br>공유받은 갤러리 주소(…/s/코드)로 접속하세요.</div>';
    return;
  }
  load("", []);
}

// path: "" = 갤러리 루트(담긴 폴더들) / "<fid>/<하위>" = 그 디렉토리. trail=브레드크럼 배열.
async function load(path, trail) {
  curTrail = trail || [];
  const main = document.getElementById("main");
  main.innerHTML = '<div class="empty">불러오는 중…</div>';
  let data;
  try {
    const r = await fetch(api("list?path=" + encodeURIComponent(path)), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    main.innerHTML = '<div class="empty">갤러리를 불러오지 못했습니다.<br>(맥이 꺼져 있거나 주소가 잘못됨)</div>';
    return;
  }
  if (data.error === "mac_offline") {
    main.innerHTML = '<div class="empty">🌙 맥이 꺼져 있어 지금은 볼 수 없습니다.<br>잠시 후 다시 시도하세요.</div>';
    return;
  }
  TITLE = data.title || "공개파일";
  document.title = TITLE;
  render(path, data);
}

function buildCrumb() {
  const crumb = document.getElementById("crumb");
  crumb.innerHTML = "";
  const seg = (label, handler) => {
    const sp = document.createElement("span");
    sp.textContent = label; sp.onclick = handler; crumb.appendChild(sp);
  };
  const sep = () => { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; crumb.appendChild(s); };
  seg(`📁 ${TITLE}`, () => load("", []));
  curTrail.forEach((t, i) => { sep(); seg(t.label, () => load(t.path, curTrail.slice(0, i + 1))); });
}

function render(path, data) {
  buildCrumb();
  const dirs = data.dirs || [], items = data.items || [];
  curItems = items;
  document.getElementById("count").textContent =
    [dirs.length ? dirs.length + "개 폴더" : "", items.length ? items.length + "개" : ""].filter(Boolean).join(" · ");
  const main = document.getElementById("main"); main.innerHTML = "";
  if (!dirs.length && !items.length) { main.innerHTML = '<div class="empty">이 폴더는 비어 있습니다.</div>'; return; }
  if (dirs.length) {
    const fd = document.createElement("div"); fd.className = "folders";
    if (items.length) fd.style.marginBottom = "18px";
    dirs.forEach(d => {
      const el = document.createElement("div"); el.className = "folder";
      el.innerHTML = `<div class="fname">📁 ${esc(d.name)}</div>`;
      el.onclick = () => load(d.path, curTrail.concat([{ path: d.path, label: d.name }]));
      fd.appendChild(el);
    });
    main.appendChild(fd);
  }
  if (items.length) {
    const grid = document.createElement("div"); grid.className = "grid";
    items.forEach((it, idx) => {
      const tile = document.createElement("div"); tile.className = "tile";
      if (it.thumb) {
        tile.innerHTML = `<img loading="lazy" src="${thumbUrl(it)}" alt="${esc(it.title)}">`
          + (it.kind === "video" ? '<div class="play">▶</div>' : "");
      } else if (it.kind === "audio") {
        tile.innerHTML = `<div class="noimg audio"><div class="ico">🎵</div><span>${esc(it.title)}</span></div>`;
      } else {
        tile.innerHTML = `<div class="noimg">📄<span>${esc(it.title)}</span></div>`;
      }
      tile.onclick = () => openLb(idx);
      grid.appendChild(tile);
    });
    main.appendChild(grid);
  }
}

function nextAudioIndex(from) {
  for (let i = from + 1; i < curItems.length; i++) if (curItems[i].kind === "audio") return i;
  return -1;
}

function openLb(idx) {
  const it = curItems[idx]; if (!it) return;
  lbIndex = idx;
  releasePlayback();
  document.getElementById("lbSeek").style.display = "none";
  syncQBtn(it.kind === "video");
  const body = document.getElementById("lbBody");
  if (it.kind === "video") {
    // 형제 자막(subs)을 <track> 으로 얹고, HLS(적응형) 우선·프로그레시브 폴백.
    openVideo(body, it);
  } else if (it.kind === "audio") {
    // 트랜스코드 층이 없다(브라우저가 무는 포맷만 audio 로 분류) — 원본 그대로 <audio>.
    body.innerHTML = `<div class="audiobox"><div class="ico">🎵</div>`
      + `<div class="atitle">${esc(it.title)}</div>`
      + `<audio controls autoplay src="${mediaUrl(it)}"></audio></div>`;
    // 곡이 끝나면 같은 폴더의 다음 곡으로 — 앨범 폴더를 연속으로 듣게. 끝에서 멈춘다(순환 없음).
    body.querySelector("audio").addEventListener("ended", () => {
      const n = nextAudioIndex(lbIndex);
      if (n >= 0) openLb(n);
    });
  } else if (it.kind === "photo") {
    body.innerHTML = `<img src="${mediaUrl(it)}">`;
  } else {
    body.innerHTML = `<div class="empty" style="color:#ccc">${esc(it.title)}<br>미리보기 없음</div>`;
  }
  document.getElementById("lbCap").textContent = it.title || "";
  document.getElementById("lb").classList.add("open");
}
function closeLb() {
  releasePlayback();
  document.getElementById("lb").classList.remove("open");
  document.getElementById("lbBody").innerHTML = "";
  document.getElementById("lbSeek").style.display = "none";
  document.getElementById("lbQ").style.display = "none";
  lbIndex = -1;
}
function step(d) {
  if (lbIndex < 0) return;
  let n = lbIndex + d;
  if (n < 0) n = curItems.length - 1; if (n >= curItems.length) n = 0;
  openLb(n);
}
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("lb").classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});
document.getElementById("lb").addEventListener("click", (e) => { if (e.target.id === "lb") closeLb(); });

boot();
</script>
