node: self
actions:
  python:
    description: 설치된 Python 라이브러리의 함수·생성자·메서드를 직접 호출하고 객체를 조합한다. 함수별 등록 불필요.
    target_description: 'modules(query,offset,limit): 설치 후보. describe(target 또는 receiver,name): 서명. call(target:"모듈:함수",args:[],kwargs:{} 또는 receiver,name): 직접 호출. getattr: 속성. export(receiver,format:list/records/bytes,options): 값/파일 변환. release(receiver): 참조 해제. result:auto/value/ref. 파이프는 receiver. 객체는 같은 IBL 실행에서만 유효하므로 종료 전에 값/파일로 변환. Python 효과는 unknown이며 자동 retry/reuse 없음. 제한 없는 주인만 사용. 현재 IBL(edition:2) 전용.'
    returns: scalar
    side_effect: true
    always_on: false
    runs_on: pc_only
    group: system
    router: handler
    tool: python_op
    target_key: op
    scope: workspace
    exempt: 현재 IBL 실행·주인 권한·실행별 객체 수명 필요 — 전용 종단 회귀로 검증
    keywords: [Python, 파이선, 파이썬, 라이브러리, numpy, pandas, 배열, 데이터프레임, 직접 호출]
    guides: [python_libraries.md]
    params:
      target: string
      receiver: object
      name: string
      args: array
      kwargs: object
      result: string
      format: string
      options: object
      query: string
      offset: integer
      limit: integer
      timeout: number
    ops:
      default: modules
      values:
        modules: 설치 배포판과 import 후보 탐색
        describe: 함수·클래스·객체 계약 조회
        call: 함수·생성자·메서드 직접 호출
        getattr: 속성·상수 읽기
        export: 객체를 값·파일로 변환
        release: 객체 참조 반납
    callable_contract:
      version: 1
      params:
        op: Text
        target: Text
        receiver: ForeignRef
        name: Text
        args: List
        kwargs: Record
        result: Text
        format: Text
        options: Record
        query: Text
        offset: Number
        limit: Number
        timeout: Number
      required: []
      pipe_input: receiver
      exclusive: [[target, receiver]]
      enums:
        op: [modules, describe, call, getattr, export, release]
        result: [auto, value, ref]
        format: [list, records, bytes]
      integers: [offset, limit]
      minimum: {offset: 0, limit: 1, timeout: 0.01}
      maximum: {limit: 200, timeout: 3600}
      variants:
        - when: {op: call}
          required_any: [[target, receiver]]
        - when: {op: getattr}
          required_any: [[target, receiver]]
        - when: {op: describe}
          required_any: [[target, receiver]]
        - when: {op: export}
          required: [receiver, format]
        - when: {op: release}
          required: [receiver]
      result: Unknown
      effects: [unknown]
      nondeterministic: true
      adapter: {protocol: python-call/1, stateful: true}
tool_json:
  header:
    id: python-runtime
    name: Python Libraries
    description: Python 함수와 객체를 IBL에서 직접 호출하는 실행 공급자
    version: 1.0.0
  tools:
    - name: python_op
      description: 현재 IBL의 직접 Python 호출. modules/describe/call/getattr/export/release.
      input_schema:
        type: object
        properties:
          op: {type: string}
        additionalProperties: false
