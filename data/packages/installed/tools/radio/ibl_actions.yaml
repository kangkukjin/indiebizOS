nodes:
  limbs:
    actions:
      radio:
        lands_on: body
        params:
          name: string
          query: string
        limb_op:
          op: media
          action: $op
          url: $stream_url
          volume: $volume
        member_transform: radio_member:control
        path_audited:
          at: '2026-10-20'
          impl: fa1eb2d31bfef8b2
        returns: effect
        description: 라디오 조작 — 방송국 검색·목록, 재생·정지·상태·음량, 즐겨찾기를 한 대상의 op로 제공.
        target_description: 'search: 전세계 방송국 검색(query/name, tag, country, language, limit). stations: 한국 방송사 채널
          목록(country 생략 또는 KR만 지원, broadcaster 옵션). play: station_id 또는 stream_url, name·volume·mode(client/host)
          옵션; 출력지는 요청 표면이 정한다. stop/status/volume: 현재 라디오 제어(volume 0~100). favorite_list/favorite_add/favorite_remove:
          주인 즐겨찾기 조회/등록/삭제. 추가는 station_id/stream_url 생략 시 현재 채널, 삭제는 name 또는 stream_url.'
        group: media
        target_key: op
        router: handler
        tool: radio_op
        ops:
          default: play
          returns:
            status: scalar
            search: items
            stations: items
            favorite_list: items
          side_effect:
            status: false
            search: false
            stations: false
            favorite_list: false
          exempt:
            status: 재생 기기 상태 — 상시 가용 아님
          values:
            search: 전세계 방송국 검색
            stations: 한국 방송사 채널 목록 (country 생략/KR)
            play: 라디오 재생 (station_id 또는 stream_url, 기본)
            stop: 라디오 중지
            status: 재생 상태 확인 (재생 중 채널·경과 시간)
            volume: 볼륨 조절 0~100 (스트림 재시작 방식 — 재생 중이 아니면 거절)
            favorite_list: 즐겨찾기 목록
            favorite_add: 즐겨찾기 등록
            favorite_remove: 즐겨찾기 삭제
          fixture:
            search: '[limbs:radio]{op: "search", query: "jazz"}'
            stations: '[limbs:radio]{op:"stations"}'
            favorite_list: '[limbs:radio]{op:"favorite_list"}'
          lands_on:
            search: hub
            stations: hub
            favorite_list: false
            favorite_add: false
            favorite_remove: false
        implementation: radio_op가 탐색·재생·즐겨찾기를 분기한다. 회원 검색·방송국 목록은 허브, 재생 제어는 회원 기기, 즐겨찾기는 주인 전용. 볼륨 변경은 호스트 스트림
          재시작 방식.
        keywords:
        - 라디오
        - 인터넷라디오
        - 한국라디오
        - KBS
        - MBC
        - SBS
        - 라디오재생
        - 라디오듣기
        - 라디오중지
        - 재생상태
        - 볼륨
        - 음량
        app:
          edition: 2
          icon: 📻
          name: 라디오
          order: 5
          modes:
          - name: 한국
            auto_run: true
            buttons:
            - label: ■ 정지
              action: '[limbs:radio]{op: "stop"}'
            action: '[limbs:radio]{op: "stations"}'
            view:
            - type: list_action
              from: items
              icon: 📻
              title: '{name}'
              sub: '{broadcaster} · {description}'
              button:
                label: ▶
                action: '[limbs:radio]{op: "play", station_id: $item.station_id}'
              button2:
                label: ♡
                action: '[limbs:radio]{op: "favorite_add", station_id: $item.station_id, name: $item.name}'
          - name: 검색
            buttons:
            - label: ■ 정지
              action: '[limbs:radio]{op: "stop"}'
            inputs:
            - key: q
              type: text
              placeholder: 방송국 이름·태그  예) jazz, BBC
              required: true
            action: '[limbs:radio]{op: "search", query: $q, limit: 30}'
            view:
            - type: list_action
              from: items
              icon: 📻
              title: '{name}'
              sub: '{country} · {tags|trunc:40}'
              button:
                label: ▶
                action: '[limbs:radio]{op: "play", stream_url: $item.stream_url}'
              button2:
                label: ♡
                action: '[limbs:radio]{op: "favorite_add", stream_url: $item.stream_url, name: $item.name}'
          - name: 즐겨찾기
            auto_run: true
            buttons:
            - label: ■ 정지
              action: '[limbs:radio]{op: "stop"}'
            action: '[limbs:radio]{op: "favorite_list"}'
            view:
            - type: list_action
              from: items
              empty: 즐겨찾기가 없습니다 — 한국·검색 탭에서 ♡ 를 눌러 추가하세요
              icon: ♥
              title: '{name}'
              sub: '{added_at}'
              button:
                label: ▶
                action: "[if:$item.station_id != null and $item.station_id != \"\"] {\n  [limbs:radio]{op: \"play\"\
                  , station_id: $item.station_id}\n} [else] {\n  [limbs:radio]{op: \"play\", stream_url: $item.stream_url}\n\
                  }"
              button2:
                label: ✕
                action: '[limbs:radio]{op: "favorite_remove", name: $item.name}'
                refresh: true
        aliases:
          stream_url:
          - url
          name:
          - title
        requires:
          ops:
            favorite_list:
              principal:
              - owner
            favorite_add:
              principal:
              - owner
            favorite_remove:
              principal:
              - owner
tool_json:
  header:
    id: radio
    name: Radio Tools
    description: 인터넷 라디오 검색 및 재생 도구. Radio Browser API로 전세계 라디오를 검색하고, 한국 주요 방송사(KBS/MBC/SBS/TBS/CBS) 직접 스트리밍을 지원합니다.
      PC 스피커로 라디오를 들을 수 있습니다.
    version: 1.0.0
  tools:
  - name: radio_op
    description: '라디오 조작 — 방송국 검색·목록, 재생·정지·상태·음량, 즐겨찾기를 한 대상의 op로 제공. search: 전세계 방송국 검색(query/name, tag, country,
      language, limit). stations: 한국 방송사 채널 목록(country 생략 또는 KR만 지원, broadcaster 옵션). play: station_id 또는 stream_url,
      name·volume·mode(client/host) 옵션; 출력지는 요청 표면이 정한다. stop/status/volume: 현재 라디오 제어(volume 0~100). favorite_list/favorite_add/favorite_remove:
      주인 즐겨찾기 조회/등록/삭제. 추가는 station_id/stream_url 생략 시 현재 채널, 삭제는 name 또는 stream_url.'
    input_schema:
      type: object
      properties:
        volume:
          type: integer
          description: 볼륨 0-100 (op=play 시, 기본 70)
        op:
          type: string
          description: 수행할 동작 (ops 목록 참조)
        name:
          type: string
          description: '[search] 방송국 이름'
        station_id:
          type: string
          description: 방송국 ID (op=play 시)
        stream_url:
          type: string
          description: 스트림 URL (op=play 시)
        mode:
          type: string
          description: 출력지 (op=play 시) — client=보고 있는 기기에서 재생 / host=이 PC 스피커에서 재생. 생략하면 요청 표면이 정한다(원격런처·포털·폰=그
            기기, 데스크탑=이 PC).
        tag:
          type: string
          description: '[search] 장르 태그'
        country:
          type: string
          description: 'search: 국가 이름. stations: 생략 또는 KR만 지원.'
        language:
          type: string
          description: '[search] 언어'
        state:
          type: string
          description: '[search] 지역·주 이름 (Radio Browser state)'
        order:
          type: string
          description: '[search] 정렬 votes(기본)/clickcount/random/name/bitrate'
        bitrateMin:
          type: integer
          description: '[search] 최소 비트레이트 kbps'
        limit:
          type: integer
          description: '[search] 결과 수(기본 10)'
        broadcaster:
          type: string
          description: 'stations: KBS/MBC/SBS 등 (생략 시 전체)'
