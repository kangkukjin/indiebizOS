node: sense
actions:
  search_shopping:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [display]
    returns: items
    fixture: '[sense:search_shopping]{query: "노트북"}'
    shape_variants:
      site=enuri: '[sense:search_shopping]{site:"enuri", query:"밥솥", limit:3}'
    description: 새 상품 가격비교 검색. 다나와(기본)·에누리 공개 검색, 상품명·표시 가격·출처 링크. 다나와는 페이지 이동 지원. 중고는 [sense:used], 원천 밖 구매 조사는 구매 지도 참조.
    group: research
    target_description: |
      query=상품명(필수), site=danawa(기본)|enuri, limit=1..40(기본5; display 별칭).
      page=1..100은 다나와에서 지원(원천 40개 단위 페이지). sort는 두 원천 모두 default만 지원한다.
      에누리는 기본 정렬 첫 페이지의 JSON-LD 목록만 지원하며 page>1/다른 sort는 오류로 거절한다.
      items의 price는 숫자 문자열 또는 null(미확인). currency·price_status·price_basis·shipping_included·rental_hint 보존.
      최저가·표시가는 배송·쿠폰·옵션·렌탈 조건을 확정한 구매 총액이 아니다. total은 반환 건수, page_items는 파싱된 해당 페이지 건수다.
      site별 query·page·sort·source_url·observed_at으로 범위를 확인한다. 구조 변경·HTTP 실패는 정상 0건과 구분한다.
      두 원천은 &로 조합하고 한쪽 실패는 부분 결과를 회수한다. site=naver는 공식 API 종료 안내만 반환.
      홈쇼핑·제조사·해외몰·후기는 구매 지도에 따라 기존 search/crawl/browser로 보완한다. 중고는 [sense:used].
    guides: [shopping.md]
    router: handler
    tool: search_shopping
    implementation: tool_danawa.py는 공개 검색 HTML의 상품 카드 경계를 파싱하고 HTTP 실패 시 같은 인자·파서의 브라우저 폴백. tool_enuri.py는 검색어에 대응하는 공개 JSON-LD ItemList만 파싱. 표준 라이브러리 파서·urllib 폴백으로 폰 경로 유지. 네이버 공식 검색 API는 2026-07-31 종료.
    keywords:
    - 쇼핑
    - 상품
    - 가격비교
    - 최저가
    - 다나와
    - 에누리
    - 신제품
    - 구매
    - 물건값
    target_key: query
  used:
    # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
    #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
    #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
    aliases:
      query: [q]          # ★정본은 query(check_param_canon) — 관습어 q 는 별칭으로 수용
    returns: items
    fixture: '[sense:used]{source: "bunjang", query: "맥미니 m4 pro"}'
    # 원천별 변이 축(79회차 B79-3): fixture 하나(bunjang)로는 당근 경로 드리프트가 자가점검에 안 닿았다.
    # 원천마다 한 줄 — 주간 관측 스윕·정직성 스윕이 돌린다(0행 = 불변식 G 경보).
    shape_variants:
      source=danggeun: '[sense:used]{source: "danggeun", query: "자전거", region: "역삼동", limit: 5}'
      source=joongna: '[sense:used]{source: "joongna", query: "자전거", limit: 5}'
      source=naver: '[sense:used]{source: "naver", query: "자전거", limit: 5}'
    description: 중고 C2C 매물 검색 (source 분기). 당근·번개장터·중고나라·네이버카페 중고 매물을 items 통화로. 자주 하는 중고 검색을 어휘화.
    group: research
    target_description: "중고 거래 매물 검색. source로 플랫폼 선택.\n- source=bunjang(기본): 번개장터 내부 API — 제목·가격·위치·링크가 담긴 깨끗한 매물. region=지역이름(예 \"청주\") 주면 위치 substring 후필터(반경 아님). ★번개장터엔 지역 검색 인자가 없어 전국 최신순을 최대 200행까지 훑어 거른다 — 위치 미표기 매물(대다수)은 판정 불가로 빠진다(unlocated). 봉투의 scanned=훑은 행 수, 상한에 닿아 limit 을 못 채우면 truncations(reason scan_limit). 0건은 '그 지역 매물 없음'이 아니라 '최신 표본에 없음'이다.\n- source=danggeun: 당근 — region=동이름(예 \"죽백동\", 필수) 그 동네+인근 동으로 스코프('내동네' 검색, 지역ID 자동 해소). ★동네 매물 검색엔 이걸 우선. 제목·가격·설명·사진·링크·매물 동(region)·상태. 당근 검색이 같은 요청에 간헐적으로 빈 목록을 주는 현상이 있어 0건이면 몇 번 다시 묻고, 그래도 0건이면 empty_notes 로 미확인임을 말한다.\n- source=joongna: 중고나라 web 검색(제목·가격·링크, best-effort 파싱).\n- source=naver: 네이버 카페 통합검색(중고나라 카페 등 게시글).\nquery=검색어(필수). limit=개수(기본15). region=지역 필터(bunjang=위치 substring 후필터 / danggeun=동네 스코프, 필수)."
    target_key: query
    router: handler
    tool: used_search
    scope: workspace
    implementation: source 분기 — bunjang=api.bunjang.co.kr find_v2.json(region 이면 40행×최대 5쪽 훑어 위치 후필터, scanned·unlocated·scan_limit 신고) / danggeun=regions/keyword 지역해소→/kr/search/buy-sell Remix 로더 JSON(_data=routes/kr.search.buy-sell._index)의 buySellArticles(구조 미발견=source_changed, 0건=최대 3회 재시도 후 empty_notes) / joongna=web RSC 파싱 / naver=api_call cafearticle. tool_used.py.
    keywords:
    - 중고
    - 중고거래
    - 중고매물
    - 번개장터
    - 중고나라
    - 당근
    - 당근마켓
    - 중고물건
    - 세컨핸드

tool_json:
  header:
    id: shopping-assistant
    name: 상품·중고
    description: 새 상품 가격비교와 중고 거래 매물을 검색합니다.
    version: 1.4.0
  tools:
  - name: search_shopping
    description: '새 상품 가격비교 — 다나와(페이지 이동)와 에누리(기본 첫 페이지). 표시 가격은 구매 총액이 아니며 price=null은 미확인. {items:[{name,price,mall,link,image,category,site,spec}],total}에 원천·조회 범위를 보존. 중고는 [sense:used]. site=naver는 종료 안내.'
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색할 상품명
        site:
          type: string
          description: 가격비교 원천 — danawa(기본), enuri(기본 첫 페이지), naver(종료 안내)
          enum:
          - danawa
          - enuri
          - naver
          default: danawa
        limit:
          type: integer
          description: 해당 페이지에서 반환할 개수 (1..40)
          minimum: 1
          maximum: 40
          default: 5
        page:
          type: integer
          description: 다나와 40개 단위 페이지(1..100). 에누리는 1만 지원
          minimum: 1
          maximum: 100
          default: 1
        sort:
          type: string
          description: 원천 기본 정렬만 지원
          enum: [default]
          default: default
      required:
      - query
  - name: used_search
    description: '중고 C2C 매물 검색. source로 플랫폼 선택 — bunjang(번개장터, 내부 API,
      위치 포함·region 후필터·기본), danggeun(당근, region=동이름으로 동네+인근 스코프 —
      동네 매물엔 우선), joongna(중고나라 web), naver(네이버 카페 중고 게시글).
      통화: {records: [{title, meta, summary, url, image}], total, source}.'
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색어 (예 "맥미니 m4 pro")
        source:
          type: string
          description: 검색 플랫폼 (동네 매물=danggeun+region, 위치 표기 매물=bunjang+region)
          enum:
          - bunjang
          - danggeun
          - joongna
          - naver
          default: bunjang
        region:
          type: string
          description: 지역 필터 — bunjang=위치 substring 후필터(예 "청주", 전국 최신 최대 200행 표본), danggeun=동이름(예 "죽백동", 필수 — 그 동네+인근 동 스코프)
        limit:
          type: integer
          description: 결과 개수 (기본 15)
          default: 15
      required:
      - query
