node: sense
actions:
  search_shopping:
    returns: items
    fixture: '[sense:search_shopping]{query: "노트북"}'
    description: 새 상품 가격비교 검색 (다나와 — 상품명·최저가·스펙·링크). 순수 HTTP 라 PC·폰 모두 동작. ★중고 매물은 [sense:used] 가 정본(2026-08 site=used/all 은퇴). ★site=naver 도 은퇴(공식 API SE05 + 내부 API 봇차단).
    group: research
    target_description: "새 상품 가격비교 검색. query=상품명(필수). display=개수(기본 5).\n다나와 가격비교 — 상품명·최저가·스펙 요약·상품 링크. 순수 HTTP 라 폰에서도 동작.\n★중고 매물은 이 어휘가 아니라 [sense:used] — 소스 넷(번개장터·당근·중고나라·네이버카페)에 동네 스코프까지 된다.\n★site 는 danawa(기본) 하나뿐이다. 옛 used/all 축은 2026-08 은퇴(두 사이트 개편으로 스크래핑이 0건, [sense:used] 가 같은 소스를 내부 API 로 더 잘 준다) — 넣으면 다나와 결과 + 안내 note 를 준다. site=naver 도 죽었다(안내만 반환)."
    router: handler
    tool: search_shopping
    implementation: 'tool_danawa.py — 다나와 검색 HTML(search.danawa.com/dsearch.php) SSR 파싱. 봇차단·TLS 지문 검사 없어 stdlib urllib 만으로 200(curl_cffi 위장 불요) → 폰서도 로컬 실행. Playwright 는 폴백(PC 전용, 실측 정상 동작). ★site=used/all 은퇴(2026-08-04): 중고나라·번개장터 Playwright 스크래핑이 사이트 개편으로 라이브 0건 + except:pass 로 침묵 — 같은 두 소스를 [sense:used] 가 내부 API 로 준다. ★site=naver 은퇴: 공식 /v1/search/shop.json=404 SE05, 내부 API(api/search/all·ns/v1/paged-composite-cards)=418 WAF, headed 브라우저조차 ncpt 캡차(sus_val·X-Wtm-Cpt-Tk), robots Disallow /.'
    keywords:
    - 쇼핑
    - 상품
    - 가격비교
    - 최저가
    - 다나와
    - 신제품
    - 구매
    - 물건값
    target_key: query
  used:
    returns: items
    fixture: '[sense:used]{source: "bunjang", query: "맥미니 m4 pro"}'
    description: 중고 C2C 매물 검색 (source 분기). 당근·번개장터·중고나라·네이버카페 중고 매물을 items 통화로. 자주 하는 중고 검색을 어휘화.
    group: research
    target_description: "중고 거래 매물 검색. source로 플랫폼 선택.\n- source=bunjang(기본): 번개장터 내부 API — 제목·가격·위치·링크가 담긴 깨끗한 매물. region=지역이름(예 \"청주\") 주면 위치 substring 후필터(반경 아님).\n- source=danggeun: 당근 — region=동이름(예 \"죽백동\") 주면 그 동네+인근 동으로 스코프('내동네' 검색, 지역ID 자동 해소). ★동네 매물 검색엔 이걸 우선. 제목·가격·설명·사진·링크.\n- source=joongna: 중고나라 web 검색(제목·가격·링크, best-effort 파싱).\n- source=naver: 네이버 카페 통합검색(중고나라 카페 등 게시글).\nquery=검색어(필수). limit=개수(기본15). region=지역 필터(bunjang=위치 substring / danggeun=동네 스코프)."
    target_key: query
    router: handler
    tool: used_search
    scope: workspace
    implementation: source 분기 — bunjang=api.bunjang.co.kr find_v2.json(위치 후필터) / danggeun=regions/keyword 지역해소→/kr/buy-sell JSON-LD ItemList(전체결과 한방) / joongna=web RSC 파싱 / naver=api_call cafearticle. tool_used.py.
    keywords:
    - 중고
    - 중고거래
    - 중고매물
    - 번개장터
    - 중고나라
    - 당근
    - 당근마켓
    - 중고물건
    - 세컨핸드
  freelance:
    aliases:
      query: [q, keyword]
    returns: items
    fixture: '[sense:freelance]{query: "로고디자인"}'
    description: 프리랜서·외주 서비스 검색 (source 분기, 현재 kmong=크몽). type=gigs(기본)=서비스 상품(제목·가격·평점·판매자) / type=experts=전문가 프로필(등급·경력·응답시간·주문수·전문분야). 통화 items.
    group: research
    target_description: "프리랜서·외주 서비스 검색. query=검색어 필수(예 \"로고디자인\", \"번역\", \"영상편집\").\n- type=gigs(기본): 서비스 상품 검색 — 제목·가격·평점·리뷰수·판매자·카테고리. max_price=가격 상한(원, 후필터).\n- type=experts: 전문가(프리랜서) 검색 — 닉네임·등급(MASTER 등)·자기소개·경력·평균 응답시간·누적 주문수·전문분야·만족도. 사람을 찾을 땐 이쪽.\nsort=ranking(인기, 기본)/score(연관도). limit=개수(기본 20, 페이지 자동추적 최대 100). source=kmong(기본, 현재 유일)."
    target_key: query
    router: handler
    tool: freelance_search
    scope: workspace
    implementation: tool_freelance.py — 크몽 비공식 내부 API(api.kmong.com/gig-app — gigs=/gig/v2/gigs/search, experts=/seller-profile/v2/seller-profiles/search). curl_cffi 크롬위장(직방 선례), 인증 불요. ★HTML 크롤링 불가(클라이언트 fetch 구조, 첫 HTML 에 데이터 없음 실측). sortType 은 RANKING/SCORE 만 유효(그 외 400). 서비스 URL=kmong.com/gig/{id}, 전문가 URL=kmong.com/@{닉네임}.
    keywords:
    - 프리랜서
    - 외주
    - 크몽
    - 전문가
    - 의뢰
    - 용역
    - 로고제작
    - 디자인외주
    - 번역
    - 영상편집
    - 개발외주
    - 재능마켓
    app:
      instrument: freelance
      icon: 💼
      name: 외주
      order: 19
      modes:
      - name: 서비스
        inputs:
        - key: query
          type: text
          label: 검색어
          placeholder: '예: 로고디자인, 번역, 영상편집'
          required: true
        - key: sort
          type: select
          label: 정렬
          options:
          - value: ranking
            label: 인기순
          - value: score
            label: 연관도순
        action: '[sense:freelance]{type: "gigs", query: "$query", sort: "$sort"}'
        view:
        - type: card_list
          from: items
          empty: 서비스를 찾지 못했습니다
          card:
            title: '{title}'
            image: '{image}'
            lines:
            - '{meta}'
            - '{summary}'
            link:
              href: '{url}'
              label: 크몽에서 보기 →
      - name: 전문가
        inputs:
        - key: query
          type: text
          label: 검색어
          placeholder: '예: 로고디자인, 웹개발'
          required: true
        action: '[sense:freelance]{type: "experts", query: "$query"}'
        view:
        - type: card_list
          from: items
          empty: 전문가를 찾지 못했습니다
          card:
            title: '{title}'
            image: '{image}'
            lines:
            - '{meta}'
            - '{summary}'
            link:
              href: '{url}'
              label: 프로필 보기 →

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: shopping-assistant
    name: Shopping Assistant
    description: 다나와 및 중고 거래 사이트에서 상품 가격 비교 및 검색 도구. 최저가 찾기, 상품 정보 조회에 활용합니다.
    version: 1.2.0
  tools:
  - name: search_shopping
    description: '새 상품 가격비교 검색을 수행합니다. 다나와 가격비교(순수 HTTP — PC·폰 모두 동작).
      ★중고 매물은 이 도구가 아니라 [sense:used] 를 쓰십시오 — 중고 축(site=used/all)은 2026-08 은퇴했습니다
      (사이트 개편으로 스크래핑 0건, 같은 소스를 [sense:used] 가 내부 API 로 제공).
      ★네이버 축도 2026-08 은퇴 — 공식 API 404 SE05, 내부 API 418 봇차단, site:naver 는 안내만 반환.


      지원 사이트: danawa(기본)


      데이터 형식: {items: [{name, price, mall, link, image, category, site, spec}], total}'
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색할 상품명
        site:
          type: string
          description: 검색할 사이트 — danawa(기본이자 유일한 실동작 축, 가격비교·폰서도 동작). naver 는 은퇴(안내만 반환)
          enum:
          - danawa
          - naver
          default: danawa
        display:
          type: integer
          description: 검색 결과 개수 (최대 10)
          default: 5
      required:
      - query
  - name: used_search
    description: '중고 C2C 매물 검색. source로 플랫폼 선택 — bunjang(번개장터, 내부 API,
      위치 포함·region 후필터·기본), danggeun(당근, region=동이름으로 동네+인근 스코프 —
      동네 매물엔 우선), joongna(중고나라 web), naver(네이버 카페 중고 게시글).
      통화: {records: [{title, meta, summary, url, image}], total, source}.'
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색어 (예 "맥미니 m4 pro")
        source:
          type: string
          description: 검색 플랫폼 (동네 매물=danggeun+region, 위치 표기 매물=bunjang+region)
          enum:
          - bunjang
          - danggeun
          - joongna
          - naver
          default: bunjang
        region:
          type: string
          description: 지역 필터 — bunjang=위치 substring(예 "청주"), danggeun=동이름(예 "죽백동", 그 동네+인근 동 스코프)
        limit:
          type: integer
          description: 결과 개수 (기본 15)
          default: 15
      required:
      - query
  - name: freelance_search
    description: '프리랜서·외주 서비스 검색 (크몽 내부 API). type=gigs(서비스 상품 —
      제목·가격·평점·판매자) / type=experts(전문가 프로필 — 등급·경력·응답시간·주문수·전문분야).
      통화: {items: [{title, meta, summary, url, image, price}], total, source, type}.'
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색어 (예 "로고디자인", "번역", "영상편집")
        type:
          type: string
          description: gigs=서비스 상품(기본) / experts=전문가(프리랜서 사람 찾기)
          enum:
          - gigs
          - experts
          default: gigs
        source:
          type: string
          description: 플랫폼 (현재 kmong 만)
          enum:
          - kmong
          default: kmong
        sort:
          type: string
          description: ranking=인기순(기본) / score=연관도순
          enum:
          - ranking
          - score
          default: ranking
        max_price:
          type: integer
          description: 가격 상한 (원, gigs 전용 후필터)
        limit:
          type: integer
          description: 결과 개수 (기본 20)
          default: 20
      required:
      - query
