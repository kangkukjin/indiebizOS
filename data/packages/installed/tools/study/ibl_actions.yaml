node: sense
actions:
  paper:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [max_results]
    # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
    #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
    #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
    params:
      arxiv_id: string
      pmcid: string
    returns: items
    side_effect: true    # download 가 PDF 를 로컬에 저장한다
    fixture: '[sense:paper]{query: "attention"}'
    description: 학술 논문·학위논문 검색·다운로드 (op 분기). source로 DB 선택. 웹 검색은 search, 라이브러리 문서는 devdocs.
    target_description: "op로 분기 (기본 search).\n- search: query(필수) + source(기본 openalex) + max_results.\n  · openalex=범용 학술(분야무관, 기본), arxiv=AI/CS/물리/수학 프리프린트, pubmed=생의학/의학, semantic=AI/ML 심층(인용그래프·관련논문).\n  · nanet=국내 학술논문·학위논문(국회도서관 국가학술정보). 한국 인물·국내 학위 추적의 핵심 — 서울대 박사논문 등 신원의 결정적 닻. type(예 학위논문)·year로 좁힘.\n- download: source(arxiv|pubmed) + id(arxiv_id 예 2301.07041 / PMC ID 예 PMC1234567) + filename(선택).\n"
    target_key: op
    group: research
    router: handler
    tool: paper_op
    ops:
      default: search
      returns:
        download: effect
      side_effect:
        search: false
      values:
        search: 논문·학위논문 검색 (source openalex/arxiv/pubmed/semantic/nanet)
        download: 논문 PDF 다운로드 (source arxiv/pubmed)
    implementation: study 패키지 op/source 분기. search=openalex/arxiv/pubmed/semantic_scholar/nanet(searchTotal — 페이지당 5건 고정·pageNo 추적, type/year=후필터), download=arxiv/pubmed_pdf.
    keywords:
    - 논문
    - 학술
    - arxiv
    - pubmed
    - 논문검색
    - 학위논문
  researcher:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [max_results]
    returns: items
    side_effect: false    # 전 op 읽기 전용
    fixture: '[sense:researcher]{op: "find", query: "정은정"}'
    description: 연구자(학자) 검색 (op 분기, 국회도서관 국가학술정보). 동명이인을 소속·출생연도로 분리. 일반 인물은 search(웹 검색).
    target_description: "op로 분기 (기본 find).\n- find: name(한글, 필수) + org(소속 — 동명이인 압축) + name_en + max_results.\n  반환 열: name·org·birth_year·position·lodID·name_en (+ 표시용 title·meta·summary·url). 흔한 이름이 사람 단위로 갈라짐(웹 검색이 못 넘는 동명이인 벽 해소).\n- coauthor: name(연구자 이름, 필수) → 같은 열의 연관연구자망(함께 연구한 학자들). 협업 이름들로 신원 재확인.\n  주의: 이름 기반이라 동명이인의 연관연구자가 합쳐져 옴 — find의 소속과 교차 검증.\n"
    target_key: op
    group: research
    router: handler
    tool: researcher_op
    ops:
      default: find
      fixture:
        coauthor: '[sense:researcher]{op: "coauthor", name: "정은정"}'
      values:
        find: 연구자 검색 (이름→소속·출생연도·lodID, 동명이인 분리)
        coauthor: 연관연구자망 (이름→함께 연구한 학자들, 신원 재확인)
    implementation: study 패키지. find=authorView, coauthor=relAuthor(searchTerm=이름 — ID 스코핑·페이지네이션 없음) (국회도서관 LOSI OpenAPI, NANET_API_KEY).
    keywords:
    - 연구자
    - 학자
    - 인물찾기
    - 동명이인
    - 공저자
    - researcher
  entity:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [max_results]
    returns: items
    side_effect: false    # 전 op 읽기 전용
    fixture: '[sense:entity]{query: "강국진"}'
    description: 개체 해소·구조화된 사실 (op 분기, Wikidata 지식 그래프). 동명이인·동음이의를 QID로 못박고 속성·사실을 구조화. 일반 인물/뉴스는 search(웹 검색), 국내 연구자는 researcher.
    target_description: "op로 분기 (기본 resolve).\n- resolve: query(필수) + lang(기본 ko) + max_results → 후보 개체별 QID·라벨·설명. 동명이인/동음이의 해소(예 '강국진'=여러 인물). QID는 개체를 못박는 신원자.\n- detail: id(QID 예 Q42) 또는 query → 구조화된 속성·사실(출생·직업·소속 등, 속성:값 records). query만 주면 최상위 후보로 자동 해소.\n"
    target_key: op
    group: research
    router: handler
    tool: entity_op
    ops:
      default: resolve
      fixture:
        detail: '[sense:entity]{op: "detail", id: "Q42"}'
      values:
        resolve: 개체 후보 검색 (query→QID·라벨·설명, 동명이인/동음이의 분리)
        detail: 구조화된 사실 (QID→속성:값 records)
    implementation: study 패키지. Wikidata Action API — resolve=wbsearchentities, detail=wbgetentities(claims 라벨 해소). source 기본 wikidata(무API키).
    keywords:
    - 개체
    - 위키데이터
    - wikidata
    - 동명이인
    - 동음이의
    - 신원
    - 개체해소
    - QID
  world_bank:
    returns: items
    fixture: '[sense:world_bank]{indicator: "GDP", country: "한국"}'
    description: 세계은행 경제·사회 지표 시계열. 국가별 GDP·인구·교육 등 장기 비교 분석용. items 통화(연도+지표값 필드) 반환.
    group: world
    target_description: 지표명 또는 코드 (예 "GDP"/"인구"/"실업률" 자연어 가능, NY.GDP.MKTP.CD 코드도). country는 국가명(한국/미국) 또는 ISO 코드. 반환에 table={columns:[연도,지표],rows:[[연도,값],...]} 포함 — 그대로 table:chart{table:...}/spreadsheet{table:...}로 흘려보내 reshape 없이 시각화/표.
    router: handler
    tool: fetch_world_bank_data
    implementation: 세계은행 공개 API로 국가별 경제/사회 지표 시계열 조회
    target_key: indicator
# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: study
    name: Academic Research
    description: 학술 논문·연구자 검색, 여론 조사, 글로벌 경제 지표 접근 도구 (OpenAlex, arXiv, PubMed, 국회도서관 국가학술정보, Wikidata, World Bank)
    version: 1.3.0
  tools:
  - name: fetch_world_bank_data
    description: 'World Bank API를 사용하여 국가별 경제 및 사회 지표 데이터를 가져옵니다.


      ## World Bank API란?

      - 전 세계 국가의 경제 성장, 인구, 빈곤, 교육 등 수천 개의 지표 제공

      - 시계열 데이터(연도별) 분석에 최적화


      ## 주요 지표 코드 (Indicator Codes)

      - NY.GDP.MKTP.CD: GDP (현재 US$)

      - SP.POP.TOTL: 총 인구

      - FP.CPI.TOTL.ZG: 인플레이션 (소비자 물가, 연간 %)

      - SL.UEM.TOTL.ZS: 실업률 (총 노동력의 %)

      - NY.GDP.PCAP.CD: 1인당 GDP (현재 US$)


      ## 사용 시점

      - 국가별 경제 성장 트렌드 분석

      - 인구 통계 및 사회적 지표 확인

      - 보고서에 객관적인 통계 수치 삽입


      ## 반환 정보

      - 연도별 지표 값, 국가명, 지표명'
    input_schema:
      type: object
      properties:
        indicator:
          type: string
          description: '지표 코드 (예: ''NY.GDP.MKTP.CD'')'
        country:
          type: string
          description: '국가 코드 (ISO 3자리, 예: ''KOR'', ''USA'', ''all'')'
          default: all
        date:
          type: string
          description: '날짜 범위 (예: ''2010:2022'')'
        per_page:
          type: integer
          description: 페이지당 결과 수 (기본 50)
          default: 50
      required:
      - indicator
  - name: paper_op
    description: '학술 논문 검색·다운로드 (op 분기) — [sense:paper]. source로 DB 선택. 웹검색은 search, 라이브러리 문서는 devdocs.

      - op=search(기본): query + source(openalex 기본/arxiv/pubmed/semantic/nanet) + max_results. openalex=범용, arxiv=AI/CS/물리/수학
      프리프린트, pubmed=생의학, semantic=AI/ML 심층(인용그래프), nanet=국내 학술논문·학위논문(국회도서관, 한국 인물·국내 학위 추적). nanet은 type(예 학위논문)·year로 좁힘.

      - op=download: source(arxiv|pubmed) + id(arxiv_id 또는 PMC ID) + filename.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: search(기본)/download
        source:
          type: string
          enum:
          - openalex
          - arxiv
          - pubmed
          - semantic
          - nanet
          default: openalex
          description: 논문 DB. download는 arxiv|pubmed만. nanet=국내 학술논문·학위논문(국회도서관 국가학술정보)
        query:
          type: string
          description: '[search] 검색 쿼리'
        limit:
          type: integer
          description: '[search] 최대 결과 수(기본 5)'
        id:
          type: string
          description: '[download] arxiv_id(예 2301.07041) 또는 PMC ID(예 PMC1234567)'
        filename:
          type: string
          description: '[download] 저장 파일명(선택)'
      required: []
  - name: researcher_op
    description: '연구자(학자) 검색 (op 분기) — [sense:researcher]. 국회도서관 국가학술정보. 동명이인을 소속·출생연도·lodID로 분리. 일반 인물 OSINT는 search(웹 검색).

      - op=find(기본): name(한글, 필수) + org(소속, 동명이인 압축) + name_en + max_results → name·org·birth_year·position·lodID·name_en 구조 열(+표시용 공통 열).

      - op=coauthor: name(연구자 이름, 필수) → 같은 구조 열의 공저자망(이름 기반이라 동명이인 합산 주의).'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: find(기본)/coauthor
        name:
          type: string
          description: '[find/coauthor] 연구자 이름(필수)'
        name_en:
          type: string
          description: '[find] 연구자명(영문, 선택)'
        org:
          type: string
          description: '[find] 소속 기관(동명이인 압축, 선택)'
        limit:
          type: integer
          description: 최대 결과 수(기본 30)
      required: []
  - name: entity_op
    description: '개체 해소·구조화된 사실 (op 분기) — [sense:entity]. Wikidata 지식 그래프. 동명이인·동음이의를 QID로 못박음. 일반 인물 OSINT는 search(웹 검색), 국내 연구자는 researcher_op.

      - op=resolve(기본): query(필수) + lang(기본 ko) + max_results → 후보별 QID·라벨·설명. 동명이인/동음이의 분리.

      - op=detail: id(QID 예 Q42) 또는 query → 구조화된 속성·사실(출생·직업·소속 등). query만 주면 최상위 후보 자동 해소.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: resolve(기본)/detail
        source:
          type: string
          enum:
          - wikidata
          default: wikidata
          description: 지식 그래프. 현재 wikidata(무API키)만 지원.
        query:
          type: string
          description: '[resolve/detail] 개체명·검색어 (예 "강국진")'
        id:
          type: string
          description: '[detail] Wikidata QID (예 Q42). resolve로 먼저 획득.'
        lang:
          type: string
          description: 라벨 언어(기본 ko, 없으면 en 폴백)
          default: ko
        limit:
          type: integer
          description: '[resolve] 최대 후보 수(기본 7)'
      required: []
