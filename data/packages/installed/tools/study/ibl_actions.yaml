node: sense
actions:
  paper:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [max_results, display]
      query: [q, keyword]
    # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
    #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
    #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
    params:
      arxiv_id: string
      pmcid: string
      year: [string, integer]    # search — 발행연도 정확(= year_from·year_to 같은 값)
      type: string               # search source=nanet — 자료유형 후필터(학위논문|학술논문|단행본 또는 divFlag 값)
      page: integer              # search source=nanet — 시작 페이지(pageNo, 기본 1·페이지당 5건 고정)
      year_from: integer         # search — 발행연도 하한(원천별 지원은 param_support)
      year_to: integer           # search — 발행연도 상한
      open_access: boolean       # search — true=오픈액세스만(arXiv 는 전부 공개)
      sort_by: string            # search — relevance(기본)|cited|recent, 원천별 허용 값은 param_support
    # ★77회차 B77-1(2026-09-29): 원천마다 읽는 선택 인자가 달라 arXiv 최신순·연도 하한이 조용히 버려졌다.
    #   이 표가 단일 소스 — 판본 2 계약 생성기가 source 조건부 계약(금지 인자·허용 값)으로 투영해 check 가
    #   거절하고, 핸들러도 같은 표로 거절한다. 모르는 source 도 거절(기본 원천인 척 삼키지 않는다).
    param_support:
      axis: source
      default: openalex
      params: [year, year_from, year_to, sort_by, open_access, type, page]
      aliases: {pmc: pubmed, semantic_scholar: semantic, s2: semantic, kr: nanet, dissertation: nanet, 국회도서관: nanet}
      values:
        openalex: {year: any, year_from: any, year_to: any, open_access: any, sort_by: [relevance, cited, recent]}
        arxiv: {year: any, year_from: any, year_to: any, open_access: any, sort_by: [relevance, recent]}
        pubmed: {year: any, year_from: any, year_to: any, open_access: any, sort_by: [relevance, recent]}
        semantic: {year: any, year_from: any, year_to: any, open_access: any, sort_by: [relevance]}
        nanet: {year: any, year_from: any, year_to: any, type: any, page: any}
    returns: items
    side_effect: true    # download 가 PDF 를 로컬에 저장한다
    fixture: '[sense:paper]{query: "attention"}'
    # 원천별 변이 축(79회차 B79-3 census — iblbuild_source_honesty): fixture 하나로는 나머지 원천의
    # 드리프트가 자가점검에 안 닿는다. 주간 관측 스윕·정직성 스윕이 돌린다(0행 = 불변식 G 경보).
    shape_variants:
      source=arxiv: '[sense:paper]{op: "search", query: "attention", source: "arxiv", limit: 3}'
      source=pubmed: '[sense:paper]{op: "search", query: "sleep", source: "pubmed", limit: 3}'
      source=semantic: '[sense:paper]{op: "search", query: "attention", source: "semantic", limit: 3}'
      source=nanet: '[sense:paper]{op: "search", query: "인공지능", source: "nanet", limit: 3}'
    description: 학술 논문·학위논문 검색·다운로드 (op 분기). source로 DB 선택. 웹 검색은 search, 라이브러리 문서는 devdocs.
    target_description: "선택 필터(원천별 지원 밖이면 check·실행이 거절) — 연도 year·year_from·year_to=전 원천, open_access=nanet 외, sort_by=openalex(relevance|cited|recent)·arxiv/pubmed(relevance|recent)·semantic(relevance), type·page=nanet. 반환 열: title·authors(전원)·year·journal/venue·citations·doi·arxiv_id/pmid 등 구조 칸 + 표시용 meta·summary·url. op로 분기 (기본 search).\n- search: query(필수) + source(기본 openalex) + max_results.\n  · openalex=범용 학술(분야무관, 기본), arxiv=AI/CS/물리/수학 프리프린트, pubmed=생의학/의학, semantic=AI/ML 심층(인용그래프·관련논문).\n  · nanet=국내 학술논문·학위논문(국회도서관 국가학술정보). 한국 인물·국내 학위 추적의 핵심 — 서울대 박사논문 등 신원의 결정적 닻. type(예 학위논문)·year로 좁힘.\n- download: source(arxiv|pubmed) + id(arxiv_id 예 2301.07041 / PMC ID 예 PMC1234567) + filename(선택).\n"
    target_key: op
    group: research
    router: handler
    tool: paper_op
    ops:
      default: search
      returns:
        download: effect
      side_effect:
        search: false
      values:
        search: 논문·학위논문 검색 (source openalex/arxiv/pubmed/semantic/nanet)
        download: 논문 PDF 다운로드 (source arxiv/pubmed)
    implementation: study 패키지 op/source 분기. search=openalex/arxiv/pubmed/semantic_scholar/nanet(searchTotal — 페이지당 5건 고정·pageNo 추적, type/year=후필터), download=arxiv/pubmed_pdf.
    keywords:
    - 논문
    - 학술
    - arxiv
    - pubmed
    - 논문검색
    - 학위논문
  researcher:
    aliases:   # ★정본(check_param_canon) — 관습어는 별칭으로 수용
      limit: [max_results, display]
      name: [name_ko, searchTerm, query]   # query: 핸들러가 name 의 대체로 읽고 fixture 도 쓴다 (2026-09-18 선언 보충)
      org: [orgName_ko]
      id: [lodID, authorID]
    returns: items
    side_effect: false    # 전 op 읽기 전용
    fixture: '[sense:researcher]{op: "find", query: "정은정"}'
    description: 연구자(학자) 검색 (op 분기, 국회도서관 국가학술정보). 동명이인을 소속·출생연도로 분리. 일반 인물은 search(웹 검색).
    target_description: "op로 분기 (기본 find).\n- find: name(한글, 필수) + org(소속 — 동명이인 압축) + name_en + max_results.\n  반환 열: name·org·birth_year·position·lodID·name_en (+ 표시용 title·meta·summary·url). 흔한 이름이 사람 단위로 갈라짐(웹 검색이 못 넘는 동명이인 벽 해소).\n- coauthor: name(연구자 이름, 필수) → 같은 열의 연관연구자망(함께 연구한 학자들). 협업 이름들로 신원 재확인.\n  주의: 이름 기반이라 동명이인의 연관연구자가 합쳐져 옴 — find의 소속과 교차 검증.\n"
    target_key: op
    group: research
    router: handler
    tool: researcher_op
    ops:
      default: find
      fixture:
        coauthor: '[sense:researcher]{op: "coauthor", name: "정은정"}'
      values:
        find: 연구자 검색 (이름→소속·출생연도·lodID, 동명이인 분리)
        coauthor: 연관연구자망 (이름→함께 연구한 학자들, 신원 재확인)
    implementation: study 패키지. find=authorView, coauthor=relAuthor(searchTerm=이름 — ID 스코핑·페이지네이션 없음) (국회도서관 LOSI OpenAPI, NANET_API_KEY).
    keywords:
    - 연구자
    - 학자
    - 인물찾기
    - 동명이인
    - 공저자
    - researcher

tool_json:
  header:
    id: study
    name: 논문·연구자
    description: 학술 논문 검색·다운로드와 연구자·공저자 조회.
    version: 1.4.0
  tools:
  - name: paper_op
    description: '학술 논문 검색·다운로드 (op 분기) — [sense:paper]. source로 DB 선택. 웹검색은 search, 라이브러리 문서는 devdocs.

      - op=search(기본): query + source(openalex 기본/arxiv/pubmed/semantic/nanet) + max_results. openalex=범용, arxiv=AI/CS/물리/수학
      프리프린트, pubmed=생의학, semantic=AI/ML 심층(인용그래프), nanet=국내 학술논문·학위논문(국회도서관, 한국 인물·국내 학위 추적). nanet은 type(예 학위논문)·year로 좁힘.

      - op=download: source(arxiv|pubmed) + id(arxiv_id 또는 PMC ID) + filename.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: search(기본)/download
        source:
          type: string
          enum:
          - openalex
          - arxiv
          - pubmed
          - semantic
          - nanet
          default: openalex
          description: 논문 DB. download는 arxiv|pubmed만. nanet=국내 학술논문·학위논문(국회도서관 국가학술정보)
        query:
          type: string
          description: '[search] 검색 쿼리'
        limit:
          type: integer
          description: '[search] 최대 결과 수(기본 5)'
        id:
          type: string
          description: '[download] arxiv_id(예 2301.07041) 또는 PMC ID(예 PMC1234567)'
        filename:
          type: string
          description: '[download] 저장 파일명(선택)'
      required: []
  - name: researcher_op
    description: '연구자(학자) 검색 (op 분기) — [sense:researcher]. 국회도서관 국가학술정보. 동명이인을 소속·출생연도·lodID로 분리. 일반 인물 OSINT는 search(웹 검색).

      - op=find(기본): name(한글, 필수) + org(소속, 동명이인 압축) + name_en + max_results → name·org·birth_year·position·lodID·name_en 구조 열(+표시용 공통 열).

      - op=coauthor: name(연구자 이름, 필수) → 같은 구조 열의 공저자망(이름 기반이라 동명이인 합산 주의).'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: find(기본)/coauthor
        name:
          type: string
          description: '[find/coauthor] 연구자 이름(필수)'
        name_en:
          type: string
          description: '[find] 연구자명(영문, 선택)'
        org:
          type: string
          description: '[find] 소속 기관(동명이인 압축, 선택)'
        limit:
          type: integer
          description: 최대 결과 수(기본 30)
      required: []
