# ③ 작업 접수증 어댑터(task_receipts) — kind: "모듈:함수". [self:task] 가 모르는 kind 를 만나면 여기서 적재한다.
task_kinds:
  script: "script_ops:task_status"
  sheet_op: "essentials_workspace:sheet_task_status"
  coding_run: "essentials_workspace:coding_run_status"

nodes:
  self:
    actions:
      time:
        callable_contract:
          version: 1
          params: {format: Text}
          required: []
          result: Text
          effects: [read_external]
          nondeterministic: true
          per_run: true
          adapter:
            protocol: legacy-envelope
            value_path: /message
        returns: scalar
        fixture: '[self:time]{}'
        description: 현재 시간 조회 (로컬 시스템 시계). 기본 출력에 날짜·시:분:초·시간대 이름·UTC 오프셋 포함.
        group: system
        target_description: format 으로 출력 포맷 지정 (생략 시 %Y-%m-%d %H:%M:%S %Z%z).
        router: handler
        tool: get_current_time
        implementation: Python datetime으로 현재 시간 조회 (로컬 시스템 시계)
      ask:
        returns: scalar
        pipe_in: true   # 앞 통화(_prev_result)를 읽는다 — 정적 검사 T3(죽은 이음매)의 소비자 선언 (2026-09-18)
        ai_call: true  # F14-4 (2026-08-20): 실행마다 모델 호출 — dry-run 고지·포털 기본 거부(포털은 self 노드 자체도 차단)
        exempt: LLM 원샷 호출 — 정기 실행 시 토큰 소모·비결정적이라 fixture 부적합
        description: 내 몸의 경량 모델에게 원샷으로 물어 답을 즉시 받는다(도구·다단계 없이 가볍고 빠름). 요약·개선·설명·변환·답변에. 앱·워크플로우처럼 AI 없는 표면이 AI를 한 줄로 부를 때. 다단계는 [others:delegate], 이웃 몸은 [others:ask].
        group: system
        target_description: prompt(지시/질문)에 할 일을, context(선택)에 대상 텍스트/데이터를 준다.
        target_key: prompt
        params:
          system: string   # 시스템 프롬프트 대체 — 생략 시 내장 조수 프롬프트 (2026-08-29 구현-읽기 감사 상환).
        router: handler
        tool: ai_ask
        implementation: consciousness_agent.oneshot_ai_call(role="background") — 모델은 기어가 분류 축으로 해소(세 프리셋 모두 경량 티어). 도구·다단계·대화맥락 없음.
        keywords: [질문, 물어봐, 요약, 개선, 설명, 변환, 답변, ask, ai, summarize, rewrite]
      read:
        callable_contract:
          version: 1
          read_resources: {file: path}
          params:
            path: Text
            offset: Number
            limit: Number
            format: Text
            pages: Text
            ocr: Bool
            tables: Bool
            sheet: Text
            max_rows: Number
            max_blocks: Number
            extract_images: Bool
            numbered: Bool
            tail: Number
            start_line: Number
            end_line: Number
          required:
          - path
          pipe_input: path
          result:
            text: Text
            blocks: List<Record>
            data: Unknown
          effects:
          - read_external
          adapter:
            protocol: document-value/1
            fixed_params:
              blocks: true
            value_path: /value
            attachments:
            - path
            - total_lines
            - start_line
            - end_line
          nondeterministic: true
        # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
        #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
        #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
        params:
          format: string
          limit: integer
          tables: boolean
          blocks: boolean   # 문단 items 분할 — B35-3 params 블록에 빠져 있던 실존 param (2026-08-24)
          # 2026-08-29 구현-읽기 감사 상환 — format 별 옵션(전부 read_file/office_ops 가 읽음).
          end: integer      # text 전용 — 끝 줄(별칭 아닌 계산이라 여기 선언, limit = end − offset 로 흡수).
          client: boolean   # 파일을 b64 봉투로 반환해 부른 몸(폰)이 네이티브 저장하게 한다.
          mime: string      # client 전용 — 저장 MIME 타입(생략 시 확장자로 추정).
          ocr: boolean       # pdf 전용 — 글자 없는 선택 페이지에 로컬 OCR(기본 true).
          pages: string     # pdf 전용 — 페이지 범위(예 '1-5').
          extract_images: boolean  # docx 전용 — 이미지 추출 여부(기본 true).
          max_blocks: integer      # docx 전용 — 블록(문단·표) 선택 상한(생략·0=전체).
          max_rows: integer        # xlsx/xls 전용 — 시트당 행 선택 상한(헤더 포함, 생략·0=전체).
          sheet: string            # xlsx/xls 전용 — 이 시트만 읽는다(생략=전체). office_ops.read_xlsx 가 읽는다 (2026-09-18 선언 보충)
          numbered: boolean  # text 전용 — 각 줄 앞에 줄번호(cat -n 모양). grep 줄번호·edit start_line 과 같은 자 (2026-09-05 그림자 관문)
          tail: integer      # text 전용 — 끝에서 N줄(1 이상), blocks에서도 동일. 앞쪽 범위 옵션과 동시 지정 불가.
        # ★셸 그림자(2026-09-05): 이 낱말로 표현되는 셸 명령 — 빌드가 data/shell_shadow.json 으로 파생하고
        #   실행기 훅·run_command 관문이 그 표로 거절하며 옮긴 문장을 돌려준다(backend/base/shell_shadow_gate.py).
        #   heads="명령 [필수 flag]" · argmap = 셸 인자 → param 대응(데이터) · 낱말 이름은 코드에 없다.
        shell_shadow:
          heads: [cat, head, tail, less, more, nl, "sed -n"]
          argmap:
            positional: [path]
            range_script: [start_line, end_line]     # sed -n '12,40p'
            flags_by_head:
              head: {"-n": limit}
              tail: {"-n": tail}
              cat: {"-n": numbered=true}
              nl: {}
        returns: scalar
        pipe_in: true   # 앞 통화(_prev_result)를 읽는다 — 정적 검사 T3(죽은 이음매)의 소비자 선언 (2026-09-18)
        columns_from: data   # 반환 열은 액션이 아니라 읽는 데이터(파일·원장·시트)가 정한다 — 정적 검사기는 fixture 열을 이 액션의 열로 쓰지 않는다(2026-09-05)
        # 변이 축이 op 이 아니라 **param** 인 통화 (F20-1 shape_variants 판정의 동형 —
        # "변이 축은 param" 문제를 op 로 바꾸지 않고 선언의 입도를 param 축으로 확장한다).
        # 평범한 read=본문 텍스트(진짜 scalar), 아래 모드에서만 통화가 나온다.
        # 2026-08-24 B36-3: 이 조건부가 선언에 없어서 08-19 스윕이 '표현 불가 straggler'
        # 로 유보했었다 — 런타임 shape 실측(action_health)이 이 선언과 대조된다.
        returns_variants:
          blocks=true: items    # 문단 분할 — items 26행 실측 (2026-08-24)
          tables=true: items    # pdf 표 추출 — {text, table, items} 완전 통화 (08-19 실측)
        exempt: '파일 경로 인자 필요(고정 fixture 부적합)'
        description: 파일 읽기 — 텍스트/PDF/DOCX/XLSX 통합. 확장자로 자동 인식(format 명시도 가능).
        group: file
        target_description: 'path는 읽을 파일 경로. format(text/json/csv/tsv/pdf/docx/xlsx/xls/hwp/hwpx/pptx/epub)은 생략 시 확장자로 정한다. 판본 2 반환은 Document{text,blocks,data}. text — offset/limit(0-기반 행 범위, limit:0은 빈 본문), start_line/end_line(1-기반 양끝 포함), tail(끝 N줄, 다른 범위와 병용 금지), numbered(줄번호). 역전·비정수·충돌 범위는 오류. docx/hwp/hwpx — offset/limit/max_blocks는 블록 단위. max_blocks는 생략·0이면 전체, 양수면 명시한 범위를 읽는다. pdf — pages는 1-기반 범위(예 "1-5,8"), tables:true는 .data.table로 표 추출. PDF text는 페이지 표지 없는 추출 본문이며 blocks.page는 1-기반이다. .data.page_text_chars와 .data.no_text_pages로 선택 페이지별 글자 수·추출 불가 페이지를 알린다. 글자 없는 선택 페이지는 로컬 Tesseract OCR을 자동 실행한다(ocr:false로 해제). .data.ocr_pages에 엔진·언어·상태·단어 신뢰도를, blocks.source에 native/ocr 출처를 남긴다. OCR 미설치·실패·빈 결과·낮은 신뢰도는 PARTIAL_SOURCE로 .partial에 읽은 Document를 보존한다. .data.incomplete_pages는 미완료 페이지다. OCR은 글자 인식이며 정확성 보증·표 구조 추출은 아니다. 0쪽·파싱 손상은 TOOL 오류의 details.error_type=corrupt다. xlsx/xls — sheet/max_rows, max_rows는 헤더를 포함한 행 선택 상한(생략·0=전체), 첫 행은 헤더, .data.table{columns,rows} 및 TSV text. pptx/epub — pages로 슬라이드/챕터 선택. extract_images:true는 임시 캐시에 그림을 추출한다(OCR과 별개). JSON 전체 읽기는 .data에 파싱 값을 보존한다(배열은 .data.items). JSON/CSV/TSV 전체 구조 읽기는 텍스트 미리보기의 100만 문자 상한을 적용하지 않는다. 오피스 문서도 기본 읽기는 전체이며 완전한 원문·구조는 내부 값과 결과 참조에 보존하고 모델 표시만 제한한다. 큰 자료는 IBL에서 집계·선택한 값만 반환하거나 결과 참조로 이어 쓴다. CSV/TSV 전체 읽기는 .data.items(헤더→문자열 셀)와 .data.table{columns,rows}; 인용된 구분자·줄바꿈을 보존하며 빈 셀은 빈 문자열, 0은 문자열 "0"이다. 텍스트 범위·절단 읽기는 구조 파싱 없이 .text로 남는다. 빈 파일은 빈 text. .data에는 일반 본문·구판 실행 봉투를 중복하지 않는다. 파일 부재는 NOT_FOUND, 원인·경로는 오류 details에 보존한다.'
        router: handler
        tool: read_op
        implementation: handler.py가 format 또는 확장자로 분기 — read_file/read_pdf/read_docx/read_xlsx(office_ops)·read_hwp/hwpx/pptx/epub(doc_read_extra)에 위임. 읽기 예외는 JSON 실패 봉투로 반환하며 파일 부재(not_found)·권한(permission)·I/O(io)의 error_type과 errno를 보존한다. 선택 파일은 self:list의 빈 목록으로 부재를 먼저 확인하고 필수 파일의 실패는 전파한다.
        # 회원 개방(외부 서비스 앱, 2026-09-14 docs/EXTERNAL_SERVICE_APP_HANDOFF.md §3-4): 회원 세션에서는
        # 회원 기기(손발)에서 돈다 — 번역표는 데이터(limb_op). 주인 세션에는 영향 없음.
        lands_on: body
        limb_op: {op: read, path: $path}
        member_transform: member_documents:read_document
        path_audited: {at: "2026-10-07", impl: "4e5664b66c13fad3"}  # 31회차 재감사: fs_grep 본문·문맥 처리만 변경. member_documents의 기기 수신/턴 임시경로·script의 기기 exchange 경로는 fs_grep 미사용·불변. 보고서 round_31/report.md
        target_key: path
        # start/end 흡수(2026-07-18): 모델이 ~30% 확률로 start/end 를 써 조용히 무시되고
        # 통파일이 오던 것(file_size_modularization 측정). start=offset 은 1:1 별칭,
        # end 는 계산(limit = end − offset)이라 핸들러 read_op 초입이 흡수.
        aliases:
          offset:
          - start
      fill:
        lands_on: body
        limb_op: {op: document_fill, path: $path}
        member_transform: member_documents:fill_document
        path_audited: {at: "2026-10-07", impl: "4e5664b66c13fad3"}  # 31회차 재감사: fs_grep 본문·문맥 처리만 변경. member_documents의 기기 수신/턴 임시경로·script의 기기 exchange 경로는 fs_grep 미사용·불변. 보고서 round_31/report.md
        # data 없이 부르는 introspection 모드가 필드 목록을 items 로 이미 내고 있었다
        # (office_ops._fill_pdf/_fill_docx) — 라벨만 effect 로 뒤처져 설명과 어긋났다.
        returns: items
        # ★채우기 모드는 실제로 문서를 쓴다 — 통화가 items 라고 안전까지 '읽기'가 되면 안 된다.
        side_effect: true
        # 템플릿 경로 인자에 의존 — self:read 선례.
        exempt: 템플릿 문서 경로 인자 필요(고정 fixture 부적합)
        description: 양식 채우기 — PDF 폼/DOCX 템플릿에 값을 넣어 완성 문서를 만든다. read 의 짝(문서→문서, 구조 보존). data 없이 부르면 채울 수 있는 필드 목록을 돌려준다(먼저 필드 파악 → 채우기).
        group: file
        target_description: 'path — 템플릿 문서(.pdf 폼 또는 {{자리표시자}} 든 .docx). data — 필드→값 매핑({이름: 값}); 생략하면 채울 수 있는 필드 목록 반환(introspection). output — 출력 경로(생략 시 원본 옆 _filled). flatten — PDF 전용, true면 폼을 정적 내용으로 구워 제출용(수정 불가, 기본 false). 스캔 이미지 PDF는 폼 필드가 없어 채울 수 없다(별도 OCR 대상).'
        aliases:
          # output_path — 형제 emitter 관습어 수용 (2026-08-29 구현-읽기 감사 상환).
          output: [output_path]
        router: handler
        tool: fill_op
        implementation: handler.py가 확장자로 분기 — PDF는 PyMuPDF widget 값 설정(+flatten=bake), DOCX는 {{자리표시자}} 치환. data 없으면 필드 열거.
        target_key: path
        keywords:
        - 양식
        - 폼
        - 채우기
        - 신청서
        - 서식
        - 작성
        - fill
        - form
      write:
        callable_contract:
          version: 1
          params:
            path: Text
            content: Text|List<Record>
            format: Text
            columns: List<Text>
          required:
          - path
          - content
          pipe_input: content
          write_resources: {file: path}
          result: Record
          effects:
          - write_external
          adapter:
            protocol: legacy-envelope
            value_path: ''
          nondeterministic: true
        # ★B35-3 ①(2026-08-24 #repair): op 하위 param 의 타입 단일 소스.
        #   target_key 는 액션의 주 param 하나뿐이라 op 어휘의 나머지 자리를 못 덮었다.
        #   빌드가 이 블록을 input_schema.properties 로 주입한다(어긋남이 존재 불가).
        params:
          spill: boolean
          columns: array
          format: string    # "json" = 통화 보존 스위치 (V53-1 ⓑ, 2026-09-02) — 파이프 통화를 {items, count} JSON 원장으로
        shell_shadow:
          heads: [tee]
          redirect: true                      # `… > 파일`·`>>` 리다이렉션(임시 폴더·/dev/null 제외)
          native: [Write]
          argmap:
            positional: [path]
            skeleton: {content: "<내용>"}
        returns: effect
        pipe_in: true   # 앞 통화(_prev_result)를 읽는다 — 정적 검사 T3(죽은 이음매)의 소비자 선언 (2026-09-18)
        # spill=true 는 봉투에 {items:[], ref:…} 를 실어 뒤 step 이 투명 해소한다 —
        # 통화가 계속 흐르는 파이프 통과자다. 액션 단위 effect 만 읽으면 이음매 정적
        # 검사(T2)가 `write{spill:true} >> [table:*]` 코퍼스 실례를 오거절한다
        # (2026-08-30 실측 2건). B36-3 param-조건부 통화 선언으로 정정.
        returns_variants:
          spill=true: items
        description: 텍스트 파일 새로 쓰기·덮어쓰기 (append 아님). 파이프 싱크 겸용 — content 생략 시 직전 step 결과를 저장(message 있으면 산문, 없으면 JSON). format:"json" 이면 items와 명시된 원문 본문을 함께 JSON으로 보존. spill:true 면 봉투에 참조(ref)만.
        group: file
