nodes:
  self:
    actions:
      time:
        returns: scalar
        fixture: '[self:time]{}'
        description: 현재 시간 조회 (로컬 시스템 시계, KST). 날짜·요일·시:분:초 반환.
        group: system
        target_description: format 으로 출력 포맷 지정 (생략 시 %Y-%m-%d %H:%M:%S).
        router: handler
        tool: get_current_time
        implementation: Python datetime으로 현재 시간 조회 (로컬 시스템 시계)
      ask:
        returns: scalar
        ai_call: true  # F14-4 (2026-08-20): 실행마다 모델 호출 — dry-run 고지·포털 기본 거부(포털은 self 노드 자체도 차단)
        exempt: LLM 원샷 호출 — 정기 실행 시 토큰 소모·비결정적이라 fixture 부적합
        description: 내 몸의 경량 모델에게 원샷으로 물어 답을 즉시 받는다(도구·다단계 없이 가볍고 빠름). 요약·개선·설명·변환·답변에. 앱·워크플로우처럼 AI 없는 표면이 AI를 한 줄로 부를 때. 다단계는 [others:delegate], 이웃 몸은 [others:ask].
        group: system
        target_description: prompt(지시/질문)에 할 일을, context(선택)에 대상 텍스트/데이터를 준다.
        target_key: prompt
        router: handler
        tool: ai_ask
        implementation: consciousness_agent.oneshot_ai_call(role="background") — 모델은 기어가 분류 축으로 해소(세 프리셋 모두 경량 티어). 도구·다단계·대화맥락 없음.
        keywords: [질문, 물어봐, 요약, 개선, 설명, 변환, 답변, ask, ai, summarize, rewrite]
      read:
        returns: scalar
        exempt: '파일 경로 인자 필요(고정 fixture 부적합)'
        description: 파일 읽기 — 텍스트/PDF/DOCX/XLSX 통합. 확장자로 자동 인식(format 명시도 가능).
        group: file
        target_description: 읽을 파일 경로 (생략 시 직전 파이프 step 결과의 파일 경로 자동 사용 — file_find | take:1 >> read). format 옵션 (text/pdf/docx/xlsx) — 생략 시 확장자 자동. text — offset/limit (라인, start/end 별칭 허용) 또는 start_line/end_line(1-기반 양끝 포함) 또는 blocks(빈 줄 기준 문단 items 로 분할, 문서 뷰어용). pdf — pages 옵션 (예 '1-5'), tables:true 면 표를 table{columns,rows} 통화로 추출(>> spreadsheet/filter 로 흐름 — 실선 표 기준). docx — offset/limit/max_blocks (블록 단위). xlsx — sheet(특정 시트명)/max_rows 옵션, 시트를 TSV 텍스트로. 스캔 PDF는 별도 OCR 필요.
        router: handler
        tool: read_op
        implementation: handler.py가 format 또는 확장자로 분기 — read_file/read_pdf/read_docx에 위임.
        target_key: path
        # start/end 흡수(2026-07-18): 모델이 ~30% 확률로 start/end 를 써 조용히 무시되고
        # 통파일이 오던 것(file_size_modularization 측정). start=offset 은 1:1 별칭,
        # end 는 계산(limit = end − offset)이라 핸들러 read_op 초입이 흡수.
        aliases:
          offset:
          - start
      fill:
        # data 없이 부르는 introspection 모드가 필드 목록을 items 로 이미 내고 있었다
        # (office_ops._fill_pdf/_fill_docx) — 라벨만 effect 로 뒤처져 설명과 어긋났다.
        returns: items
        # ★채우기 모드는 실제로 문서를 쓴다 — 통화가 items 라고 안전까지 '읽기'가 되면 안 된다.
        side_effect: true
        # 템플릿 경로 인자에 의존 — self:read 선례.
        exempt: 템플릿 문서 경로 인자 필요(고정 fixture 부적합)
        description: 양식 채우기 — PDF 폼/DOCX 템플릿에 값을 넣어 완성 문서를 만든다. read 의 짝(문서→문서, 구조 보존). data 없이 부르면 채울 수 있는 필드 목록을 돌려준다(먼저 필드 파악 → 채우기).
        group: file
        target_description: 'path — 템플릿 문서(.pdf 폼 또는 {{자리표시자}} 든 .docx). data — 필드→값 매핑({이름: 값}); 생략하면 채울 수 있는 필드 목록 반환(introspection). output — 출력 경로(생략 시 원본 옆 _filled). flatten — PDF 전용, true면 폼을 정적 내용으로 구워 제출용(수정 불가, 기본 false). 스캔 이미지 PDF는 폼 필드가 없어 채울 수 없다(별도 OCR 대상).'
        router: handler
        tool: fill_op
        implementation: handler.py가 확장자로 분기 — PDF는 PyMuPDF widget 값 설정(+flatten=bake), DOCX는 {{자리표시자}} 치환. data 없으면 필드 열거.
        target_key: path
        keywords:
        - 양식
        - 폼
        - 채우기
        - 신청서
        - 서식
        - 작성
        - fill
        - form
      write:
        returns: effect
        description: 텍스트 파일 새로 쓰기·덮어쓰기 (append 아님). 파이프 싱크 겸용 — content 생략 시 직전 step 결과를 저장(구 output op:file 흡수 2026-08-05). spill:true 면 봉투에 참조(ref)만 싣는다(뒤 step 은 투명 해소 — 데이터 흐름 불변).
        group: file
        target_description: 쓸 파일 경로 (절대 또는 상대) + content. content 생략 시 파이프의 직전 step 결과를 저장. 기존 파일은 묻지 않고 덮어쓴다. spill:true = 스필 싱크 — 결과 봉투에 {items:[], ref:{path,kind,count,bytes}} 만 실어 results[]·모델 컨텍스트를 덜어낸다. 뒤 step 은 참조를 투명 해소해 원래 데이터를 그대로 본다(흐름 불변). 나중에 다시 읽으려면 [self:read]{path}.
        router: handler
        tool: write_file
        implementation: Python 파일 I/O로 로컬 파일 쓰기. content 미지정 시 _prev_result(파이프 주입) 폴백 — RED 쓰기 안전판 경유(output op:file 은 이 안전판을 우회했었다).
        target_key: path
      list:
        returns: items
        fixture: '[self:list]{path: "."}'
        description: 디렉토리 안의 파일·하위 폴더 목록 조회 (ls 동등).
        group: file
        target_description: 조회할 디렉토리 경로. recursive 옵션으로 하위 포함 가능.
        router: handler
        tool: list_directory
        implementation: os.listdir/pathlib로 디렉토리 내용 조회
        target_key: path
      file_find:
        # 구 self:fs_query(파일 메타 검색, pc-manager) 흡수 (2026-08-05 어휘 중복 압축):
        # "파일 찾기"는 한 개념 — glob(패턴)이냐 OS 색인 메타(이름·확장자·크기·종류)냐는
        # 기제이지 어휘가 아니다. pattern 있으면 glob, 메타 파라미터만 있으면 Spotlight.
        aliases:
          min_size_mb: [min_size]
        returns: items
        fixture: '[self:file_find]{pattern: "*.md", path: "."}'
        description: 파일 검색 — pattern(glob) 또는 메타(search_term 이름·extension·kind·min_size_mb, OS 색인 직접·선스캔 불요·항상 최신). path로 검색 루트 지정(생략 시 glob=프로젝트, 메타=홈). 내용 검색은 grep.
        group: file
        target_description: 'pattern(glob, 예 ''*.md'', ''**/*.tsx'' — **나 / 없으면 자동 재귀) 또는 메타 검색: search_term(이름 부분일치)·extension(확장자)·kind(image/video/audio/pdf/any)·min_size_mb·sort(mtime/size)·limit(기본 100). path 옵션으로 검색 루트. 메타 결과 items + 표형 table={columns,rows} 키.'
        keywords:
        - 파일
        - 찾기
        - 검색
        - find
        - search
        - 파일찾기
        - 파일메타
        - 큰파일
        router: handler
        tool: glob_files
        implementation: pattern 있으면 pathlib.glob(max_results 상한, 기본 200). 메타 파라미터만 있으면 backend/file_index.query 위임(mdfind 무상태, 비색인 경로는 라이브 walk 폴백 — 구 pc-manager _query_storage 이식).
        target_key: pattern
        app:
          instrument: files
          icon: 🗂️
          name: 파일
          order: 16
          modes:
          - name: 검색
            auto_run: true
            inputs:
            - key: q
              type: text
              placeholder: 파일명·확장자 검색 (예 report, pdf)
            action: '[self:file_find]{search_term: "$q", limit: 50}'
            view:
            - type: card_list
              from: items
              card:
                title: '{title}'
                lines:
                - '{meta}'
                - '{path}'
          - name: 문서
            auto_run: true
            phone_render: false
            note: 최근 PDF·문서 (OS 색인 직접 — 스캔 불필요·항상 최신). 폰은 MediaStore=미디어 전용이라 문서 미색인 → mac/원격만.
            action: '[self:file_find]{kind: "pdf", sort: "mtime", limit: 50}'
            view:
            - type: card_list
              from: items
              card:
                title: '{title}'
                lines:
                - '{meta}'
                - '{path}'
          - name: 큰 파일
            auto_run: true
            note: 100MB 이상 — 용량 정리 대상 (큰 순).
            action: '[self:file_find]{min_size_mb: 100, sort: "size", limit: 50}'
            view:
            - type: card_list
              from: items
              card:
                title: '{title}'
                lines:
                - '{meta}'
                - '{path}'
      grep:
        aliases:
          root_path: [path]
          pattern: [query]
        returns: items
        fixture: '[self:grep]{pattern: "provider", path: "."}'
        description: 파일 내용에서 패턴 검색 (grep/ripgrep). items 통화(파일/줄번호/내용 필드) + total/truncated(절단 신고). 패턴은 기본 정규식(alternation 'a|b' 동작), regex=false면 리터럴. 파일명 검색은 find.
        group: file
        target_description: 검색 패턴 (기본 정규식, 'a|b' OR 가능). regex=false면 리터럴. path로 검색 루트, include로 확장자 필터. output_mode=content(매칭 라인, 기본)/files_with_matches(파일 목록)/count(파일별 매칭 수 — ★전수·결정적이라 집계엔 이것). content는 max_results(기본 100, 최대 2000)건 표본 + total(진짜 총 매칭 수)·truncated 봉투 키.
        keywords:
        - 검색
        - 내용검색
        - grep
        - 코드검색
        router: handler
        tool: grep_files
        implementation: 2층 — ripgrep(rg) 있고 ASCII 패턴이면 rg --json 고속 경로, 아니면(한글 패턴 포함) 파이썬 줄 스캔. 파이썬 경로는 utf-8→cp949→utf-8(replace) 인코딩 폴백으로 옛 한글(cp949) 문서 침묵 탈락 방지
        target_key: pattern
      edit:
        returns: effect
        description: 파일 부분 편집 (old_string → new_string 교체). 전체 덮어쓰기는 write.
        group: file
        target_description: 편집할 파일 경로. old_string/new_string 파라미터로 교체할 텍스트 지정.
        router: handler
        tool: edit_file
        implementation: Python 문자열 치환으로 파일 부분 편집
        target_key: path
      copy:
        returns: effect
        description: 파일 또는 폴더를 다른 위치로 복사 (원본 유지). 폴더는 재귀 복사. src 없이 파이프로 items를 받으면 그 파일들을 dest 폴더에 한꺼번에 저장(폰 사진 등).
        group: file
        target_description: 'src(원본 경로)와 dest(복사 위치) 두 파라미터. (source/destination 별칭도 허용) ★src를 생략하고 앞 액션 결과를 >> 로 넘기면 그 items의 파일 전부를 dest 폴더로 복사 — 몇 장을 고르는 일은 [table:take]/[table:filter]가 한다. items의 source가 usb면 USB 연결 폰에서 당겨 온다. 이름 충돌은 "(2)"로 피하고 덮어쓰지 않는다. 앞 단계가 **0행**이면 고장이 아니라 빈손 성공(0개 저장) — 통화 자체가 없을 때만 거절한다.'
        router: handler
        tool: copy_path
        implementation: shutil.copy/copytree로 파일/폴더 복사. src 생략 시 _copy_piped_items — _prev_result의 items를 dest 폴더로(usb 항목은 file_index.usb_pull). 통화 되읽기=common.currency 정본, 통화 없음/0행/비-레코드 3갈래 분간(F20-3 계약)
        target_key: source
      move:
        returns: effect
        description: 파일 또는 폴더 이동·이름 변경. 같은 폴더면 이름 변경, 다른 폴더면 이동.
        group: file
        target_description: src(원본)와 dest(이동/새 이름) 두 파라미터. (source/destination 별칭도 허용)
        router: handler
        tool: move_path
        implementation: shutil.move로 파일/폴더 이동/이름변경
        target_key: source
      delete:
        returns: effect
        description: 파일 또는 폴더 영구 삭제. 휴지통 거치지 않음 — 신중히 사용.
        group: file
        target_description: 삭제할 파일 또는 폴더 경로. 폴더는 재귀 삭제 (rmtree).
        router: handler
        tool: delete_path
        implementation: os.remove/shutil.rmtree로 파일/폴더 삭제
        target_key: path
      mkdir:
        returns: effect
        description: 빈 폴더 생성 (mkdir -p 동등, 중간 경로 자동 생성·이미 있으면 조용히 통과). 삭제는 delete, 이동·이름변경은 move.
        group: file
        target_description: 만들 폴더 경로 (절대 또는 상대). 중간 폴더가 없으면 함께 만든다. 이미 있어도 오류 아님.
        router: handler
        tool: make_directory
        implementation: os.makedirs(exist_ok=True)로 빈 디렉토리 생성
        target_key: path
      patch:
        returns: effect
        description: 자기개조 패치 — RED 코어 코드(backend/·frontend/·scripts/) 변경을 격리 사본(worktree)에서 다룬다. 수리 경로의 RED write/edit 은 자동으로 격리에 쌓이고(라이브 무변경), apply 가 기계검증 후 통과분만 라이브로 옮긴다. propose 제안도 apply{proposal_id} 로 집어간다.
        group: file
        ops:
          default: propose
          returns:
            status: items
          side_effect:
            status: false
          fixture:
            status: '[self:patch]{op: "status"}'
          values:
            propose: RED 변경을 격리 사본에 제안 + 기계검증 (라이브 무변경, 자율 태스크용 — 적용은 사용자 수리 턴의 apply{proposal_id})
            apply: 격리 변경을 검증 후 통과분만 라이브 적용(리로드 1회). proposal_id 주면 그 제안을 적용
            status: 스테이징 세션 + 적용 대기 제안 현황 — 무엇이 격리에 쌓여 있고 아직 라이브에 안 갔나
            discard: 격리 사본 폐기 (proposal_id 로 제안도 폐기). 라이브는 원래 무변경이라 되돌릴 것이 없다
        target_description: 'op — propose(기본): RED 변경을 격리 사본에 제안+검증만(라이브 무변경, 자율 태스크용. path + content 또는 old_string+new_string, reason 필수 — 남긴 제안은 나중에 apply{proposal_id} 로 집어갈 수 있다) / apply: 격리 변경을 검증(구문·import 스모크·IBL 삼각·안전장치 스모크) 후 통과분만 라이브 일괄 적용 — 리로드는 이때 한 번, 실패하면 라이브 무변경. proposal_id 를 주면 이 세션 대신 그 제안을 적용(재작업 불필요) / status: 스테이징 세션 + 적용 대기 제안 목록 / discard: 격리 사본 폐기(proposal_id 로 제안도). 라이브는 원래 무변경.'
        router: handler
        tool: patch_op
        implementation: repair_staging.py (system_essentials 형제 모듈) — 세션별 worktree(.worktrees/repair-<task>)에 라이브 원본을 씨로 스테이징, verify() 배터리, apply 가 _red_write_prepare/_red_write_finalize(백업·keeper·워치독)를 통과해 라이브 반영.
        target_key: op
        keywords:
        - 자기수정
        - 자기개조
        - 코어수정
        - propose
        - patch
        - backend수정
      webapp:
        returns: items
        # register/remove 가 data/webapps.json 을 쓴다 — op 하나라도 쓰기면 true (빌드 가드).
        side_effect: true
        fixture: '[self:webapp]{}'
