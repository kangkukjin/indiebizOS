        target_description: 'append/upsert 입력은 객체 행만 허용한다. item 문자열·items 안의 비객체는 쓰기 전 거절하고, 저장된 비객체 행도 select에서 조용히 누락하지 않고 손상 위치를 신고한다. items_file 은 맨 배열 파일 또는 [self:write]{format:"json"} 이 낸 {items,count} 봉투 파일(그 목록으로 받음, 2026-09-05). path(저장소 안·~workspace/ 가능) 필수. path와 items_file의 상대경로는 저장소 루트 기준이며 self:write의 프로젝트 기준과 다르다. 공유 파일은 양쪽에 ~workspace/ 접두 또는 쓰기 결과의 절대경로를 사용한다. op=select(기본): target(배열 자리, 점 경로)·fields(열 선택)·where(table:filter와 같은 조건: {field,op,value}·{필드:값}·문자열·AND 배열, 필드 점 경로 지원)·limit → items 통화(total=모집단, limit 으로 덜 내면 truncated) / append: item|items|items_file(큰 payload 는 [self:write] 로 파일에 고정한 뒤 가리킨다)·max_items(배열 상한 롤링) / upsert: key(기본 id)로 갱신·삽입 / set: target 필수 — target 없는 set 은 파일 전체를 갈아치우므로 거절, 정말 루트를 바꿀 때만 replace_root:true, set 에 key 를 주면 거절(target 오타). 쓰기 관문: enum_fields{필드:[허용값]}·list_limits{필드:{max_items,max_item_len}} — 넘으면 쓰지 않고 실패한다. 저장소 밖 쓰기 거절. 동일 경로 쓰기는 읽기부터 저장까지 직렬화한다. upsert 키는 IBL 공통 동등성(대소문자·유니코드 정규화, bool과 숫자 구분)을 따르며 병합된 최종 행도 관문으로 검증한다.'
        router: handler
        tool: ledger_op
        implementation: system_essentials/ledger_ops.py — 원자 쓰기(tmp+fsync+replace), 관문 넷(set target 필수·key 거절·enum_fields·list_limits) 전부 실사고 유래. 옛 등록 스크립트(2026-09-04 은퇴) 이식.
        target_key: op
        runs_on: anywhere
        params:
          path: string
          target: string
          key: string
          max_items: integer
          limit: integer
          replace_root: boolean
          items_file: string
        ops:
          default: select
          returns:
            append: effect
            upsert: effect
            set: effect
          side_effect:
            select: false
          fixture:
            select: '[self:ledger]{op: "select", path: "data/guide_db.json", target: "guides", fields: ["id"], limit: 3}'
          values:
            select: 배열의 필요한 열·행만 items 로 — target·fields·where·limit
            append: 항목 추가 — item|items|items_file, max_items 롤링, enum_fields·list_limits 관문
            upsert: key(기본 id) 기준 갱신·삽입 — 같은 관문
            set: target 자리의 값 교체 — target 필수, 루트 교체는 replace_root:true 명시
        keywords:
        - 원장
        - JSON 원장
        - 커버리지 원장
        - 순회 큐
        - 상태 기록
        - ledger
        - upsert
  sense:
    actions:
      sqlite:
        returns: items
        columns_from: data   # 반환 열은 질의·표가 정한다 — 정적 검사기는 fixture 열을 이 낱말의 열로 쓰지 않는다
        side_effect: false    # 읽기 전용 — mode=ro 연결 + 문장 머리 관문(SELECT/WITH/PRAGMA/EXPLAIN 만)
        runs_on: anywhere
        fixture: '[sense:sqlite]{op: "tables", path: "~workspace/data/ibl_usage.db"}'
        description: SQLite 파일 읽기 전용 조회 (op 분기) — query(SELECT → 행 items)·tables(표 목록·행 수)·schema(열 목록). 몸의 원장(.db)을 셸 sqlite3 대신 문장으로 본다. 쓰기는 거절.
        group: system
        target_description: 'op=query(기본): path(SQLite 파일 — ~workspace/·절대·저장소 상대)·query(SELECT/WITH/PRAGMA/EXPLAIN 만 — INSERT·UPDATE·DELETE·DDL 은 거절)·params(? 자리 값 목록)·limit(기본 200, 상한 2000; 명시한 유효 limit은 selection, 기본값·안전 상한은 source) → items(행 dict)+columns / tables: path → items(name·rows) / schema: path·table → items(cid·name·type·notnull·pk). BLOB은 {$blob:{bytes,hex}} 무손실 표현과 markers.blob_columns로 신고한다. 중복 열 이름은 AS로 구별해야 하며 설정 변경 PRAGMA는 거절한다. 표·열 이름을 모르면 tables→schema→query 순. 결과는 >> [table:filter]/[table:groupby] 로 흐른다.'
        router: handler
        tool: sqlite_op
        implementation: system_essentials/sqlite_ops.py — sqlite3 mode=ro URI 연결, 문장 머리 관문 + SQLite authorizer(실제 쓰기 연산·설정 PRAGMA 거절), fetchmany(limit+1) 로 절단 신고. 열 이름은 데이터(세계의 명사).
        target_key: op
        params:
          path: string
          query: string
          params: array
          limit: integer
          table: string
        shell_shadow:
          heads: [sqlite3]
          argmap:
            positional: [path, query]
            path_params: [path]
        ops:
          default: query
          side_effect:
            query: false
            tables: false
            schema: false
          fixture:
            tables: '[sense:sqlite]{op: "tables", path: "~workspace/data/ibl_usage.db"}'
            schema: '[sense:sqlite]{op: "schema", path: "~workspace/data/ibl_usage.db", table: "ibl_examples"}'
            query: '[sense:sqlite]{op: "query", path: "~workspace/data/ibl_usage.db", query: "SELECT name FROM sqlite_master WHERE type = ''table'' ORDER BY name", limit: 5}'
          values:
            query: SELECT 실행 — path·query(·params·limit) → 행 items + columns
            tables: 표 목록과 행 수 — 어떤 표가 있나
            schema: 한 표의 열 목록 — table 필수
        keywords:
        - sqlite
        - DB 조회
        - 원장 조회
        - SQL
        - 테이블
  table:
    actions:
      spreadsheet:
        params:
          items: array
        returns: effect
        pipe_in: true   # 앞 통화(_prev_result)를 읽는다 — 정적 검사 T3(죽은 이음매)의 소비자 선언 (2026-09-18)
        runs_on: pc_only
        description: items 통화 → xlsx 스프레드시트 산출. 값만(수식·서식 제외).
        target_description: 'path(출력 경로, .xlsx 자동 보정). 단일 시트: rows(행 배열, 각 행은 셀 배열) + headers(선택, 첫 행)/sheet_name(선택). 다중 시트: sheets={시트명: rows} (rows보다 우선). 표형 table={columns,rows} 파라미터도 수용(headers/rows로 매핑 — table:chart와 같은 입력 형태). bare 파일명은 프로젝트 outputs/로, 디렉토리를 적으면 그 자리에(형제 emitter 공통 규약). 읽기는 self:read{format=xlsx}.'
        group: chart
        router: handler
        tool: spreadsheet
        implementation: system_essentials handler.py가 openpyxl로 Workbook 생성 — sheets(다중) 또는 rows+headers(단일), 셀은 str/int/float로 강제.
        target_key: path
        keywords:
        - 스프레드시트
        - 엑셀
        - xlsx
        - 표
        - 시트
        - 장부

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: system_essentials
    name: System Essentials Kit
    description: 에이전트 기본 도구 모음. 파일 읽기/쓰기/검색, 작업 목록(todo) 관리, 계획 모드, 사용자 질문, 이웃(연락처) 조회 기능을 제공합니다. 모든 에이전트에게 기본 배분되는 핵심 패키지입니다.
    version: 1.1.0
    author: System AI
  tools:
  # 2026-07-03 미소유 도구 감사: 죽은 tool.json 항목 3개 제거(read_file/read_pdf/read_docx —
  # [self:read] read_op가 handler 내부에서 tool_name 재할당으로 위임, tool.json 불필요).
  # 아래 5개(run_command 등 최상위 인지 도구)는 산 배관.
  - name: write_file
    description: '파일에 내용을 씁니다 (기존 파일 덮어쓰기).


      사용법:

      - 새 파일 생성 또는 기존 파일 완전 교체

      - 디렉토리가 없으면 자동 생성


      주의사항:

      - 기존 파일 수정 시 반드시 먼저 read_file로 읽어야 함

      - 부분 수정은 edit_file 사용 권장 (전체 재작성 불필요)

      - 꼭 필요한 경우에만 파일 생성 - 기존 파일 편집 우선'
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: 파일 경로
        content:
          type: [string, array]
          description: 기록할 전체 내용. format:csv는 객체 행 목록을 받아 인용해 저장한다. 생략 시 파이프의 직전 step 결과(_prev_result)를 저장
      required:
      - file_path
  - name: list_directory
    description: '디렉토리의 파일/폴더 목록을 조회합니다.


      사용법:

      - 지정된 디렉토리의 직속 항목만 반환 (재귀 아님)

      - 파일/폴더 구분하여 표시


      주의사항:

      - 재귀적 탐색이 필요하면 glob_files 사용 (예: ''**/*'')

      - run_command로 ''ls -R'' 사용 금지 - 대용량 출력으로 토큰 초과 위험

      - 파일 내용 검색은 grep_files 사용'
    input_schema:
      type: object
      properties:
        dir_path:
          type: string
          description: '디렉토리 경로 (기본: 현재 작업 디렉토리)'
  - name: grep_files
    description: '파일 내용에서 텍스트/패턴을 검색합니다.


      사용법:

      - 매칭되는 라인과 라인 번호 반환

      - 패턴은 기본적으로 정규표현식 (alternation ''a|b'', 메타문자 동작). 리터럴 문자열로 검색하려면 regex=false

      - 파일 패턴으로 검색 범위 제한 가능


      사용 예시:

      - 함수 정의 찾기: pattern=''def my_function'', file_pattern=''*.py''

      - 클래스 찾기: pattern=''class.*Manager'', regex=true

      - 특정 문자열 검색: pattern=''TODO'', root_path=''./src''


      주의사항:

      - 위치 탐색은 output_mode=files_with_matches로 파일을 좁힌 뒤 content로 필요한 줄만 검색

      - total은 반환 행 단위(본문 모드=일치 줄, 파일/집계 모드=파일). 파일/집계 모드의 total_matches가 일치 줄 수

      - run_command로 grep/rg 사용 대신 이 도구 사용

      - 결과가 많을 수 있으니 file_pattern으로 범위 제한 권장'
    input_schema:
      type: object
      properties:
        pattern:
          type: string
          description: 검색할 텍스트 또는 정규표현식
        file_pattern:
          type: string
          description: '파일 패턴 (예: ''*.py'', ''*.js'')'
        root_path:
          type: string
          description: 검색 시작 경로
        regex:
          type: boolean
          description: '정규표현식 모드 (기본: true). false로 두면 패턴을 리터럴 문자열로 검색. 잘못된 정규식은 리터럴로 자동 폴백.'
        output_mode:
          type: string
          enum:
          - content
          - files_with_matches
          - count
          description: '출력 형태: content(매칭 라인, 기본) / files_with_matches(파일 목록) / count(파일별 매칭 수)'
        include_logs:
          type: boolean
          description: '로그(*.log·회전본) 포함 여부 (기본 false — 로그·_backups·.worktrees·spill 은 검색 모집단에서 제외)'
      required:
      - pattern
  - name: get_current_time
    description: '현재 날짜와 시간을 조회합니다.


      사용법:

      - 파라미터 없이 호출하면 기본 포맷으로 반환

      - 커스텀 포맷 지정 가능'
    input_schema:
      type: object
      properties:
        format:
          type: string
          description: '시간 포맷 (기본: %Y-%m-%d %H:%M:%S)'
  - name: ai_ask
    description: '시스템 AI에게 원샷 질문을 보내 답 텍스트를 받는다. 도구·다단계 없는 가벼운 호출 —
      요약·개선·설명·변환·답변에. 무언가를 만들거나 여러 단계가 필요하면 [others:delegate].'
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: AI에게 줄 지시 또는 질문 (필수)
        context:
          type: string
          description: 판단 대상이 되는 텍스트/데이터 (선택)
      required:
      - prompt
  # 산 배관(2026-07-03 감사): agent_cognitive._build_ibl_tools·system_ai_tools·api_xray가 tool.json에서 스키마 로드, system_tools→load_tool_handler로 실행 (최상위 도구)
  - name: run_command
    description: "쉘 명령어를 실행합니다. execute_ibl과 함께 에이전트의 두 가지 실행 경로 중 하나.\n\n주의사항 - 반드시 읽으세요:\n1. 파일/디렉토리 작업은 IBL 액션을 우선 사용:\n   - 디렉토리 목록: execute_ibl [self:list] (ls 대신)\n   - 파일 검색: execute_ibl [self:file_find] (find 대신)\n   - 내용 검색: execute_ibl [self:grep] (grep/rg 대신)\n   - 파일 읽기: execute_ibl [self:read] (cat/head/tail 대신)\n   - 파일 쓰기: execute_ibl [self:write] (echo > 대신)\n   - 파일 수정: execute_ibl [self:edit] (sed/awk 대신)\n\n2. Python/Node.js 코드 실행 — write→run 패턴:\n   - 멀티라인: [self:write]로 /tmp/*.py 파일 생성 후 run_command 'python3 /tmp/x.py'\n   - 한 줄: run_command 'python3 -c \"...\"' 또는 'node -e \"...\"'\n   - 별도의 execute_python/execute_node 도구는 없음 (이스케이프·traceback 손실 회피)\n\n3. 금지된 명령어 (대용량 출력 위험):\n   - ls -R, ls -la -R (재귀 목록)\n   - find / (루트 검색)\n   - cat 대용량파일\n   - 출력 제한 없는 검색 명령\n\n4. 위험 명령은 approved=true 필요:\n   - rm, rmdir (삭제)\n   - sudo (권한 상승)\n   - chmod, chown (권한 변경)\n\nrun_command가 어울리는 경우:\n- git 명령어 (git status, git log --oneline -10)\n- 패키지 관리 (npm install, pip install)\n\
      - 빌드/테스트 (npm run build, pytest)\n- 프로세스 관리 (ps, kill)\n- write→run 패턴의 실행 단계 (python3/node 스크립트 실행)\n- IBL 액션에 해당하지 않는 시스템 명령"
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: 실행할 쉘 명령어
        timeout:
          type: number
          description: '제한시간 초 (기본: 60, 최대: 300)'
        approved:
          type: boolean
          description: 위험 명령 승인 (rm, sudo 등)
      required:
      - command
  - name: glob_files
    description: 'glob 패턴으로 파일을 검색합니다. 프로젝트 안뿐 아니라 컴퓨터 어느 디렉토리든 검색 가능.


      ## 검색 범위 (path 파라미터)

      - 미지정: 프로젝트 디렉토리 (기본)

      - 절대경로: 그대로 사용 (예: ''/Users/me/Desktop'', ''/etc'')

      - ~ 시작: 홈 디렉토리 확장 (예: ''~/Documents'', ''~'')

      - 상대경로: 프로젝트 디렉토리 기준


      ## 패턴 동작

      - 패턴에 ''**''나 ''/''가 없으면 자동으로 모든 하위 디렉토리까지 검색 (''*.docx'' → ''**/*.docx'' 효과)

      - 명시적 재귀: ''**/*.py'' (모든 하위)

      - 디렉토리 한정: ''src/**/*.{js,ts}''


      ## 사용 예시

      - 프로젝트 안 Python 파일: pattern=''**/*.py''

      - 바탕화면의 docx: pattern=''*.docx'', path=''~/Desktop''

      - 컴퓨터 전체에서 특정 파일: pattern=''**/하네스*.docx'', path=''/Users''

      - 다운로드 폴더의 PDF: pattern=''*.pdf'', path=''~/Downloads''


      ## 결과

      - ''{총_매칭수}개 매칭 | root: {검색루트}'' 헤더 + 절대경로 목록

      - 기본 200개까지 반환 (max_results로 조정, 0이면 무제한 — 컨텍스트 폭주 주의)

      - 매칭 없으면 path 옵션 사용 힌트 안내


      ## 주의

      - run_command로 ''find'' 사용하지 말 것 — 이 도구가 컴퓨터 전체 검색 지원

      - 너무 넓은 범위(예: path=''/'')는 시간이 오래 걸리고 결과가 폭주'
    input_schema:
      type: object
      properties:
        pattern:
          type: string
          description: 'glob 패턴 (예: ''*.docx'', ''**/*.py''). ''**''나 ''/''가 없으면 자동 재귀. 생략 시 메타 검색 모드(search_term 등)'
        path:
          type: string
          description: 검색 루트. 절대경로(/Users/...), ~ 확장(~/Desktop), 상대경로(./src) 모두 가능. 미지정 시 glob=프로젝트 디렉토리, 메타=홈
        root_path:
          type: string
          description: (deprecated) path와 동일. path 사용 권장
        query:
          type: string
          description: (메타 검색) 파일명 부분일치 검색어 — OS 색인(Spotlight) 직접, 선스캔 불요
        extension:
          type: string
          description: (메타 검색) 확장자 필터 (pdf, jpg 등)
        kind:
          type: string
          description: (메타 검색) 종류 필터 — image/video/audio/pdf/any
        min_size_mb:
          type: number
          description: (메타 검색) 최소 크기 (MB)
        sort:
          type: string
          description: (메타 검색) 정렬 — mtime(최신순, 기본) | size(큰 순)
        limit:
          type: integer
          description: (메타 검색) 결과 개수 (기본 100)
  - name: edit_file
    description: '파일의 특정 부분을 수정합니다 (문자열 교체).


      사용법:

      - old_string을 new_string으로 교체

      - 파일 전체를 다시 쓰지 않고 정확한 위치만 수정


      주의사항:

      - 반드시 먼저 read_file로 파일 내용을 확인해야 함

      - old_string은 파일 내에서 고유해야 함 (중복되면 실패)

      - 중복되는 경우 더 많은 컨텍스트(주변 코드)를 포함

      - 들여쓰기(탭/스페이스)를 정확히 맞춰야 함

      - write_file보다 이 도구 사용 권장 (부분 수정에 적합)'
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: 파일 경로
        old_string:
          type: string
          description: 교체할 기존 문자열 (파일 내 고유해야 함)
        new_string:
          type: string
          description: 새 문자열
        replace_all:
          type: boolean
          description: 'true 면 old_string 이 여러 곳이어도 전부 교체 (기본 false = 파일 내 고유해야 함)'
        start_line:
          type: integer
          description: '줄 범위 편집 시작(1-기반 양끝 포함) — 주어지면 old_string 없이 [start_line, end_line] 을 new_string 으로 교체'
        end_line:
          type: integer
          description: '줄 범위 편집 끝(생략 시 start_line 한 줄)'
      required:
      - file_path
      - new_string
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: todo_write
    description: '작업 목록을 생성하고 관리합니다. 진행 상황을 추적하고 복잡한 작업을 체계적으로 관리합니다.


      ## 중요: 유일한 todo 도구

      이 도구가 todo 관련 유일한 도구입니다.

      - 항목 추가: 기존 목록 + 새 항목으로 전체 목록 작성

      - 상태 변경: 해당 항목의 status만 바꿔서 전체 목록 다시 작성

      - 항목 삭제: 해당 항목 제외하고 전체 목록 다시 작성


      ## 사용 시점

      1. 복잡한 다단계 작업 (3개 이상의 구분된 단계)

      2. 사용자가 여러 작업을 요청한 경우 (번호 목록, 쉼표로 구분)

      3. 신중한 계획이 필요한 비단순 작업


      ## 사용하지 않을 때

      1. 단일하고 직접적인 작업

      2. 추적해도 조직적 이점이 없는 사소한 작업

      3. 3단계 미만의 사소한 단계로 완료 가능한 작업

      4. 순수한 대화나 정보 요청


      참고: 사소한 단일 작업만 있다면 이 도구를 사용하지 마세요.


      ## 상태 관리

      - pending: 대기 중

      - in_progress: 진행 중 (한 번에 하나만)

      - completed: 완료


      작업 완료 시 상태를 completed로 표시하세요.'
    input_schema:
      type: object
      properties:
        todos:
          type: array
          description: 작업 목록
          items:
            type: object
            properties:
              content:
                type: string
                description: '작업 내용 (명령형: ''테스트 실행'')'
              status:
                type: string
                enum:
                - pending
                - in_progress
                - completed
                description: 상태
              activeForm:
                type: string
                description: '진행 중 표시 (현재형: ''테스트 실행 중'')'
            required:
            - content
            - status
            - activeForm
      required:
      - todos
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: ask_user_question
    description: '실행 중 사용자에게 질문이 필요할 때 사용합니다.


      ## 사용 시점

      1. 사용자 선호도나 요구사항 파악

      2. 모호한 지시 명확화

      3. 구현 방식 선택 필요

      4. 진행 방향에 대한 사용자 의견 필요


      ## 사용하지 않을 때

      1. 이미 충분한 정보가 있는 경우

      2. 합리적인 기본 선택이 명확한 경우

      3. 사용자가 이미 명시적 지시를 한 경우


      ## 사용법

      - 2-4개의 선택지 제공

      - 권장 옵션은 첫 번째에 배치하고 ''(권장)'' 표시

      - multiSelect=true로 복수 선택 허용 가능

      - 사용자는 항상 ''기타''로 직접 입력 가능


      참고: 플랜 모드에서는 요구사항 명확화에 사용하고, ''계획 진행할까요?''는 exit_plan_mode 사용'
    input_schema:
      type: object
      properties:
        questions:
          type: array
          description: 질문 목록 (1-4개)
          items:
            type: object
            properties:
              question:
                type: string
                description: 질문 내용
              header:
                type: string
                description: 짧은 라벨 (최대 12자)
              options:
                type: array
                description: 선택지 (2-4개)
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: 선택지 텍스트
                    description:
                      type: string
                      description: 선택지 설명
                  required:
                  - label
                  - description
              multiSelect:
                type: boolean
                description: 복수 선택 허용 (기본 false)
            required:
            - question
            - header
            - options
      required:
      - questions
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: enter_plan_mode
    description: '비단순 구현 작업 전 계획 모드로 전환합니다. 코드 작성 전 사용자 동의를 구하는 용도입니다.


      ## 사용 고려 상황

      단순하지 않은 구현 작업에서 사용을 고려하세요:

      1. 새 기능 구현 - 배치 위치, 클릭 시 동작 등 결정 필요

      2. 여러 접근 방식 가능 - 캐싱 방식, 성능 개선 전략 등

      3. 기존 동작/구조 변경 - 무엇이 바뀌어야 하는지 명확화

      4. 아키텍처 결정 - WebSocket vs SSE, 상태 관리 방식 등

      5. 다중 파일 변경 (2-3개 초과)

      6. 요구사항 탐색 필요 - 먼저 파악 후 범위 이해

      7. 사용자 선호도 중요 - 여러 방향 가능


      ## 사용하지 않을 때

      단순한 작업은 바로 진행:

      - 한두 줄 수정 (오타, 명확한 버그, 작은 조정)

      - 명확한 요구사항의 단일 함수 추가

      - 사용자가 상세한 구체적 지시를 한 경우

      - 순수 조사/탐색 작업 (구현 계획이 아님)


      ## 계획 모드에서 할 일

      1. glob_files, grep_files, read_file로 코드베이스 탐색

      2. 기존 패턴과 아키텍처 이해

      3. 구현 방안 설계

      4. 접근 방식 명확화 필요시 ask_user_question 사용

      5. 구현 준비 완료시 exit_plan_mode로 승인 요청


      참고: 이 도구는 사용자 승인이 필요합니다 - 계획 모드 진입에 동의해야 합니다.'
    input_schema:
      type: object
      properties: {}
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: exit_plan_mode
    description: '계획 파일 작성 완료 후 사용자 승인을 요청합니다.


      ## 이 도구의 동작

      - 계획 파일에서 내용을 읽어 사용자에게 표시

      - 계획 내용을 파라미터로 받지 않음

      - 사용자가 계획을 검토하고 승인/수정 요청


      ## 사용 시점

      코드 구현이 필요한 계획이 완료되었을 때만 사용:

      - 계획이 완성되고 명확할 때

      - 구현할 준비가 되었을 때


      ## 사용하지 않을 때

      - 요구사항이나 접근 방식에 미해결 질문이 있으면 ask_user_question 먼저 사용

      - 조사/탐색 작업 - 구현 계획이 아니면 이 도구 불필요


      중요: ''이 계획 괜찮나요?'', ''진행할까요?''를 ask_user_question으로 묻지 마세요 - 그것이 바로 이 도구의 역할입니다.'
    input_schema:
      type: object
      properties: {}
  - name: copy_path
    description: '파일 또는 폴더를 복사합니다.


      사용법:

      - 파일 복사: 단일 파일을 다른 위치로 복사

      - 폴더 복사: 폴더 전체를 하위 내용 포함하여 복사

      - 대상 경로의 상위 디렉토리가 없으면 자동 생성


      사용 예시:

      - 사진 파일 복사: source=''/Photos/IMG_001.jpg'', destination=''~/Desktop/backup/IMG_001.jpg''

      - 폴더 통째로 복사: source=''/data/project'', destination=''/backup/project''


      - 여러 개 한꺼번에: source 를 생략하고 앞 액션 결과를 >> 로 넘기면, 그 items 의 파일 전부를
      destination *폴더* 에 저장합니다. 몇 개를 고를지는 [table:take]/[table:filter] 가 정합니다.
      예: [self:photo]{source:"usb"} >> [table:take]{n:10} >> [self:copy]{dest:"~/Desktop/폰사진"}
      (items 의 source 가 usb 면 USB 로 연결된 폰에서 파일을 당겨 옵니다)


      주의사항:

      - 단일 복사에서 대상 경로에 이미 파일/폴더가 있으면 덮어씁니다 (파이프 저장은 "(2)" 를 붙여 보존)

      - 매우 큰 폴더 복사는 시간이 걸릴 수 있습니다'
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: 원본 파일 또는 폴더 경로 (생략 시 파이프로 받은 items 를 복사)
        items:
          type: array
          items:
            type: object
          description: 복사할 파일 레코드 목록 (path 또는 url). 빈 목록은 0개 복사.
        destination:
          type: string
          description: 복사 대상 경로 (파이프 저장이면 대상 폴더)
      required:
      - destination
  - name: move_path
    description: '파일 또는 폴더를 이동합니다 (이름 변경 포함).


      사용법:

      - 파일/폴더를 다른 위치로 이동

      - 같은 디렉토리 내에서 이름 변경에도 사용 가능

      - 대상 경로의 상위 디렉토리가 없으면 자동 생성


      사용 예시:

      - 파일 이동: source=''./temp/report.pdf'', destination=''./docs/report.pdf''

      - 이름 변경: source=''./old_name.txt'', destination=''./new_name.txt''


      주의사항:

      - 원본이 삭제됩니다 (이동이므로)

      - 대상 경로에 이미 파일이 있으면 덮어씁니다'
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: 원본 파일 또는 폴더 경로
        destination:
          type: string
          description: 이동 대상 경로
      required:
      - source
      - destination
  - name: delete_path
    description: '파일 또는 폴더를 삭제합니다.


      사용법:

      - 파일 삭제: 단일 파일 제거

      - 폴더 삭제: 폴더와 하위 내용 전체 제거


      주의사항:

      - 이 작업은 되돌릴 수 없습니다 (휴지통으로 이동하지 않음)

      - 사용자에게 반드시 확인 후 실행하세요'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 삭제할 파일 또는 폴더 경로
      required:
      - path
  - name: make_directory
    description: '빈 폴더(디렉토리)를 생성합니다.


      사용법:

      - 중간 경로가 없으면 함께 생성 (mkdir -p 동등)

      - 이미 존재해도 오류 없이 통과 (멱등)


      주의사항:

      - 파일 삭제·폴더 삭제는 delete_path 사용

      - 이동·이름변경은 move_path 사용'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 생성할 폴더 경로
      required:
      - path
  - name: patch_op
    description: "자기수리의 격리 사본·전체 준비 판정·정본 반영. 사용자 승인 REPAIR에서는 소스·설정·문서·검사·파생물을 모두 같은 사본에서 수정하고 격리 셸로 검사한다. 새 수리의 apply는 verification_plan으로 각 기준을 실제 검사(method:test, 단일 pytest 또는 node --test 명령) 또는 의미 검토(method:semantic)에 연결한다. 같은 후보·환경의 통과 검사를 재사용하며 의미 조건만 평가한다. 이전 수리는 이전 정책을 유지한다. 동기화·생성·빌드는 apply 전에 격리 셸에서 끝내며 apply는 읽기 검사 후 고정된 바이트만 적용한다. 하위 기능 완료·구문 통과만으로 예약하지 않는다. 기준 부족이면 같은 사본에서 보완한다. status는 조회만, discard는 미적용 사본만 폐기한다. 무그랜트 propose는 사본 제안만 남기며 승인 수리의 apply도 동일한 전체 준비 관문을 따른다. backend·패키지 변경은 기존 제어자에게 예약하므로 scheduled 뒤 현재 턴을 종료한다. 인계가 활성 확인과 수리 델타 커밋을 이어가며 예약/준비/반영은 전체 완료와 다르다. verify_cmd와 active_verify_cmd는 적용 후 읽기 전용 확인이다. 이 단계에서 구현·빌드하지 않는다. 격리 실패·예약 실패 때 정본 직접 쓰기나 즉시 적용으로 돌아가지 않는다."
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 동작.
        path:
          type: string
          description: (propose) 대상 RED 파일 경로 (backend/·frontend/·scripts/ 하위). RED 밖이면 거부됨.
        content:
          type: string
          description: (propose) 새 전체 파일 내용 (신규 생성 또는 전체 교체). old_string/new_string 과 택일.
        old_string:
          type: string
          description: (propose) 부분 교체 — 교체할 기존 문자열 (HEAD 기준 파일 내 유일해야 함). new_string 과 함께.
        new_string:
          type: string
          description: (propose) 부분 교체 — 새 문자열.
        reason:
          type: string
          description: (propose) 변경 근거 (필수). 사람이 제안을 검토할 때 읽는다.
        key:
          type: string
          description: (status/discard) 조회·폐기할 수리 세션 키. status 생략 시 목록, discard 생략 시 현재 세션.
        proposal_id:
          type: string
          description: (apply/discard) propose 가 돌려준 제안 id. apply 에 주면 이 세션 대신 그 제안을 검증 후 적용한다(재작업 불필요, 수리 그랜트는 그대로 필요). discard 에 주면 그 제안을 폐기. 목록은 op:status.
        verify_cmd:
          type: string
          description: (apply) 반영 후 읽기 전용 부팅 검증 명령. 기존 제어자가 실행하며 실패 시 복구한다. 구현·빌드·커밋을 넣지 않는다. 리로드 없는 즉시 적용도 실행 영수증을 보존한다.
        verification_plan:
          type: array
          description: '(apply, 새 수리) 각 기능 기준과 검사 연결. 직접 수리의 C1은 사용자 요청 전체. test는 단일 pytest 또는 node --test 명령, semantic은 보존된 관측으로 의미 조건만 검토한다. status로 기존 검사와 실패 이유 확인.'
          items:
            type: object
            properties:
              criterion_id:
                type: string
              method:
                type: string
                enum: [test, semantic]
              command:
                type: string
            required: [criterion_id, method]
        active_verify_cmd:
          type: string
          description: (apply) ACTIVE 이후 읽기 전용 활성 확인 명령. 결과 불명 실행은 자동 반복하지 않는다. 수리 델타 커밋은 신뢰된 기존 각인 서비스가 맡는다.
  - name: read_op
    description: '파일 읽기 — 텍스트/PDF/DOCX/XLSX 통합. 확장자로 자동 인식(format 명시도 가능).


      파라미터: 읽을 파일 경로. format 옵션 (text/pdf/docx/xlsx/xls/hwp/hwpx/pptx/epub) — 생략 시 확장자 자동. text — offset/limit (라인) 또는 start_line/end_line (1-기반 양끝 포함, 구간 발췌). pdf — pages 옵션 (예 ''1-5''), tables:true 면 표를 table 통화로 추출. docx — offset/limit/max_blocks (블록 단위). xlsx/xls — sheet(특정 시트명)/max_rows 옵션. 텍스트 없는 PDF 페이지는 로컬 OCR 자동 적용(ocr:false로 해제), 실패·낮은 신뢰도는 부분 결과로 신고.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 동작 분기 — target_description 참조
        start_line:
          type: integer
          description: text — 발췌 시작 줄 (1-기반, 양끝 포함). end_line 과 짝. 긴 파일을 통째로 읽지 말고 이 구간 발췌를 쓸 것
        end_line:
          type: integer
          description: text — 발췌 끝 줄 (1-기반, 포함). start_line 과 짝
      additionalProperties: true
  - name: fill_op
    description: '양식 채우기 — PDF 폼/DOCX 템플릿에 값을 넣어 완성 문서 생성. read 의 짝(문서→문서, 구조 보존).


      파라미터: path(템플릿 .pdf 폼 또는 {{자리표시자}} 든 .docx). data({필드: 값}) — 생략하면 채울 수 있는 필드 목록을 반환. output(출력 경로, 생략 시 원본 옆 _filled). flatten(PDF 전용, true면 폼을 정적 내용으로 구워 제출용).'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 템플릿 문서 경로 (.pdf 폼 또는 {{자리표시자}} 든 .docx)
        data:
          type: object
          description: 필드→값 매핑. 생략하면 채울 수 있는 필드 목록을 반환
        output:
          type: string
          description: 출력 파일 경로 (생략 시 원본 옆 _filled)
        flatten:
          type: boolean
          description: 'PDF 전용 — true면 폼을 정적 내용으로 구워 제출용(수정 불가). 기본 false'
      required:
      - path
  - name: spreadsheet
    description: '행 데이터를 xlsx 스프레드시트로 씁니다 (값만, 수식·서식 제외).


      단일 시트: rows(행 배열, 각 행은 셀 배열) + headers(선택)/sheet_name(선택). 다중 시트: sheets={시트명: rows}. path는 .xlsx 자동 보정, bare 파일명은 프로젝트 outputs/로·디렉토리를 적으면 그 자리에(형제 emitter 공통 규약).'
    input_schema:
      type: object
      properties:
        table:
          type: object
          description: 표형 통화 {columns, rows}.
        path:
          type: string
          description: 출력 파일 경로 (.xlsx 자동 보정)
        rows:
          type: array
          items:
            type: array
          description: 행 배열 — 각 행은 셀 값 배열 (단일 시트)
        headers:
          type: array
          items:
            type: string
          description: 열 머리글 (선택, 첫 행으로 삽입)
        sheet_name:
          type: string
          description: 단일 시트 이름 (기본 Sheet1)
        sheets:
          type: object
          description: '다중 시트 {시트명: rows}. 주면 rows보다 우선.'
      required:
      - path
  - name: webapp_op
    description: 내 웹앱 등기부 — 목록(파생+수동)·생존 실측·수동 등록/제거. 몸 공개면과 web-builder 사이트는 자동 파생.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: list(기본)/status/register/remove
        name:
          type: string
          description: register — 웹앱 이름 / remove — 지울 웹앱 이름(url 대신 지목 가능)
        url:
          type: string
          description: register/remove — 웹앱 주소
        kind:
          type: string
          description: register 선택 — 부류 메모 (예 외부(Worker))
        memo:
          type: string
          description: register 선택 — 자유 메모
        timeout:
          type: number
          description: status 선택 — 프로브 타임아웃 초 (기본 5)
  - name: body_op
    description: 몸(이 저장소) 파일 변화 이력 — git 원장 회상. changes(최근 파일 변화, 미커밋 포함)/log(커밋 이력)/file(한 파일의 일생 — 이름변경·이동 관통)/writes(런타임 쓰기 원장 — 관문 통과분만, 행위자 동반).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: changes(기본)/log/file/writes
        days:
          type: integer
          description: changes/log/writes — 조회 기간(일). 기본 7, 최대 365
        path:
          type: string
          description: changes/log/writes — 스코프 폴더(예 backend/cognition) / file — 대상 파일 경로(필수)
        limit:
          type: integer
          description: 최대 행 수. 기본 200, 상한 1000 (초과 요청은 신고 후 상한 적용)
  - name: document_op
    description: 기존 DOCX inspect/edit — 문단 id·해시 조회 후 선택 교체, 변경 추적·주석, 원본 보존. 열린 문서의 세션·저장은 workspace_op.
    input_schema:
      type: object
      properties:
        op: {type: string, description: inspect/edit}
  - name: workspace_op
    description: 범용 작업 공간 — 문서·스프레드시트·코딩(git)을 같은 계약으로 열기·스냅샷·읽기·제안·적용·저장·버전·복구. resource 하나로 종류 무관, 세션 배관은 몸이 숨긴다. 접수(queued)는 완료가 아니다.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: open/snapshot/read/propose/apply/save/export/versions/restore/close/capabilities/recover
        path:
          type: string
          description: open — 파일 또는 git 폴더 경로
        resource:
          type: string
          description: open 이 돌려준 자료 ID (이후 op 공통)
        selector:
          type: object
          description: read/propose — 문서 {start,end,selected_sha256?} · 사무 {offset,limit,pages,tables} · 시트 {sheet,range} · 코딩 {path,start_line,end_line}|{diff:true}|{files:true}
        replacement:
          type: string
          description: propose — 교체 문구(문서) 또는 파일 본문·줄 범위 교체문(코딩)
        values:
          type: array
          description: propose(시트) — 범위와 같은 행·열의 2차원 배열
        proposal:
          type: string
          description: apply — 제안 ID
        client:
          type: string
          description: 작성 창 식별자 — 세션을 쥔 창만 적용·저장·내보내기·복구·닫기
        message:
          type: string
          description: save(코딩) — 커밋 메시지(필수)
        verify:
          type: string
          description: save(코딩) — 반영 전 돌릴 검증 명령
        filename:
          type: string
          description: export — 같은 폴더의 새 파일명(같은 형식)
        revision:
          type: string
          description: restore — 버전 ID
        wait:
          type: number
          description: snapshot(시트) — 편집창 엔진 응답 대기 초(상한 30)
  - name: sheet_op
    description: 엑셀 파일 행/범위·재계산 — find/append/update/range/range_write/calculate. range_write/calculate는 새 결과 파일이며 원본 보존. 열린 시트의 세션·제안·저장은 workspace_op.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: find(기본)/append/update/range/range_write/calculate
        path:
          type: string
          description: 대상 xlsx/xlsm 파일 경로
        sheet:
          type: string
          description: 시트명 (생략 시 활성 시트)
        header_row:
          type: number
          description: 헤더 행 번호 (기본 1)
        where:
          type: object
          description: 'find/update — {열이름: 값} 전부 일치하는 행'
        set:
          type: object
          description: 'update 전용 — {열이름: 새값}. "=수식" 문자열 지원'
        items:
          type: array
          description: 'append 전용 — [{열이름: 값}, …]. 생략 시 파이프 직전 step 의 items/table 자동 사용'
        limit:
          type: number
          description: find 결과 상한 (기본 50)
  - name: sqlite_op
    description: SQLite 파일 읽기 전용 조회 — query(SELECT)/tables/schema. 쓰기 SQL 은 거절한다(mode=ro).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: query(기본)/tables/schema
        path:
          type: string
          description: SQLite 파일 경로 (~workspace/·절대·저장소 상대)
        query:
          type: string
          description: 'SELECT/WITH/PRAGMA/EXPLAIN 문 (op=query)'
        params:
          type: array
          description: 'query 의 ? 자리에 순서대로 들어갈 값 목록'
        limit:
          type: integer
          description: 행 상한 (기본 200, 최대 2000 — 넘으면 truncated)
        table:
          type: string
          description: 표 이름 (op=schema)
      required:
      - path
  - name: ledger_op
    description: JSON 원장 원자 갱신·조회 — select/append/upsert/set. 관문(set target 필수·enum_fields·list_limits)은 넘으면 쓰지 않고 실패한다.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: select(기본)/append/upsert/set
        path:
          type: string
          description: 원장 파일 경로 (저장소 안, ~workspace/ 가능)
        target:
          type: string
          description: 배열·값 자리(점 경로, 예 queue 또는 covered) — set 은 필수
        item:
          type: object
          description: append/upsert 항목 하나
        items:
          type: array
          description: append/upsert 항목 여럿
        items_file:
          type: string
          description: append/upsert — 항목 배열이 든 JSON 파일 경로(큰 payload)
        key:
          type: string
          description: upsert 식별 필드 (기본 id)
        max_items:
          type: integer
          description: append/upsert 후 배열 상한(오래된 앞을 버림)
        value:
          type: [object, array, string, number, boolean, "null"]
          description: set 의 새 값(null 도 명시 가능)
        replace_root:
          type: boolean
          description: set — target 없이 루트 전체 교체를 정말 원할 때만 true
        enum_fields:
          type: object
          description: '쓰기 관문 {필드: [허용값…]}'
        list_limits:
          type: object
          description: '쓰기 관문 {필드: {max_items, max_item_len}}'
        fields:
          type: array
          description: select 열 선택
        where:
          type: [string, object, array]
          description: 'select 행 필터 — table:filter와 같은 {field,op,value}·{필드:값}·문자열 비교(and/or)·AND 배열. 동등성은 공통 값 의미론(숫자·공백·대소문자·ISO 날짜), 필드는 점 경로 지원.'
        limit:
          type: integer
          description: select 상한
      required: [path]
      additionalProperties: true
  - name: script_op
    description: 파일 Script — list/register/run/status/remove. 등록 id 또는 IBL 현재 턴 path 참조. path는 inputs와 write/edit로 작성하며 별도 결과 파일 JSON이 값, stdout/stderr는 진단. 등록 id는 기존 stdout 계약, background:true→job_id와 status 지원.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: list(기본)/register/run/status/remove
        background:
          type: boolean
          description: '등록 id run 선택 — true 면 별도 프로세스로 실행하고 즉시 job_id 반환(긴 작업)'
        job_id:
          type: string
          description: 'status 선택 — 조회할 작업 id (run background 가 돌려준 값)'
        wait:
          type: number
          description: 'status 선택 — 끝날 때까지 유한 대기 초(≤240)'
        id:
          type: string
          description: 스크립트 id (register 생략 시 파일명에서 유도)
        path:
          type: string
          description: register 파일 또는 판본 2 run의 현재 ~turn Python 경로(실존 필수, 미등록 로컬 실행)
        interpreter:
          type: string
          description: register 선택 — 생략 시 확장자 추론 (.py/.sh/.js)
        description:
          type: string
          description: register 선택 — 스크립트 설명 (목록에 표시)
        args:
          type: [object, string]
          description: 'run의 JSON stdin 객체. path 실행은 객체만, 등록 id는 JSON 문자열도 허용하며 큰 payload는 args_file 지원'
        input_as:
          type: string
          minLength: 1
          description: 'run 전용. 실제 >> 파이프 봉투 전체를 args의 지정 최상위 키에 넣어 stdin 전달. 빈 items 허용, 파이프 부재·args 키 충돌·args_file 병용 거절.'
        args_file:
          type: string
          description: 'run 선택 — stdin 으로 보낼 JSON 객체가 담긴 **파일 경로**(상대경로는 저장소 루트 기준). 원장 배치처럼 킬로바이트급 payload 를 문장에 리터럴로 박지 않는 통로. args 와 함께 주면 정직 거절(stdin 은 하나)'
        timeout:
          type: number
          description: 실행 제한 초 (기본 300)
