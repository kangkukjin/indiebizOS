# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: system_essentials
    name: System Essentials Kit
    description: 에이전트 기본 도구 모음. 파일 읽기/쓰기/검색, 작업 목록(todo) 관리, 계획 모드, 사용자 질문, 이웃(연락처) 조회 기능을 제공합니다. 모든 에이전트에게 기본 배분되는 핵심 패키지입니다.
    version: 1.1.0
    author: System AI
  tools:
  # 2026-07-03 미소유 도구 감사: 죽은 tool.json 항목 3개 제거(read_file/read_pdf/read_docx —
  # [self:read] read_op가 handler 내부에서 tool_name 재할당으로 위임, tool.json 불필요).
  # 아래 5개(run_command 등 최상위 인지 도구)는 산 배관.
  - name: write_file
    description: '파일에 내용을 씁니다 (기존 파일 덮어쓰기).


      사용법:

      - 새 파일 생성 또는 기존 파일 완전 교체

      - 디렉토리가 없으면 자동 생성


      주의사항:

      - 기존 파일 수정 시 반드시 먼저 read_file로 읽어야 함

      - 부분 수정은 edit_file 사용 권장 (전체 재작성 불필요)

      - 꼭 필요한 경우에만 파일 생성 - 기존 파일 편집 우선'
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: 파일 경로
        content:
          type: string
          description: 기록할 전체 내용. 생략 시 파이프의 직전 step 결과(_prev_result)를 저장
      required:
      - file_path
  - name: list_directory
    description: '디렉토리의 파일/폴더 목록을 조회합니다.


      사용법:

      - 지정된 디렉토리의 직속 항목만 반환 (재귀 아님)

      - 파일/폴더 구분하여 표시


      주의사항:

      - 재귀적 탐색이 필요하면 glob_files 사용 (예: ''**/*'')

      - run_command로 ''ls -R'' 사용 금지 - 대용량 출력으로 토큰 초과 위험

      - 파일 내용 검색은 grep_files 사용'
    input_schema:
      type: object
      properties:
        dir_path:
          type: string
          description: '디렉토리 경로 (기본: 현재 작업 디렉토리)'
  - name: grep_files
    description: '파일 내용에서 텍스트/패턴을 검색합니다.


      사용법:

      - 매칭되는 라인과 라인 번호 반환

      - 패턴은 기본적으로 정규표현식 (alternation ''a|b'', 메타문자 동작). 리터럴 문자열로 검색하려면 regex=false

      - 파일 패턴으로 검색 범위 제한 가능


      사용 예시:

      - 함수 정의 찾기: pattern=''def my_function'', file_pattern=''*.py''

      - 클래스 찾기: pattern=''class.*Manager'', regex=true

      - 특정 문자열 검색: pattern=''TODO'', root_path=''./src''


      주의사항:

      - run_command로 grep/rg 사용 대신 이 도구 사용

      - 결과가 많을 수 있으니 file_pattern으로 범위 제한 권장'
    input_schema:
      type: object
      properties:
        pattern:
          type: string
          description: 검색할 텍스트 또는 정규표현식
        file_pattern:
          type: string
          description: '파일 패턴 (예: ''*.py'', ''*.js'')'
        root_path:
          type: string
          description: 검색 시작 경로
        regex:
          type: boolean
          description: '정규표현식 모드 (기본: true). false로 두면 패턴을 리터럴 문자열로 검색. 잘못된 정규식은 리터럴로 자동 폴백.'
        output_mode:
          type: string
          enum:
          - content
          - files_with_matches
          - count
          description: '출력 형태: content(매칭 라인, 기본) / files_with_matches(파일 목록) / count(파일별 매칭 수)'
      required:
      - pattern
  - name: get_current_time
    description: '현재 날짜와 시간을 조회합니다.


      사용법:

      - 파라미터 없이 호출하면 기본 포맷으로 반환

      - 커스텀 포맷 지정 가능'
    input_schema:
      type: object
      properties:
        format:
          type: string
          description: '시간 포맷 (기본: %Y-%m-%d %H:%M:%S)'
  - name: ai_ask
    description: '시스템 AI에게 원샷 질문을 보내 답 텍스트를 받는다. 도구·다단계 없는 가벼운 호출 —
      요약·개선·설명·변환·답변에. 무언가를 만들거나 여러 단계가 필요하면 [others:delegate].'
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: AI에게 줄 지시 또는 질문 (필수)
        context:
          type: string
          description: 판단 대상이 되는 텍스트/데이터 (선택)
      required:
      - prompt
  # 산 배관(2026-07-03 감사): agent_cognitive._build_ibl_tools·system_ai_tools·api_xray가 tool.json에서 스키마 로드, system_tools→load_tool_handler로 실행 (최상위 도구)
  - name: run_command
    description: "쉘 명령어를 실행합니다. execute_ibl과 함께 에이전트의 두 가지 실행 경로 중 하나.\n\n주의사항 - 반드시 읽으세요:\n1. 파일/디렉토리 작업은 IBL 액션을 우선 사용:\n   - 디렉토리 목록: execute_ibl [self:list] (ls 대신)\n   - 파일 검색: execute_ibl [self:file_find] (find 대신)\n   - 내용 검색: execute_ibl [self:grep] (grep/rg 대신)\n   - 파일 읽기: execute_ibl [self:read] (cat/head/tail 대신)\n   - 파일 쓰기: execute_ibl [self:write] (echo > 대신)\n   - 파일 수정: execute_ibl [self:edit] (sed/awk 대신)\n\n2. Python/Node.js 코드 실행 — write→run 패턴:\n   - 멀티라인: [self:write]로 /tmp/*.py 파일 생성 후 run_command 'python3 /tmp/x.py'\n   - 한 줄: run_command 'python3 -c \"...\"' 또는 'node -e \"...\"'\n   - 별도의 execute_python/execute_node 도구는 없음 (이스케이프·traceback 손실 회피)\n\n3. 금지된 명령어 (대용량 출력 위험):\n   - ls -R, ls -la -R (재귀 목록)\n   - find / (루트 검색)\n   - cat 대용량파일\n   - 출력 제한 없는 검색 명령\n\n4. 위험 명령은 approved=true 필요:\n   - rm, rmdir (삭제)\n   - sudo (권한 상승)\n   - chmod, chown (권한 변경)\n\nrun_command가 어울리는 경우:\n- git 명령어 (git status, git log --oneline -10)\n- 패키지 관리 (npm install, pip install)\n\
      - 빌드/테스트 (npm run build, pytest)\n- 프로세스 관리 (ps, kill)\n- write→run 패턴의 실행 단계 (python3/node 스크립트 실행)\n- IBL 액션에 해당하지 않는 시스템 명령"
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: 실행할 쉘 명령어
        timeout:
          type: number
          description: '제한시간 초 (기본: 60, 최대: 300)'
        approved:
          type: boolean
          description: 위험 명령 승인 (rm, sudo 등)
      required:
      - command
  - name: glob_files
    description: 'glob 패턴으로 파일을 검색합니다. 프로젝트 안뿐 아니라 컴퓨터 어느 디렉토리든 검색 가능.


      ## 검색 범위 (path 파라미터)

      - 미지정: 프로젝트 디렉토리 (기본)

      - 절대경로: 그대로 사용 (예: ''/Users/me/Desktop'', ''/etc'')

      - ~ 시작: 홈 디렉토리 확장 (예: ''~/Documents'', ''~'')

      - 상대경로: 프로젝트 디렉토리 기준


      ## 패턴 동작

      - 패턴에 ''**''나 ''/''가 없으면 자동으로 모든 하위 디렉토리까지 검색 (''*.docx'' → ''**/*.docx'' 효과)

      - 명시적 재귀: ''**/*.py'' (모든 하위)

      - 디렉토리 한정: ''src/**/*.{js,ts}''


      ## 사용 예시

      - 프로젝트 안 Python 파일: pattern=''**/*.py''

      - 바탕화면의 docx: pattern=''*.docx'', path=''~/Desktop''

      - 컴퓨터 전체에서 특정 파일: pattern=''**/하네스*.docx'', path=''/Users''

      - 다운로드 폴더의 PDF: pattern=''*.pdf'', path=''~/Downloads''


      ## 결과

      - ''{총_매칭수}개 매칭 | root: {검색루트}'' 헤더 + 절대경로 목록

      - 기본 200개까지 반환 (max_results로 조정, 0이면 무제한 — 컨텍스트 폭주 주의)

      - 매칭 없으면 path 옵션 사용 힌트 안내


      ## 주의

      - run_command로 ''find'' 사용하지 말 것 — 이 도구가 컴퓨터 전체 검색 지원

      - 너무 넓은 범위(예: path=''/'')는 시간이 오래 걸리고 결과가 폭주'
    input_schema:
      type: object
      properties:
        pattern:
          type: string
          description: 'glob 패턴 (예: ''*.docx'', ''**/*.py''). ''**''나 ''/''가 없으면 자동 재귀. 생략 시 메타 검색 모드(search_term 등)'
        path:
          type: string
          description: 검색 루트. 절대경로(/Users/...), ~ 확장(~/Desktop), 상대경로(./src) 모두 가능. 미지정 시 glob=프로젝트 디렉토리, 메타=홈
        root_path:
          type: string
          description: (deprecated) path와 동일. path 사용 권장
        max_results:
          type: integer
          description: 반환할 최대 파일 수 (기본 200). 0이면 무제한 (큰 검색 시 컨텍스트 폭주 위험)
        search_term:
          type: string
          description: (메타 검색) 파일명 부분일치 검색어 — OS 색인(Spotlight) 직접, 선스캔 불요
        extension:
          type: string
          description: (메타 검색) 확장자 필터 (pdf, jpg 등)
        kind:
          type: string
          description: (메타 검색) 종류 필터 — image/video/audio/pdf/any
        min_size_mb:
          type: number
          description: (메타 검색) 최소 크기 (MB)
        sort:
          type: string
          description: (메타 검색) 정렬 — mtime(최신순, 기본) | size(큰 순)
        limit:
          type: integer
          description: (메타 검색) 결과 개수 (기본 100)
  - name: edit_file
    description: '파일의 특정 부분을 수정합니다 (문자열 교체).


      사용법:

      - old_string을 new_string으로 교체

      - 파일 전체를 다시 쓰지 않고 정확한 위치만 수정


      주의사항:

      - 반드시 먼저 read_file로 파일 내용을 확인해야 함

      - old_string은 파일 내에서 고유해야 함 (중복되면 실패)

      - 중복되는 경우 더 많은 컨텍스트(주변 코드)를 포함

      - 들여쓰기(탭/스페이스)를 정확히 맞춰야 함

      - write_file보다 이 도구 사용 권장 (부분 수정에 적합)'
    input_schema:
      type: object
      properties:
        file_path:
          type: string
          description: 파일 경로
        old_string:
          type: string
          description: 교체할 기존 문자열 (파일 내 고유해야 함)
        new_string:
          type: string
          description: 새 문자열
      required:
      - file_path
      - old_string
      - new_string
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: todo_write
    description: '작업 목록을 생성하고 관리합니다. 진행 상황을 추적하고 복잡한 작업을 체계적으로 관리합니다.


      ## 중요: 유일한 todo 도구

      이 도구가 todo 관련 유일한 도구입니다.

      - 항목 추가: 기존 목록 + 새 항목으로 전체 목록 작성

      - 상태 변경: 해당 항목의 status만 바꿔서 전체 목록 다시 작성

      - 항목 삭제: 해당 항목 제외하고 전체 목록 다시 작성


      ## 사용 시점

      1. 복잡한 다단계 작업 (3개 이상의 구분된 단계)

      2. 사용자가 여러 작업을 요청한 경우 (번호 목록, 쉼표로 구분)

      3. 신중한 계획이 필요한 비단순 작업


      ## 사용하지 않을 때

      1. 단일하고 직접적인 작업

      2. 추적해도 조직적 이점이 없는 사소한 작업

      3. 3단계 미만의 사소한 단계로 완료 가능한 작업

      4. 순수한 대화나 정보 요청


      참고: 사소한 단일 작업만 있다면 이 도구를 사용하지 마세요.


      ## 상태 관리

      - pending: 대기 중

      - in_progress: 진행 중 (한 번에 하나만)

      - completed: 완료


      작업 완료 시 상태를 completed로 표시하세요.'
    input_schema:
      type: object
      properties:
        todos:
          type: array
          description: 작업 목록
          items:
            type: object
            properties:
              content:
                type: string
                description: '작업 내용 (명령형: ''테스트 실행'')'
              status:
                type: string
                enum:
                - pending
                - in_progress
                - completed
                description: 상태
              activeForm:
                type: string
                description: '진행 중 표시 (현재형: ''테스트 실행 중'')'
            required:
            - content
            - status
            - activeForm
      required:
      - todos
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: ask_user_question
    description: '실행 중 사용자에게 질문이 필요할 때 사용합니다.


      ## 사용 시점

      1. 사용자 선호도나 요구사항 파악

      2. 모호한 지시 명확화

      3. 구현 방식 선택 필요

      4. 진행 방향에 대한 사용자 의견 필요


      ## 사용하지 않을 때

      1. 이미 충분한 정보가 있는 경우

      2. 합리적인 기본 선택이 명확한 경우

      3. 사용자가 이미 명시적 지시를 한 경우


      ## 사용법

      - 2-4개의 선택지 제공

      - 권장 옵션은 첫 번째에 배치하고 ''(권장)'' 표시

      - multiSelect=true로 복수 선택 허용 가능

      - 사용자는 항상 ''기타''로 직접 입력 가능


      참고: 플랜 모드에서는 요구사항 명확화에 사용하고, ''계획 진행할까요?''는 exit_plan_mode 사용'
    input_schema:
      type: object
      properties:
        questions:
          type: array
          description: 질문 목록 (1-4개)
          items:
            type: object
            properties:
              question:
                type: string
                description: 질문 내용
              header:
                type: string
                description: 짧은 라벨 (최대 12자)
              options:
                type: array
                description: 선택지 (2-4개)
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: 선택지 텍스트
                    description:
                      type: string
                      description: 선택지 설명
                  required:
                  - label
                  - description
              multiSelect:
                type: boolean
                description: 복수 선택 허용 (기본 false)
            required:
            - question
            - header
            - options
      required:
      - questions
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: enter_plan_mode
    description: '비단순 구현 작업 전 계획 모드로 전환합니다. 코드 작성 전 사용자 동의를 구하는 용도입니다.


      ## 사용 고려 상황

      단순하지 않은 구현 작업에서 사용을 고려하세요:

      1. 새 기능 구현 - 배치 위치, 클릭 시 동작 등 결정 필요

      2. 여러 접근 방식 가능 - 캐싱 방식, 성능 개선 전략 등

      3. 기존 동작/구조 변경 - 무엇이 바뀌어야 하는지 명확화

      4. 아키텍처 결정 - WebSocket vs SSE, 상태 관리 방식 등

      5. 다중 파일 변경 (2-3개 초과)

      6. 요구사항 탐색 필요 - 먼저 파악 후 범위 이해

      7. 사용자 선호도 중요 - 여러 방향 가능


      ## 사용하지 않을 때

      단순한 작업은 바로 진행:

      - 한두 줄 수정 (오타, 명확한 버그, 작은 조정)

      - 명확한 요구사항의 단일 함수 추가

      - 사용자가 상세한 구체적 지시를 한 경우

      - 순수 조사/탐색 작업 (구현 계획이 아님)


      ## 계획 모드에서 할 일

      1. glob_files, grep_files, read_file로 코드베이스 탐색

      2. 기존 패턴과 아키텍처 이해

      3. 구현 방안 설계

      4. 접근 방식 명확화 필요시 ask_user_question 사용

      5. 구현 준비 완료시 exit_plan_mode로 승인 요청


      참고: 이 도구는 사용자 승인이 필요합니다 - 계획 모드 진입에 동의해야 합니다.'
    input_schema:
      type: object
      properties: {}
  # 산 배관(2026-07-03 감사): 최상위 인지 도구 — agent_cognitive·system_ai_tools·api_xray가 tool.json에서 스키마 로드
  - name: exit_plan_mode
    description: '계획 파일 작성 완료 후 사용자 승인을 요청합니다.


      ## 이 도구의 동작

      - 계획 파일에서 내용을 읽어 사용자에게 표시

      - 계획 내용을 파라미터로 받지 않음

      - 사용자가 계획을 검토하고 승인/수정 요청


      ## 사용 시점

      코드 구현이 필요한 계획이 완료되었을 때만 사용:

      - 계획이 완성되고 명확할 때

      - 구현할 준비가 되었을 때


      ## 사용하지 않을 때

      - 요구사항이나 접근 방식에 미해결 질문이 있으면 ask_user_question 먼저 사용

      - 조사/탐색 작업 - 구현 계획이 아니면 이 도구 불필요


      중요: ''이 계획 괜찮나요?'', ''진행할까요?''를 ask_user_question으로 묻지 마세요 - 그것이 바로 이 도구의 역할입니다.'
    input_schema:
      type: object
      properties: {}
  - name: copy_path
    description: '파일 또는 폴더를 복사합니다.


      사용법:

      - 파일 복사: 단일 파일을 다른 위치로 복사

      - 폴더 복사: 폴더 전체를 하위 내용 포함하여 복사

      - 대상 경로의 상위 디렉토리가 없으면 자동 생성


      사용 예시:

      - 사진 파일 복사: source=''/Photos/IMG_001.jpg'', destination=''~/Desktop/backup/IMG_001.jpg''

      - 폴더 통째로 복사: source=''/data/project'', destination=''/backup/project''


      - 여러 개 한꺼번에: source 를 생략하고 앞 액션 결과를 >> 로 넘기면, 그 items 의 파일 전부를
      destination *폴더* 에 저장합니다. 몇 개를 고를지는 [table:take]/[table:filter] 가 정합니다.
      예: [self:photo]{source:"usb"} >> [table:take]{n:10} >> [self:copy]{dest:"~/Desktop/폰사진"}
      (items 의 source 가 usb 면 USB 로 연결된 폰에서 파일을 당겨 옵니다)


      주의사항:

      - 단일 복사에서 대상 경로에 이미 파일/폴더가 있으면 덮어씁니다 (파이프 저장은 "(2)" 를 붙여 보존)

      - 매우 큰 폴더 복사는 시간이 걸릴 수 있습니다'
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: 원본 파일 또는 폴더 경로 (생략 시 파이프로 받은 items 를 복사)
        destination:
          type: string
          description: 복사 대상 경로 (파이프 저장이면 대상 폴더)
      required:
      - destination
  - name: move_path
    description: '파일 또는 폴더를 이동합니다 (이름 변경 포함).


      사용법:

      - 파일/폴더를 다른 위치로 이동

      - 같은 디렉토리 내에서 이름 변경에도 사용 가능

      - 대상 경로의 상위 디렉토리가 없으면 자동 생성


      사용 예시:

      - 파일 이동: source=''./temp/report.pdf'', destination=''./docs/report.pdf''

      - 이름 변경: source=''./old_name.txt'', destination=''./new_name.txt''


      주의사항:

      - 원본이 삭제됩니다 (이동이므로)

      - 대상 경로에 이미 파일이 있으면 덮어씁니다'
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: 원본 파일 또는 폴더 경로
        destination:
          type: string
          description: 이동 대상 경로
      required:
      - source
      - destination
  - name: delete_path
    description: '파일 또는 폴더를 삭제합니다.


      사용법:

      - 파일 삭제: 단일 파일 제거

      - 폴더 삭제: 폴더와 하위 내용 전체 제거


      주의사항:

      - 이 작업은 되돌릴 수 없습니다 (휴지통으로 이동하지 않음)

      - 사용자에게 반드시 확인 후 실행하세요'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 삭제할 파일 또는 폴더 경로
      required:
      - path
  - name: make_directory
    description: '빈 폴더(디렉토리)를 생성합니다.


      사용법:

      - 중간 경로가 없으면 함께 생성 (mkdir -p 동등)

      - 이미 존재해도 오류 없이 통과 (멱등)


      주의사항:

      - 파일 삭제·폴더 삭제는 delete_path 사용

      - 이동·이름변경은 move_path 사용'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 삭제할 파일 또는 폴더 경로
        missing_ok:
          type: boolean
          default: false
          description: 대상이 없을 때 오류 대신 성공으로 넘어간다(멱등). 지우고 다시 올리는 정기 작업에서 첫 실행이 파이프를 끊지 않게 할 때.
      required:
      - path
  - name: patch_op
    description: "자기개조 패치 — RED 구역(backend/·frontend/·scripts/) 코어 코드 변경을 격리\
      \ 사본(git worktree)에서 다룹니다.\n\n## 수리 경로에서 (사용자 명령 수리 = 그랜트 있음)\n\
      RED 파일을 [self:write]/[self:edit] 로 그냥 고치세요 — **자동으로 격리 사본에 쌓입니다**\
      \ (라이브 무변경 = 리로드 없음 = 당신의 턴이 안 끊깁니다). 다 고쳤으면 반드시:\n\n  \
      [self:patch]{op:\"apply\"}\n\n가 기계 검증(구문·import 스모크·IBL 삼각·안전장치\
      \ 스모크)을 돌리고 **통과분만** 라이브로 한 번에 옮깁니다. 검증 실패면 라이브는 무변경이고\
      \ 실패 상세가 돌아오니 격리 사본에서 고쳐 쓰고 다시 apply 하세요.\n★apply 를 부르지 않으면\
      \ 그 수정은 라이브에 없습니다 — 고쳤다고 보고하지 마세요.\n\n## 자율 태스크에서 (그랜트 없음)\n\
      op:\"propose\" (기본) — 격리 사본에 제안+검증만 남깁니다. 스스로 적용할 수는\
      \ 없지만 제안은 죽지 않습니다 — 사용자가 수리 경로로 명령한 턴에서 [self:patch]{op:\"apply\",\
      \ proposal_id:\"<id>\"} 가 집어갑니다(재작업 불필요).\n\n## op\n\
      - propose(기본): path + content(전체) 또는 old_string+new_string(부분), reason 필수\n\
      - apply: 이 세션의 격리 변경을 검증 후 라이브 적용\n- status: 무엇이 격리에 쌓여 있고 아직\
      \ 라이브에 안 갔는지\n- discard: 격리 사본 폐기 (라이브는 원래 무변경)"
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 수행할 동작.
        path:
          type: string
          description: (propose) 대상 RED 파일 경로 (backend/·frontend/·scripts/ 하위). RED 밖이면 거부됨.
        content:
          type: string
          description: (propose) 새 전체 파일 내용 (신규 생성 또는 전체 교체). old_string/new_string 과 택일.
        old_string:
          type: string
          description: (propose) 부분 교체 — 교체할 기존 문자열 (HEAD 기준 파일 내 유일해야 함). new_string 과 함께.
        new_string:
          type: string
          description: (propose) 부분 교체 — 새 문자열.
        reason:
          type: string
          description: (propose) 변경 근거 (필수). 사람이 제안을 검토할 때 읽는다.
        key:
          type: string
          description: (discard) 폐기할 스테이징 세션 키. 생략 시 현재 수리 세션.
        proposal_id:
          type: string
          description: (apply/discard) propose 가 돌려준 제안 id. apply 에 주면 이 세션 대신 그 제안을 검증 후 적용한다(재작업 불필요, 수리 그랜트는 그대로 필요). discard 에 주면 그 제안을 폐기. 목록은 op:status.
  - name: read_op
    description: '파일 읽기 — 텍스트/PDF/DOCX/XLSX 통합. 확장자로 자동 인식(format 명시도 가능).


      파라미터: 읽을 파일 경로. format 옵션 (text/pdf/docx/xlsx) — 생략 시 확장자 자동. text — offset/limit (라인) 또는 start_line/end_line (1-기반 양끝 포함, 구간 발췌). pdf — pages 옵션 (예 ''1-5''), tables:true 면 표를 table 통화로 추출. docx — offset/limit/max_blocks (블록 단위). xlsx — sheet(특정 시트명)/max_rows 옵션. 스캔 PDF는 별도 OCR 필요.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 동작 분기 — target_description 참조
        start_line:
          type: integer
          description: text — 발췌 시작 줄 (1-기반, 양끝 포함). end_line 과 짝. 긴 파일을 통째로 읽지 말고 이 구간 발췌를 쓸 것
        end_line:
          type: integer
          description: text — 발췌 끝 줄 (1-기반, 포함). start_line 과 짝
      additionalProperties: true
  - name: fill_op
    description: '양식 채우기 — PDF 폼/DOCX 템플릿에 값을 넣어 완성 문서 생성. read 의 짝(문서→문서, 구조 보존).


      파라미터: path(템플릿 .pdf 폼 또는 {{자리표시자}} 든 .docx). data({필드: 값}) — 생략하면 채울 수 있는 필드 목록을 반환. output(출력 경로, 생략 시 원본 옆 _filled). flatten(PDF 전용, true면 폼을 정적 내용으로 구워 제출용).'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 템플릿 문서 경로 (.pdf 폼 또는 {{자리표시자}} 든 .docx)
        data:
          type: object
          description: 필드→값 매핑. 생략하면 채울 수 있는 필드 목록을 반환
        output:
          type: string
          description: 출력 파일 경로 (생략 시 원본 옆 _filled)
        flatten:
          type: boolean
          description: 'PDF 전용 — true면 폼을 정적 내용으로 구워 제출용(수정 불가). 기본 false'
      required:
      - path
  - name: spreadsheet
    description: '행 데이터를 xlsx 스프레드시트로 씁니다 (값만, 수식·서식 제외).


      단일 시트: rows(행 배열, 각 행은 셀 배열) + headers(선택)/sheet_name(선택). 다중 시트: sheets={시트명: rows}. path는 .xlsx 자동 보정, bare 파일명은 outputs/로.'
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: 출력 파일 경로 (.xlsx 자동 보정)
        rows:
          type: array
          items:
            type: array
          description: 행 배열 — 각 행은 셀 값 배열 (단일 시트)
        headers:
          type: array
          items:
            type: string
          description: 열 머리글 (선택, 첫 행으로 삽입)
        sheet_name:
          type: string
          description: 단일 시트 이름 (기본 Sheet1)
        sheets:
          type: object
          description: '다중 시트 {시트명: rows}. 주면 rows보다 우선.'
      required:
      - path
  - name: webapp_op
    description: 내 웹앱 등기부 — 목록(파생+수동)·생존 실측·수동 등록/제거. 몸 공개면과 web-builder 사이트는 자동 파생.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: list(기본)/status/register/remove
        name:
          type: string
          description: register — 웹앱 이름 / remove — 지울 웹앱 이름(url 대신 지목 가능)
        url:
          type: string
          description: register/remove — 웹앱 주소
        kind:
          type: string
          description: register 선택 — 부류 메모 (예 외부(Worker))
        memo:
          type: string
          description: register 선택 — 자유 메모
        timeout:
          type: number
          description: status 선택 — 프로브 타임아웃 초 (기본 5)
  - name: body_op
    description: 몸(이 저장소) 파일 변화 이력 — git 원장 회상. changes(최근 파일 변화, 미커밋 포함)/log(커밋 이력)/file(한 파일의 일생 — 이름변경·이동 관통)/writes(런타임 쓰기 원장 — 관문 통과분만, 행위자 동반).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: changes(기본)/log/file/writes
        days:
          type: integer
          description: changes/log/writes — 조회 기간(일). 기본 7, 최대 365
        path:
          type: string
          description: changes/log/writes — 스코프 폴더(예 backend/cognition) / file — 대상 파일 경로(필수)
        limit:
          type: integer
          description: 최대 행 수. 기본 200, 상한 1000 (초과 요청은 신고 후 상한 적용)
  - name: sheet_op
    description: 엑셀 장부 부분 편집 — 행 검색(find)/행 추가(append)/셀 수정(update). 기존 수식·서식·다른 시트 보존.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: find(기본)/append/update
        path:
          type: string
          description: 대상 xlsx/xlsm 파일 경로
        sheet:
          type: string
          description: 시트명 (생략 시 활성 시트)
        header_row:
          type: number
          description: 헤더 행 번호 (기본 1)
        where:
          type: object
          description: 'find/update — {열이름: 값} 전부 일치하는 행'
        set:
          type: object
          description: 'update 전용 — {열이름: 새값}. "=수식" 문자열 지원'
        items:
          type: array
          description: 'append 전용 — [{열이름: 값}, …]. 생략 시 파이프 직전 step 의 items/table 자동 사용'
        limit:
          type: number
          description: find 결과 상한 (기본 50)
  - name: script_op
    description: 등록 스크립트 실행기 — list/register/run/status/remove. 코드가 아니라 등록 id 만 나른다. 셸 미경유 argv 실행, stdout JSON 은 통화로. run{background:true}→job_id, status{job_id, wait}.
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: list(기본)/register/run/status/remove
        background:
          type: boolean
          description: 'run 선택 — true 면 별도 프로세스로 실행하고 즉시 job_id 반환(긴 작업)'
        job_id:
          type: string
          description: 'status 선택 — 조회할 작업 id (run background 가 돌려준 값)'
        wait:
          type: number
          description: 'status 선택 — 끝날 때까지 유한 대기 초(≤240)'
        id:
          type: string
          description: 스크립트 id (register 생략 시 파일명에서 유도)
        path:
          type: string
          description: register 전용 — 등록할 스크립트 파일 경로 (실존 필수)
        interpreter:
          type: string
          description: register 선택 — 생략 시 확장자 추론 (.py/.sh/.js)
        description:
          type: string
          description: register 선택 — 스크립트 설명 (목록에 표시)
        args:
          type: object
          description: 'run 선택 — JSON 객체, 스크립트 stdin 으로 전달'
        timeout:
          type: number
          description: 실행 제한 초 (기본 300)
