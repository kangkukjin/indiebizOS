nodes:
  sense:
    actions:
      search:
        lands_on: hub
        path_audited: {at: "2026-09-15", impl: "bdc9d886a725ddb9"}
        aliases:
          limit: [count, display, page_size, max_results]
          # ★max_results 는 정본이 아니다(check_param_canon) — 이 액션의 기존 정본 count 로 흡수
          headlines: [front_page]   # HN 원어 관습어는 별칭으로 수용
        returns: items
        result_shape_variants:
          source=gnews:
            kind: items
            cols: [title, meta, summary, url, link_label, query, date, sources, hot, reason]
            closed: false  # 원문 행 복구·편집장 부가 필드를 열어 둔다
        result_shape_rules:
          - when: {source: gnews, queries: {nonempty: true}, curate: {present: false}}
            shape:  # 비편집 배치의 단일 생성자 _gnews_item이 보장하는 전체 열
              kind: items
              cols: [title, meta, summary, url, link_label, query, date]
              closed: true
        side_effect: false   # 브라우저 프로필·사이트 설정 캐시만 쓴다(부작용-정직성 관문 2026-09-06)
        fixture: '[sense:search]{query: "climate policy"}'
        description: 웹·뉴스 통합 검색 — source 로 엔진 선택. ddg(기본, 글로벌 웹)/naver(한국어 콘텐츠 — 한국어 질의는 이쪽)/gnews(구글 뉴스)/hn(Hacker News 기술)/guardian(가디언 아카이브, 영어). 유튜브·논문·지역·쇼핑은 각 도메인 검색 액션.
        group: research
        target_description: 검색어. gnews/hn 정상 0건은 성공한 빈 items이며 HTTP·파싱·시간 초과 오류와 구별한다. 배치 실패는 errors에 남기고 성공한 행은 보존한다. source 로 엔진 선택(기본 ddg — 한국어는 naver 권장). naver 는 type(webkr/news/blog/cafe/kin/encyc)·sort, gnews/hn 은 headlines(톱 헤드라인/프론트페이지)·queries(배치 팬아웃)·curate(경량 편집장) 지원. ★hn 은 기본이 전체 기간 인기순이라 몇 년 된 글이 1위로 온다 — 최신 동향을 볼 땐 days(최근 N일) 를 줄 것. hn·gnews·guardian·naver(news) 결과의 date 필드가 ISO8601 aware 게시일, naver(blog)는 날짜만(YYYY-MM-DD) — 발행일 파싱 불능 행은 date 없음. 신선도 술어는 우변도 aware 로 쓸 것 — 예 where "date >= 2026-08-07T00:00:00Z" (날짜만 리터럴은 naive 라 aware 값과 혼합 판정 불능 — ISO 시간 의미론 2026-08-27 판정).
        router: handler
        tool: search
        implementation: source 분기 단일 도구 — ddg=DuckDuckGo ddgs 라이브러리(키 불요), naver=네이버 개발자센터 API(NAVER_CLIENT_ID/SECRET — 구 web-kr 패키지 흡수), gnews=Google News RSS(feedparser, 배치 팬아웃+curate 편집장+가디언 합류), hn=HN Algolia API(키 불요), guardian=Guardian Open Platform(GUARDIAN_API_KEY — 구 study search_guardian 흡수). gnews 언어 자동 감지.
        target_key: query
      crawl:
        lands_on: hub
        path_audited: {at: "2026-09-15", impl: "bdc9d886a725ddb9"}
        returns: items
        side_effect: false   # 세션 상태·원문 캐시·임시 PDF만 쓴다
        fixture: '[sense:crawl]{url: "https://example.com"}'
        description: 웹페이지 원문 읽기 (URL 필요). 전문을 보관하고 items=문단 단위로 전달. 첫 표시는 문단 수와 무관하게 6만자까지, 추가 읽기는 저장 변수·source_ref 사용. 같은 URL은 캐시 재사용, 새 내용은 refresh:true.
        group: research
        target_description: 읽을 페이지 URL (http/https). max_length는 모델 표시 글자 예산(기본 60000)이며 원문·IBL 후속 처리량을 자르지 않는다. 새 내용 갱신은 refresh:true, 더 읽기는 저장 변수·source_ref.path.
        router: handler
        tool: crawl_website
        implementation: 1차 curl_cffi(TLS 크롬 위장) 정적 크롤링 → 로그인 벽·봇차단·콘텐츠 부족 감지 시 Chrome MCP/Playwright(로그인 세션 자동 복원, iframe 전 프레임 수집)로 자동 에스컬레이션. 최종 실패 시 reason(bot_blocked/login_required) 명시.
        target_key: url
        # 뉴스(구 search_gnews)·HN(구 search_hn)·네이버(구 web-kr search_naver)·가디언(구 study
        # search_guardian)은 2026-08-05 어휘 압축 (2)에서 source 축으로 흡수 — 검색 5액션 → search 하나.
        # 신문 계기(NewspaperInstrument.tsx)는 [sense:search]{source: gnews|hn} 배치 경로를 쓴다.
      http:
        returns: items
        side_effect: false    # HEAD/GET 만 — 부작용 요청은 이 낱말이 아니다
        runs_on: anywhere
        fixture: '[sense:http]{op: "head", url: "https://example.com"}'
        description: HTTP 탐침(읽기 전용, op 분기) — head(기본)/body 로 상태 코드·헤더·Content-Type·길이·Range 응답·지연을 items 1행으로. 본문을 읽는 건 crawl, 상태와 헤더를 보는 건 이것(curl 대신).
        group: research
        target_description: 'url 필수. op=head(기본): 상태·헤더만 / body: 본문을 max_bytes(기본 64KB)까지 받아 bytes·body_preview(텍스트일 때 앞 max_preview 자) 동반. range("bytes=0-99999" — 206·Content-Range 확인)·headers(추가 헤더 dict)·timeout(초, 기본 15). 4xx/5xx 는 success:true·ok:false·status 로 관측 — 연결 실패·타임아웃만 success:false. >> [table:select]{columns: ["status", "content_type", "elapsed_ms"]} 로 좁혀 받는다.'
        router: handler
        tool: http_probe
        implementation: web/tool_http.py — urllib HEAD/GET, 리다이렉트 5홉 추적(final_url·redirected), Range 헤더 전달, 본문은 max_bytes 까지만. 텍스트 타입만 미리보기.
        target_key: op
        # ★셸 그림자(2026-09-06 ep2910): 세상의 JSON API 를 curl 로 9회 두드렸다 — 이 낱말이 그 자리인데 그림자 표엔
        #   curl 이 self:package(url_contains=/packages/reload)에만 있었다. curl 의 그림자는 둘이다(몸의 API / HTTP 탐침).
        #   url_args = 인자는 경로가 아니라 URL(경로 면제 판정을 타지 않음) · not_when_flags = 쓰기 요청·파일 저장은 셸의 몫.
        shell_shadow:
          heads: [curl]
          argmap:
            positional: [url]
            url_args: true
            skip_url_contains: ["127.0.0.1", "localhost", "0.0.0.0"]   # 몸 자신의 주소(health 탐침 등)는 셸의 몫
            skeleton: {op: body}
            flags:
              "-I": op=head
              "--head": op=head
              "-H": headers
              "--header": headers
              "-m": timeout
              "--max-time": timeout
              "-r": range
              "--range": range
            not_when_flags: ["-X", "--request", "-d", "--data", "--data-raw", "--data-binary", "--data-urlencode",
                             "-F", "--form", "-T", "--upload-file", "-o", "-O", "--output", "--remote-name",
                             "-u", "--user", "-b", "-c", "--cookie", "--cookie-jar"]
        params:
          url: string
          headers: object
          range: string
          timeout: number
          max_bytes: integer
          max_preview: integer
        ops:
          default: head
          side_effect:
            head: false
            body: false
          fixture:
            head: '[sense:http]{op: "head", url: "https://example.com"}'
            body: '[sense:http]{op: "body", url: "https://example.com", max_bytes: 4096}'
          values:
            head: 상태·헤더만 (기본)
            body: 본문 일부까지 — bytes·body_preview
        keywords:
        - HTTP
        - 상태 코드
        - 헤더
        - 탐침
        - curl
        - Range
      feed:
        returns: items
        fixture: '[sense:feed]{url: "https://www.pewresearch.org/feed/", limit: 3}'
        description: RSS/Atom 피드 읽기 — 어떤 사이트든 피드 URL 하나로 최신 글 목록을 items(제목·날짜·링크·요약)로. 블로그·뉴스·연구기관 새 글 확인용. crawl 은 피드 항목 구조를 뭉개므로 피드 URL 은 이쪽. 이웃·커뮤니티 타임라인은 others:feed.
        group: research
        target_description: 피드 URL (…/feed/, …/rss.xml, atom.xml 등). limit 로 항목 수 제한(기본 10, 0은 빈 결과). HTML 등 피드가 아닌 응답은 오류다. 특정 기관 예시 — Pew Research는 https://www.pewresearch.org/feed/ (구 sense:pew_research 액션의 일반화, 2026-08-15).
        router: handler
        tool: fetch_feed
        implementation: feedparser 로 RSS/Atom 파싱 — 제목·게시일·링크·요약(HTML 제거)을 레코드 통화 {title, meta, summary, url} 로. 피드 제목을 source 로 자동 사용.
        target_key: url
        keywords:
        - 피드
        - RSS
        - 구독
        - 새 글
  engines:
    actions:
      # 신문 발행 — 옛 engines:newspaper(수집+조립+브라우저 열기 박제, 은퇴)와 다른 개념:
      # 현행 '판(edition) 3파일' 모델(newspaper_guide.md)을 한 액션으로 결정화.
      # 배경: 발행 로직이 데스크탑 계기 React 코드에만 살아 원격/폰 버튼이 시스템 AI
      # 자연어 위임으로 우회(무시되면 끝)하던 것을 결정론 경로로 교체(2026-07-23).
      newspaper:
        returns: effect
        runs_on: pc_only
        # 2026-08-15 조합성 재점검 2차: 스위치화(사전 퇴거) — 실체는 gnews 팬아웃 오케스트레이션
        # +조판 템플릿(낱말 아닌 문장). 신문 계기 발행 버튼([engines:newspaper]{}@hub)이 유일한
        # 살아있는 호출자라 레지스트리·핸들러는 유지, 에이전트 카탈로그에서만 숨김.
        # 코퍼스 8행은 보존(해마 회상=부활 방아쇠 — 자연어 "신문 발행"도 회상 경유로 실행 가능).
        prompt_hidden: true
        description: 신문 발행 — 서버 설정(제호·키워드)의 키워드로 gnews 팬아웃+경량 편집장 편성 후 판(json/md/html)+날짜 아카이브를 저장. 파라미터 없이 호출 가능, 기본 백그라운드(즉시 반환, ~1분) — wait:true=동기. 신문 계기·뷰어가 저장된 판을 읽어 표시.
        group: media_produce
        target_description: 전부 선택 — keywords(키워드 목록, 리스트 또는 쉼표 구분·미지정 시 서버 설정 outputs/newspaper_config.json), title(제호), sources(기본 "gnews,guardian"), wait(true=동기 발행·완료까지 블로킹). 기본은 백그라운드 시작 후 즉시 반환(queued) — 진행 상태는 앱모드 outputs/newspaper_publish_state.json.
        router: handler
        params:
          keywords: ["string", "array"]   # 구현 _parse_keywords 가 리스트를 먼저 받는다
        tool: publish_newspaper
        implementation: tool_newspaper.py — handler 의 gnews 배치 경로([sense:search]{source:"gnews"} 의 queries 팬아웃 — RSS 병렬+편집장 일괄 curate+가디언 합류) 재사용 → query 태그로 섹션 조립(핫토픽 맨 앞) → JSON(데스크탑 카드 그리드)/MD(폰·원격 뷰어)/HTML(공유)+newspaper_archive/ 날짜본 저장. 설정 파일 없으면 기본값(청주 데일리·12키워드) 결정화.
        keywords:
        - 신문
        - 신문 발행
        - 새 신문
        - 발행
        - 뉴스 신문
  limbs:
    actions:
      launch:
        returns: effect
        description: 즐겨찾기 런처 대시보드 띄우기(기본) 또는 사이트 관리. action 미지정 시 대시보드 UI 표시
        group: open
        target_description: (미지정 시 대시보드 표시). action으로 register/add/list/remove 등 사이트 관리.
        router: handler
        tool: launch_sites
        scope: workspace
        implementation: 즐겨찾기 JSON 설정 기반 URL 일괄 오픈 (webbrowser 모듈) — workspace 도구(프로젝트 무관)
        target_key: action
        app:
          icon: 🔖
          name: 즐겨찾기
          order: 10
          auto_run: true
          action: '[limbs:launch]{action: "list"}'
          view:
          - type: card_list
            from: items
            empty_from: message
            card:
              title: '{name}'
              lines:
              - '{url|trunc:54}'
              link:
                href: '{url}'
                label: 열기 →

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: web
    name: Web Tools
    description: 웹 검색 및 크롤링 도구. 통합 검색(DuckDuckGo/네이버/Google 뉴스/Hacker News/가디언 — source 분기), 웹페이지 텍스트 추출, 신문 발행, 즐겨찾기 사이트 관리 기능을 제공합니다. 정보 수집, 뉴스
      모니터링, 웹 리서치에 활용.
    version: 1.3.0
  tools:
  - name: http_probe
    description: 'HTTP 탐침 — head(상태·헤더)/body(본문 일부까지)로 상태 코드·헤더·Content-Type·Range 응답·지연을 봅니다(읽기 전용, curl 대신). 본문 추출은 crawl_website.'
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: 요청할 http/https 주소
        op:
          type: string
          description: head(기본)/body
        range:
          type: string
          description: 'Range 헤더 값 (예: bytes=0-99999)'
        headers:
          type: object
          description: 추가 요청 헤더
        timeout:
          type: number
          description: 초 (기본 15)
        max_bytes:
          type: integer
          description: body 가 받을 본문 상한 바이트 (기본 65536)
        max_preview:
          type: integer
          description: body_preview 글자 수 (기본 600)
      required:
      - url
  - name: fetch_feed
    description: 'RSS/Atom 피드를 읽어 최신 글 목록을 반환합니다.


      ## 사용 시점

      - 특정 사이트(블로그·뉴스·연구기관)의 새 글 목록이 필요할 때

      - 피드 URL(…/feed/, rss.xml, atom.xml)을 알거나 추정할 수 있을 때


      ## 다른 도구와의 관계

      - crawl_website 는 피드의 글별 제목/날짜/링크 구조를 뭉갬 — 피드 URL 은 이 도구로

      - 키워드 검색은 search (이 도구는 "이 사이트의 최신 글" 열거)'
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: 피드 URL (RSS 2.0 / Atom)
        limit:
          type: integer
          description: 가져올 항목 수 (기본 10)
          default: 10
      required:
      - url
  - name: search
    description: '웹·뉴스 통합 검색 — source 로 검색 엔진을 선택합니다.


      ## source (기본 ddg)

      - ddg: DuckDuckGo 글로벌 웹 검색 (키 불요). 영어/글로벌 질의.

      - naver: 네이버 검색 API — 한국어 콘텐츠(웹문서/뉴스/블로그/카페/지식인/백과)에 압도적. 한국어 질의는 이쪽. type 으로 도메인 선택.

      - gnews: Google News RSS 뉴스 검색 (키 불요). 언어 자동 감지, headlines/queries/curate 지원.

      - hn: Hacker News(Algolia) 기술·스타트업 포스팅 (키 불요). points(▲)=주목도, headlines:true=프론트페이지.

      - guardian: The Guardian 아카이브 (영어, GUARDIAN_API_KEY 필요). from_date/to_date 기간 검색.


      ## 주의사항

      - 단순 검색만 수행 — 페이지 본문을 읽으려면 crawl_website 사용

      - 실시간 데이터가 필요하면 여러 번 검색보다 한 번에 구체적으로


      ## 다른 도구와의 관계

      - 유튜브: search_youtube / 논문: paper / 지역 업소: search_restaurants / 쇼핑: search_shopping (각 도메인 검색은 별도 액션)

      - 페이지 내용 확인: crawl_website / 복잡한 웹 작업: browser_op'
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 검색 키워드 (구체적으로 작성). gnews/hn 의 headlines:true 면 생략 가능.
        source:
          type: string
          enum:
          - ddg
          - naver
          - gnews
          - hn
          - guardian
          default: ddg
          description: 검색 엔진 (기본 ddg). 한국어 질의는 naver, 뉴스는 gnews(한국 출처는 naver+type:news), 기술 동향은 hn, 영어 아카이브는 guardian.
        limit:
          type: integer
          description: 결과 수 (기본 ddg 5 · naver 5 · gnews 10 · hn 15 · guardian 10. gnews 는 100까지 GET 1회)
        days:
          type: integer
          description: hn 전용 — 최근 N일로 제한. 미지정이면 전체 기간 인기순이라 몇 년 된 글이 1위로 온다(2026-08-20 실측 — "AI agent" 상위 3건이 2026-02·03·06월). 최신 동향을 볼 때는 days 를 반드시 줄 것(예 days 7). 결과의 date 필드가 ISO8601 게시일.
        type:
          type: string
          description: 'naver 전용 — 검색 도메인 (webkr/news/blog/cafe/kin/encyc, 기본 webkr). 자연어 별칭(웹/뉴스/블로그/카페/지식인/백과) 허용. ★book/doc/shop 은 2026-08 네이버 은퇴(SE05).'
        sort:
          type: string
          enum:
          - sim
          - date
          description: naver 전용 — sim(정확도, 기본) 또는 date(최신순)
        country:
          type: string
          description: 'ddg 전용 — 국가/언어 코드 (기본: kr-kr)'
        language:
          type: string
          enum:
          - auto
          - ko
          - en
          description: gnews 전용 — 언어 (기본 auto=키워드의 한글 비율로 자동 감지)
        curate:
          type: integer
          description: gnews/hn 전용 — 지정 시 경량 AI '편집장'이 ~100개를 넓게 보고 이 개수만큼 편성(hot·delta·surface 선별, 각 기사에 role/why 부착). 안 뽑힌 나머지는 pool 필드로 반환. 신문 섹션용. 미지정 시 순수 검색.
        headlines:
          type: boolean
          description: gnews/hn 전용 — true 면 키워드 없이 톱 헤드라인(gnews)/프론트페이지(hn). curate 와 함께 '오늘의 핫토픽' 섹션. query 불필요.
        queries:
          type: [string, array]
          description: gnews/hn 전용 — 여러 키워드 배치 팬아웃(배열 또는 쉼표/개행 문자열 — 핸들러가 양쪽 처리하는데 선언이 string 뿐이라 배열 리터럴이 관문에서 죽던 비대칭 수리 2026-08-28), 각 검색어를 query 태그로 섹션화해 한 목록으로.
        sources:
          type: string
          description: gnews curate 전용 — 큐레이션 풀 합류 소스(쉼표 나열). 기본 "gnews,guardian" — 영어 키워드면 가디언 기사 합류. "gnews"만 주면 끔.
        from_date:
          type: string
          description: guardian 전용 — 시작일 (YYYY-MM-DD)
        to_date:
          type: string
          description: guardian 전용 — 종료일 (YYYY-MM-DD)
      required: []
  - name: crawl_website
    description: '웹페이지의 텍스트 내용을 추출합니다.


      ## 반환값

      - title: 페이지 제목

      - text: 추출된 전문. items와 함께 내부 통화에 유지하며 모델 미리보기에서는 중복 본문을 생략할 수 있다.

      - length: 원본 텍스트 길이. source_ref.path: 전문 JSON 스냅샷(24시간). cache: hit·fetched_at·reuse_until. HTTP 오류는 실패이며 정상 원문 캐시에 저장하지 않는다. resolved_url·http_status는 수집 단계가 확인한 최종 주소·상태다.


      ## 사용 시점

      - 검색 결과에서 찾은 URL의 상세 내용 확인

      - 기사, 블로그, 문서 내용 읽기


      ## 주의사항

      - JS 렌더링·iframe 자동 지원 (정적 실패 시 Playwright 로 자동 에스컬레이션 — 직접 curl 우회 불필요)

      - news.google.com 기사 링크는 실제 기사 URL 로 자동 해소 후 크롤

      - 원문은 한 번 수집해 보관한다. 첫 표시는 문단 수와 무관하게 기본 60000자까지이며 max_length로 조절한다. 넘는 부분은 _preview로 알린다. 같은 턴의 $변수에서 filter/select/take로 필요한 부분을 읽거나 source_ref.path를 읽는다. 전문 보관과 전량 검토는 다르다. 동일 URL은 기본 15분 캐시를 재사용하므로 표시량을 늘려도 네트워크 재조회하지 않는다. 최신 내용 갱신만 refresh:true로 명시한다.

      - Cloudflare 급 완전 챌린지·로그인 벽은 reason(bot_blocked/login_required) 으로 정직 반환 → 다른 소스 시도


      ## 다른 도구와의 관계

      - URL 찾기: search

      - 로그인 세션이 필요한 조작: browser_op'
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: 크롤링할 URL
        max_length:
          type: integer
          description: 모델 미리보기 글자 예산(양의 정수, 기본 60000). 문단 수로 먼저 자르지 않으며 원문 보관·IBL 후속 처리량은 제한하지 않는다. execute_ibl의 verbose:true는 미리보기를 생략한다.
          default: 60000
        refresh:
          type: boolean
          description: true면 URL 캐시를 건너뛰고 새 원문 수집. 더 읽기에는 불필요(기본 false).
          default: false
      required:
      - url
  - name: publish_newspaper
    description: '신문 발행 — 판(edition) 3파일을 앱모드 outputs/ 에 저장합니다.


      ## 흐름

      - 서버 설정(newspaper_config.json)의 제호·키워드 로드 (없으면 기본값 결정화)

      - gnews 배치 팬아웃 1회 (search{source:gnews} 경로 — 핫토픽 headlines + 키워드별, 경량 편집장 curate 7, 가디언 합류)

      - 판 조립 → newspaper_current.json(데스크탑)/md(뷰어)/html(공유) + newspaper_archive/ 날짜본


      ## 사용 시점

      - "신문 발행해줘", 신문앱 새 신문 발행 버튼 — 파라미터 없이 호출하면 서버 설정대로.


      ## 다른 도구와의 관계

      - 개별 뉴스 검색: search{source:gnews} / 발행된 판 읽기: 파일 읽기(newspaper_current.md)'
    input_schema:
      type: object
      properties:
        keywords:
          # type 은 액션 params 블록이 단일 소스(string|array)
          description: 섹션 키워드 목록 (쉼표/개행 구분, JSON 리스트도 허용). 미지정 시 서버 설정(newspaper_config.json).
        title:
          type: string
          description: 제호 (미지정 시 서버 설정, 기본 "청주 데일리").
        sources:
          type: string
          description: 큐레이션 소스 (기본 "gnews,guardian" — 영어 키워드에 가디언 합류, "gnews"만 주면 끔).
        wait:
          type: boolean
          description: true면 동기 발행(완료까지 ~1분 블로킹). 기본 false=백그라운드 시작 후 즉시 반환, 진행은 outputs/newspaper_publish_state.json.
      required: []
  - name: launch_sites
    description: '즐겨찾기 사이트 런처(대시보드) 및 관리.


      ## 기능 (action)

      - open_ui (기본값): 즐겨찾기 대시보드 페이지를 브라우저에 띄움

      - list: 저장된 사이트 목록 텍스트로 확인

      - add: 새 사이트 추가 (name, url 필요)

      - remove: 사이트 삭제 (name 필요)'
    input_schema:
      type: object
      properties:
        action:
          type: string
          enum:
          - open_ui
          - list
          - add
          - remove
          description: 실행할 작업
        name:
          type: string
          description: 사이트 이름 (add/remove용)
        url:
          type: string
          description: 사이트 URL (add용)
