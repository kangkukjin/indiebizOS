nodes:
  sense:
    actions:
      video:
        returns: scalar
        side_effect: true    # summarize 가 HTML 보고서를 쓰고 브라우저를 연다
        fixture: '[sense:video]{op: "info", video_id: "jNQXAC9IVRw"}'  # 유튜브 최초 영상(2005~ 불변) — yt-dlp 생존 프로브. 옛 fixture 는 죽은 op 'meta'+비파라미터 query 로 94% 거짓 실패
        runs_on: pc_only
        description: 유튜브 동영상 조회·시청 (op 분기). 메타·자막·요약 + 시청 앱(추천 피드·시청 페이지·시청 기록 — 재생은 맥 경유 릴레이, 유튜브 직접 접속 없음). 검색은 search_youtube.
        target_description: 'op로 분기 (기본 info). info/transcript/languages/summarize 는 url 또는 video_id 필수.

          - info: 메타데이터(제목·조회수·채널).

          - transcript: 자막/스크립트 추출. language 옵션.

          - languages: 사용 가능한 자막 언어 목록.

          - summarize: 자막 추출 + AI 요약 + HTML 보고서 + 브라우저 열기. summary_length 옵션.

          - feed: 추천 홈 피드 (시청 기록의 채널 RSS + 연관 검색, 기록 없으면 기본 카테고리). limit 옵션.

          - watch: 시청 페이지 (릴레이 스트림 플레이어 + 연관 동영상). video_id 필수.

          - history: 시청 기록 목록. limit 옵션.

          '
        target_key: op
        group: media
        router: handler
        tool: video_op
        ops:
          default: info
          returns:
            summarize: effect
          side_effect:
            info: false
            transcript: false
            languages: false
            history: false
            feed: false
          fixture:
            transcript: '[sense:video]{op: "transcript", video_id: "jNQXAC9IVRw"}'
            languages: '[sense:video]{op: "languages", video_id: "jNQXAC9IVRw"}'
            feed: '[sense:video]{op: "feed", limit: 5}'
            history: '[sense:video]{op: "history", limit: 5}'
          values:
            info: 동영상 메타데이터 (제목·조회수·채널)
            transcript: 자막/스크립트 추출
            languages: 사용 가능한 자막 언어 목록
            summarize: 자막+AI요약+HTML 보고서 생성
            feed: 추천 홈 피드 (시청 기록 기반 채널 RSS+연관 검색, 콜드스타트=기본 카테고리)
            watch: 시청 페이지 (video_id — 맥 경유 릴레이 플레이어 + 연관 동영상)
            history: 시청 기록 (최신순, limit 옵션)
        implementation: youtube 패키지 op 분기. info=get_youtube_info, transcript=get_youtube_transcript, languages=list_available_transcripts, summarize=summarize_youtube, feed/watch/history=tool_watch.py(채널 RSS·ytsearch·youtube_watch.json — 재생 로그는 api_ytrelay 가 적재).
        keywords:
        - youtube
        - 유튜브
        - 동영상
        - 자막
        - 영상요약
        - 시청
        - 추천
        - 피드
        app:
          instrument: yttv
          icon: ▶️
          name: 유튜브
          order: 8
          # 유튜브 앱을 닮은 3탭 — 홈(추천)/검색/기록. 카드 클릭=시청 페이지(플레이어+연관),
          # 연관 클릭=recursive 드릴로 다음 영상(유튜브식 무한 탐색). 재생=맥 경유 릴레이
          # (/yt/relay — 브라우저는 유튜브에 직접 접속하지 않음, 한 번 본 것은 캐시 즉시 재생).
          # ★phone_render:false — 폰 네이티브는 relay 상대 URL 이 폰 자신을 가리켜 죽는다
          #   (릴레이 서버·ffmpeg=PC 몸). 원격 런처(리모컨)와 데스크탑만.
          modes:
          - name: 홈
            auto_run: true
            phone_render: false
            note: 추천은 내 시청 기록으로 만듭니다(본 채널의 새 영상 + 본 주제 연관 검색) — 유튜브 계정 추천과 달리 전부 이 기기 안의 기록입니다. 처음엔 기본 카테고리가 나오고, 보실수록 개인화됩니다.
            action: '[sense:video]{op: "feed"}'
            view:
            - type: card_list
              from: items
              empty_from: message
              card:
                wide: true
                title: '{title}'
                lines:
                - '{channel} · {src}'
                image: '{thumb}'
              item_click:
                action: '[sense:video]{op: "watch", video_id: "{video_id}"}'
                view:
                - type: media_player
                  from: items
                  lazy: true
                  video: true
                  src: '{stream}'
                  src_low: '{stream_low}'
                  src_hls: '{stream_hls}'
                  poster: '{thumb}'
                  title: '{title} · {channel}'
                - type: card_list
                  from: related
                  card:
                    wide: true
                    title: '{title}'
                    lines:
                    - '{channel} · {duration}'
                    image: '{thumb}'
                  item_click:
                    action: '[sense:video]{op: "watch", video_id: "{video_id}"}'
                    recursive: true
          - name: 검색
            phone_render: false
            inputs:
            - key: q
              type: text
              placeholder: 동영상 검색
              required: true
            action: '[sense:search_youtube]{query: "$q", count: 12}'
            view:
            - type: card_list
              from: items
              empty_from: message
              card:
                wide: true
                title: '{title}'
                lines:
                - '{channel} · {duration}'
                image: '{thumb}'
              item_click:
                action: '[sense:video]{op: "watch", video_id: "{video_id}"}'
                view:
                - type: media_player
                  from: items
                  lazy: true
                  video: true
                  src: '{stream}'
                  src_low: '{stream_low}'
                  src_hls: '{stream_hls}'
                  poster: '{thumb}'
                  title: '{title} · {channel}'
                - type: card_list
                  from: related
                  card:
                    wide: true
                    title: '{title}'
                    lines:
                    - '{channel} · {duration}'
                    image: '{thumb}'
                  item_click:
                    action: '[sense:video]{op: "watch", video_id: "{video_id}"}'
                    recursive: true
          - name: 기록
            auto_run: true
            phone_render: false
            action: '[sense:video]{op: "history"}'
            view:
            - type: card_list
              from: items
              empty_from: message
              card:
                wide: true
                title: '{title}'
                lines:
                - '{channel} · {duration}'
                image: '{thumb}'
              item_click:
                action: '[sense:video]{op: "watch", video_id: "{video_id}"}'
                view:
                - type: media_player
                  from: items
                  lazy: true
                  video: true
                  src: '{stream}'
                  src_low: '{stream_low}'
                  src_hls: '{stream_hls}'
                  poster: '{thumb}'
                  title: '{title} · {channel}'
                - type: card_list
                  from: related
                  card:
                    wide: true
                    title: '{title}'
                    lines:
                    - '{channel} · {duration}'
                    image: '{thumb}'
                  item_click:
                    action: '[sense:video]{op: "watch", video_id: "{video_id}"}'
                    recursive: true
      search_youtube:
        returns: items
        fixture: '[sense:search_youtube]{query: "jazz"}'
        runs_on: pc_only
        description: 유튜브 검색 (재생하지 않고 결과 목록만 반환 — video_id, title, url 포함)
        group: media
        keywords:
        - youtube
        - 유튜브
        - 영상검색
        - 동영상검색
        - video search
        target_description: 검색어
        router: handler
        tool: search_youtube
        implementation: yt-dlp ytsearch로 유튜브 검색 결과 목록 추출
        target_key: query
        app:
          instrument: ytmusic
          icon: 🎵
          name: 유튜브 뮤직
          order: 8
          # 명시적 modes — 검색/큐 두 탭을 한 액션이 선언(주식/음악앱 선례).
          # ★primary 가 modes 를 선언하면 다른 액션의 싱글 mode 블록은 무시되므로
          #   큐 탭도 여기로 이사(limbs:music 의 app 블록은 제거).
          # 동영상 시청은 별도 앱(yttv ▶️ 유튜브 — sense:video 의 app 블록) — 이 앱은
          # 원래 목적(음악 재생·저장) 그대로.
          modes:
          - name: 검색
            inputs:
            - key: q
              type: text
              placeholder: 곡·아티스트 검색
              required: true
            action: '[sense:search_youtube]{query: "$q", count: 15}'
            view:
            - type: list_action
              from: items
              icon: 🎵
              title: '{title|trunc:60}'
              sub: '{channel} · {duration}'
              button:
                label: ▶
                action: '[limbs:music]{op: "play", mode: "client", query: "https://www.youtube.com/watch?v={video_id}"}'
              button2:
                label: ⬇
                action: '[limbs:music]{op: "download", mode: "client", url: "https://www.youtube.com/watch?v={video_id}"}'
          - name: 큐
            phone_render: false
            auto_run: true
            buttons:
            - label: ⏭ 다음 곡
              action: '[limbs:music]{op: "skip"}'
            - label: ■ 정지
              action: '[limbs:music]{op: "stop"}'
            action: '[limbs:music]{op: "queue"}'
            view:
            - type: kv
              rows:
              - k: 상태
                v: '{message}'
            - type: kv_list
              from: queue
              title: 대기열
              empty: 대기열이 비어 있습니다
              k: '{position}'
              v: '{title|trunc:40} · {channel}'
  limbs:
    actions:
      music:
        returns: effect
        runs_on: pc_only
        description: 유튜브 음악 재생·큐 관리·중간 점프·MP3 다운로드·맥 경유 릴레이 (op 분기). play/add/skip/seek/queue/stop/download/relay. 내 파일 라이브러리는 [self:music].
        group: media
        target_description: play/add — query 파라미터로 검색어 또는 URL. seek — position 파라미터로 이동할 위치(초). download — url 파라미터로 MP3 추출(output_path 옵션). relay — query(검색어/URL)+media(audio|video), 원격·폰 표면이 유튜브 직접 접속 없이 맥 경유로 재생할 스트림 목록 반환. skip/queue/stop — 파라미터 없음.
        target_key: op
        router: handler
        tool: music_op
        ops:
          default: play
          side_effect:
            queue: false
            relay: false
          returns:
            queue: scalar
            relay: items
          fixture:
            queue: '[limbs:music]{op: "queue"}'
            relay: '[limbs:music]{op: "relay", query: "lofi", media: "audio", count: 2}'
          values:
            play: 즉시 재생 (query 검색어/URL, 기본)
            add: 큐에 추가 (query 검색어/URL)
            skip: 현재 곡 스킵
            seek: 현재 곡의 특정 지점으로 점프 (position 초)
            queue: 큐 목록 조회
            stop: 재생 중지
            download: MP3 다운로드 (url + output_path 옵션)
            relay: 맥 경유 릴레이 스트림 목록 (query 검색어/URL + media audio|video — 원격 표면 재생용, 유튜브 직접 접속 없음)
        implementation: yt-dlp + ffplay 음악 재생·큐·중간점프(-ss 재시작)·다운로드·릴레이(api_ytrelay 서빙) op 분기
        guides:
        - youtube_relay.md
        keywords:
        - youtube
        - 유튜브
        - 음악
        - 노래
        - 재생
        - 틀어줘
        - 큐
        - 대기열
        - 스킵
        - 다음곡
        - 정지
        - 멈춰
        - 다운로드
        - mp3
        - 전송
        - 릴레이

# tool.json 파생 원본 (2026-07-03 이관) — 빌드가 이 블록과 위 actions 의 ops 로 tool.json 을 생성한다.
# op-bearing 도구의 op enum/default 는 여기 저장하지 않는다 (actions 의 ops 가 단일 소스).
tool_json:
  header:
    id: youtube
    name: YouTube Tools
    description: YouTube 영상 도구. 영상 정보 조회, 자막 추출 및 요약, MP3 다운로드, PC 스피커 음악 재생 기능을 제공합니다. 영상 내용 분석, 음악 감상, 팟캐스트 청취, 영상 요약 문서화에
      활용.
    version: 1.1.0
  tools:
  - name: search_youtube
    description: 유튜브 검색 (재생하지 않고 결과 목록만 반환). 검색어로 영상을 찾고 video_id, title, channel, duration, url 정보를 포함한 결과 목록을 반환합니다. 재생/다운로드/자막추출
      전에 원하는 영상을 먼저 찾을 때 사용.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: '검색어. 예: ''김필 너무 아픈 사랑은'', ''빅뱅 판타스틱베이비'''
        count:
          type: integer
          description: 검색 결과 수 (1-10, 기본 5)
      required:
      - query
  - name: music_op
    description: 유튜브 음악 재생/대기열 단일 디스패처. op으로 play/add/skip/seek/queue/stop/download/relay 분기 (기본 play).
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: 음악 동작
        query:
          type: string
          description: 검색어 또는 URL (op=play/add/relay 시)
        position:
          type: number
          description: 점프할 위치(초) (op=seek 시)
        url:
          type: string
          description: 유튜브 URL (op=download 시)
        mode:
          type: string
          enum:
          - audio
          - video
          description: 재생 모드 (op=play 시, 기본 audio)
        media:
          type: string
          enum:
          - audio
          - video
          description: 릴레이 형태 (op=relay 시, 기본 audio — 소리만/영상+소리)
        count:
          type: integer
          description: 곡 수 (op=play/add/relay 시)
        output_path:
          type: string
          description: MP3 저장 경로 (op=download 시)
  - name: video_op
    description: '유튜브 동영상 조회·시청 (op 분기) — [sense:video]. 검색은 search_youtube.

      - op=info(기본): 메타데이터(제목·조회수·채널). url/video_id 필수.

      - op=transcript: 자막/스크립트. language 옵션.

      - op=languages: 사용 가능한 자막 언어 목록.

      - op=summarize: 자막+AI요약+HTML 보고서+브라우저 열기. summary_length 옵션.

      - op=feed: 추천 홈 피드 (시청 기록 기반, 로그인 불요). limit 옵션.

      - op=watch: 시청 페이지 (맥 경유 릴레이 플레이어+연관 동영상). video_id 필수.

      - op=history: 시청 기록 목록. limit 옵션.'
    input_schema:
      type: object
      properties:
        op:
          type: string
          description: info(기본)/transcript/languages/summarize/feed/watch/history
        url:
          type: string
          description: 유튜브 URL
        video_id:
          type: string
          description: 유튜브 video_id (url 대신)
        language:
          type: string
          description: '[transcript] 자막 언어 (예 ko/en)'
        summary_length:
          type: integer
          description: '[summarize] 요약 길이(기본 3000)'
        limit:
          type: integer
          description: '[feed/history] 결과 수 (기본 feed 24 / history 40)'
      required: []
