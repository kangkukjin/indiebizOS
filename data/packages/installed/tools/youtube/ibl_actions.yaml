nodes:
  limbs:
    actions:
      youtube:
        description: YouTube 탐색·조회·요약·재생·큐·다운로드를 한 대상의 op로 제공. search(기본), info/transcript/languages/channel/summarize, play/add/skip/seek/queue/stop/download/relay.
          내 파일 음악은 self:music.
        target_description: 'op 생략 시 search(재생하지 않음). search: query 또는 queries(배열·쉼표/개행 문자열), limit 기본5·최대75; 검색어별 sections와
          video_id 중복 제거 items를 반환. 정상 0건과 공급자 실패를 구별한다. info/transcript/languages/summarize 는 url 또는 video_id
          필수.

          - info: 메타데이터(제목·발행 채널/ID/URL·설명·조회수/좋아요/댓글/구독자·채널 인증·observed_at·upload_date=ISO YYYY-MM-DD). 미제공 지표는 null이며 0과
          구별한다. 채널 인증은 전문성 보증이 아니다. 원 공급자 날짜는 upload_date_raw로 보존. 날짜 누락·달력 오류는 실패.

          - transcript: 자막/스크립트 추출. language 옵션.

          - languages: 사용 가능한 자막 언어 목록.

          - channel: 채널 핸들(@name)·채널 URL·channel_id를 채널 ID로 해석하고 최신 영상을 조회. handle/url/channel_id 중 하나, limit 옵션.

          - summarize: 자막 추출 + AI 요약 + HTML 보고서 + 브라우저 열기. summary_length 옵션. 긴 자막은 전체를 구간별로 요약한 뒤 통합한다(원문 절단 없음).





          play/add — query 파라미터로 검색어 또는 URL. seek — position 파라미터로 이동할 위치(초). download — url 파라미터로 MP3 추출(output_path 옵션).
          relay — query(검색어/URL)+media(audio|video), 원격·폰 표면이 유튜브 직접 접속 없이 맥 경유로 재생할 스트림 목록 반환. skip/queue/stop — 파라미터 없음.
          skip은 다음 곡 재생 실패 시 success=false·failed_video_id를 반환하며 아직 시도하지 않은 대기열을 보존한다. 다시 skip하면 남은 다음 곡을 시도한다.

          실행 위치: 검색·재생·큐는 현재 기기(폰도 자체 실행), info/transcript/languages/channel/summarize/download/relay는 PC. 폰에서 PC 전용 op는 허브로
          위임한다. 폰 mode:video는 외부 앱을 열며 재생 확인·정지 제어는 외부 앱 소유다.'
        group: media
        router: handler
        tool: youtube_op
        target_key: op
        runs_on: anywhere
        aliases:
          language:
          - languages
          limit:
          - count
          output_path:
          - output
          - filename
          - path
          - file
          - name
          position:
          - seconds
          - time
        returns: items
        side_effect: true
        fixture: '[limbs:youtube]{op: "search", query: "indiebiz", limit: 1}'
        ops:
          default: search
          values:
            search: 영상 검색 (query 또는 queries, limit; 기본·재생 없음)
            info: 동영상 메타데이터 (제목·조회수·채널)
            transcript: 자막/스크립트 추출
            languages: 사용 가능한 자막 언어 목록
            channel: 채널 핸들·URL·ID 해석 + 채널 메타데이터와 최신 영상
            summarize: 자막+AI요약+HTML 보고서 생성
            play: 즉시 재생 (query 검색어/URL)
            add: 큐에 추가 (query 검색어/URL)
            skip: 현재 곡 스킵
            seek: 현재 곡의 특정 지점으로 점프 (position 초)
            queue: 큐 목록 조회
            stop: 재생 중지
            download: MP3 다운로드 (url + output_path 옵션)
            relay: 맥 경유 릴레이 스트림 목록 (query 검색어/URL + media audio|video — 원격 표면 재생용, 유튜브 직접 접속 없음)
          returns:
            search: items
            info: items
            transcript: scalar
            languages: scalar
            channel: items
            summarize: effect
            play: effect
            add: effect
            skip: effect
            seek: effect
            queue: scalar
            stop: effect
            download: effect
            relay: items
          side_effect:
            search: false
            info: false
            transcript: false
            languages: false
            channel: false
            summarize: true
            play: true
            add: true
            skip: true
            seek: true
            queue: false
            stop: true
            download: true
            relay: false
          runs_on:
            info: pc_only
            transcript: pc_only
            languages: pc_only
            channel: pc_only
            summarize: pc_only
            download: pc_only
            relay: pc_only
          fixture:
            info: '[limbs:youtube]{op: "info", video_id: "jNQXAC9IVRw"}'
            transcript: '[limbs:youtube]{op: "transcript", video_id: "jNQXAC9IVRw"}'
            languages: '[limbs:youtube]{op: "languages", video_id: "jNQXAC9IVRw"}'
            channel: '[limbs:youtube]{op: "channel", handle: "@YouTube", limit: 3}'
            queue: '[limbs:youtube]{op: "queue"}'
            relay: '[limbs:youtube]{op: "relay", query: "lofi", media: "audio", count: 2}'
        implementation: youtube 패키지 youtube_op 단일 디스패처. 기존 yt-dlp 검색·메타·자막·요약과 PC ffplay/폰 네이티브 재생·큐를 보존. PC 전용 op는 ops.runs_on으로
          분산 라우팅.
        guides:
        - youtube_relay.md
        keywords:
        - youtube
        - 유튜브
        - 영상
        - 자막
        - 음악
        - 검색
        - 재생
        - 큐
        - 다운로드
        app:
          edition: 2
          instrument: ytmusic
          icon: 🎵
          name: 유튜브 뮤직
          order: 8
          modes:
          - name: 검색
            inputs:
            - key: q
              type: text
              placeholder: 곡·아티스트 검색
              required: true
            action: '[limbs:youtube]{op: "search", query: $q, count: 45}'
            view:
            - type: list_action
              from: items
              icon: 🎵
              title: '{title|trunc:60}'
              sub: '{channel} · {duration}'
              button:
                label: ▶
                action: '[limbs:youtube]{op: "play", mode: "client", query: f"https://www.youtube.com/watch?v=${item.video_id}"}'
              button2:
                label: ⬇
                action: '[limbs:youtube]{op: "download", mode: "client", url: f"https://www.youtube.com/watch?v=${item.video_id}"}'
          - name: 큐
            phone_render: false
            auto_run: true
            buttons:
            - label: ⏭ 다음 곡
              action: '[limbs:youtube]{op: "skip"}'
            - label: ■ 정지
              action: '[limbs:youtube]{op: "stop"}'
            action: '[limbs:youtube]{op: "queue"}'
            view:
            - type: kv
              rows:
              - k: 상태
                v: '{message}'
            - type: kv_list
              from: queue
              title: 대기열
              empty: 대기열이 비어 있습니다
              k: '{position}'
              v: '{title|trunc:40} · {channel}'
tool_json:
  header:
    id: youtube
    name: YouTube Tools
    description: YouTube 영상 도구. 영상 정보 조회, 자막 추출 및 요약, MP3 다운로드, PC 스피커 음악 재생 기능을 제공합니다. 영상 내용 분석, 음악 감상, 팟캐스트 청취, 영상 요약 문서화에
      활용.
    version: 1.1.0
  tools:
  - name: youtube_op
    description: YouTube 탐색·조회·요약·재생·큐·다운로드를 한 대상의 op로 제공. search(기본), info/transcript/languages/channel/summarize, play/add/skip/seek/queue/stop/download/relay.
      내 파일 음악은 self:music.
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: 'search: 검색어, play/add/relay: 검색어 또는 URL'
        queries:
          type:
          - string
          - array
          description: 여러 검색어 배치 팬아웃(배열 또는 쉼표/개행 문자열) — 검색어마다 query 태그를 붙이고 video_id 중복을 걷어 한 목록(items)+sections 로. [sense:search]{source:"gnews"}
            의 queries 와 같은 통화(어휘 개정 2026-09-04).
        limit:
          type: integer
          description: 'search: 1~75 기본5, channel: 기본5, play: 기본5, add: 기본3, relay: 기본6'
        op:
          type: string
          description: YouTube 동작 (기본 search·재생 없음)
        position:
          type: number
          description: 점프할 위치(초) (op=seek 시)
        url:
          type: string
          description: 유튜브 URL
        mode:
          type: string
          enum:
          - audio
          - video
          - client
          - server
          description: play는 audio/video/client(기본 audio), download는 server/client(기본 server). client는 폰·원격 클라이언트에 재생 URL
            또는 다운로드 데이터를 반환. relay는 media 사용(audio/video).
        media:
          type: string
          enum:
          - audio
          - video
          description: 릴레이 형태 (op=relay 시, 기본 audio — 소리만/영상+소리)
        output_path:
          type: string
          description: MP3 저장 경로 (op=download 시)
        video_id:
          type: string
          description: 유튜브 video_id (url 대신)
        handle:
          type: string
          description: '[channel] 채널 핸들 (@name 또는 name)'
        channel_id:
          type: string
          description: '[channel] UC로 시작하는 YouTube 채널 ID'
        language:
          type: string
          description: '[transcript] 자막 언어 (예 ko/en)'
        summary_length:
          type: integer
          description: '[summarize] 요약 길이(기본 3000)'
      required: []
