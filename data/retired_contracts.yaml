      같은 질문에 매 턴 해마 Top-5(사용자 문장)와 <execution_map>+recall{store:"실행"}
      (주제 가지)이 이미 답하고, 카탈로그는 프롬프트에 전부 실린다(노드 스코핑 기각).
      한 달 실사용 77건/약 26,500건, 용례 28건 발화 0 — 프롬프트가 밀어서 생긴 호출이었다.
      사용자 판정(언어 개정)으로 은퇴.
    instead: >-
      액션이 무엇이 있는지는 카탈로그가, 어떻게 잇는지는 <execution_map> 의 가지를
      [self:memory]{op:"recall", node, store:"실행"} 로 열어 성공한 문장에서 본다.
    phrases:
      - "self:discover"
      - "discover부터"
      - "discover에서"

