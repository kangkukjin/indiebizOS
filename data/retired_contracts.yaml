  - id: recall_automatic_naming_promise
    retired: 2026-09-08
    reason: 자동 작명을 중단했지만 가지 회상의 빈 목록 안내는 다음 증류가 이름을 붙인다고 약속했다.
    instead: 이름 있는 함수는 검증 후 수동 등록한다. 가지 회상은 조상의 공통 함수 카드도 보여 준다.
    phrases:
      - "이 주행이 성공하면 증류가 이름을 붙인다"
  - id: list_directory_recursive_hint
    retired: 2026-09-08
    reason: list는 한 디렉토리 조회인데 recursive 옵션이 있다고 가르쳤다.
    instead: list는 pattern으로 이름을 선별한다. 재귀 탐색은 file_find를 쓴다.
    phrases:
      - "조회할 디렉토리 경로. recursive 옵션으로 하위 포함 가능."
  - id: global-it-reservation
    retired: 2026-09-08
    reason: each 밖의 $it까지 예약해 함수의 필수 인자 검출과 명시 값 전달을 막았다.
    instead: $items는 집합 예약어이고 $it는 해당 each의 do에서만 지역 행 이름이다. 다른 위치에서는 일반 함수 인자다.
    phrases:
      - '_CALLER_VAR_RESERVED = {"it", "items"}'
      - '변수 `$items $it $i $error $return`'
  - id: automatic-report-idiom-repair
    retired: 2026-09-08
    reason: 자동 작명을 중단했는데 세 보고서 가이드가 자동 등록·본문 갱신을 약속했다.
    instead: 신규 관용구는 수동 등록, 기존 본문은 register_idiom.py --update로 이력 보존 개정한다.
    phrases:
      - "성공하면 증류가 이름을 붙이고 다음 호가 부른다"
      - "고쳐서 부르면 그 골격이 다음 증류에서 그 이름의 새 본문이 된다"
  - id: unclosed-container-string-fallback
    retired: 2026-09-08
    reason: 닫히지 않은 item 객체가 뒤 인자를 삼킨 문자열로 원장에 저장될 수 있었다.
    instead: 닫는 괄호가 없는 구조는 파싱 오류. 원장은 객체 행만 저장·조회한다.
    phrases:
      - "닫는 bracket을 못 찾으면 원본 반환"
  - id: parallel-parenthesis-actions-only
    retired: 2026-09-08
    reason: 같은 변수 통화가 괄호 분기에서만 금지되어 불필요한 중간 할당을 강제했다.
    instead: 병렬 괄호 분기는 일반 액션과 변수 통화를 같은 파이프로 받는다. 폴백은 시도만 받는다.
    phrases:
      - "괄호 안=일반 step 파이프만"
      - "[node:action]{...} step 을 >> 로 이은 파이프만 허용합니다"
  - id: population-reduction-is-truncation
    retired: 2026-09-08
    reason: 조건 선별·중복 제거·집계까지 표본 절단으로 취급해 정상 보고서에 잘림 경고가 붙었다.
    instead: 집합 재정의는 기존 total을 결과 행수로 갱신하고 실제 상류 truncated만 승계한다. take는 표본 규약을 유지한다.
    phrases:
      - "take/filter/dedup 전부"
      - "filter·dedup 도 같은 부류"
      - "truncated == total > len(items)"
  - id: json_ledger_script
    retired: 2026-09-04
    reason: >-
      등록 스크립트 `json원장` 은 세 정기 보고서와 폴더 조사·나레이션이 함께 쓰는 몸 수준의
      원장 원시 연산(관문 넷 = 실사고 유래)이었다 — 어휘 밖(스크립트)에 두면 인자가 JSON
      덩어리라 파서·빌드 관문·픽스처·해마 결정화 밖에 있고 파이썬 몸에서만 돈다.
      사용자 판정(언어 개정)으로 [self:ledger] 로 승격, 스크립트는 은퇴.
    instead: >-
      [self:ledger]{op: "select"|"append"|"upsert"|"set", path, target, …} — 같은 인자, 같은 관문.
      옛 [self:script]{op:"run", id:"json원장", args:{…}} 의 args 가 곧 새 낱말의 params 다.
    phrases:
      - "json원장"
      - "id: \"json원장\""
  - id: business-ledger-renamed
    retired: 2026-09-04
    reason: >-
      사업 원장 낱말이 보편 단어 `ledger` 를 차지하고 있었다(명명 헌법 5조 land-grab 금지 —
      분야 낱말은 분야가 이름에 드러나야 한다). JSON 원장 원시 연산이 보편 동작으로 승격되며
      `[self:ledger]` 를 그쪽에 준다. 사용자 판정(언어 개정).
    instead: >-
      사업·아이템·공개문서·근무지침은 [self:business]{store: "business"|"item"|"document"|"guideline", op}.
      JSON 배열 원장(커버리지·순회 큐·판정)은 [self:ledger]{op: "select"|"append"|"upsert"|"set", path, target}.
    phrases:
      - "[self:ledger]{store"
      - "business_op 가 아니라 ledger_op"
  - id: each_result_envelope
    retired: 2026-08-23
    reason: >-
      [table:each] 가 do 결과를 `_result` 에 통째로 접어 붙이던 계약을 폐기하고
      결과 통화를 그대로 내도록 언어를 개정했다. 그래서 3개월간 교재가 가르친
      관용구 `each >> flatten` 은 이제 참이 아니다 — flatten 은 행 속 실제
      중첩 목록 필드를 펴는 변환자다.
    instead: >-
      [table:each] 뒤에는 flatten 없이 바로 다음 변환자를 잇는다.
      중첩 목록을 펼 때만 [table:flatten]{field:"<그 필드>"} 로 지목한다.
    phrases:
      - "each 결과 뒤"
      - "each 의 출구"
      - "each 결과의 _result"
      - "each 결과를 한 표로"
      - "each >> flatten"
  - id: transformer_items_take_only
    retired: 2026-08-27
    reason: >-
      단항 변환자의 items 직접 입력을 비공개로 두고 take 만 씨앗 진입점으로 강제하던
      계약 — 치환 의미론 개정($변수 통짜 경로=원형)으로 변수는 원형 목록을 넣게 되면서
      리터럴만 거절하는 비대칭이 무의미해졌고, 사용자 판정으로 전면 개방.
    instead: >-
      단항 변환자 전부(filter/sort/take/select/compute/rename/flatten/dedup/since/
      groupby/union/merge, render_document)가 items(array) 를 공개 파라미터로 받는다 —
      리터럴·$변수 원형 어느 쪽으로도 씨앗이 된다.
    phrases: ["[table:take]{items: […]} 로 진입해 이어라"]

  - id: if-nomatch-message-envelope
    retired: 2026-08-28
    reason: >-
      파이프 세그먼트의 if 블록이 어느 분기도 안 걸리면 message 봉투("모든 조건 불일치")가
      직전 통화를 갈아치워 뒤 step 이 끊겼다 — 빈 통화 폴백 "A >> [if: empty($items)]{대안}"
      관용구가 원리적으로 불가능했다(언어 개정 2026-08-28, 사용자 판정). 단독 문장(파이프 밖)은
      옛 계약 그대로다.
    instead: >-
      파이프 안 불일치 = 직전 통화 통과 + "_if_skipped"(평가한 조건 목록) 표식.
    phrases: ["모든 조건 불일치가 통화를 대체"]

  - id: block-not-in-pipe
    retired: 2026-08-22
    reason: >-
      "블록은 파이프(>>) 속에 넣을 수 없다"는 M6 이전의 계약 — 2026-08-22 M6 이
      블록-인-파이프를 개통하면서 은퇴했다. 그러나 은퇴 등록 없이 카탈로그·명세만
      갱신돼, 활성 교재(12_ibl_only.md)가 8일간 한 문서 안에서 금지와 허용을 동시에
      가르쳤다(2026-08-30 적발·등록 — 다른 AI 에이전트 감사가 발견).
    instead: >-
      블록은 파이프 세그먼트가 될 수 있다: [A] >> [if: …]{…} [else]{…} >> [B].
      블록은 직전 통화를 $items 로 보고 몸의 첫 액션에 넘기며, 결과가 다음 통화다.
    phrases:
      - "속*에는 넣을 수 없다"
      - "파이프 속에는 넣을 수 없다"
      - "파이프 안에 넣을 수 없다"

  - id: business-four-siblings-to-ledger
    retired: 2026-08-15
    reason: >-
      사업 원장 통합(390e3bcd)이 self:business/business_item/business_document/
      work_guideline 4형제를 [self:business]{store, op} 로 흡수했다. 그러나 이 은퇴는
      등록부(2026-08-27 탄생) 이전이라 등재가 없었고, 관문 스캔 표면에 frontend/ 도
      빠져 있어서, 소개발행 버튼 2곳(WarehouseView.tsx·launcher_app_warehouse.py)이
