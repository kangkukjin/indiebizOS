    reason: 같은 새 이름을 가리키는 옛 이름들이 후보 집합이 되었으므로 지도 전체의 이름을 필수로 요구하던 설명을 은퇴한다.
    instead: 입력 전체에 정확히 한 후보가 있어야 한다. 후보 0개·2개 이상, 단일 이름 부재·기존 열 덮어쓰기는 오류이며 관측 열이 없으면 판정을 유보한다.
    phrases:
      - '없는 이름·이름 충돌=명시 에러(값 무변경·비파괴)'
      - '없는 이름·충돌=명시 에러, 값 무변경'
  - id: projection_numeric_exception
    retired: 2026-09-09
    reason: 복사에서 숫자 문자열을 바꾸고 투영에서만 명시 변환을 요구하던 자리별 차이를 없앴다.
    instead: 모든 공용 식은 복사·문자열 함수에서 원형을 보존하고 산술 자리에서 숫자를 관측한다.
    phrases:
      - "숫자 문자열 계산은 int/float로 명시 변환한다"
      - "source` 객체를 compute로 만들지 않는다"
      - '결과는 스칼라 — 뒤 문장의 `"$x"` 엔 값 문자열이'
  - id: source_preview_as_full_text
    retired: 2026-09-09
    reason: 원문 파일 소실을 preview로 대체하면 모델이 일부만 보고 전문 처리에 성공한 것처럼 보인다.
    instead: JSON 저장 시 원문 전문을 보존하고 원문 파일 소실·입력 상한 초과는 추출 전에 실패한다.
    phrases:
