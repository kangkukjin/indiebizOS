# 은퇴 등록부 — 낱말·계약을 은퇴시킬 때 여기 한 줄을 적는다.
#
# 왜: 낱말의 뜻이나 계약을 바꾸면 카탈로그(`ibl_actions.yaml`)와 파생물은 빌드가
# 대조해 주지만, **같은 계약을 말하는 코드 안의 문장**(핸들러의 오류·도움말 문자열,
# 독스트링, 가이드 산문)은 아무도 안 본다. 2026-08-27 실측: 47회차가 flatten 의
# `each >> flatten` 계약 은퇴를 카탈로그에서만 집행해, 모델·사용자가 실제로 읽는
# 런타임 오류 문구가 은퇴한 관용구를 계속 가르치고 있었다(`aa904ffc`).
#
# 교리: 사람이 고른 grep 범위는 반드시 샌다(pitfall hand-picked-sweep-leaks).
# 그러니 표면 목록을 사람이 기억하지 않는다 — **여기 한 줄이면 관문이 전 표면을
# 대신 훑는다.** 역사를 소급해 채울 필요는 없다. 앞으로의 은퇴만 등록하면 된다
# (값·경로·동시성 관문과 같은 "탄생 차단" 교리).
#
# 형식:
#   - id: 짧은 식별자
#     retired: YYYY-MM-DD          # 은퇴한 날
#     reason: 왜 은퇴했나           # 필수
#     instead: 지금의 참인 계약     # 필수
#     phrases: [금지 문구, ...]     # 표면에서 발견되면 안 되는 문장 조각
#
# 정당한 언급(이행 진단·회귀 가드처럼 은퇴 문구를 **이름 불러 거절하는** 자리)은
# 그 줄에 `retired-ok: <사유>` 를 달아 통과시킨다. 사유 없는 면제는 거부된다.
# 가드 배터리(`backend/test_*.py`)는 부류상 문구를 담는 자리이므로 스캔 밖이다.
#
# 관문: scripts/check_retired_contracts.py (pre-commit)

