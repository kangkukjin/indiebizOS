# 은퇴 등록부 — 낱말·계약을 은퇴시킬 때 여기 한 줄을 적는다.
#
# 왜: 낱말의 뜻이나 계약을 바꾸면 카탈로그(`ibl_actions.yaml`)와 파생물은 빌드가
# 대조해 주지만, **같은 계약을 말하는 코드 안의 문장**(핸들러의 오류·도움말 문자열,
# 독스트링, 가이드 산문)은 아무도 안 본다. 2026-08-27 실측: 47회차가 flatten 의
# `each >> flatten` 계약 은퇴를 카탈로그에서만 집행해, 모델·사용자가 실제로 읽는
# 런타임 오류 문구가 은퇴한 관용구를 계속 가르치고 있었다(`aa904ffc`).
#
# 교리: 사람이 고른 grep 범위는 반드시 샌다(pitfall hand-picked-sweep-leaks).
# 그러니 표면 목록을 사람이 기억하지 않는다 — **여기 한 줄이면 관문이 전 표면을
# 대신 훑는다.** 역사를 소급해 채울 필요는 없다. 앞으로의 은퇴만 등록하면 된다
# (값·경로·동시성 관문과 같은 "탄생 차단" 교리).
#
# 형식:
#   - id: 짧은 식별자
#     retired: YYYY-MM-DD          # 은퇴한 날
#     reason: 왜 은퇴했나           # 필수
#     instead: 지금의 참인 계약     # 필수
#     phrases: [금지 문구, ...]     # 표면에서 발견되면 안 되는 문장 조각
#
# 정당한 언급(이행 진단·회귀 가드처럼 은퇴 문구를 **이름 불러 거절하는** 자리)은
# 그 줄에 `retired-ok: <사유>` 를 달아 통과시킨다. 사유 없는 면제는 거부된다.
# 가드 배터리(`backend/test_*.py`)는 부류상 문구를 담는 자리이므로 스캔 밖이다.
#
# 관문: scripts/check_retired_contracts.py (pre-commit)

retired:
  - id: each_result_envelope
    retired: 2026-08-23
    reason: >-
      [table:each] 가 do 결과를 `_result` 에 통째로 접어 붙이던 계약을 폐기하고
      결과 통화를 그대로 내도록 언어를 개정했다. 그래서 3개월간 교재가 가르친
      관용구 `each >> flatten` 은 이제 참이 아니다 — flatten 은 행 속 실제
      중첩 목록 필드를 펴는 변환자다.
    instead: >-
      [table:each] 뒤에는 flatten 없이 바로 다음 변환자를 잇는다.
      중첩 목록을 펼 때만 [table:flatten]{field:"<그 필드>"} 로 지목한다.
    phrases:
      - "each 결과 뒤"
      - "each 의 출구"
      - "each 결과의 _result"
      - "each 결과를 한 표로"
      - "each >> flatten"
  - id: transformer_items_take_only
    retired: 2026-08-27
    reason: >-
      단항 변환자의 items 직접 입력을 비공개로 두고 take 만 씨앗 진입점으로 강제하던
      계약 — 치환 의미론 개정($변수 통짜 경로=원형)으로 변수는 원형 목록을 넣게 되면서
      리터럴만 거절하는 비대칭이 무의미해졌고, 사용자 판정으로 전면 개방.
    instead: >-
      단항 변환자 전부(filter/sort/take/select/compute/rename/flatten/dedup/since/
      groupby/union/merge, render_document)가 items(array) 를 공개 파라미터로 받는다 —
      리터럴·$변수 원형 어느 쪽으로도 씨앗이 된다.
    phrases: ["[table:take]{items: […]} 로 진입해 이어라"]

  - id: if-nomatch-message-envelope
    retired: 2026-08-28
    reason: >-
      파이프 세그먼트의 if 블록이 어느 분기도 안 걸리면 message 봉투("모든 조건 불일치")가
      직전 통화를 갈아치워 뒤 step 이 끊겼다 — 빈 통화 폴백 "A >> [if: empty($items)]{대안}"
      관용구가 원리적으로 불가능했다(언어 개정 2026-08-28, 사용자 판정). 단독 문장(파이프 밖)은
      옛 계약 그대로다.
    instead: >-
      파이프 안 불일치 = 직전 통화 통과 + "_if_skipped"(평가한 조건 목록) 표식.
    phrases: ["모든 조건 불일치가 통화를 대체"]

  - id: block-not-in-pipe
    retired: 2026-08-22
    reason: >-
      "블록은 파이프(>>) 속에 넣을 수 없다"는 M6 이전의 계약 — 2026-08-22 M6 이
      블록-인-파이프를 개통하면서 은퇴했다. 그러나 은퇴 등록 없이 카탈로그·명세만
      갱신돼, 활성 교재(12_ibl_only.md)가 8일간 한 문서 안에서 금지와 허용을 동시에
      가르쳤다(2026-08-30 적발·등록 — 다른 AI 에이전트 감사가 발견).
    instead: >-
      블록은 파이프 세그먼트가 될 수 있다: [A] >> [if: …]{…} [else]{…} >> [B].
      블록은 직전 통화를 $items 로 보고 몸의 첫 액션에 넘기며, 결과가 다음 통화다.
    phrases:
      - "속*에는 넣을 수 없다"
      - "파이프 속에는 넣을 수 없다"
      - "파이프 안에 넣을 수 없다"

  - id: business-four-siblings-to-ledger
    retired: 2026-08-15
    reason: >-
      사업 원장 통합(390e3bcd)이 self:business/business_item/business_document/
      work_guideline 4형제를 [self:ledger]{store, op} 로 흡수했다. 그러나 이 은퇴는
      등록부(2026-08-27 탄생) 이전이라 등재가 없었고, 관문 스캔 표면에 frontend/ 도
      빠져 있어서, 소개발행 버튼 2곳(WarehouseView.tsx·launcher_app_warehouse.py)이
      은퇴 어휘 [self:business_document] 를 16일간 호출하며 "액션이 없습니다"로
      죽었다(윈도우 설치본 실측 2026-08-31). 소급 등재 의무는 없지만 잔재가 실증된
      은퇴는 등재한다 — 재발이 곧 사유다.
    instead: >-
      [self:ledger]{store: "business"|"item"|"document"|"guideline", op: ...} 하나.
      공개인사프로필 발행은 [self:ledger]{store: "document", op: "publish"}.
    phrases:
      - "[self:business]"
      - "[self:business_item]"
      - "[self:business_document]"
      - "[self:work_guideline]"

  - id: system-ai-providers-endpoint
    retired: 2026-08-31
    reason: >-
      `GET /system-ai/providers` 는 프로바이더 목록·모델 ID 를 핸들러 안에 손으로 적어
      돌려주던 죽은 계약이다 — 프론트 소비자 0건(2026-08-31 실측)에, 목록은
      anthropic/openai/google 3종뿐이라 claude_code·codex·deepseek·openrouter·ollama·
      gemini_http 가 통째로 빠졌고 모델 ID 도 낡았다(claude-sonnet-4-20250514·gpt-4o·
      gemini-2.0-flash-exp). 아무도 안 읽는 자리에서 조용히 썩는 두 번째 진실 —
      되살리면 레지스트리와 갈라진다.
    instead: >-
      프로바이더의 정본은 `backend/providers/__init__.py` 의 `get_provider` 레지스트리
      하나다. 목록이 다시 필요해지면 하드코딩이 아니라 그 레지스트리에서 파생시킨다
      (모델 ID 는 `model_resolver`). 설정 UI 는 프론트의 `<option>` 목록을 쓴다.
    phrases:
      - "/system-ai/providers"
      - "get_available_providers"

  - id: write_sink_structure_hint
    retired: 2026-09-02
    reason: >-
      파이프 싱크 [self:write] 가 message 를 추출하며 동반 items 의 처방을
      "table:spreadsheet/structure 로 저장" 이라 안내했다 — JSON 원장(원장 누적 관용구
      `$본.items & (새 조회) >> union >> dedup >> write`)의 답이 아니었다
      (53회차 F53-1 · 사용자 판정 V53-1 ⓑ, 2026-09-02).
    instead: >-
      [self:write]{path, format: "json"} — 통화(items)를 JSON 원장으로 보존하는 명시 스위치.
      표·문서 산출은 종전대로 table:spreadsheet/structure.
    phrases:
      - "구조 보존이 필요하면 table:spreadsheet/structure 로 저장하세요"
  - id: trigger_config_weekday_names_and_once
    retired: 2026-09-02
    reason: >-
      옛 트리거 가이드가 config:{repeat:"once"}·weekdays:["mon",…]·repeat:"daily"+interval_hours 를
      가르쳤는데 캘린더는 요일을 정수(0=월)로만 비교하고 once 라는 repeat 이 없어, 영원히 안 도는
      트리거가 성공으로 등록됐다(54회차 B54-8). 지금은 등록 입구가 정규화·검증한다.
    instead: >-
      cron 문자열이 정본("0 9 * * 1-5" 평일, "0 */2 * * *" 2시간마다). config 를 쓰면
      repeat ∈ daily/weekly/monthly/yearly/none/interval, weekdays 는 0=월..6=일(mon..sun 도 정규화),
      1회는 none + date, interval 은 interval_hours.
    phrases:
      - 'repeat:"once"'
      - 'weekdays:["mon"'
      - 'repeat:"daily", interval_hours'

  - id: ai-trend-report-pending-contribution
    retired: 2026-09-02
    reason: >-
      AI 동향 보고서가 매일 특별기고 대기열을 읽고, 도래 원고가 있으면 NEW 계수
      게이트를 우회해 발행하던 별도 분기를 사용자 판정으로 폐지했다. 보고서 본연의
      동향 조사와 무관한 확인 비용과 자기감사 문구가 매 호 반복됐다.
    instead: >-
      AI 동향 보고서는 최신 보고서·커버리지 원장·방법론 규칙만 기준선으로 읽고,
      전체 보고서 발행 여부는 섹션별 NEW 행 합계만으로 판정한다.
    phrases:
      - "특별기고 대기 목록을 반드시 읽"
      - "특별기고 게재 가능일 도래"
      - "_pending_contributions.md` — 04시 프로세스"

  - id: self_discover
    retired: 2026-09-03
    reason: >-
      [self:discover] 는 키워드를 해마 벡터에 던져 액션 이름을 뽑는 세 번째 입구였다.
      같은 질문에 매 턴 해마 Top-5(사용자 문장)와 <execution_map>+recall{store:"실행"}
      (주제 가지)이 이미 답하고, 카탈로그는 프롬프트에 전부 실린다(노드 스코핑 기각).
      한 달 실사용 77건/약 26,500건, 용례 28건 발화 0 — 프롬프트가 밀어서 생긴 호출이었다.
      사용자 판정(언어 개정)으로 은퇴.
    instead: >-
      액션이 무엇이 있는지는 카탈로그가, 어떻게 잇는지는 <execution_map> 의 가지를
      [self:memory]{op:"recall", node, store:"실행"} 로 열어 성공한 문장에서 본다.
    phrases:
      - "self:discover"
      - "discover부터"
      - "discover에서"
