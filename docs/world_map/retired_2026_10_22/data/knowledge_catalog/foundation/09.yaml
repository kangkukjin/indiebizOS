  kind: concept
  path: [인문, 종교와 사상]
  name: 종교다원주의
  hint: 여러 종교 전통의 공존과 관계를 다루는 관점
  aliases: [다른 신앙을 가진 사람들이 함께 사는 방식, 종교 사이의 대화, 여러 종교가 공존하는 사회, 믿음의 차이를 대하는 관점]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 인문
