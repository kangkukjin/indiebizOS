- id: foundation.myth
  kind: concept
  path: [인문, 종교와 사상]
  name: 신화
  hint: 세계·인간·공동체의 기원과 질서를 상징적으로 서술하는 이야기
  aliases: [옛사람들의 세상 기원 이야기, 신과 영웅의 이야기가 전하는 뜻, 공동체의 시작을 설명하는 서사, 이야기로 표현한 세계관]
