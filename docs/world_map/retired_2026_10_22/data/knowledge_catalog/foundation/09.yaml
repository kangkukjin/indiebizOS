  path: [인문, 종교와 사상]
  name: 성스러움과 세속성
  hint: 특별한 의미로 구별된 영역과 일상적 영역의 구분
  aliases: [어떤 장소나 물건을 특별하게 대하는 이유, 일상과 종교적 공간의 차이, 금기와 성스러운 대상, 공동체가 특별한 의미를 부여하는 방식]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
