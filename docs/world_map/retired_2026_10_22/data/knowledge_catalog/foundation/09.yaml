  kind: concept
  path: [인문, 문학과 서사]
  name: 운율
  hint: 말의 소리·강세·길이·반복이 만드는 리듬과 형식
  aliases: [시를 소리 내 읽을 때 느껴지는 박자, 행의 길이와 반복이 주는 효과, 시어의 소리 배열, 뜻뿐 아니라 소리로 작품 읽기]
