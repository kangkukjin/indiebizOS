  kind: concept
  path: [인문, 종교와 사상]
  name: 세계관
  hint: 세계와 인간의 위치·의미에 관한 기본적인 이해의 틀
  aliases: [사람마다 세상을 다르게 보는 뿌리, 삶의 의미를 해석하는 기본 생각, 신념들이 연결되는 전체 그림, 인간과 자연의 관계를 보는 관점]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
