  aliases: [다른 작품을 알고 읽으면 달라지는 뜻, 옛이야기를 바꿔 쓴 소설, 작품 속 인용과 패러디, 이야기들이 서로 대화하는 방식]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 인문
- id: foundation.characterization
  kind: concept
  path: [인문, 문학과 서사]
  name: 인물 형상화
  hint: 행동·대화·묘사 등으로 작품 속 인물의 성격을 구성하는 방식
  aliases: [등장인물의 성격이 드러나는 장면, 말투와 행동으로 인물 이해, 설명하지 않고 성격을 보여주기, 이야기 속 사람이 변하는 과정]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 인문
