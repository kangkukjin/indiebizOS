  hint: 형식·관습·주제와 독서 기대에 따른 문학의 갈래
  aliases: [시와 소설의 읽는 방식 차이, 독자가 기대하는 이야기 규칙, 비극과 희극의 특성, 문학 작품을 갈래로 이해하기]
  source:
