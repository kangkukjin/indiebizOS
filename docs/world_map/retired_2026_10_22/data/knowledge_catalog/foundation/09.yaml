  path: [인문, 종교와 사상]
  name: 금욕주의
  hint: 욕망과 생활을 절제하여 정신적·윤리적 목적을 추구하는 태도
  aliases: [생활을 단순하게 줄이는 수행, 즐거움을 절제하는 종교적 이유, 몸의 훈련과 정신적 목표, 소유와 욕망을 줄이는 사상]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
