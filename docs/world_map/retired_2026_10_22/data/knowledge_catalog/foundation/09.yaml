- id: foundation.secularization
  kind: concept
  path: [인문, 종교와 사상]
  name: 세속화
  hint: 종교의 사회적 위치와 제도·생활의 관계가 변화하는 과정
  aliases: [정치와 종교의 영역이 나뉘는 변화, 종교가 일상에 미치는 영향의 변화, 근대화와 신앙의 관계, 종교 기관의 역할이 달라지는 과정]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
