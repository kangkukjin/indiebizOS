  name: 은유
  hint: 다른 대상의 관계나 성질을 빌려 의미를 구성하는 표현
  aliases: [직접 말하지 않고 다른 것에 빗대기, 시에서 낯선 두 대상이 연결될 때, 표현이 문자 그대로가 아닌 이유, 비유가 생각을 바꾸는 방식]
  source:
    path: docs/world_map/L_topdown_editorial_2026_09_22.md
    section: 인문
