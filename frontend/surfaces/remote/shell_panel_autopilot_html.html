
  <!-- 자율주행 — 드릴다운: ① 대상 선택(시스템AI/스위치/프로젝트→에이전트) → ② 대화/결과 -->
  <div class="panel on" id="p-autopilot">
    <!-- ① 대상 브라우저 (루트 ↔ 프로젝트 에이전트 드릴) -->
    <div class="ap-browse" id="ap-browse">
      <div class="ap-bhead" id="ap-bhead" style="display:none">
        <button class="back" onclick="apBrowseRoot()">←</button>
        <h2 id="apBrowseTitle"></h2>
      </div>
      <div id="apBrowse"></div>
    </div>
    <!-- ② 대화 / 결과 (전체 폭) -->
    <div class="ap-chat" id="ap-chat" style="display:none">
      <div class="ap-head">
        <button class="back" onclick="apExitChat()">←</button>
        <div class="ap-head-t"><h2 id="apTitle">시스템 AI</h2></div>
      </div>
      <div id="apSessions" aria-label="대화 세션 메뉴" hidden>
        <strong id="apSessionTitle"></strong>
        <button class="btn2" id="apSessionOlder" onclick="apSessionOlder()" hidden></button>
        <button class="btn2" id="apHistory" onclick="apOpenSessionHistory()"></button>
        <button class="btn2" id="apSessionNew" onclick="apNewSession()"></button>
        <button class="btn2" id="apDictionary" onclick="apOpenDictionary()"></button>
      </div>
      <dialog id="apSessionHistory" aria-label="대화 히스토리" onclick="if(event.target===this)this.close()">
        <div class="ap-history-head"><strong>대화 히스토리</strong><button class="btn2" onclick="apCloseSessionHistory()" aria-label="닫기">닫기</button></div>
        <div id="apSessionList"></div>
      </dialog>
      <dialog id="apDictionaryDialog" aria-label="IBL 사전" onclose="apRestoreDictionary()" onclick="if(event.target===this)this.close()"><div class="ap-history-head"><strong>IBL 사전</strong><button class="btn2" onclick="this.closest('dialog').close()" aria-label="닫기">닫기</button></div></dialog>
      <div class="ap-session-workspace">
        <div class="ap-session-conversation">
          <div id="apSessionBar" hidden>
            <button class="btn2" id="apSessionStop" onclick="apSessionCancel()" hidden>작업 중단</button>
          </div>
          <p id="apSessionError" role="alert"></p>
      <div class="msgs" id="apMsgs"></div>
      <!-- 첨부 사진 미리보기 칩 (전송 전) -->
      <div class="ap-chips" id="apChips" style="display:none"></div>
      <div class="composer" id="apComposer">
        <button class="ap-attach" id="apAttach" onclick="apPickImage()" title="사진 첨부">📷</button>
        <textarea id="apInput" rows="1" placeholder="메시지..." onkeydown="apKey(event)"></textarea>
        <button class="go" id="apSend" onclick="apSend()">전송</button>
      </div>
      <input type="file" id="apFile" accept="image/*" multiple style="display:none" onchange="apFileChosen(event)">
        </div>
      </div>
    </div>
  </div>
