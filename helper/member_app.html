<details><summary>최근 작업 결과</summary><div id="results"></div></details><section id="appsPanel" hidden><button id="reloadApps" class="secondary">앱 새로고침</button><button id="openMemberFiles" class="secondary">내 파일 · 가져오기 · 내려받기</button><p id="appStatus"></p><iframe id="appFrame" title="내 기기에서 쓰는 앱" sandbox="allow-scripts"></iframe></section><section id="filesPanel" hidden><button id="backToApps" class="secondary">앱으로 돌아가기</button><input id="filePath" value="." aria-label="파일 경로"><div class="fileActions"><button id="browseFiles">폴더 열기</button><button id="readFile">파일 읽기</button><button id="saveFile">저장</button><input id="importFile" type="file" aria-label="파일 가져오기"></div><div id="fileRows"></div><textarea id="fileEditor" aria-label="파일 내용" placeholder="파일을 열거나 새 내용을 쓰세요"></textarea><p id="fileStatus"></p></section></div></div></main><script>window.__MEMBER=true;</script><script>
const API='';
let surface='autopilot';
let apChat={ type:'system', projectId:null, agentId:null, agentName:null };
let apProjects=[];
let apSwitches=[];

/* ===== 공통 ===== */
function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
/* 채팅 버블용 경량 마크다운 — AI 응답의 **·`·##·리스트·링크가 생짜로 보이던 것을 얇게 해석.
   버블은 white-space:pre-wrap 이라 블록 요소를 만들지 않고 인라인 치환만 한다(줄바꿈은 원문 그대로). */
function mdChat(t){
  let s=String(t==null?'':t);
  s=s.replace(/\s*\[MAP:\{[\s\S]*?\}\]\s*/g,'\n');  /* 지도 봉투(데스크탑 렌더 전용)는 원격 표시서 제거 */
  s=esc(s);
  const fences=[];
  s=s.replace(/```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g,function(_m,c){ fences.push(c.replace(/\n+$/,'')); return '\u0000F'+(fences.length-1)+'\u0000'; });
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/^#{1,6}\s+(.+)$/gm,'<span class="mdh">$1</span>');
  s=s.replace(/^&gt; ?(.+)$/gm,'<span class="mdq">▏ $1</span>');
  s=s.replace(/^(\s*)[-*]\s+/gm,'$1• ');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[^"'>=\]])(https?:\/\/[^\s<>"']+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\u0000F(\d+)\u0000/g,function(_m,i){ return '<pre>'+fences[+i]+'</pre>'; });
  return s;
}
// kv 값 렌더 — http(s) URL 이면 새 탭으로 여는 링크(공개 사이트 주소 등), 아니면 텍스트.
function kvVal(v){ const t=String(v==null?'':v).trim();
  const isUrl=(t.startsWith('http://')||t.startsWith('https://'))&&t.indexOf(' ')<0;
  return isUrl
    ? '<a href="'+esc(t)+'" target="_blank" rel="noopener" style="color:var(--info);word-break:break-all">'+esc(t)+'</a>'
    : '<span>'+esc(v)+'</span>'; }
function launcherLoginRequired(message){
  if(window.__MEMBER || window.__PORTAL) return;
  document.getElementById('app').classList.remove('on');
  document.getElementById('login').style.display='';
  document.getElementById('loginErr').textContent=message;
}
async function jfetch(url,opt){
  const r=await fetch(API+url, Object.assign({headers:{'Content-Type':'application/json'}}, opt||{}));
  if(r.status===401 && url!=='/launcher/auth/login') launcherLoginRequired('로그인이 만료되었습니다. 다시 로그인해주세요.');
  return r;
}
async function ibl(code){
  /* 포털(회원 원격 계기): 범용 /ibl/execute 대신 회원 실행 게이트로 보낸다 — 렌더러 포크 금지·매개변수화 */
  /* surface:'web' = 보고 있는 곳이 브라우저라는 표식 — 소리·저장이 맥이 아니라 여기서 나게 한다
     (포털은 게이트가 서버측에서 같은 표식을 붙인다). */
  const r=window.__PORTAL
    ? await jfetch(window.__PORTAL.exec,{method:'POST',body:JSON.stringify({code:code})})
    : await jfetch('/ibl/execute',{method:'POST',body:JSON.stringify({code,project_id:'앱모드',project_path:'.',surface:'web'})});
  if(!r.ok){ let m='[HTTP '+r.status+']'; try{ const e=await r.json(); if(e&&(e.error||e.detail)) m=e.error||e.detail; }catch(_e){} throw new Error(m); }
  /* 합성(>>) 액션은 final_result(마지막 단계)를 펼쳐 단일 액션처럼 노출 — view의 from/{필드}가 풀리도록.
     펼치는 규칙은 공용 렌더 코어(unwrapFinalResult)가 정본 — 데스크탑 runIBL 과 같은 것. */
  return unwrapFinalResult(await r.json());
}

/* ===== 로그인 ===== */
document.addEventListener('DOMContentLoaded',()=>{
  if(window.__MEMBER){ memberBoot(); return; }
  if(window.__PORTAL){ portalBoot(); return; }
  document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });
  checkSession();
});
/* 포털(개인 커뮤니티 홈) 부트 — 이 셸을 회원용 단일 계기 페이지로 재사용(포크 금지·매개변수화).
   로그인/표면 토글/계기판을 전부 건너뛰고 서버가 주입한 계기 하나(__PORTAL.instrument)를 바로
   연다. 실행은 ibl() 이 __PORTAL.exec(회원 실행 게이트)로 보낸다. appHome 을 미리 숨겨
   openInstrument 의 history push 를 막는다 → 뒤로가기 = 포털 홈. */
function portalBoot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  const top=document.querySelector('.top'); if(top) top.style.display='none';
  const sf=document.querySelector('.surfaces'); if(sf) sf.style.display='none';
  const ap=document.getElementById('p-autopilot'); if(ap) ap.classList.remove('on');
  document.getElementById('p-app').classList.add('on');
  document.getElementById('appHome').style.display='none';
  INSTRUMENTS=[window.__PORTAL.instrument];
  openInstrument(0);
}
async function checkSession(){
  // 비번 없는 표면(폰 자급·로컬)은 게이트 자체가 무의미 → config로 즉시 진입(맥 프록시 의존 제거).
  // 폰은 has_password=false 라 /projects(맥 터널 왕복) 결과와 무관히 바로 런처가 뜬다 = 로그인 화면 없음.
  try{ const c=await(await jfetch('/launcher/config')).json(); if(c && c.has_password===false){ showApp(); return; } }catch(e){}
  try{ const r=await jfetch('/projects'); if(r.ok){ showApp(); } }catch(e){}
}
async function doLogin(){
  const pw=document.getElementById('pw').value;
  const el=document.getElementById('loginErr'); el.textContent='';
  try{
    const r=await jfetch('/launcher/auth/login',{method:'POST',body:JSON.stringify({password:pw})});
    if(r.ok){
      // 비밀번호 성공만으로 진입하지 않고 브라우저가 실제 세션을 보낼 수 있는지 확인한다.
      const session=await jfetch('/projects');
      if(session.ok){ document.getElementById('pw').value=''; showApp(); }
      else launcherLoginRequired('로그인 연결을 확인하지 못했습니다. HTTPS 주소에서 다시 로그인해주세요.');
    } else { const d=await r.json().catch(()=>({})); el.textContent=d.detail||'로그인 실패'; }
  }catch(e){ el.textContent='서버 연결 실패'; }
}
let IS_PHONE=false;
async function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  // 자급 컴패니언(폰-로컬)인지 판별 — REMOTE 배지는 원격 시나리오 전용이라 폰에선 숨긴다.
  // (2026-07-21 헤더의 ↻ 새로고침·⏻ 로그아웃 제거 — 새로고침은 브라우저와 겹치고,
  //  로그아웃은 표면에 상주할 만큼 자주 쓰지 않는다. 세션 해제는 브라우저 데이터 삭제.)
  try{ const r=await jfetch('/launcher/config'); if(r.ok){ const c=await r.json();
    IS_PHONE=(c.host==='phone-local');
    /* 허브 OS — 붙여넣기 안내 키에만 쓴다. 폰 네이티브가 받는 config 는 폰 자신의 것이라
       허브 OS 를 모른다 → 그때는 두 키를 다 보여준다(라벨은 어차피 OS 중립). */
    if(c.platform==='mac') PASTE_KEY='⌘V';
    else if(c.platform==='windows'||c.platform==='linux') PASTE_KEY='Ctrl+V';
    if(IS_PHONE){ const b=document.getElementById('surfBadge'); if(b) b.style.display='none'; }
  } }catch(e){}
  /* 클립보드 'PC로'는 두 표면 공통 — 방향은 표면이 정한다(보고 있는 기계 → 허브 PC).
     읽는 방법만 갈린다: 폰 네이티브=Java ClipboardManager, 원격런처=브라우저 clipboard API. */
  const cm=document.getElementById('clipToMacBtn'); if(cm) cm.style.display='block';
  apLoad();
  loadPeer(); setInterval(loadPeer, 20000);  /* 다른 몸 연결상태 폴링(계기판) */
  loadGear();  /* 모델 기어 레버(계기판) */
}

/* ===== 여기→허브PC 클립보드 (헤더 버튼) — 데스크탑 '폰으로'의 역방향 =====
   방향은 *표면*이 정한다: 보고 있는 기계의 클립보드를 허브 PC 로 민다. 데스크탑 런처는
   '폰으로'(PC→폰), 이 표면은 'PC로'. 사용자가 방향을 고를 일이 없다(당기기 없음).
   ★라벨은 OS 중립 — 허브는 맥일 수도 윈도우일 수도 있다(둘 다 indiebizOS 설치 대상).
   내부 라우트 이름(/launcher/clip-to-mac)은 폰 번들에 박혀 있어 그대로 둔다.
   읽는 방법만 표면별로 갈린다:
     - 폰 네이티브: /launcher/clip-to-mac (Java ClipboardManager — WebView 의 readText 는 불가)
     - 원격런처(브라우저): navigator.clipboard.readText → 실패하면 붙여넣기 칸 폴백
   놓는 쪽은 둘 다 기존 어휘 [self:output]{op:"clipboard"} — 허브 백엔드가 실행하니 거기 박힌다. */
let clipMacBusy=false;
let PASTE_KEY='⌘V / Ctrl+V';   /* 허브 OS 를 알기 전 기본값 — showApp 에서 확정 */
function clipMacFlash(msg){
  const b=document.getElementById('clipToMacBtn'); if(!b) return;
  b.textContent=msg;
  setTimeout(()=>{ b.textContent='📋 PC로 보내기'; clipMacBusy=false; }, 3500);
}
async function clipToMac(){
  if(clipMacBusy) return;
  const b=document.getElementById('clipToMacBtn'); if(!b) return;
  clipMacBusy=true;
  b.textContent='보내는 중…';
  if(IS_PHONE){
    let msg='실패';
    try{
      const r=await jfetch('/launcher/clip-to-mac',{method:'POST'});
      const d=await r.json().catch(()=>({}));
      if(d && d.success) msg='PC 도착 ✓ ('+(d.chars||0)+'자) — '+PASTE_KEY+' 로 붙여넣으세요';
      else msg=(d && d.error) ? d.error : '실패';
    }catch(e){ msg='연결 실패'; }
    clipMacFlash(msg);
    return;
  }
  /* 브라우저 표면: 읽기는 권한·제스처에 걸린다(iOS 는 확인 UI, 일부 브라우저는 아예 불가)
     → 실패·빈값이면 붙여넣기 칸으로 떨어뜨린다. 어디서든 되는 최후 경로. */
  let text='';
  try{ text=await navigator.clipboard.readText(); }catch(e){ text=''; }
  if(!(text||'').trim()){ clipMacBusy=false; b.textContent='📋 PC로 보내기'; clipPasteBox(); return; }
  clipSendToMac(text);
}
async function clipSendToMac(text){
  /* JSON.stringify = IBL 문자열 이스케이프 (따옴표·줄바꿈·중괄호·백슬래시 왕복 검증됨) */
  try{
    const d=await ibl('[self:output]{op: "clipboard", content: '+JSON.stringify(String(text))+'}');
    if(d && (d.copied_length || d.ok)) clipMacFlash('PC 도착 ✓ ('+(d.copied_length||String(text).length)+'자) — '+PASTE_KEY+' 로 붙여넣으세요');
    else clipMacFlash((d && d.error) ? d.error : '실패');
  }catch(e){ clipMacFlash('전송 실패: '+e.message); }
}
/* 붙여넣기 칸 폴백 — 셸 마크업을 늘리지 않도록 필요할 때만 만든다 */
function clipPasteBox(){
  let ov=document.getElementById('clipPasteOv');
  if(!ov){
    ov=document.createElement('div'); ov.id='clipPasteOv';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:none;align-items:flex-start;justify-content:center;padding:56px 16px';
    ov.innerHTML='<div style="background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(74,64,53,.25)">'
      +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">📋 PC로 보내기</div>'
      +'<div style="font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.5">브라우저가 클립보드를 직접 읽지 못했어요.<br>아래 칸을 길게 눌러 <b>붙여넣기</b> 한 뒤 보내세요.</div>'
      +'<textarea id="clipPasteTa" rows="5" placeholder="여기에 붙여넣기" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-size:14px;resize:vertical"></textarea>'
      +'<div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">'
      +'<button onclick="clipPasteClose()" style="background:var(--bg3);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:8px 16px;font-size:14px">취소</button>'
      +'<button onclick="clipPasteSend()" style="background:var(--acc);border:none;color:#fff;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600">PC로 보내기</button>'
      +'</div></div>';
    document.body.appendChild(ov);
  }
  ov.style.display='flex';
  const ta=document.getElementById('clipPasteTa'); if(ta){ ta.value=''; setTimeout(()=>{ try{ta.focus();}catch(e){} }, 60); }
}

async function memberMedia(){if(memberMediaBusy)return;memberMediaBusy=true;try{const pending=await memberRequest('media');for(const job of pending){const claimed=await memberRequest('media-claim',{key:job.key});if(!claimed.success)continue;const c=claimed.command,a=document.getElementById('memberAudio');let result;try{if(c.action==='play'){const u=new URL(c.url);if(!['http:','https:'].includes(u.protocol))throw Error('스트림 주소 오류');a.hidden=false;a.src=u.href;if(c.volume!==undefined)a.volume=c.volume/100;await Promise.race([a.play(),new Promise((_,reject)=>setTimeout(()=>reject(Error('스트림 응답 시간 초과')),20000))])}else if(c.action==='stop'){a.pause();a.removeAttribute('src');a.load();a.hidden=true}else if(c.action==='volume'){if(!a.currentSrc)throw Error('재생 중인 스트림이 없습니다');a.volume=c.volume/100}result={success:true,playing:!a.paused,volume:Math.round(a.volume*100),url:a.currentSrc}}catch(e){a.pause();result={success:false,error:'재생 실패: '+e.message+' · 아래 재생 버튼과 스트림 형식을 확인하세요'}}await memberRequest('media-result',{key:job.key,result})}}catch(e){}finally{memberMediaBusy=false}}
const MEMBER_FRAME_HTML="<!doctype html><html><meta charset=\"utf-8\"><meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'\"><style>\n:root{--bg:#f6f5f1;--bg2:white;--txt:#20372d;--dim:#65766e;--line:#d7dfda;--acc:#245644;--info:#256b95;--up:#23754a;--down:#b43737}body{font:15px system-ui;color:var(--txt);margin:12px}button,input,select,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:white}button{cursor:pointer}button.go,.on{background:var(--acc);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.tile{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.em{font-size:28px}.row,.tabs,.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.inst-head{display:flex;align-items:center;gap:12px}.muted{color:var(--dim)}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;overflow-wrap:anywhere}.card{padding:15px;background:white;margin:10px 0;border-radius:10px}a{color:var(--info)}#instOut{overflow:auto}\n<\/style><div id=\"appHome\"><\/div><div id=\"appInst\" style=\"display:none\"><\/div><script>window.__MEMBER=true;<\/script><script>\nconst API='';\nlet surface='autopilot';\nlet apChat={ type:'system', projectId:null, agentId:null, agentName:null };\nlet apProjects=[];\nlet apSwitches=[];\n\n/* ===== 공통 ===== */\nfunction esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }\n/* 채팅 버블용 경량 마크다운 — AI 응답의 **·`·##·리스트·링크가 생짜로 보이던 것을 얇게 해석.\n   버블은 white-space:pre-wrap 이라 블록 요소를 만들지 않고 인라인 치환만 한다(줄바꿈은 원문 그대로). */\nfunction mdChat(t){\n  let s=String(t==null?'':t);\n  s=s.replace(/\\s*\\[MAP:\\{[\\s\\S]*?\\}\\]\\s*/g,'\\n');  /* 지도 봉투(데스크탑 렌더 전용)는 원격 표시서 제거 */\n  s=esc(s);\n  const fences=[];\n  s=s.replace(/```[a-zA-Z0-9_-]*\\n?([\\s\\S]*?)```/g,function(_m,c){ fences.push(c.replace(/\\n+$/,'')); return '\\u0000F'+(fences.length-1)+'\\u0000'; });\n  s=s.replace(/`([^`\\n]+)`/g,'<code>$1<\/code>');\n  s=s.replace(/\\*\\*([^*\\n]+)\\*\\*/g,'<b>$1<\/b>');\n  s=s.replace(/^#{1,6}\\s+(.+)$/gm,'<span class=\"mdh\">$1<\/span>');\n  s=s.replace(/^&gt; ?(.+)$/gm,'<span class=\"mdq\">▏ $1<\/span>');\n  s=s.replace(/^(\\s*)[-*]\\s+/gm,'$1• ');\n  s=s.replace(/\\[([^\\]]+)\\]\\((https?:[^)\\s\"']+)\\)/g,'<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1<\/a>');\n  s=s.replace(/(^|[^\"'>=\\]])(https?:\\/\\/[^\\s<>\"']+)/g,'$1<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$2<\/a>');\n  s=s.replace(/\\u0000F(\\d+)\\u0000/g,function(_m,i){ return '<pre>'+fences[+i]+'<\/pre>'; });\n  return s;\n}\n// kv 값 렌더 — http(s) URL 이면 새 탭으로 여는 링크(공개 사이트 주소 등), 아니면 텍스트.\nfunction kvVal(v){ const t=String(v==null?'':v).trim();\n  const isUrl=(t.startsWith('http://')||t.startsWith('https://'))&&t.indexOf(' ')<0;\n  return isUrl\n    ? '<a href=\"'+esc(t)+'\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--info);word-break:break-all\">'+esc(t)+'<\/a>'\n    : '<span>'+esc(v)+'<\/span>'; }\nfunction launcherLoginRequired(message){\n  if(window.__MEMBER || window.__PORTAL) return;\n  document.getElementById('app').classList.remove('on');\n  document.getElementById('login').style.display='';\n  document.getElementById('loginErr').textContent=message;\n}\nasync function jfetch(url,opt){\n  const r=await fetch(API+url, Object.assign({headers:{'Content-Type':'application/json'}}, opt||{}));\n  if(r.status===401 && url!=='/launcher/auth/login') launcherLoginRequired('로그인이 만료되었습니다. 다시 로그인해주세요.');\n  return r;\n}\nasync function ibl(code){\n  /* 포털(회원 원격 계기): 범용 /ibl/execute 대신 회원 실행 게이트로 보낸다 — 렌더러 포크 금지·매개변수화 */\n  /* surface:'web' = 보고 있는 곳이 브라우저라는 표식 — 소리·저장이 맥이 아니라 여기서 나게 한다\n     (포털은 게이트가 서버측에서 같은 표식을 붙인다). */\n  const r=window.__PORTAL\n    ? await jfetch(window.__PORTAL.exec,{method:'POST',body:JSON.stringify({code:code})})\n    : await jfetch('/ibl/execute',{method:'POST',body:JSON.stringify({code,project_id:'앱모드',project_path:'.',surface:'web'})});\n  if(!r.ok){ let m='[HTTP '+r.status+']'; try{ const e=await r.json(); if(e&&(e.error||e.detail)) m=e.error||e.detail; }catch(_e){} throw new Error(m); }\n  /* 합성(>>) 액션은 final_result(마지막 단계)를 펼쳐 단일 액션처럼 노출 — view의 from/{필드}가 풀리도록.\n     펼치는 규칙은 공용 렌더 코어(unwrapFinalResult)가 정본 — 데스크탑 runIBL 과 같은 것. */\n  return unwrapFinalResult(await r.json());\n}\n\n/* ===== 로그인 ===== */\ndocument.addEventListener('DOMContentLoaded',()=>{\n  if(window.__MEMBER){ memberBoot(); return; }\n  if(window.__PORTAL){ portalBoot(); return; }\n  document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });\n  checkSession();\n});\n/* 포털(개인 커뮤니티 홈) 부트 — 이 셸을 회원용 단일 계기 페이지로 재사용(포크 금지·매개변수화).\n   로그인/표면 토글/계기판을 전부 건너뛰고 서버가 주입한 계기 하나(__PORTAL.instrument)를 바로\n   연다. 실행은 ibl() 이 __PORTAL.exec(회원 실행 게이트)로 보낸다. appHome 을 미리 숨겨\n   openInstrument 의 history push 를 막는다 → 뒤로가기 = 포털 홈. */\nfunction portalBoot(){\n  document.getElementById('login').style.display='none';\n  document.getElementById('app').classList.add('on');\n  const top=document.querySelector('.top'); if(top) top.style.display='none';\n  const sf=document.querySelector('.surfaces'); if(sf) sf.style.display='none';\n  const ap=document.getElementById('p-autopilot'); if(ap) ap.classList.remove('on');\n  document.getElementById('p-app').classList.add('on');\n  document.getElementById('appHome').style.display='none';\n  INSTRUMENTS=[window.__PORTAL.instrument];\n  openInstrument(0);\n}\nasync function checkSession(){\n  // 비번 없는 표면(폰 자급·로컬)은 게이트 자체가 무의미 → config로 즉시 진입(맥 프록시 의존 제거).\n  // 폰은 has_password=false 라 /projects(맥 터널 왕복) 결과와 무관히 바로 런처가 뜬다 = 로그인 화면 없음.\n  try{ const c=await(await jfetch('/launcher/config')).json(); if(c && c.has_password===false){ showApp(); return; } }catch(e){}\n  try{ const r=await jfetch('/projects'); if(r.ok){ showApp(); } }catch(e){}\n}\nasync function doLogin(){\n  const pw=document.getElementById('pw').value;\n  const el=document.getElementById('loginErr'); el.textContent='';\n  try{\n    const r=await jfetch('/launcher/auth/login',{method:'POST',body:JSON.stringify({password:pw})});\n    if(r.ok){\n      // 비밀번호 성공만으로 진입하지 않고 브라우저가 실제 세션을 보낼 수 있는지 확인한다.\n      const session=await jfetch('/projects');\n      if(session.ok){ document.getElementById('pw').value=''; showApp(); }\n      else launcherLoginRequired('로그인 연결을 확인하지 못했습니다. HTTPS 주소에서 다시 로그인해주세요.');\n    } else { const d=await r.json().catch(()=>({})); el.textContent=d.detail||'로그인 실패'; }\n  }catch(e){ el.textContent='서버 연결 실패'; }\n}\nlet IS_PHONE=false;\nasync function showApp(){\n  document.getElementById('login').style.display='none';\n  document.getElementById('app').classList.add('on');\n  // 자급 컴패니언(폰-로컬)인지 판별 — REMOTE 배지는 원격 시나리오 전용이라 폰에선 숨긴다.\n  // (2026-07-21 헤더의 ↻ 새로고침·⏻ 로그아웃 제거 — 새로고침은 브라우저와 겹치고,\n  //  로그아웃은 표면에 상주할 만큼 자주 쓰지 않는다. 세션 해제는 브라우저 데이터 삭제.)\n  try{ const r=await jfetch('/launcher/config'); if(r.ok){ const c=await r.json();\n    IS_PHONE=(c.host==='phone-local');\n    /* 허브 OS — 붙여넣기 안내 키에만 쓴다. 폰 네이티브가 받는 config 는 폰 자신의 것이라\n       허브 OS 를 모른다 → 그때는 두 키를 다 보여준다(라벨은 어차피 OS 중립). */\n    if(c.platform==='mac') PASTE_KEY='⌘V';\n    else if(c.platform==='windows'||c.platform==='linux') PASTE_KEY='Ctrl+V';\n    if(IS_PHONE){ const b=document.getElementById('surfBadge'); if(b) b.style.display='none'; }\n  } }catch(e){}\n  /* 클립보드 'PC로'는 두 표면 공통 — 방향은 표면이 정한다(보고 있는 기계 → 허브 PC).\n     읽는 방법만 갈린다: 폰 네이티브=Java ClipboardManager, 원격런처=브라우저 clipboard API. */\n  const cm=document.getElementById('clipToMacBtn'); if(cm) cm.style.display='block';\n  apLoad();\n  loadPeer(); setInterval(loadPeer, 20000);  /* 다른 몸 연결상태 폴링(계기판) */\n  loadGear();  /* 모델 기어 레버(계기판) */\n}\n\n/* ===== 여기→허브PC 클립보드 (헤더 버튼) — 데스크탑 '폰으로'의 역방향 =====\n   방향은 *표면*이 정한다: 보고 있는 기계의 클립보드를 허브 PC 로 민다. 데스크탑 런처는\n   '폰으로'(PC→폰), 이 표면은 'PC로'. 사용자가 방향을 고를 일이 없다(당기기 없음).\n   ★라벨은 OS 중립 — 허브는 맥일 수도 윈도우일 수도 있다(둘 다 indiebizOS 설치 대상).\n   내부 라우트 이름(/launcher/clip-to-mac)은 폰 번들에 박혀 있어 그대로 둔다.\n   읽는 방법만 표면별로 갈린다:\n     - 폰 네이티브: /launcher/clip-to-mac (Java ClipboardManager — WebView 의 readText 는 불가)\n     - 원격런처(브라우저): navigator.clipboard.readText → 실패하면 붙여넣기 칸 폴백\n   놓는 쪽은 둘 다 기존 어휘 [self:output]{op:\"clipboard\"} — 허브 백엔드가 실행하니 거기 박힌다. */\nlet clipMacBusy=false;\nlet PASTE_KEY='⌘V / Ctrl+V';   /* 허브 OS 를 알기 전 기본값 — showApp 에서 확정 */\nfunction clipMacFlash(msg){\n  const b=document.getElementById('clipToMacBtn'); if(!b) return;\n  b.textContent=msg;\n  setTimeout(()=>{ b.textContent='📋 PC로 보내기'; clipMacBusy=false; }, 3500);\n}\nasync function clipToMac(){\n  if(clipMacBusy) return;\n  const b=document.getElementById('clipToMacBtn'); if(!b) return;\n  clipMacBusy=true;\n  b.textContent='보내는 중…';\n  if(IS_PHONE){\n    let msg='실패';\n    try{\n      const r=await jfetch('/launcher/clip-to-mac',{method:'POST'});\n      const d=await r.json().catch(()=>({}));\n      if(d && d.success) msg='PC 도착 ✓ ('+(d.chars||0)+'자) — '+PASTE_KEY+' 로 붙여넣으세요';\n      else msg=(d && d.error) ? d.error : '실패';\n    }catch(e){ msg='연결 실패'; }\n    clipMacFlash(msg);\n    return;\n  }\n  /* 브라우저 표면: 읽기는 권한·제스처에 걸린다(iOS 는 확인 UI, 일부 브라우저는 아예 불가)\n     → 실패·빈값이면 붙여넣기 칸으로 떨어뜨린다. 어디서든 되는 최후 경로. */\n  let text='';\n  try{ text=await navigator.clipboard.readText(); }catch(e){ text=''; }\n  if(!(text||'').trim()){ clipMacBusy=false; b.textContent='📋 PC로 보내기'; clipPasteBox(); return; }\n  clipSendToMac(text);\n}\nasync function clipSendToMac(text){\n  /* JSON.stringify = IBL 문자열 이스케이프 (따옴표·줄바꿈·중괄호·백슬래시 왕복 검증됨) */\n  try{\n    const d=await ibl('[self:output]{op: \"clipboard\", content: '+JSON.stringify(String(text))+'}');\n    if(d && (d.copied_length || d.ok)) clipMacFlash('PC 도착 ✓ ('+(d.copied_length||String(text).length)+'자) — '+PASTE_KEY+' 로 붙여넣으세요');\n    else clipMacFlash((d && d.error) ? d.error : '실패');\n  }catch(e){ clipMacFlash('전송 실패: '+e.message); }\n}\n/* 붙여넣기 칸 폴백 — 셸 마크업을 늘리지 않도록 필요할 때만 만든다 */\nfunction clipPasteBox(){\n  let ov=document.getElementById('clipPasteOv');\n  if(!ov){\n    ov=document.createElement('div'); ov.id='clipPasteOv';\n    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:none;align-items:flex-start;justify-content:center;padding:56px 16px';\n    ov.innerHTML='<div style=\"background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(74,64,53,.25)\">'\n      +'<div style=\"font-size:15px;font-weight:600;margin-bottom:6px\">📋 PC로 보내기<\/div>'\n      +'<div style=\"font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.5\">브라우저가 클립보드를 직접 읽지 못했어요.<br>아래 칸을 길게 눌러 <b>붙여넣기<\/b> 한 뒤 보내세요.<\/div>'\n      +'<textarea id=\"clipPasteTa\" rows=\"5\" placeholder=\"여기에 붙여넣기\" style=\"width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-size:14px;resize:vertical\"><\/textarea>'\n      +'<div style=\"display:flex;gap:8px;margin-top:12px;justify-content:flex-end\">'\n      +'<button onclick=\"clipPasteClose()\" style=\"background:var(--bg3);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:8px 16px;font-size:14px\">취소<\/button>'\n      +'<button onclick=\"clipPasteSend()\" style=\"background:var(--acc);border:none;color:#fff;border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600\">PC로 보내기<\/button>'\n      +'<\/div><\/div>';\n    document.body.appendChild(ov);\n  }\n  ov.style.display='flex';\n  const ta=document.getElementById('clipPasteTa'); if(ta){ ta.value=''; setTimeout(()=>{ try{ta.focus();}catch(e){} }, 60); }\n}\nfunction clipPasteClose(){ const ov=document.getElementById('clipPasteOv'); if(ov) ov.style.display='none'; }\nfunction clipPasteSend(){\n  const ta=document.getElementById('clipPasteTa'); const t=ta?ta.value:'';\n  if(!(t||'').trim()){ if(ta) ta.focus(); return; }\n  clipPasteClose(); clipMacBusy=true;\n  const b=document.getElementById('clipToMacBtn'); if(b) b.textContent='보내는 중…';\n  clipSendToMac(t);\n}\n\n/* ===== 다른 몸(피어) 연결상태 — 계기판 안에 표기 ===== */\nfunction renderPeer(d){\n  const el=document.getElementById('peerStatus'); if(!el) return;\n  if(!d){ el.style.display='none'; return; }\n  const online = !!(d.has_peer && d.online);\n  const name = d.peer_name || '다른 몸';\n  const status = !d.has_peer ? '미연동' : (online ? '연결됨' : '오프라인');\n  const dot = online ? '#10b981' : '#d6d3d1';\n  el.innerHTML =\n    '<span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:'+dot+'\"><\/span>'+\n    '<span style=\"color:'+(online?'#44403c':'#a8a29e')+';margin-left:8px\">'+((d.peer_icon||'📱'))+' '+esc(name)+'<\/span>'+\n    '<span style=\"color:'+(online?'#059669':'#a8a29e')+';margin-left:6px\">· '+status+'<\/span>';\n  el.style.cssText='display:flex;align-items:center;font-size:12px;padding:8px 2px;margin-bottom:8px';\n}\nasync function loadPeer(){\n  try{ const r=await jfetch('/nodes/peer-status'); if(r.ok){ renderPeer(await r.json()); return; } }catch(e){}\n  renderPeer(null);\n}\n\n/* ===== 모델 기어 — 계기판 변속 레버 + 설정(프리셋·핀). data-속성 위임으로 따옴표 함정 회피 ===== */\nlet gearState=null, gearOpen=false, gearAgents=[], gearOverrides={}, gearPresetDraft={};\nconst GEAR_DESC={'절약':'기어 역할 경량 — 빠르고 저렴','균형':'실행·의식 중급 — 기본','최대':'실행·의식 고급 — 최고 품질'};\nasync function loadGear(){\n  try{ const r=await jfetch('/model-gear'); if(r.ok){ gearState=await r.json(); renderGear(); return; } }catch(e){}\n  const el=document.getElementById('gearLever'); if(el) el.style.display='none';\n}\nfunction renderGear(){\n  const el=document.getElementById('gearLever'); if(!el||!gearState) return;\n  el.style.display='block'; const g=gearState; let h='';\n  h+='<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">';\n  h+='<span style=\"font-weight:700;font-size:14px\">⚙️ 모델 기어<\/span>';\n  h+='<button data-act=\"toggle\" style=\"font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:'+(gearOpen?'var(--acc)':'var(--bg3)')+';color:var(--txt)\">설정<\/button><\/div>';\n  h+='<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px\">';\n  (g.gears||[]).forEach(function(name){\n    const on=g.current_gear===name;\n    h+='<button data-act=\"gear\" data-g=\"'+esc(name)+'\" style=\"padding:10px 6px;border-radius:10px;border:1px solid '+(on?'var(--acc)':'var(--line)')+';background:'+(on?'var(--acc)':'var(--bg)')+';color:'+(on?'#fff':'var(--txt)')+';text-align:center\">';\n    h+='<div style=\"font-weight:700;font-size:13px\">'+esc(name)+'<\/div>';\n    h+='<div style=\"font-size:10px;margin-top:2px;color:'+(on?'rgba(255,255,255,.85)':'var(--dim)')+'\">'+esc(GEAR_DESC[name]||'')+'<\/div><\/button>';\n  });\n  h+='<\/div>';\n  if(g.axes){\n    h+='<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)\">';\n    Object.keys(g.axes).forEach(function(ax){ h+='<span>'+esc((g.axis_info&&g.axis_info[ax]?g.axis_info[ax].label:ax))+' <b style=\"color:var(--txt)\">'+esc(g.axes[ax].tier)+'<\/b><\/span>'; });\n    h+='<span style=\"color:var(--dim)\">· 티어별 모델은 설정 ▸ 모델 설정<\/span><\/div>';\n  }\n  if(typeof g.consciousness_enabled!=='undefined'){\n    const on=g.consciousness_enabled!==false;\n    h+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)\">';\n    h+='<span style=\"font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\"><b style=\"color:'+(on?'var(--txt)':'var(--dim)')+'\">🧠 최초 숙고 '+(on?'켜짐':'꺼짐')+'<\/b> <span style=\"color:var(--dim)\">'+(on?'— 복잡한 일은 계획부터':'— 바로 실행부터')+'<\/span><\/span>';\n    h+='<button data-act=\"mind\" role=\"switch\" aria-checked=\"'+on+'\" title=\"의식 없는 바로 실행·반사 경로는 감독·평가를 생략합니다.\" style=\"position:relative;flex-shrink:0;width:40px;height:20px;border-radius:9999px;border:none;cursor:pointer;background:'+(on?'var(--acc)':'var(--line)')+'\">';\n    h+='<span style=\"position:absolute;top:2px;left:'+(on?'22px':'2px')+';width:16px;height:16px;border-radius:9999px;background:#fff;transition:left .15s\"><\/span><\/button><\/div>';\n  }\n  h+='<p style=\"font-size:10px;color:var(--dim);margin-top:6px\">의식이 작동한 턴만 감독·평가합니다. 바로 실행·반사는 평가하지 않습니다.<\/p>';\n  if(gearOpen) h+=renderGearSettings();\n  el.innerHTML=h;\n}\nfunction renderGearSettings(){\n  const g=gearState, tiers=g.tiers||['경량','중급','고급'], axes=g.axis_names||['분류','평가','실행','의식'];\n  let h='<div style=\"margin-top:12px;padding-top:12px;border-top:1px solid var(--line)\">';\n  h+='<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\"><span style=\"font-size:12px;font-weight:600\">기어 프리셋<\/span><button data-act=\"savePresets\" style=\"font-size:11px;padding:3px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--txt)\">저장<\/button><\/div>';\n  h+='<table style=\"width:100%;font-size:11px;border-collapse:collapse\"><tr style=\"color:var(--dim)\"><td style=\"padding:2px 4px\">기어<\/td>';\n  axes.forEach(function(ax){ h+='<td style=\"padding:2px;text-align:center\">'+esc((g.axis_info&&g.axis_info[ax]?g.axis_info[ax].label:ax))+'<\/td>'; });\n  h+='<\/tr>';\n  Object.keys(gearPresetDraft).forEach(function(gn){\n    h+='<tr><td style=\"padding:3px 4px;font-weight:600\">'+esc(gn)+'<\/td>';\n    axes.forEach(function(ax){\n      h+='<td style=\"padding:2px\"><select data-act=\"cell\" data-gn=\"'+esc(gn)+'\" data-ax=\"'+esc(ax)+'\" style=\"width:100%;font-size:11px;padding:2px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:5px\">';\n      tiers.forEach(function(t){ h+='<option'+((gearPresetDraft[gn]||{})[ax]===t?' selected':'')+'>'+esc(t)+'<\/option>'; });\n      h+='<\/select><\/td>';\n    });\n    h+='<\/tr>';\n  });\n  h+='<\/table>';\n  axes.forEach(function(ax){ const info=(g.axis_info||{})[ax]; if(info) h+='<p style=\"font-size:11px;color:var(--dim);margin:5px 0\"><b>'+esc(info.label)+'<\/b> · '+esc(info.description)+'<\/p>'; });\n  h+='<div style=\"margin:16px 0\"><b style=\"font-size:12px\">시각·청각·기억 모델<\/b><p style=\"font-size:11px;color:var(--dim)\">현재 선택 경로와 별도 설정입니다. 조회 전용 항목은 이 기어에서 변경하지 않습니다.<\/p>';\n  (g.sensory_models||[]).forEach(function(item){\n    h+='<div style=\"border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:11px;overflow-wrap:anywhere\">';\n    h+='<b>'+esc(item.label)+'<\/b><div style=\"margin:4px 0\">'+esc(item.model?((item.provider?item.provider+' / ':'')+item.model):'미설정')+'<\/div>';\n    h+='<div style=\"color:var(--dim)\">'+esc(item.policy)+'<\/div><p style=\"color:var(--dim);margin:4px 0\">'+esc(item.detail)+'<\/p>';\n    h+='<div style=\"color:var(--dim);font-size:10px\">설정 출처: '+esc(item.source)+'<\/div><\/div>';\n  });\n  h+='<\/div>';\n\n  h+='<div style=\"font-size:12px;font-weight:600;margin:12px 0 6px\">에이전트 핀 — 특정 에이전트만 고정<\/div><div style=\"max-height:200px;overflow-y:auto\">';\n  gearAgents.forEach(function(a){\n    const cur=gearOverrides[a.id]||'';\n    h+='<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0\">';\n    h+='<span style=\"font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">'+esc(a.name)+' <span style=\"color:var(--dim);font-size:10px\">'+esc(a.project)+'<\/span><\/span>';\n    h+='<select data-act=\"pin\" data-id=\"'+esc(a.id)+'\" style=\"font-size:11px;padding:2px 4px;border-radius:5px;background:'+(cur?'var(--acc)':'var(--bg)')+';color:'+(cur?'#fff':'var(--dim)')+';border:1px solid var(--line)\"><option value=\"\">기어 따름<\/option>';\n    tiers.forEach(function(t){ h+='<option'+(cur===t?' selected':'')+' value=\"'+esc(t)+'\">📌 '+esc(t)+'<\/option>'; });\n    h+='<\/select><\/div>';\n  });\n  h+='<\/div><\/div>';\n  return h;\n}\nasync function setGearTo(name){\n  try{ const r=await jfetch('/model-gear',{method:'PUT',body:JSON.stringify({gear:name})}); if(r.ok){ gearState=await r.json(); renderGear(); } }catch(e){}\n}\nasync function gearToggle(){\n  gearOpen=!gearOpen;\n  if(gearOpen){\n    await loadGear();\n    if(gearState&&gearState.presets) gearPresetDraft=JSON.parse(JSON.stringify(gearState.presets));\n    try{ const r=await jfetch('/model-gear/overrides'); if(r.ok){ const d=await r.json(); gearAgents=d.agents||[]; gearOverrides=d.overrides||{}; } }catch(e){}\n  }\n  renderGear();\n}\nasync function saveGearPresets(){\n  try{ const r=await jfetch('/model-gear/presets',{method:'PUT',body:JSON.stringify({presets:gearPresetDraft})}); if(r.ok){ gearState=await r.json(); renderGear(); } }catch(e){}\n}\nasync function setGearPin(id,tier){\n  const next=Object.assign({},gearOverrides); if(tier) next[id]=tier; else delete next[id];\n  try{ const r=await jfetch('/model-gear/overrides',{method:'PUT',body:JSON.stringify({overrides:next})}); if(r.ok){ const d=await r.json(); gearOverrides=d.overrides||{}; await loadGear(); } }catch(e){}\n}\nasync function setConsciousness(enabled){\n  try{ const r=await jfetch('/model-gear/consciousness',{method:'PUT',body:JSON.stringify({enabled:enabled})}); if(r.ok){ gearState=await r.json(); renderGear(); } }catch(e){}\n}\n/* 위임 핸들러 — 인라인 onclick 없이 data-속성으로(따옴표 함정 회피) */\ndocument.addEventListener('click',function(ev){\n  const t=ev.target.closest('[data-act]'); if(!t||!document.getElementById('gearLever').contains(t)) return;\n  const act=t.getAttribute('data-act');\n  if(act==='toggle') gearToggle();\n  else if(act==='gear') setGearTo(t.getAttribute('data-g'));\n  else if(act==='savePresets') saveGearPresets();\n  else if(act==='mind') setConsciousness(!(gearState&&gearState.consciousness_enabled!==false));\n});\ndocument.addEventListener('change',function(ev){\n  const t=ev.target; if(!t.getAttribute||!document.getElementById('gearLever').contains(t)) return;\n  const act=t.getAttribute('data-act');\n  if(act==='cell'){ const gn=t.getAttribute('data-gn'),ax=t.getAttribute('data-ax'); if(!gearPresetDraft[gn])gearPresetDraft[gn]={}; gearPresetDraft[gn][ax]=t.value; }\n  else if(act==='pin') setGearPin(t.getAttribute('data-id'),t.value);\n});\n\n\n/* ===== 공용 렌더 코어 (backend/static/app_render_core.js — 데스크탑과 단일 소스) ===== */\n/**\n * app_render_core.js — 앱 표면 렌더 어휘의 \"순수 로직\" 단일 소스 (표면 공용)\n *\n * 왜 여기 있나: 같은 15 프리미티브를 데스크탑(React/TSX)과 원격·폰(파이썬 문자열 속 JS)이\n * 이중 구현하고 있었고, 그 둘의 *로직*은 글자 그대로 번역된 사본이었다(템플릿 엔진·액션\n * 빌더·스파크라인 좌표·달력 월 산식·compose 채널 선택·미디어 소스 결정…). 마크업은 두\n * 표면이 다를 수밖에 없지만(JSX vs HTML 문자열) 로직이 둘일 이유는 없다 — 여기가 그 하나다.\n *\n * 규칙:\n *  - **DOM·프레임워크 의존 0**. 이스케이프처럼 표면마다 다른 것은 *인자로 받는다*(esc, T).\n *  - 두 소비자:\n *      데스크탑 = Vite 가 ESM 으로 import (frontend/src/components/generic/manifest.ts)\n *      원격·폰   = backend/launcher_render_core.py 가 이 파일을 읽어 **맨 끝 export 블록만**\n *                 떼고 런처 <script> 안에 인라인 → 함수들이 전역이 된다(선언 호이스팅).\n *    그래서 파일 맨 끝의 ESM-export 마커 블록은 **파일의 마지막이어야 하고**, 그 위쪽에는\n *    `export` 키워드를 쓰지 않는다(고전 스크립트에선 SyntaxError).\n *  - 모듈 최상위 값은 `var`(고전 스크립트 인라인 시 TDZ 회피).\n *\n * 어휘 자체(어떤 프리미티브가 있는가)의 정본은 여전히 build_ibl_nodes.APP_VIEW_TYPES.\n */\n\n/* ===== 경로·템플릿 엔진 ===== */\n\n/** \"a.b.c\" 경로로 중첩 값 꺼내기 (없으면 undefined) */\nfunction jget(o, path) {\n  if (!path) return o;\n  return String(path).split('.').reduce(function (a, k) { return a == null ? undefined : a[k]; }, o);\n}\n\n/** 표시 필터 — {값|round}, {값|opt:앞,뒤} 등 */\nfunction applyFilter(v, f) {\n  if (f === 'round') return v == null ? v : Math.round(Number(v));\n  if (f === 'num') return v == null ? null : Number(v).toLocaleString();\n  if (f === 'abs') return v == null ? v : Math.abs(Number(v));\n  if (f === 'arrow') return (Number(v) || 0) >= 0 ? '▲' : '▼';\n  if (f.indexOf('opt:') === 0) {\n    var a = f.slice(4).split(',');\n    return (v == null || v === '' || Number(v) === 0) ? '' : (a[0] || '') + String(v) + (a[1] || '');\n  }\n  if (f.indexOf('trunc:') === 0) {\n    var n = parseInt(f.slice(6)) || 40;\n    var s = String(v == null ? '' : v);\n    return s.length > n ? s.slice(0, n) + '…' : s;\n  }\n  return v;\n}\n\n/**\n * \"{path|filter|...}\" → 문자열 치환.\n * esc = 치환된 *값* 에 적용할 함수. 원격(HTML 문자열)은 HTML 이스케이퍼를 넘기고,\n * 데스크탑(React 가 알아서 이스케이프)은 안 넘긴다(=String).\n */\nfunction tplWith(t, data, esc) {\n  if (t == null) return '';\n  var e = esc || String;\n  return String(t).replace(/\\{([^{}]+)\\}/g, function (_m, expr) {\n    var parts = expr.split('|');\n    var v = jget(data, parts[0].trim());\n    for (var i = 1; i < parts.length; i++) v = applyFilter(v, parts[i].trim());\n    return v == null ? '' : e(v);\n  });\n}\n\n/**\n * $key 치환(사용자 입력) + 빈 입력 'param: \"\"' 쌍 자동 제거.\n * ★값은 스트립이 아니라 이스케이프 — IBL 값은 JSON5 문자열 리터럴로 파싱되므로\n *   윈도우 경로(C:\\Users\\…)의 백슬래시를 스트립하면 깨진다.\n */\nfunction buildAction(template, values) {\n  var code = String(template).replace(/\\$(\\w+)/g, function (_m, k) {\n    var v = values ? values[k] : undefined;\n    return v == null ? '' : String(v).replace(/\\\\/g, '\\\\\\\\').replace(/\"/g, '\\\\\"');\n  });\n  code = code.replace(/\\w+:\\s*\"\",?\\s*/g, '');\n  code = code.replace(/,\\s*\\}/g, '}').replace(/\\{\\s*,/g, '{');\n  return code;\n}\n\n/** 행 데이터 {path} 치환 (드릴·행 버튼용) */\nfunction rowAction(template, item) {\n  return String(template).replace(/\\{([\\w.]+)\\}/g, function (_m, path) {\n    var v = jget(item, path);\n    return v == null ? '' : String(v).replace(/\"/g, '');\n  });\n}\n\n/** view 통화 슬라이스 — from:'.' 은 응답 자체를 1행으로 */\nfunction viewList(data, from) {\n  if (from === '.') return [data];\n  var a = jget(data, from);\n  return Array.isArray(a) ? a : [];\n}\n\n/** 빈 결과 문구 (empty_from → empty → 기본) */\nfunction emptyText(p, data) {\n  return (p.empty_from ? jget(data, p.empty_from) : null) || p.empty || '결과가 없습니다';\n}\n\n/** 추세 방향 — p.trend 없으면 null(색 없음), 있으면 상승 여부. 색 어휘는 표면 몫. */\nfunction trendUp(p, data) {\n  if (!p.trend) return null;\n  return (Number(jget(data, p.trend)) || 0) >= 0;\n}\n\nfunction statusGlyph(s) {\n  return s === 'sent' ? '✓' : s === 'pending' ? '⏳' : s === 'failed' ? '⚠' : '';\n}\n\n/** 합성(>>) 응답의 final_result(마지막 단계)를 펼쳐 단일 액션처럼 노출 */\nfunction unwrapFinalResult(data) {\n  if (data && data.edition === 2 && data.success === true && data.source_complete !== false && Object.prototype.hasOwnProperty.call(data, 'value')) {\n    return data.value;\n  }\n  if (data && typeof data === 'object' && 'final_result' in data) {\n    var fr = data.final_result;\n    if (typeof fr === 'string') {\n      try { return JSON.parse(fr); } catch (_e) { return { message: fr }; }\n    }\n    if (fr && typeof fr === 'object') return fr;\n  }\n  return data;\n}\n\n/* ===== 프리미티브 모델 (마크업 없는 결정층) ===== */\n\n/**\n * group 파티션 — from 리스트를 키로 나눈다(입력 순서 보존).\n * keyOf(item) 는 표면의 템플릿 함수(이스케이프 정책 포함)를 그대로 받는다.\n */\nfunction groupPartition(arr, keyOf, maxGroups) {\n  var order = [], groups = {};\n  arr.forEach(function (it) {\n    var key = keyOf(it);\n    if (!(key in groups)) { groups[key] = []; order.push(key); }\n    groups[key].push(it);\n  });\n  var keys = maxGroups ? order.slice(0, maxGroups) : order;\n  return keys.map(function (k) { return { key: k, members: groups[k] }; });\n}\n\n/** 스파크라인 수치 포맷 — 큰 값(가격)은 정수·천단위, 작은 값(환율·코인)은 소수 */\nfunction fmtSpark(n) {\n  var a = Math.abs(n);\n  var d = a >= 1000 ? 0 : a >= 1 ? 2 : 4;\n  return Number(n).toLocaleString(undefined, { maximumFractionDigits: d });\n}\n\n/**\n * sparkline 좌표 모델 — 점이 2개 미만이면 null(그리지 않음).\n * x축 라벨 필드: p.x 우선, 없으면 흔한 시간 필드 자동 감지.\n */\nfunction sparkModel(p, data) {\n  var arr = viewList(data, p.from);\n  var first = arr[0];\n  var xkey = p.x || (first && typeof first === 'object'\n    ? ['date', 'time', 'label', 'x'].filter(function (k) { return first[k] != null; })[0]\n    : undefined);\n  var rows = arr.map(function (x) {\n    return { v: Number(p.y ? x[p.y] : x), x: xkey ? String(x[xkey] == null ? '' : x[xkey]) : '' };\n  }).filter(function (r) { return !isNaN(r.v); });\n  if (rows.length < 2) return null;\n  var vals = rows.map(function (r) { return r.v; });\n  var w = 280, h = 50;\n  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = (mx - mn) || 1;\n  var px = function (i) { return (i / (rows.length - 1)) * w; };\n  var py = function (v) { return h - ((v - mn) / rg) * h; };\n  var pts = rows.map(function (r, i) { return px(i).toFixed(1) + ',' + py(r.v).toFixed(1); }).join(' ');\n  return { rows: rows, xkey: xkey, w: w, h: h, mn: mn, mx: mx, rg: rg, px: px, py: py, pts: pts };\n}\n\n/**\n * calendar 월 모델 — year/month(1-12) 기준.\n *  byDay: 날짜 명확 이벤트(none/monthly/yearly)를 일자 → 이벤트[] 로\n *  recurring: 정기(daily/weekly/interval) — 그리드 밖 목록\n *  cells: 앞 공백 + 1..말일 (7의 배수로 뒤 패딩)\n * ★그 달에 없는 날(2월 31일 등)은 버린다 — monthly 반복의 31일이 30일 달에 새지 않게.\n */\nvar CAL_PERIODIC = ['daily', 'weekly', 'interval'];\nfunction calendarModel(events, year, month) {\n  var byDay = {};\n  var daysInMonth = new Date(year, month, 0).getDate();\n  (events || []).forEach(function (e) {\n    var rep = e.repeat || 'none';\n    if (CAL_PERIODIC.indexOf(rep) >= 0) return;\n    var ps = e.date ? String(e.date).split('-').map(Number) : null;\n    if (!ps || ps.length < 3) return;\n    var day = null;\n    if (rep === 'monthly') day = ps[2];\n    else if (rep === 'yearly') { if (ps[1] === month) day = ps[2]; }\n    else if (ps[0] === year && ps[1] === month) day = ps[2];\n    if (day && day >= 1 && day <= daysInMonth) (byDay[day] = byDay[day] || []).push(e);\n  });\n  var recurring = (events || []).filter(function (e) { return CAL_PERIODIC.indexOf(e.repeat || '') >= 0; });\n  var firstWeekday = new Date(year, month - 1, 1).getDay();\n  var cells = [];\n  for (var i = 0; i < firstWeekday; i++) cells.push(null);\n  for (var d = 1; d <= daysInMonth; d++) cells.push(d);\n  while (cells.length % 7 !== 0) cells.push(null);\n  return { byDay: byDay, recurring: recurring, cells: cells, firstWeekday: firstWeekday, daysInMonth: daysInMonth };\n}\n\n/** 월 이동 (1-12 유지) */\nfunction calShift(year, month, delta) {\n  var m = month + delta, y = year;\n  if (m < 1) { m = 12; y--; }\n  if (m > 12) { m = 1; y++; }\n  return { year: y, month: m };\n}\n\nfunction pad2(n) { return (n < 10 ? '0' : '') + n; }\n\n/**\n * compose 발신 채널 후보 — 드릴 데이터의 연락처 배열에서 발신 가능한 채널만.\n * 없으면 기본(primary) 채널로 폴백. 백엔드가 정한 data.channel 을 맨 앞으로 올린다\n * (작성바 기본 선택=opts[0] — 등록 순서와 무관하게 nostr 를 가진 이웃은 nostr 가 기본).\n */\nfunction composeChannelOptions(cmp, data) {\n  var ch = cmp && cmp.channels;\n  if (!ch || !data || typeof data !== 'object') return [];\n  var mk = function (ct, to, label) { return { key: ct + '|' + to, channel_type: ct, to: to, label: label }; };\n  var str = function (o, k) { var v = jget(o, k); return v == null ? '' : String(v); };\n  var opts = viewList(data, ch.from)\n    .map(function (c) { return { ct: str(c, ch.type), to: str(c, ch.value) }; })\n    .filter(function (o) { return o.to && (!ch.sendable || ch.sendable.indexOf(o.ct) >= 0); })\n    .map(function (o) { return mk(o.ct, o.to, o.ct + ' · ' + o.to); });\n  if (!opts.length) {\n    var ct = str(data, 'channel'), to = str(data, 'to');\n    if (to) opts = [mk(ct, to, ct || '기본')];\n  }\n  var seen = {};\n  var uniq = opts.filter(function (o) { return seen[o.key] ? false : (seen[o.key] = 1, true); });\n  var prefCt = str(data, 'channel');\n  if (prefCt) {\n    var i = uniq.findIndex(function (o) { return o.channel_type === prefCt; });\n    if (i > 0) { var pick = uniq.splice(i, 1)[0]; uniq.unshift(pick); }\n  }\n  return uniq;\n}\n\n/**\n * 느린 회선 판정 — navigator.connection(크로미움 계열). 테슬라 실측 1.4Mbps/350ms 가 걸린다.\n * 참이면 media_player 가 src_low(저대역 판)를 자동 선택한다.\n */\nfunction isSlowNet(conn) {\n  return !!conn && ((!!conn.downlink && conn.downlink < 3) || (!!conn.rtt && conn.rtt > 250));\n}\n\n/** preload='metadata' 를 허용할 목록 길이 상한 — 이 위는 항목 수만큼 요청이 나가므로 'none s.charAt(p.length);\n      if (c === '/' || c === '?') return true;\n    }\n  }\n  return false;\n}\n\n/**\n * 미디어 소스 문자열 → 실제로 물릴 URL. base = 표면이 백엔드에 붙일 오리진\n * (데스크탑 = 'http://127.0.0.1:8765' — file://·5173 이라 origin 이 다르다 / 원격·폰 = '' 동일오리진).\n *\n * 절대 URL은 그대로 · 백엔드 라우트는 base 부착 · 그 밖(파일 절대/상대경로)은 /launcher/file 서빙.\n * 이미 해소된 URL 을 다시 넣어도 같은 값이 나온다(/launcher/file… 자체가 라우트라 멱등).\n */\nfunction resolveMediaUrl(raw, base) {\n  if (!raw) return '';\n  var s = String(raw);\n  if (/^(https?:|data:|blob:)/.test(s)) return s;\n  var b = base || '';\n  return isBackendRoute(s) ? b + s : b + '/launcher/file?path=' + encodeURIComponent(s);\n}\n\n/**\n * media_player 한 항목의 소스 결정 — T 는 표면의 템플릿 함수(이스케이프 정책 포함).\n * 고른 문자열을 URL 로 절대화하는 것은 resolveMediaUrl(표면이 base 를 넘긴다),\n * 여기선 *어떤 문자열을 고를지*만 정한다.\n *\n * n = 이 media_player 가 그리는 항목 수(표면이 arr.length 로 넘긴다) — preload 판정에 쓴다.\n */\nfunction mediaModel(p, it, T, slowNet, n) {\n  var lowRaw = (typeof p.src_low === 'string') ? T(p.src_low, it) : '';\n  var src = (slowNet && lowRaw) ? lowRaw : (p.src ? T(p.src, it) : '');\n  var isVideo = p.video === true || (typeof p.video === 'string' && /^(true|1)$/i.test(T(p.video, it)));\n  return {\n    src: src,\n    hls: (typeof p.src_hls === 'string') ? T(p.src_hls, it) : '',\n    isVideo: isVideo,\n    poster: p.poster ? T(p.poster, it) : '',\n    title: p.title ? T(p.title, it) : '',\n    preload: preloadOf(p, n),\n  };\n}\n\n/**\n * 셔플(랜덤 재생)의 다음 곡 — '섞은 자루': 이번 바퀴에 아직 안 나온 곡에서만 고르고,\n * 다 돌면 자루를 새로 채운다. 매번 균등하게 다시 뽑는 방식과 달리 한 바퀴 안에서는 같은 곡이\n * 두 번 나오지 않고(즉시 반복 없음) 목록 전체가 반드시 한 번씩 나온다(영영 안 나오는 곡 없음).\n *\n * count=곡 수 · current=지금 곡 인덱스(없으면 -1) · played=이번 바퀴에 이미 나온 인덱스들.\n * 상태를 안 들고 인자로 받는다 — 순수 함수라야 두 표면(데스크탑 TSX · 원격 JS)이 같은 규칙을 나눈다.\n * 반환 {index, played} — index<0 은 재생할 것이 없다는 뜻(곡 0개). rnd 는 시험용 주입구(생략=Math.random).\n */\nfunction shuffleNext(count, current, played, rnd) {\n  var n = Math.max(0, count | 0);\n  if (!n) return { index: -1, played: [] };\n  var R = rnd || Math.rand trument(ix){\n  const inst=INSTRUMENTS[ix]; if(!inst) return;\n  CUR={inst:inst, mode:null, optCache:{}}; VIEW_CTX=null;\n  // 홈에서 계기로 들어갈 때만 history 항목 push(뒤로가기로 그리드 복귀). 중복 push 방지.\n  const _fromHome=document.getElementById('appHome').style.display!=='none';\n  document.getElementById('appHome').style.display='none';\n  const box=document.getElementById('appInst'); box.style.display='block';\n  if(_fromHome){ try{ history.pushState({inst:1}, ''); }catch(e){} }\n  let h='<div class=\"inst-head\"><button class=\"back\" onclick=\"history.back()\">←<\/button><h2>'+esc(inst.icon||'')+' '+esc(inst.name)+'<\/h2><\/div>';\n  if(inst.web_app && new RegExp('^/[a-z][a-z0-9/_-]*$').test(inst.web_app)){\n    box.innerHTML=h;\n    const frame=document.createElement('iframe'); frame.title=inst.name;\n    frame.src=API+inst.web_app; frame.style.cssText='width:100%;height:85vh;border:0';\n    box.appendChild(frame); return;\n  }\n  if(inst.renderer&&inst.renderer.indexOf('custom:')===0){\n    box.innerHTML=h+'<div id=\"modeBody\"><\/div>';\n    const fn=CUSTOM_RENDERERS[inst.renderer.slice(7)];\n    if(fn) fn(inst,document.getElementById('modeBody'));\n    else document.getElementById('modeBody').innerHTML='<p class=\"muted\">렌더러 없음: '+esc(inst.renderer)+'<\/p>';\n    return;\n  }\n  // 탭 + 최상단 고정 버튼(소개발행 등)을 같은 줄에 — 버튼은 오른쪽 끝(margin-left:auto)\n  const _tabsHtml=(inst.modes && inst.modes.length>1)?inst.modes.map((m,i)=>'<button class=\"tab\" id=\"modeTab'+i+'\" onclick=\"setMode('+i+')\">'+esc(m.name)+'<\/button>').join(''):'';\n  const _topHtml=(inst.top_buttons||[]).map((b,i)=>'<button class=\"btn2\" style=\"'+(i===0?'margin-left:auto':'')+'\" onclick=\"fireTop('+i+')\">'+esc(b.label)+'<\/button>').join('');\n  if(_tabsHtml||_topHtml){ h+='<div class=\"tabs\" style=\"align-items:center\">'+_tabsHtml+_topHtml+'<\/div>'; }\n  h+='<div id=\"modeBody\"><\/div>';\n  box.innerHTML=h;\n  setMode(0);\n}\nfunction setMode(i){\n  const inst=CUR.inst; const modes=inst.modes||[inst]; const mode=modes[i];\n  CUR.mode=mode; VIEW_CTX=null; SPLIT=false; LIST=null;\n  if(inst.modes) modes.forEach((m,j)=>{ const t=document.getElementById('modeTab'+j); if(t)t.classList.toggle('on',j===i); });\n  CUR.optCache={};\n  CUR.catFilter=null;  // 동적 필터(from_field) 선택값 — 모드 진입 시 초기화\n  CUR.filterVal=(mode.filter&&mode.filter.items)?((mode.filter.items.find(x=>x.default)||mode.filter.items[0]||{}).value):null;\n  let h='';\n  if(mode.note) h+='<div class=\"note\">'+esc(mode.note)+'<\/div>';\n  const inputs=mode.inputs||[];\n  if(inputs.length){\n    h+='<div class=\"row\" style=\"flex-wrap:wrap\">'+inputs.map(inp=>{\n      if(inp.type==='select')\n        return '<select class=\"field\" id=\"in_'+esc(inp.key)+'\" style=\"flex:0 1 130px\" onchange=\"selChanged(\\''+esc(inp.key)+'\\')\"><option value=\"\">'+esc(inp.label||'전체')+'<\/option><\/select>';\n      if(inp.type==='file')\n        /* file 프리미티브 — 선택 즉시 /launcher/upload, 값(서버 절대경로)은 hidden in_KEY 에 */\n        return '<input type=\"hidden\" id=\"in_'+esc(inp.key)+'\">'\n          +'<input type=\"file\" id=\"inf_'+esc(inp.key)+'\" style=\"display:none\"'+(inp.accept?' accept=\"'+esc(inp.accept)+'\"':'')+' onchange=\"upFile(\\''+esc(inp.key)+'\\',this)\">'\n          +'<button class=\"btn2\" type=\"button\" id=\"infb_'+esc(inp.key)+'\" data-label=\"\\ud83d\\udcce '+esc(inp.label||'파일')+'\" onclick=\"document.getElementById(\\'inf_'+esc(inp.key)+'\\').click()\">\\ud83d\\udcce '+esc(inp.label||'파일')+'<\/button>'\n          +'<span class=\"muted\" id=\"infl_'+esc(inp.key)+'\" style=\"font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:center\"><\/span>';\n      return '<input class=\"field\" style=\"min-width:0\" id=\"in_'+esc(inp.key)+'\" value=\"'+esc(loadInpVal(inst.id,mode.id,inp.key,inp.default))+'\" placeholder=\"'+esc(inp.placeholder||'')+'\" onchange=\"saveInpVals()\" onkeydown=\"if(event.key===\\'Enter\\')runMode()\">';\n    }).join('')+'<button class=\"go\" onclick=\"runMode()\">'+esc(mode.run_label||'조회')+'<\/button><\/div>';\n  }\n  inputs.forEach(inp=>{\n    if(inp.chips&&inp.chips.length)\n      h+='<div class=\"chips\" style=\"margin-top:10px\">'+inp.chips.map(c=>\n        '<span class=\"chip\" onclick=\"chipRun(\\''+esc(inp.key)+'\\',\\''+esc(c)+'\\')\">'+esc(c)+'<\/span>').join('')+'<\/div>';\n  });\n  // 기간 토글(차트 범위) — 클릭 즉시 그 기간으로 재조회\n  if(mode.filter&&mode.filter.items){\n    h+='<div class=\"filters\" style=\"margin-top:10px\">'+mode.filter.items.map(x=>\n      '<button class=\"fchip'+(String(x.value)===String(CUR.filterVal)?' on':'')+'\" data-v=\"'+esc(String(x.value))+'\" onclick=\"setFilter(\\''+esc(String(x.value))+'\\')\">'+esc(x.label)+'<\/button>').join('')+'<\/div>';\n  }\n  const btns=mode.buttons||[];\n  if(btns.length)\n    h+='<div class=\"btnrow\" style=\"margin-top:10px\">'+btns.map((b,bi)=>\n      '<button class=\"btn2\" onclick=\"fireButton('+bi+',this)\">'+esc(b.label)+'<\/button>').join('')+'<\/div>';\n  h+='<div id=\"instOut\"><\/div>';\n  document.getElementById('modeBody').innerHTML=h;\n  // select 채우기는 선언 순서대로 — 정적 옵션(동기)이 먼저 값을 잡아야 종속 옵션이 그 값을 읽는다\n  (async()=>{ for(const inp of inputs){ if(inp.type==='select') await fillOptions(inp); } if(mode.auto_run) runMode(); })();\n}\n/* options_action 의 $key 를 형제 입력값으로 치환 — 비어 있으면 missing 표시(종속 대기) */\nfunction resolveOptionsAction(template){\n  let missing=false;\n  const code=String(template).replace(/\\$(\\w+)/g,(m,k)=>{ const el=document.getElementById('in_'+k); const v=el?String(el.value):''; if(!v) missing=true; return v.replace(/\"/g,''); });\n  return {code, missing};\n}\n/* 배열은 option_value/option_label로, 딕셔너리({이름:코드})는 entries로 정규화 → [{value,label}] */\nfunction normalizeOptions(raw,inp){\n  if(Array.isArray(raw)) return raw.map(o=>({value:o[inp.option_value||'value'], label:o[inp.option_label||'label']}));\n  if(raw&&typeof raw==='object') return Object.entries(raw).map(([k,v])=>({value:v, label:k}));\n  return [];\n}\nfunction setOptions(sel,opts,def){\n  while(sel.options.length>1) sel.remove(1);  /* placeholder 1개 유지 */\n  opts.forEach(o=>{ const el=document.createElement('option'); el.value=o.value; el.textContent=o.label; sel.appendChild(el); });\n  if(def!=null && opts.some(o=>String(o.value)===String(def))) sel.value=def;\n}\nasync function fillOptions(inp){\n  const sel=document.getElementById('in_'+inp.key); if(!sel) return;\n  if(Array.isArray(inp.options)){ setOptions(sel, inp.options.map(o=>({value:o.value,label:o.label})), inp.default); return; }\n  if(!inp.options_action) return;\n  const {code,missing}=resolveOptionsAction(inp.options_action);\n  if(missing){ setOptions(sel, [], null); return; }   /* 종속 부모 미선택 — 비워두고 대기 */\n  let opts=CUR.optCache[code];\n  if(!opts){ try{ const d=await ibl(code); opts=normalizeOptions(jget(d,inp.options_from),inp); CUR.optCache[code]=opts; }catch(e){ opts=[]; } }\n  if(document.getElementById('in_'+inp.key)!==sel) return;\n  setOptions(sel, opts, inp.default);\n}\n/* select 변경 시, 그 키에 의존하는 종속 select 들을 비우고 다시 채운다 (cascade) */\nfunction selChanged(key){\n  const mode=CUR.mode; if(!mode) return;\n  (mode.inputs||[]).forEach(inp=>{\n    if(inp.type==='select' && inp.options_action && new RegExp('\\\\$'+key+'\\\\b').test(inp.options_action)) fillOptions(inp);\n  });\n}\nfunction chipRun(key,val){ const el=document.getElementById('in_'+key); if(el) el.value=val; runMode(); }\n/* file 프리미티브 업로드 — 성공 시 hidden in_KEY 에 서버 절대경로(핸들러가 그대로 연다) */\nasync function _upFileObj(key,f,el){\n  if(!f) return;\n  const btn=document.getElementById('infb_'+key), lab=document.getElementById('infl_'+key), hid=document.getElementById('in_'+key);\n  if(btn){ btn.disabled=true; btn.textContent='올리는 중…'; }\n  try{\n    const r=await fetch('/launcher/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f});\n    const d=await r.json();\n    if(d&&d.success&&d.path){ if(hid) hid.value=d.path; if(lab) lab.textContent=f.name; }\n    else{ if(hid) hid.value=''; if(lab) lab.textContent=''; if(el) el.value=''; alert((d&&d.error)||'업로드 실패'); }\n  }catch(e){ if(hid) hid.value=''; if(lab) lab.textContent=''; if(el) el.value=''; alert('업로드 실패 (네트워크)'); }\n  if(btn){ btn.disabled=false; btn.textContent=btn.getAttribute('data-label')||'파일'; }\n}\nfunction upFile(key,el){ _upFileObj(key, el.files&&el.files[0], el); }\n/* 드래그&드롭 — 현재 모드에 file 입력이 있으면 화면 어디에나 끌어다 놓으면 그 입력으로 업로드 */\nfunction _dropFileKey(){ const m=(typeof CUR!=='undefined')&&CUR&&CUR.mode; if(!m) return null; const inp=(m.inputs||[]).find(i=>i.type==='file'); return inp?inp.key:null; }\nlet _dragDepth=0;\nfunction _dropOverlay(show){\n  let o=document.getElementById('dropOverlay');\n  if(!o&&show){\n    o=document.createElement('div'); o.id='dropOverlay';\n    o.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(74,64,53,.28);pointer-events:none';\n    o.innerHTML='<div style=\"padding:16px 26px;border-radius:16px;background:var(--bg2,#fff);border:2px dashed var(--line,#bbb);color:var(--txt,#333);font-size:17px\">\\ud83d\\udcce 여기에 파일을 놓으세요<\/div>';\n    document.body.appendChild(o);\n  }\n  if(o) o.style.display=show?'flex':'none';\n}\nfunction _dragHasFiles(e){ return e.dataTransfer&&Array.prototype.slice.call(e.dataTransfer.types||[]).indexOf('Files')>=0; }\ndocument.addEventListener('dragover',e=>{ if(_dropFileKey()&&_dragHasFiles(e)) e.preventDefault(); });\ndocument.addEventListener('dragenter',e=>{ if(_dropFileKey()&&_dragHasFiles(e)){ _dragDepth++; _dropOverlay(true); } });\ndocument.addEventListener('dragleave',e=>{ if(_dragDepth>0){ _dragDepth--; if(!_dragDepth) _dropOverlay(false); } });\ndocument.addEventListener('drop',e=>{\n  const key=_dropFileKey(); _dragDepth=0; _dropOverlay(false);\n  if(!key) return;\n  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); _upFileObj(key, e.dataTransfer.files[0], null); }\n});\n/* 폰 라디오: 백엔드가 play_in_client+stream_url 반환 → WebView 가 직접 재생(소리=폰 스피커).\n   한국 방송=HLS(.m3u8)라 hls.js, ICY/mp3 등은 네이티브 <audio>. */\nlet _radioHls=null;\nfunction _radioAudioEl(){ let a=document.getElementById('radioAudio'); if(!a){ a=document.createElement('audio'); a.id='radioAudio'; a.autoplay=true; a.addEventListener('ended',_npHide); document.body.appendChild(a); } return a; }\n/* 전역 미니플레이어: 클라이언트 오디오(라디오·유튜브뮤직)는 #radioAudio 전역 엘리먼트라\n   계기를 벗어나도 계속 재생된다. 재생 중이면 어디서든 보이는 정지 바를 띄워(클라이언트 관심사=\n   IBL 왕복 없이 stopRadioStream 직접) \"멈출 방법 없음\" 해소. 곡이 끝나면(ended) 자동 숨김. */\nfunction _npBar(){\n  let b=document.getElementById('nowPlaying');\n  if(!b){\n    b=document.createElement('div'); b.id='nowPlaying';\n    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9998;display:none;align-items:stretch;gap:10px;padding:10px 14px;background:var(--bg2);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(74,64,53,.12)';\n    // 컬럼: (1) 제목+정지 (2) 진행바 — 유한 길이(유튜브뮤직)일 때만 timeupdate 가 표시, 라이브(라디오)엔 숨김\n    b.innerHTML='<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;min-width:0\">'\n      +'<div style=\"display:flex;align-items:center;gap:10px\">'\n      +'<span style=\"font-size:18px\">\\u266a<\/span>'\n      +'<span id=\"npTitle\" style=\"flex:1;color:var(--txt);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\"><\/span>'\n      +'<button onclick=\"stopRadioStream()\" style=\"background:var(--acc);color:#fff;border:none;border-radius:18px;padding:8px 18px;font-size:15px;font-weight:bold\">\\u25a0 \\uc815\\uc9c0<\/button>'\n      +'<\/div>'\n      +'<div id=\"npSeekRow\" style=\"display:none;align-items:center;gap:8px\">'\n      +'<span id=\"npCur\" style=\"color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right\">0:00<\/span>'\n      +'<input id=\"npSeek\" type=\"range\" min=\"0\" max=\"100\" value=\"0\" step=\"1\" style=\"flex:1;accent-color:var(--acc);cursor:pointer\">'\n      +'<span id=\"npDur\" style=\"color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;min-width:34px\">0:00<\/span>'\n      +'<\/div>'\n      +'<\/div>';\n    document.body.appendChild(b);\n  }\n  return b;\n}\nfunction _npShow(label){ _npLabel=label||''; const b=_npBar(); const t=document.getElementById('npTitle'); if(t) t.textContent=label||'\\uc7ac\\uc0dd \\uc911'; b.style.display=_npInApp()?'flex':'none'; }\nfunction _npHide(){ _npLabel=null; const b=document.getElementById('nowPlaying'); if(b) b.style.display='none'; }\n/* 미니플레이어는 앱모드 전용이다 — 자율주행·조종실의 화면 하단은 채팅 입력창의 자리라,\n   재생 중이라고 그 위를 덮으면 대화 자체가 막힌다(실사고 2026-09-02). 표면 판별은\n   setSurface 가 갱신하는 전역 surface 를 그대로 재사용하고, 검색브라우저(forage)는\n   setSurface 자신이 앱 탭으로 매핑하는 앱모드의 앱이라 같이 센다.\n   숨김은 표시만 끄는 것이고 재생은 전역 audio 라 계속된다 — 앱 탭으로 돌아오면\n   _npSync 가 같은 곡의 바를 그대로 되살린다. */\nvar _npLabel=null;\nfunction _npInApp(){ return typeof surface==='undefined' || surface==='app' || surface==='forage'; }\nfunction _npSync(){\n  if(!_npLabel){ const b0=document.getElementById('nowPlaying'); if(b0) b0.style.display='none'; return; }\n  const b=_npBar(); b.style.display=_npInApp()?'flex':'none';\n}\n/* 진행바(중간 점프): #radioAudio 는 실제 브라우저 <audio> 라 native seek 가 공짜.\n   유한 길이(유튜브뮤직)면 스크러버를 띄우고, 라이브 스트림(라디오, duration=Infinity)이면 숨긴다. */\nfunction _npFmtT(s){ if(!isFinite(s)||s<0) return '0:00'; s=Math.floor(s); var m=Math.floor(s/60), x=s%60, h=Math.floor(m/60); if(h>0){ m=m%60; return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); } return m+':'+String(x).padStart(2,'0'); }\nvar _npSeeking=false;\nfunction npSeekTo(v){ var a=document.getElementById('radioAudio'); if(a && isFinite(a.duration)){ try{ a.currentTime=Number(v); }catch(e){} } }\nfunction _npWireSeek(a){\n  if(a._npWired) return; a._npWired=true;\n  a.addEventListener('timeupdate',function(){\n    if(_npSeeking) return;\n    var row=document.getElementById('npSeekRow'), sk=document.getElementById('npSeek');\n    var cur=document.getElementById('npCur'), du=document.getElementById('npDur');\n    if(isFinite(a.duration) && a.duration>0){\n      if(row) row.style.display='flex';\n      if(sk){ sk.max=Math.floor(a.duration); sk.value=Math.floor(a.currentTime); }\n      if(cur) cur.textContent=_npFmtT(a.currentTime);\n      if(du) du.textContent=_npFmtT(a.duration);\n    } else if(row){ row.style.display='none'; }  // 라이브(라디오)=무한 → 숨김\n  });\n  var sk=document.getElementById('npSeek');\n  if(sk){\n    sk.addEventListener('input',function(){ _npSeeking=true; var cur=document.getElementById('npCur'); if(cur) cur.textContent=_npFmtT(Number(sk.value)); });\n    sk.addEventListener('change',function(){ npSeekTo(sk.value); _npSeeking=false; });\n  }\n}\nfunction playRadioStream(url,vol,label){\n  const a=_radioAudioEl();\n  if(_radioHls){ try{_radioHls.destroy();}catch(e){} _radioHls=null; }\n  if(typeof vol==='number') a.volume=Math.max(0,Math.min(1,vol/100));\n  if(/\\.m3u8/i.test(url) && window.Hls && Hls.isSupported()){\n    _radioHls=new Hls(); _radioHls.loadSource(url); _radioHls.attachMedia(a);\n    _radioHls.on(Hls.Events.MANIFEST_PARSED,()=>a.play().catch(()=>{}));\n  } else { a.src=url; a.play().catch(()=>{}); }\n  _npShow(label);\n  _npSeeking=false;\n  var row=document.getElementById('npSeekRow'); if(row) row.style.display='none';  // 새 곡=일단 숨김(메타 로드되면 timeupdate가 판단)\n  var sk=document.getElementById('npSeek'); if(sk) sk.value=0;\n  _npWireSeek(a);\n}\nfunction stopRadioStream(){\n  if(_radioHls){ try{_radioHls.destroy();}catch(e){} _radioHls=null; }\n  const a=document.getElementById('radioAudio'); if(a){ a.pause(); a.removeAttribute('src'); a.load(); }\n  var row=document.getElementById('npSeekRow'); if(row) row.style.display='none';\n  _npHide();\n  /* 라디오 말고도 표면이 내는 소리는 다 멈춘다 — media_player 로 그려진 곡들(음악앱은 한 폴더가\n     수백 곡이라 재생 중인 <audio> 를 찾아 누를 수가 없다). stop_in_client 규약의 뜻 그대로. */\n  document.querySelectorAll('audio').forEach(function(el){ if(!el.paused) el.pause(); });\n}\n/* CCTV 영상(item2): 지도 마커 클릭 → 전체화면 <video> 오버레이로 HLS 재생.\n   onclick
