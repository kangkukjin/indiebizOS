<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>IndieBiz Member · PC 연결</title>
<style>*{box-sizing:border-box}body{background:#f6f5f1;color:#253a32;font:16px system-ui;margin:0}main{max-width:540px;margin:8vh auto;padding:32px}h1{font-size:30px}p{line-height:1.7;color:#60716a}label{display:block;margin:24px 0 6px}input{width:100%;padding:13px;border:1px solid #bdc9c1;border-radius:9px;font:inherit}button{margin-top:24px;background:#245644;color:white;border:0;border-radius:9px;padding:14px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}small{line-height:1.6;display:block;margin-top:24px}</style>
<main><small>INDIEBIZ · MEMBER</small><h1>이 PC에서 시작하기</h1><p>중앙 관리자가 제공한 주소와 일회 등록 코드를 입력하세요. 작업 파일과 기록은 이 컴퓨터에 보관합니다.</p><form id="setup"><label for="hub">중앙 주소</label><input id="hub" type="url" required placeholder="https://your-hub.example"><label for="code">일회 등록 코드</label><input id="code" required minlength="16" maxlength="16" autocomplete="off" spellcheck="false"><button id="submit">이 중앙 PC에 연결</button></form><p id="status" role="status"></p><small>중앙은 요청을 처리하고 모델을 연결합니다. 파일·명령·화면 사용 권한은 이 PC에서 결정합니다.</small></main><script src="setup.cjs"></script></html>
