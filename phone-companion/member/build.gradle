plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.indiebiz.member'
    compileSdk 34
    defaultConfig {
        applicationId 'com.indiebiz.member'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    flavorDimensions 'surface'
    productFlavors { member { dimension 'surface' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/shared')
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/memberAssets')
}
tasks.register('copyAccessibility', Copy) {
    from '../app/src/main/java'
    include '**/PhoneAccessibilityService.kt'
    into layout.buildDirectory.dir('generated/shared')
}
tasks.register('bundleMemberShell', Exec) {
    inputs.files('../../backend/surface/member_shell.py','../../backend/surface/launcher_app_common.py')
    outputs.file(layout.buildDirectory.file('generated/memberAssets/member_app.html'))
    commandLine 'python3', '../../scripts/build_member_shell.py', '--output',
        layout.buildDirectory.file('generated/memberAssets/member_app.html').get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'copyAccessibility', 'bundleMemberShell' }
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
