; pytest 도입 (2026-08-05 감사 부채 ⑧) — "있는 것부터 돌게"가 1단계.
; 대상은 backend/test_*.py 만 — pylibs(번들 서드파티)·frontend·data 는 수집 금지.
;
; 실행:
;   python3 -m pytest                 # 전체 (로컬 데이터 필요한 것 포함)
;   python3 -m pytest -m "not local"  # CI 와 동일 (해마 DB·임베딩 모델 불요분만)
[pytest]
testpaths = backend
python_files = test_*.py
norecursedirs = pylibs node_modules frontend data outputs projects .git build
; ★addopts 의 -q 는 여기 한 번만 있으면 된다(2026-08-24 #repair C8). 호출부가 -q 를
;   또 넘기면 `-q -q` 가 되어 pytest 가 "<N> passed …" 요약 줄 자체를 지운다 —
;   회귀 보고에서 수치가 사라지던 원인이라 시험 파일의 자기 실행부 56자리에서 걷어냈다.
addopts = -q
markers =
    local: 로컬 런타임 데이터(해마 DB·임베딩 모델 등)가 필요한 테스트 — CI 는 -m "not local" 로 제외
