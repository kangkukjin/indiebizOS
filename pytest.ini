; pytest 도입 (2026-08-05 감사 부채 ⑧) — "있는 것부터 돌게"가 1단계.
; 대상은 backend/test_*.py 만 — pylibs(번들 서드파티)·frontend·data 는 수집 금지.
;
; 실행:
;   python3 -m pytest $(scripts/select_tests.py)              # 수리 중: 변경의 전이 소비자만(2026-10-04)
;   python3 -m pytest -m "not system" -n auto --dist loadfile # 종합 회귀 (병렬, 관련 system 묶음은 별도)
;   python3 -m pytest -n auto --dist loadfile                 # 전체 (로컬 데이터 필요한 것 포함)
;   python3 -m pytest -m "not local" -n auto --dist loadfile  # CI 와 동일 (해마 DB·임베딩 모델 불요분만)
; -n 은 addopts 에 넣지 않는다 — 관련 검사 몇 개는 워커 기동이 검사보다 길다.
; 개발·실패 재확인·전수 선택 규약: docs/REGRESSION_TESTING.md
[pytest]
testpaths = backend
python_files = test_*.py
norecursedirs = .hypothesis pylibs node_modules frontend data outputs projects .git build
; ★addopts 의 -q 는 여기 한 번만 있으면 된다(2026-08-24 #repair C8). 호출부가 -q 를
;   또 넘기면 `-q -q` 가 되어 pytest 가 "<N> passed …" 요약 줄 자체를 지운다 —
;   회귀 보고에서 수치가 사라지던 원인이라 시험 파일의 자기 실행부 56자리에서 걷어냈다.
; 느린 setup/call/teardown을 매번 보여 병목을 실측한다. 검사 선택·순서는 바꾸지 않는다.
addopts = -q --durations=15 --durations-min=0.1
markers =
    local: 로컬 런타임 데이터(해마 DB·임베딩 모델 등)가 필요한 테스트 — CI 는 -m "not local" 로 제외
    system: 실제 프로세스 수명·패키지 배포 또는 대규모 데이터 전수 감사 — 관련 변경과 CI/릴리스에서 실행 (docs/REGRESSION_TESTING.md)
